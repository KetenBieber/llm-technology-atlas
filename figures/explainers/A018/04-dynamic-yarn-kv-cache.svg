<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
.title{font-size:46px;font-weight:700}.subtitle{font-size:24px;fill:#526b80}.section{font-size:30px;font-weight:700}
.node{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#60758a}.math{font-size:22px;font-family:"STIX Two Text","Times New Roman",serif}
.box{fill:#f8fbfd;stroke:#9db7c8;stroke-width:2}.blue{fill:#eaf4fb;stroke:#2b6f9f;stroke-width:2.4}.cyan{fill:#e9f9fa;stroke:#178d98;stroke-width:2.4}
.orange{fill:#fff4e8;stroke:#d47a20;stroke-width:2.4}.red{fill:#fff0f0;stroke:#c64a4a;stroke-width:2.4}.green{fill:#edf9f1;stroke:#2f8a57;stroke-width:2.4}.gray{fill:#f2f4f6;stroke:#8795a1;stroke-width:2}
.flow{fill:none;stroke:#246b9b;stroke-width:4.5;marker-end:url(#a)}.goodflow{fill:none;stroke:#2f8a57;stroke-width:4.5;marker-end:url(#ag)}.cost{fill:none;stroke:#d47a20;stroke-width:4;marker-end:url(#ao)}
.axis{fill:none;stroke:#607d8b;stroke-width:2}.dash{fill:none;stroke:#8795a1;stroke-width:2;stroke-dasharray:8 7}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#246b9b"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f8a57"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d47a20"/></marker>
</defs>
<rect width="1600" height="1100" fill="#fff"/>
<text x="70" y="72" class="title">Dynamic YaRN：为什么自适应 scale 会改变 KV Cache 的所有权语义？</text>
<text x="70" y="112" class="subtitle">A018 · 当 RoPE 依赖“当前总长度 ℓ”时，历史 post-RoPE K 已经绑定旧 scale，不能默认永久复用</text>

<text x="70" y="170" class="section">1  静态 YaRN：scale 固定 ⇒ 每个历史 K 的旋转结果是稳定缓存对象</text>
<rect x="70" y="205" width="1460" height="250" rx="22" class="green"/>
<rect x="110" y="270" width="180" height="90" rx="16" class="cyan"/><text x="145" y="310" class="node">K₁ raw</text><text x="145" y="340" class="small">token 1</text>
<path d="M290 315 H405" class="goodflow"/>
<rect x="415" y="255" width="260" height="120" rx="18" class="blue"/><text x="450" y="295" class="node">RoPE(s_fixed)</text><text x="450" y="335" class="math">K₁ → K₁^rot</text>
<path d="M675 315 H790" class="goodflow"/>
<rect x="800" y="255" width="300" height="120" rx="18" class="green"/><text x="835" y="295" class="node">KV Cache</text><text x="835" y="335" class="body">保存 K₁^rot，后续 decode 直接读</text>
<path d="M1100 315 H1215" class="goodflow"/>
<rect x="1225" y="255" width="250" height="120" rx="18" class="gray"/><text x="1260" y="295" class="node">token 2…T</text><text x="1260" y="335" class="body">scale 不变 ⇒ phase 不变</text>

<text x="70" y="525" class="section">2  Dynamic scaling：s_dyn=max(1, ℓ/L) 随长度改变，旧 cache 可能“烘焙”了过期 phase</text>
<rect x="70" y="565" width="1000" height="365" rx="22" class="red"/>
<text x="105" y="610" class="node">同一个 token 1，在不同 decode 时刻应使用不同旋转</text>
<line x1="140" y1="690" x2="930" y2="690" class="axis"/>
<circle cx="250" cy="690" r="12" fill="#2b6f9f"/><circle cx="520" cy="690" r="12" fill="#d47a20"/><circle cx="820" cy="690" r="12" fill="#c64a4a"/>
<text x="205" y="730" class="body">ℓ&lt;L</text><text x="190" y="760" class="math">s_dyn=1</text>
<text x="470" y="730" class="body">ℓ≈2L</text><text x="455" y="760" class="math">s_dyn=2</text>
<text x="770" y="730" class="body">ℓ≈8L</text><text x="755" y="760" class="math">s_dyn=8</text>
<path d="M250 675 C300 610 430 610 520 675" class="cost"/><path d="M520 675 C610 610 730 610 820 675" class="cost"/>
<rect x="155" y="810" width="360" height="78" rx="16" class="gray"/><text x="180" y="846" class="body">cache: K₁^post-RoPE(s=1)</text><text x="180" y="875" class="small">若原样复用 → 与当前 s_dyn 不一致</text>
<path d="M515 850 H650" class="cost"/>
<text x="670" y="842" class="node" fill="#c64a4a">stale positional phase</text>
<text x="670" y="875" class="small">content K 未变；变的是当前应使用的 RoPE phase</text>

<rect x="1110" y="565" width="420" height="365" rx="22" class="orange"/>
<text x="1140" y="610" class="node">更干净的 cache contract</text>
<rect x="1150" y="650" width="330" height="80" rx="16" class="cyan"/><text x="1175" y="698" class="body">缓存 K^pre-RoPE</text>
<path d="M1315 730 V785" class="flow"/>
<rect x="1150" y="795" width="330" height="92" rx="16" class="green"/><text x="1175" y="832" class="body">按当前 s_dyn 重新旋转</text><text x="1175" y="865" class="small">得到与本次 attention 一致的 K^rot</text>

<rect x="70" y="965" width="1460" height="80" rx="18" class="gray"/>
<text x="100" y="1000" class="body">代价：pre-RoPE cache / 重算 / orchestration 增加。结论：位置编码一旦依赖当前总长度，KV cache 是否能“永久保存 post-RoPE K”必须重新审查。</text>
</svg>