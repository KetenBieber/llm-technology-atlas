<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
.title{font-size:46px;font-weight:700}.subtitle{font-size:24px;fill:#526b80}.section{font-size:30px;font-weight:700}.node{font-size:24px;font-weight:650}.body{font-size:21px}.small{font-size:20px;fill:#526b80}.math{font-size:23px;font-family:"STIX Two Text","Times New Roman",serif}
.box{fill:#f8fbfd;stroke:#8fb6cc;stroke-width:2.2}.blue{fill:#eaf4fb;stroke:#2b6f9f;stroke-width:2.4}.cyan{fill:#eafafa;stroke:#178d98;stroke-width:2.4}.orange{fill:#fff4e8;stroke:#d47a20;stroke-width:2.4}.red{fill:#fff0f0;stroke:#c64a4a;stroke-width:2.4}.green{fill:#edf9f1;stroke:#2f8a57;stroke-width:2.4}.gray{fill:#f2f4f6;stroke:#8795a1;stroke-width:2}
.flow{fill:none;stroke:#246b9b;stroke-width:5;marker-end:url(#arrow)}.aux{fill:none;stroke:#607d8b;stroke-width:3;marker-end:url(#arrowGray)}.comm{fill:none;stroke:#d47a20;stroke-width:5;stroke-dasharray:11 8;marker-end:url(#arrowOrange)}.good{fill:none;stroke:#2f8a57;stroke-width:5;marker-end:url(#arrowGreen)}.bad{fill:none;stroke:#c64a4a;stroke-width:4;stroke-dasharray:9 7;marker-end:url(#arrowRed)}
.cache{fill:#dff1f3;stroke:#178d98;stroke-width:2}.query{fill:#e3eef7;stroke:#2b6f9f;stroke-width:2}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#246b9b"/></marker>
<marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker>
<marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d47a20"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f8a57"/></marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c64a4a"/></marker>
</defs><rect width="1600" height="1100" fill="#fff"/><text x="70" y="72" class="title">MQA：共享的究竟是哪些 Head？</text><text x="70" y="112" class="subtitle">A019 · Query 仍保持 H 个独立头；所有 Query head 共享同一组 K/V representation</text>
<text x="70" y="180" class="section">Multi-Head Attention (MHA)</text>
<rect x="70" y="220" width="700" height="700" rx="24" class="gray"/>
<rect x="105" y="270" width="180" height="90" rx="16" class="gray"/><text x="135" y="325" class="node">X [B,T,d]</text>
<path d="M285 315 C350 315 350 315 405 315" class="flow"/><rect x="405" y="265" width="145" height="85" rx="14" class="query"/><text x="435" y="316" class="node">Q1</text><rect x="585" y="265" width="145" height="85" rx="14" class="cache"/><text x="615" y="303" class="body">K1, V1</text><path d="M550 307 H585" class="aux"/><path d="M285 315 C350 315 350 435 405 435" class="flow"/><rect x="405" y="385" width="145" height="85" rx="14" class="query"/><text x="435" y="436" class="node">Q2</text><rect x="585" y="385" width="145" height="85" rx="14" class="cache"/><text x="615" y="423" class="body">K2, V2</text><path d="M550 427 H585" class="aux"/><path d="M285 315 C350 315 350 555 405 555" class="flow"/><rect x="405" y="505" width="145" height="85" rx="14" class="query"/><text x="435" y="556" class="node">Q3</text><rect x="585" y="505" width="145" height="85" rx="14" class="cache"/><text x="615" y="543" class="body">K3, V3</text><path d="M550 547 H585" class="aux"/><path d="M285 315 C350 315 350 675 405 675" class="flow"/><rect x="405" y="625" width="145" height="85" rx="14" class="query"/><text x="435" y="676" class="node">Q4</text><rect x="585" y="625" width="145" height="85" rx="14" class="cache"/><text x="615" y="663" class="body">K4, V4</text><path d="M550 667 H585" class="aux"/>
<text x="105" y="795" class="body">每个 Q head 有自己的 K/V 子空间</text>
<text x="105" y="840" class="math">Q,K,V : [B,H,T,dₕ]</text>
<text x="105" y="885" class="small">KV Cache 随 H 线性增长</text>

<text x="850" y="180" class="section">Multi-Query Attention (MQA)</text>
<rect x="810" y="220" width="720" height="700" rx="24" class="green"/>
<rect x="845" y="270" width="180" height="90" rx="16" class="gray"/><text x="875" y="325" class="node">X [B,T,d]</text>
<path d="M1025 315 C1080 315 1080 300 1120 300" class="flow"/><rect x="1120" y="258" width="135" height="82" rx="14" class="query"/><text x="1150" y="309" class="node">Q1</text><path d="M1025 315 C1080 315 1080 410 1120 410" class="flow"/><rect x="1120" y="368" width="135" height="82" rx="14" class="query"/><text x="1150" y="419" class="node">Q2</text><path d="M1025 315 C1080 315 1080 520 1120 520" class="flow"/><rect x="1120" y="478" width="135" height="82" rx="14" class="query"/><text x="1150" y="529" class="node">Q3</text><path d="M1025 315 C1080 315 1080 630 1120 630" class="flow"/><rect x="1120" y="588" width="135" height="82" rx="14" class="query"/><text x="1150" y="639" class="node">Q4</text>
<rect x="1320" y="405" width="165" height="155" rx="18" class="cyan"/>
<text x="1350" y="452" class="node">shared</text><text x="1350" y="493" class="body">K , V</text><text x="1350" y="532" class="small">1 KV head</text>
<path d="M1255 299 C1295 299 1295 482 1320 482" class="good"/><path d="M1255 409 C1295 409 1295 482 1320 482" class="good"/><path d="M1255 519 C1295 519 1295 482 1320 482" class="good"/><path d="M1255 629 C1295 629 1295 482 1320 482" class="good"/>
<text x="845" y="795" class="body">Q head diversity 保留；K/V projection diversity 被共享</text>
<text x="845" y="840" class="math">Q : [B,H,T,dₕ] ; K,V : [B,1,T,dₕ]</text>
<text x="845" y="885" class="small">不是“只有一个 Attention head”</text>

<rect x="70" y="965" width="1460" height="70" rx="15" class="box"/>
<text x="100" y="1010" class="body">能力–成本交换：每个 head 仍能提出不同 Query，但它们都从同一个 Key 索引空间和 Value 内容空间读取；这正是后续 GQA 在 1 与 H 之间折中的原因。</text>
</svg>