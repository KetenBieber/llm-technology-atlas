<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
.title{font-size:46px;font-weight:700}.subtitle{font-size:24px;fill:#526b80}.section{font-size:30px;font-weight:700}.node{font-size:24px;font-weight:650}.body{font-size:21px}.small{font-size:20px;fill:#526b80}.math{font-size:23px;font-family:"STIX Two Text","Times New Roman",serif}
.box{fill:#f8fbfd;stroke:#8fb6cc;stroke-width:2.2}.blue{fill:#eaf4fb;stroke:#2b6f9f;stroke-width:2.4}.cyan{fill:#eafafa;stroke:#178d98;stroke-width:2.4}.orange{fill:#fff4e8;stroke:#d47a20;stroke-width:2.4}.red{fill:#fff0f0;stroke:#c64a4a;stroke-width:2.4}.green{fill:#edf9f1;stroke:#2f8a57;stroke-width:2.4}.gray{fill:#f2f4f6;stroke:#8795a1;stroke-width:2}
.flow{fill:none;stroke:#246b9b;stroke-width:5;marker-end:url(#arrow)}.aux{fill:none;stroke:#607d8b;stroke-width:3;marker-end:url(#arrowGray)}.comm{fill:none;stroke:#d47a20;stroke-width:5;stroke-dasharray:11 8;marker-end:url(#arrowOrange)}.good{fill:none;stroke:#2f8a57;stroke-width:5;marker-end:url(#arrowGreen)}.bad{fill:none;stroke:#c64a4a;stroke-width:4;stroke-dasharray:9 7;marker-end:url(#arrowRed)}
.cache{fill:#dff1f3;stroke:#178d98;stroke-width:2}.query{fill:#e3eef7;stroke:#2b6f9f;stroke-width:2}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#246b9b"/></marker>
<marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker>
<marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d47a20"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f8a57"/></marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c64a4a"/></marker>
</defs><rect width="1600" height="1100" fill="#fff"/><text x="70" y="72" class="title">MQA Decode：shared K/V 如何服务 H 个 Query heads？</text><text x="70" y="112" class="subtitle">A019 · broadcasting 发生在 head 轴；Attention score 仍保留 H 个独立 Query 结果</text>
<text x="70" y="180" class="section">当前 token projection</text>
<rect x="70" y="220" width="330" height="280" rx="24" class="gray"/>
<rect x="105" y="275" width="260" height="75" rx="14" class="gray"/><text x="135" y="323" class="node">xₜ [B,1,d]</text>
<path d="M235 350 V405" class="flow"/>
<text x="105" y="450" class="body">WQ → Q [B,H,1,dₕ]</text>
<text x="105" y="485" class="body">WK/WV → [B,1,1,dₕ]</text>

<text x="470" y="180" class="section">Cache ownership</text>
<rect x="440" y="220" width="450" height="280" rx="24" class="cyan"/>
<text x="475" y="270" class="node">append 当前 Kₜ,Vₜ</text>
<rect x="485" y="315" width="360" height="75" rx="14" class="cache"/><text x="515" y="362" class="body">Kcache [B,1,t,dₕ]</text>
<rect x="485" y="405" width="360" height="75" rx="14" class="cache"/><text x="515" y="452" class="body">Vcache [B,1,t,dₕ]</text>
<text x="475" y="525" class="small">head 轴只有 1 份物理/逻辑 KV representation</text>

<path d="M890 350 H980" class="good"/>

<text x="1020" y="180" class="section">Head-axis broadcast</text>
<rect x="950" y="220" width="580" height="280" rx="24" class="green"/>
<text x="985" y="272" class="math">Q [B,H,1,dₕ] × Kᵀ [B,1,dₕ,t]</text>
<text x="985" y="320" class="body">broadcast head axis 1 → H</text>
<rect x="995" y="365" width="490" height="85" rx="16" class="blue"/>
<text x="1025" y="418" class="node">scores [B,H,1,t]</text>
<text x="985" y="490" class="small">每个 Query head 的 score 不同，因为 Qₕ 不同</text>

<text x="70" y="590" class="section">softmax 与 Value 聚合仍按每个 Query head 独立进行</text>
<rect x="70" y="630" width="1460" height="310" rx="24" class="blue"/>
<rect x="115" y="700" width="260" height="78" rx="14" class="query"/><text x="145" y="748" class="node">A1 [1,t]</text><path d="M245 778 V825" class="flow"/><rect x="115" y="825" width="260" height="72" rx="14" class="green"/><text x="145" y="870" class="body">O1=A1·Vshared</text><rect x="465" y="700" width="260" height="78" rx="14" class="query"/><text x="495" y="748" class="node">A2 [1,t]</text><path d="M595 778 V825" class="flow"/><rect x="465" y="825" width="260" height="72" rx="14" class="green"/><text x="495" y="870" class="body">O2=A2·Vshared</text><rect x="815" y="700" width="260" height="78" rx="14" class="query"/><text x="845" y="748" class="node">A3 [1,t]</text><path d="M945 778 V825" class="flow"/><rect x="815" y="825" width="260" height="72" rx="14" class="green"/><text x="845" y="870" class="body">O3=A3·Vshared</text><rect x="1165" y="700" width="260" height="78" rx="14" class="query"/><text x="1195" y="748" class="node">A4 [1,t]</text><path d="M1295 778 V825" class="flow"/><rect x="1165" y="825" width="260" height="72" rx="14" class="green"/><text x="1195" y="870" class="body">O4=A4·Vshared</text>
<path d="M1415 897 V960 H215 V930" class="aux"/>
<text x="585" y="986" class="node">Concat(O₁…O_H) → [B,1,d] → Wᴼ</text>

<rect x="70" y="1015" width="1460" height="55" rx="14" class="box"/>
<text x="100" y="1051" class="small">MQA 仍计算 H 组 attention probabilities；共享发生在 K/V representation 与 Cache，不是把 H 个 Query heads 的 score 合并成一组。</text>
</svg>