<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<rect width="1600" height="1200" fill="#ffffff"/>
<style>
  .t{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
  .h{font-size:38px;font-weight:700}
  .sub{font-size:21px;fill:#475569}
  .st{font-size:24px;font-weight:700}
  .b{font-size:20px}
  .s{font-size:17px;fill:#475569}
  .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}
  .blue{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.2}
  .cyan{fill:#ecfeff;stroke:#06b6d4;stroke-width:2.2}
  .deep{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.2}
  .dash{fill:#f8fafc;stroke:#64748b;stroke-width:2;stroke-dasharray:8 7}
  .arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arr)}
  .thin{fill:none;stroke:#94a3b8;stroke-width:2}
</style>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
</defs>
<text class="t h" x="800" y="62" text-anchor="middle">FlashAttention：用 IO-Aware Tiling 让 Exact Attention 不再物化 N×N 中间矩阵</text>
<text class="t sub" x="800" y="102" text-anchor="middle">核心不是少算 QK pair，而是让数据尽量停留在 SRAM / registers，并在 backward 主动重算</text>
<rect class="box" x="70" y="150" width="310" height="300" rx="22"/>
<text class="t st" x="225" y="195" text-anchor="middle">HBM</text>
<text class="t b" x="225" y="245" text-anchor="middle">Q / K / V</text>
<text class="t b" x="225" y="285" text-anchor="middle">最终 O</text>
<text class="t b" x="225" y="325" text-anchor="middle">softmax stats (LSE)</text>
<line class="thin" x1="120" y1="350" x2="330" y2="350"/>
<text class="t s" x="225" y="386" text-anchor="middle">不写回完整 S=QKᵀ</text>
<text class="t s" x="225" y="414" text-anchor="middle">不写回完整 P=softmax(S)</text>

<path class="arrow" d="M380 300 H470"/>

<rect class="blue" x="470" y="145" width="650" height="310" rx="22"/>
<text class="t st" x="795" y="190" text-anchor="middle">SRAM Tiled Forward</text>
<text class="t b" x="795" y="235" text-anchor="middle">1. load Q_i, K_j, V_j tiles</text>
<text class="t b" x="795" y="275" text-anchor="middle">2. compute local scores Q_i K_jᵀ</text>
<text class="t b" x="795" y="315" text-anchor="middle">3. online softmax：running max m + running sum ℓ</text>
<text class="t b" x="795" y="355" text-anchor="middle">4. rescale accumulated output O_i and add P_ij V_j</text>
<text class="t s" x="795" y="405" text-anchor="middle">每个 tile 被消费后即可释放；跨 tile 只保留 O_i, m_i, ℓ_i</text>

<path class="arrow" d="M1120 300 H1210"/>

<rect class="cyan" x="1210" y="165" width="320" height="270" rx="22"/>
<text class="t st" x="1370" y="210" text-anchor="middle">Exact Output</text>
<text class="t b" x="1370" y="262" text-anchor="middle">O = softmax(QKᵀ)V</text>
<text class="t b" x="1370" y="305" text-anchor="middle">数学定义不变</text>
<text class="t s" x="1370" y="352" text-anchor="middle">same dense pairs</text>
<text class="t s" x="1370" y="382" text-anchor="middle">different execution order</text>

<rect class="deep" x="260" y="560" width="1080" height="260" rx="24"/>
<text class="t st" x="800" y="605" text-anchor="middle">Backward：用 Recomputation 换掉 N×N Activation Storage</text>
<text class="t b" x="800" y="660" text-anchor="middle">保存 Q/K/V + O + softmax stats，而不是保存 P</text>
<path class="arrow" d="M520 705 H690"/>
<text class="t b" x="800" y="715" text-anchor="middle">重新计算需要的 score / probability tiles</text>
<path class="arrow" d="M910 705 H1080"/>
<text class="t b" x="800" y="770" text-anchor="middle">更多 FLOPs，但显著更少 HBM traffic → wall-clock 反而更低</text>

<rect class="box" x="120" y="930" width="1360" height="150" rx="22"/>
<text class="t st" x="800" y="973" text-anchor="middle">性能本质：Memory Traffic ↓↓↓  比  FLOPs ↑  更重要</text>
<text class="t b" x="800" y="1017" text-anchor="middle">Standard Attention 的瓶颈是把 S/P 反复写入和读出 HBM；FlashAttention 把它们留在片上并融合消费</text>
<text class="t s" x="800" y="1052" text-anchor="middle">Exact attention、线性 auxiliary memory、IO-aware algorithm：这三点必须同时理解</text>
</svg>
