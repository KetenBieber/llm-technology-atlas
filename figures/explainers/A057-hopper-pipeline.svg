<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="900" viewBox="0 0 1520 900">
<rect width="1520" height="900" fill="white"/>
<text x="760" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700">FlashAttention-3：把一个 CTA 拆成异步 producer / consumer pipeline</text>
<text x="760" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Hopper 的关键变化：数据搬运、Tensor Core GEMM、softmax 不再必须串行等待同一批线程完成</text>

<rect x="70" y="150" width="260" height="120" rx="18" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
<text x="200" y="194" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">HBM / GMEM</text>
<text x="200" y="232" text-anchor="middle" font-family="Arial" font-size="19">Q, K_j, V_j</text>

<rect x="420" y="135" width="300" height="150" rx="18" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="570" y="178" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Producer warpgroup</text>
<text x="570" y="214" text-anchor="middle" font-family="Arial" font-size="21">issue TMA loads</text>
<text x="570" y="248" text-anchor="middle" font-family="Arial" font-size="18">少量寄存器；主要负责搬运</text>

<rect x="820" y="135" width="315" height="150" rx="18" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="978" y="178" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Circular SMEM buffer</text>
<text x="978" y="214" text-anchor="middle" font-family="Arial" font-size="20">stage 0 / 1 / ...</text>
<text x="978" y="248" text-anchor="middle" font-family="Arial" font-size="18">barrier 管理 ready / consumed</text>

<path d="M330 210 L405 210" stroke="#222" stroke-width="4" marker-end="url(#arr)"/>
<text x="367" y="194" text-anchor="middle" font-family="Arial" font-size="18">TMA</text>
<path d="M720 210 L805 210" stroke="#222" stroke-width="4" marker-end="url(#arr)"/>

<rect x="230" y="390" width="390" height="180" rx="18" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
<text x="425" y="430" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Consumer warpgroup A</text>
<text x="425" y="468" text-anchor="middle" font-family="Arial" font-size="21">WGMMA: QKᵀ / PV</text>
<text x="425" y="504" text-anchor="middle" font-family="Arial" font-size="18">Tensor Cores 异步执行</text>
<text x="425" y="538" text-anchor="middle" font-family="Arial" font-size="18">可分配更多 registers</text>

<rect x="900" y="390" width="390" height="180" rx="18" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
<text x="1095" y="430" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Consumer warpgroup B / CUDA cores</text>
<text x="1095" y="468" text-anchor="middle" font-family="Arial" font-size="21">rowmax / exp / rowsum / rescale</text>
<text x="1095" y="504" text-anchor="middle" font-family="Arial" font-size="18">softmax 非 GEMM 路径</text>
<text x="1095" y="538" text-anchor="middle" font-family="Arial" font-size="18">与另一个异步 WGMMA 尽量重叠</text>

<path d="M930 285 C850 330 620 330 530 378" stroke="#222" stroke-width="4" fill="none" marker-end="url(#arr)"/>
<path d="M1030 285 C1080 330 1090 340 1095 378" stroke="#222" stroke-width="4" fill="none" marker-end="url(#arr)"/>

<rect x="180" y="665" width="1160" height="145" rx="20" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="760" y="706" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">核心不是“每一步更快”，而是让不同硬件引擎同时忙起来</text>
<text x="760" y="748" text-anchor="middle" font-family="Arial" font-size="22">TMA 搬下一块 K/V  ∥  WGMMA 算 GEMM  ∥  CUDA/SFU 做上一块 softmax</text>
<text x="760" y="786" text-anchor="middle" font-family="Arial" font-size="20">同步只保留真正的数据依赖；其余工作通过 barrier + async issue 形成 software pipeline</text>

<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs>
</svg>