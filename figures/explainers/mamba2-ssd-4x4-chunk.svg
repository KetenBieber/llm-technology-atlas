<path d="M279 134 V495" stroke="#334155" stroke-width="4" stroke-dasharray="9 7" opacity=".75"/>
<path d="M66 316 H480" stroke="#334155" stroke-width="4" stroke-dasharray="9 7" opacity=".75"/>
<text x="110" y="137" font-size="17" font-weight="700" font-family="Arial,sans-serif" fill="#1d4ed8">Chunk 0</text>
<text x="315" y="137" font-size="17" font-weight="700" font-family="Arial,sans-serif" fill="#166534">Chunk 1</text>
<path d="M494 396 C555 396,555 294,610 294" stroke="#ea580c" fill="none" stroke-width="3"/>
<path d="M602 284 L615 294 L601 303" fill="none" stroke="#ea580c" stroke-width="3"/>
<text x="625" y="260" font-size="21" font-weight="700" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#c2410c">跨 Chunk：秩一分解</text>
<text x="625" y="302" font-size="19" font-family="Arial,sans-serif" fill="#334155">M(10) = [1/4, 1/8]ᵀ × [1/2, 1]</text>
<text x="625" y="337" font-size="17" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#475569">历史先压缩为 h₁ = 5，再传向下一 Chunk。</text>
<text x="625" y="369" font-size="17" font-family="Arial,sans-serif" fill="#475569">h₂ = (1/4) × 5 + 6 = 7.25</text>
<text x="625" y="401" font-size="17" font-family="Arial,sans-serif" fill="#475569">h₃ = (1/8) × 5 + (1/2) × 6 + 8</text>
<text x="625" y="431" font-size="21" font-family="Arial,sans-serif" font-weight="700" fill="#0f172a">= 11.625</text>
<g font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#334155">
<rect x="80" y="514" width="22" height="18" rx="3" fill="#dbeafe"/><text x="113" y="530">Chunk 0 内部因果计算</text>
<rect x="319" y="514" width="22" height="18" rx="3" fill="#dcfce7"/><text x="351" y="530">Chunk 1 内部因果计算</text>
<rect x="566" y="514" width="22" height="18" rx="3" fill="#ffedd5"/><text x="599" y="530">从历史 Chunk 来的状态贡献</text>
</g>
<text x="60" y="579" font-size="15" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#64748b">自制解释图，非论文原 Figure。仅演示 N = P = 1 的代数等价，非 Mamba-2 核心层性能 Benchmark。</text>
</svg>