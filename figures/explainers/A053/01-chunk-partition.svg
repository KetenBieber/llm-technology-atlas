<rect width="1600" height="1100" fill="#ffffff"/>
<text class="t title" x="70" y="72">DCA · Chunk Partition：内容不折叠，RoPE position 周期复用</text>
<text class="t body muted" x="72" y="112">核心问题：长序列怎样切 chunk，让所有 key phase 留在预训练范围，同时保留每个 token 的内容身份？</text>

<rect x="62" y="150" width="1476" height="122" rx="18" class="gray"/>
<text class="t sub" x="88" y="188">Baseline：绝对位置继续增长 → RoPE phase 进入 OOD 区间</text>
<line x1="100" y1="228" x2="1455" y2="228" stroke="#c94a4a" stroke-width="5"/>
<circle cx="118" cy="228" r="10" fill="#8ea5b7"/><text class="t small" x="108" y="258">0</text><circle cx="202" cy="228" r="10" fill="#8ea5b7"/><text class="t small" x="192" y="258">1</text><circle cx="286" cy="228" r="10" fill="#8ea5b7"/><text class="t small" x="276" y="258">2</text><circle cx="370" cy="228" r="10" fill="#8ea5b7"/><text class="t small" x="360" y="258">3</text><circle cx="454" cy="228" r="10" fill="#8ea5b7"/><text class="t small" x="444" y="258">4</text><circle cx="538" cy="228" r="10" fill="#8ea5b7"/><text class="t small" x="528" y="258">5</text><circle cx="622" cy="228" r="10" fill="#8ea5b7"/><text class="t small" x="612" y="258">6</text><circle cx="706" cy="228" r="10" fill="#8ea5b7"/><text class="t small" x="696" y="258">7</text><circle cx="790" cy="228" r="10" fill="#c94a4a"/><text class="t small" x="780" y="258">8</text><circle cx="874" cy="228" r="10" fill="#c94a4a"/><text class="t small" x="864" y="258">9</text><circle cx="958" cy="228" r="10" fill="#c94a4a"/><text class="t small" x="948" y="258">10</text><circle cx="1042" cy="228" r="10" fill="#c94a4a"/><text class="t small" x="1032" y="258">11</text><circle cx="1126" cy="228" r="10" fill="#c94a4a"/><text class="t small" x="1116" y="258">12</text><circle cx="1210" cy="228" r="10" fill="#c94a4a"/><text class="t small" x="1200" y="258">13</text><circle cx="1294" cy="228" r="10" fill="#c94a4a"/><text class="t small" x="1284" y="258">14</text><circle cx="1378" cy="228" r="10" fill="#c94a4a"/><text class="t small" x="1368" y="258">15</text>
<line x1="778" y1="202" x2="778" y2="255" stroke="#c94a4a" stroke-width="3" stroke-dasharray="7 6"/>
<text class="t small" x="646" y="198">c = 8（示意）</text>
<text class="t small" x="804" y="198" fill="#b23a3a">超出预训练 position range</text>

<text class="t sub" x="72" y="330">DCA：长度 l 被切成 n = ⌈l / s⌉ 个 chunk；示例 c=8，s=4</text>
<rect x="84" y="365" width="326" height="230" rx="18" class="blue"/>
<text class="t sub" x="105" y="402">Chunk 0</text>
<rect x="108" y="430" width="58" height="54" rx="10" fill="#ffffff" stroke="#2f77a8" stroke-width="2"/>
<text class="t body" x="124" y="465">x0</text>
<text class="t small muted" x="119" y="520">p=0</text><rect x="180" y="430" width="58" height="54" rx="10" fill="#ffffff" stroke="#2f77a8" stroke-width="2"/>
<text class="t body" x="196" y="465">x1</text>
<text class="t small muted" x="191" y="520">p=1</text><rect x="252" y="430" width="58" height="54" rx="10" fill="#ffffff" stroke="#2f77a8" stroke-width="2"/>
<text class="t body" x="268" y="465">x2</text>
<text class="t small muted" x="263" y="520">p=2</text><rect x="324" y="430" width="58" height="54" rx="10" fill="#ffffff" stroke="#2f77a8" stroke-width="2"/>
<text class="t body" x="340" y="465">x3</text>
<text class="t small muted" x="335" y="520">p=3</text>
<text class="t small" x="105" y="565">Pₖ[j] = j mod s ∈ [0,3]</text><rect x="439" y="365" width="326" height="230" rx="18" class="blue"/>
