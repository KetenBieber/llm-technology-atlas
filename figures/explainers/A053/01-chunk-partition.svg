<path d="M 185 605 C 185 675, 360 675, 360 736" class="flow"/>
<path d="M 540 605 C 540 675, 520 675, 520 736" class="flow"/>
<path d="M 895 605 C 895 675, 680 675, 680 736" class="flow"/>
<path d="M 1250 605 C 1250 675, 840 675, 840 736" class="flow"/>

<rect x="92" y="742" width="625" height="260" rx="20" class="cyan"/>
<text class="t sub" x="120" y="784">两条信息通道必须分开理解</text>
<text class="t body" x="130" y="834">Content K/V：由 hidden state 投影，x₁ ≠ x₅ ⇒ K₁ ≠ K₅</text>
<text class="t body" x="130" y="878">RoPE phase：位置 ID 可重复，p₁ = p₅ = 1</text>
<text class="t body" x="130" y="922">因此“同 phase”不等于“同 token / 同 key”。</text>
<text class="t small muted" x="130" y="965">DCA 复用的是 position phase，不是把历史内容覆盖掉。</text>

<rect x="780" y="742" width="694" height="260" rx="20" class="green"/>
<text class="t sub" x="810" y="784">为什么这一步重要？</text>
<text class="t body" x="820" y="834">局部 chunk 内：relative offset 仍可精确表示</text>
<text class="t body" x="820" y="878">跨 chunk：后续按 Intra / Successive / Inter 选择不同 Q phase</text>
<text class="t body" x="820" y="922">所有参与 attention 的相对位置被压回 [0, c−1]</text>
<text class="t small muted" x="820" y="965">下一张图回答：不同 chunk relation 究竟怎样选择 query position。</text>
</svg>