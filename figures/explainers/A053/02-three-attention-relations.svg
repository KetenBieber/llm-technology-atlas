<rect x="810" y="190" width="690" height="175" rx="18" class="blue"/>
<text class="t sub" x="838" y="230">① Intra · Δg = 0</text>
<text class="t body" x="838" y="271">Pqᴵⁿᵗʳᵃ = Pk = index mod s</text>
<text class="t body" x="838" y="310">M = Pq − Pk = i − j（局部真实距离精确保留）</text>
<text class="t small muted" x="838" y="344">范围：0 ≤ M ≤ s−1 &lt; c</text>

<rect x="810" y="395" width="690" height="205" rx="18" class="green"/>
<text class="t sub" x="838" y="435">② Successive · Δg = 1</text>
<text class="t body" x="838" y="476">Pqˢᵘᶜᶜ = [s, s+1, …, s+w−1, c−1, …]</text>
<text class="t body" x="838" y="517">边界前 w 个 query 恢复上一 chunk 尾部的真实 local distance</text>
<text class="t body" x="838" y="558">w ≤ c−s；取 w=c−s 可用满训练 position range</text>

<rect x="810" y="630" width="690" height="205" rx="18" class="cyan"/>
<text class="t sub" x="838" y="670">③ Inter · Δg &gt; 1</text>
<text class="t body" x="838" y="711">Pqᴵⁿᵗᵉʳ = c−1</text>
<text class="t body" x="838" y="752">M = (c−1) − Pk ∈ [c−s, c−1]</text>
<text class="t body" x="838" y="793">远距离 exact distance → safe-range class</text>
<text class="t small muted" x="838" y="823">positional aliasing：远历史只保留 chunk 内 phase，不保留精确绝对距离</text>

<path d="M 748 330 C 790 330, 780 275, 808 275" class="flow"/>
<path d="M 748 492 C 785 492, 785 495, 808 495" class="flowG"/>
<path d="M 748 700 C 785 700, 785 730, 808 730" class="flow"/>

<rect x="90" y="900" width="1410" height="130" rx="18" class="orange"/>
<text class="t sub" x="118" y="940">Piecewise core</text>
<text class="t body" x="118" y="981">g(i)=⌊i/s⌋，Δg=g(i)−g(j)：Δg=0 → Intra；Δg=1 → Successive；Δg&gt;1 → Inter</text>
<text class="t body" x="118" y="1015">同一个 content query qᵢ 产生三种 RoPE-rotated qᵢ；改变的是 phase，不是 content projection。</text>
