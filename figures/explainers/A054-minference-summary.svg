<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<rect width="1600" height="1200" fill="#ffffff"/>
<style>
  .t{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
  .h{font-size:38px;font-weight:700}
  .sub{font-size:21px;fill:#475569}
  .st{font-size:24px;font-weight:700}
  .b{font-size:20px}
  .s{font-size:17px;fill:#475569}
  .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}
  .blue{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.2}
  .cyan{fill:#ecfeff;stroke:#06b6d4;stroke-width:2.2}
  .deep{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.2}
  .dash{fill:#f8fafc;stroke:#64748b;stroke-width:2;stroke-dasharray:8 7}
  .arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arr)}
  .thin{fill:none;stroke:#94a3b8;stroke-width:2}
</style>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
</defs>
<text class="t h" x="800" y="62" text-anchor="middle">MInference 1.0：把百万上下文 Prefill 从 Dense O(L²) 变成动态稀疏执行</text>
<text class="t sub" x="800" y="102" text-anchor="middle">Pattern family 可离线确定，但具体 sparse indices 必须随每个 prompt 在线变化</text>
<rect class="blue" x="70" y="165" width="330" height="250" rx="22"/>
<text class="t st" x="235" y="210" text-anchor="middle">Dense Prefill Bottleneck</text>
<text class="t b" x="235" y="258" text-anchor="middle">QKᵀ ∈ R^(L×L)</text>
<text class="t b" x="235" y="300" text-anchor="middle">1M tokens → trillion pairs</text>
<text class="t s" x="235" y="350" text-anchor="middle">FlashAttention 降 IO</text>
<text class="t s" x="235" y="380" text-anchor="middle">但仍计算全部 dense pairs</text>

<path class="arrow" d="M400 290 H500"/>

<rect class="cyan" x="500" y="145" width="430" height="290" rx="22"/>
<text class="t st" x="715" y="190" text-anchor="middle">Observation：稀疏但动态</text>
<text class="t b" x="715" y="238" text-anchor="middle">attention mass 高度集中</text>
<text class="t b" x="715" y="280" text-anchor="middle">同一 head 的 pattern family 较稳定</text>
<text class="t b" x="715" y="322" text-anchor="middle">具体重要位置随 prompt 改变</text>
<line class="thin" x1="555" y1="350" x2="875" y2="350"/>
<text class="t s" x="715" y="386" text-anchor="middle">不能只用固定 mask，也不能暴力 Top-K</text>

<path class="arrow" d="M930 290 H1030"/>

<rect class="deep" x="1030" y="145" width="500" height="290" rx="22"/>
<text class="t st" x="1280" y="190" text-anchor="middle">Offline：Per-Head Pattern Search</text>
<text class="t b" x="1280" y="240" text-anchor="middle">A-shape</text>
<text class="t b" x="1280" y="278" text-anchor="middle">Vertical-Slash</text>
<text class="t b" x="1280" y="316" text-anchor="middle">Block-Sparse</text>
<text class="t s" x="1280" y="362" text-anchor="middle">以 attention-output fidelity + 真实 kernel cost</text>
<text class="t s" x="1280" y="392" text-anchor="middle">选择每个 head 的 family 与预算</text>

<path class="arrow" d="M1280 435 V525"/>

<rect class="blue" x="940" y="525" width="590" height="250" rx="22"/>
<text class="t st" x="1235" y="570" text-anchor="middle">Online：Cheap Dynamic Index Estimation</text>
<text class="t b" x="1235" y="620" text-anchor="middle">VS：少量末尾 query probe → vertical / slash</text>
<text class="t b" x="1235" y="662" text-anchor="middle">BS：pooled Q/K → top blocks</text>
<text class="t s" x="1235" y="710" text-anchor="middle">只生成当前 prompt 真正需要计算的 tiles / columns</text>

<path class="arrow" d="M940 650 H820"/>

<rect class="cyan" x="470" y="525" width="350" height="250" rx="22"/>
<text class="t st" x="645" y="570" text-anchor="middle">Sparse GPU Kernels</text>
<text class="t b" x="645" y="620" text-anchor="middle">selected QK pairs only</text>
<text class="t b" x="645" y="662" text-anchor="middle">exact softmax within mask</text>
<text class="t s" x="645" y="710" text-anchor="middle">PIT / Triton / FlashAttention-style</text>

<path class="arrow" d="M470 650 H350"/>

<rect class="deep" x="70" y="535" width="280" height="230" rx="22"/>
<text class="t st" x="210" y="580" text-anchor="middle">Prefill Output</text>
<text class="t b" x="210" y="630" text-anchor="middle">TTFT ↓</text>
<text class="t b" x="210" y="670" text-anchor="middle">KV Cache built</text>
<text class="t s" x="210" y="716" text-anchor="middle">decode 可继续 dense</text>

<rect class="box" x="125" y="900" width="1350" height="165" rx="24"/>
<text class="t st" x="800" y="943" text-anchor="middle">MInference 优化的是“算哪些 attention pairs”，不是 RoPE 外推，也不是 KV decode</text>
<text class="t b" x="800" y="992" text-anchor="middle">收益 = 减少 QK pair 计算 − 动态索引构建开销；context 越长，稀疏执行越有价值</text>
<text class="t s" x="800" y="1030" text-anchor="middle">它是 approximate dense attention；选定 mask 内的 softmax 可以保持精确</text>
</svg>
