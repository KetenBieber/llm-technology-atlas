ill="#1557B0" opacity=".88"/><text x="636" y="595" text-anchor="middle" font-size="20" fill="#fff">F0</text><rect x="710" y="550" width="92" height="72" rx="12" fill="#0E9AA7" opacity=".88"/><text x="756" y="595" text-anchor="middle" font-size="20" fill="#fff">F1</text><rect x="830" y="550" width="92" height="72" rx="12" fill="#2E8B57" opacity=".88"/><text x="876" y="595" text-anchor="middle" font-size="20" fill="#fff">F2</text><rect x="950" y="550" width="92" height="72" rx="12" fill="#7DB8D8" opacity=".88"/><text x="996" y="595" text-anchor="middle" font-size="20" fill="#fff">F3</text><rect x="1070" y="550" width="92" height="72" rx="12" fill="#1557B0" opacity=".88"/><text x="1116" y="595" text-anchor="middle" font-size="20" fill="#fff">F4</text><rect x="1190" y="550" width="92" height="72" rx="12" fill="#0E9AA7" opacity=".88"/><text x="1236" y="595" text-anchor="middle" font-size="20" fill="#fff">F5</text><rect x="710" y="685" width="92" height="72" rx="12" fill="#1557B0" opacity=".88"/><text x="756" y="730" text-anchor="middle" font-size="20" fill="#fff">F0</text><rect x="830" y="685" width="92" height="72" rx="12" fill="#0E9AA7" opacity=".88"/><text x="876" y="730" text-anchor="middle" font-size="20" fill="#fff">F1</text><rect x="950" y="685" width="92" height="72" rx="12" fill="#2E8B57" opacity=".88"/><text x="996" y="730" text-anchor="middle" font-size="20" fill="#fff">F2</text><rect x="1070" y="685" width="92" height="72" rx="12" fill="#7DB8D8" opacity=".88"/><text x="1116" y="730" text-anchor="middle" font-size="20" fill="#fff">F3</text><rect x="1190" y="685" width="92" height="72" rx="12" fill="#1557B0" opacity=".88"/><text x="1236" y="730" text-anchor="middle" font-size="20" fill="#fff">F4</text><rect x="1310" y="685" width="92" height="72" rx="12" fill="#0E9AA7" opacity=".88"/><text x="1356" y="730" text-anchor="middle" font-size="20" fill="#fff">F5</text>
<path d="M315 255V830" stroke="#C23B3B" stroke-width="3" stroke-dasharray="8 8"/><text x="310" y="865" text-anchor="middle" class="small" fill="#C23B3B">fill start</text>
<polygon points="300,300 650,300 300,705" fill="#C23B3B" opacity=".10"/><text x="430" y="515" class="n" fill="#C23B3B">fill bubble</text>
<polygon points="1140,705 1500,705 1500,300" fill="#C23B3B" opacity=".10"/><text x="1270" y="515" class="n" fill="#C23B3B">drain bubble</text>
<rect x="235" y="845" width="1130" height="95" rx="18" class="orange"/><text x="800" y="884" text-anchor="middle" class="mono">bubble fraction ≈ (p − 1) / m</text><text x="800" y="918" text-anchor="middle" class="small">p = pipeline stages · m = microbatches；m ↑ 可摊薄 bubble，但 microbatch 太小会降低 GEMM efficiency</text>
<text x="800" y="1025" text-anchor="middle" class="n">PP 切的是 layer depth；microbatch 则把 batch 再切成时间流水单位，让不同 stages 在 steady state 同时工作。</text>
</svg>