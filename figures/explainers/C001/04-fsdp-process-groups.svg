<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
.title{font-size:46px;font-weight:700}.subtitle{font-size:24px;fill:#526b80}.section{font-size:30px;font-weight:700}.node{font-size:24px;font-weight:650}.body{font-size:21px}.small{font-size:20px;fill:#526b80}.math{font-size:23px;font-family:"STIX Two Text","Times New Roman",serif}
.box{fill:#f8fbfd;stroke:#8fb6cc;stroke-width:2.2}.blue{fill:#eaf4fb;stroke:#2b6f9f;stroke-width:2.4}.cyan{fill:#eafafa;stroke:#178d98;stroke-width:2.4}.orange{fill:#fff4e8;stroke:#d47a20;stroke-width:2.4}.green{fill:#edf9f1;stroke:#2f8a57;stroke-width:2.4}.gray{fill:#f2f4f6;stroke:#8795a1;stroke-width:2}
.flow{fill:none;stroke:#246b9b;stroke-width:5;marker-end:url(#arrow)}.comm{fill:none;stroke:#d47a20;stroke-width:5;stroke-dasharray:10 8;marker-end:url(#arrowOrange)}.good{fill:none;stroke:#2f8a57;stroke-width:5;marker-end:url(#arrowGreen)}.aux{fill:none;stroke:#607d8b;stroke-width:3;marker-end:url(#arrowGray)}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#246b9b"/></marker>
<marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d47a20"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f8a57"/></marker>
<marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker>
</defs>
<rect width="1600" height="1100" fill="#fff"/>
<text x="70" y="72" class="title">FSDP + Process Groups：为什么 FSDP 是 DP 轴上的 State Sharding，而不是第五个并行维？</text>
<text x="70" y="112" class="subtitle">C001 · 同一个 rank 同时属于 TP / CP / PP / DP groups；只有 DP/FSDP group 决定参数 shard 的长期 ownership</text>

<text x="70" y="178" class="section">一个 rank 的四个正交 communicator</text>
<rect x="70" y="215" width="1460" height="345" rx="22" class="box"/>
<rect x="665" y="320" width="270" height="125" rx="18" class="blue"/>
<text x="705" y="365" class="node">rank r = (d₀,p₁,c₀,t₁)</text>
<text x="710" y="407" class="small">同一物理 GPU，多重逻辑归属</text>

<rect x="160" y="260" width="260" height="95" rx="15" class="blue"/><text x="205" y="302" class="node">TP group</text><text x="185" y="337" class="small">固定 d,p,c；变化 t</text>
<rect x="160" y="415" width="260" height="95" rx="15" class="cyan"/><text x="205" y="457" class="node">CP group</text><text x="185" y="492" class="small">固定 d,p,t；变化 c</text>
<rect x="1180" y="260" width="260" height="95" rx="15" class="gray"/><text x="1225" y="302" class="node">PP chain</text><text x="1205" y="337" class="small">固定 d,c,t；变化 p</text>
<rect x="1180" y="415" width="260" height="95" rx="15" class="green"/><text x="1210" y="457" class="node">DP / FSDP group</text><text x="1205" y="492" class="small">固定 p,c,t；变化 d</text>
<path d="M660 350 H425" class="flow"/><path d="M660 415 H425" class="aux"/><path d="M940 350 H1175" class="aux"/><path d="M940 415 H1175" class="good"/>

<text x="70" y="630" class="section">FSDP 生命周期：平时只存 shard，算到当前 module 时临时 all-gather 完整参数</text>
<rect x="70" y="665" width="1460" height="360" rx="22" class="gray"/>

<text x="105" y="720" class="node">Persistent state（DP degree d=4）</text>
<g>
<rect x="105" y="755" width="180" height="72" rx="12" class="blue"/><text x="160" y="799" class="body">Rank0 · W₀</text>
<rect x="305" y="755" width="180" height="72" rx="12" class="cyan"/><text x="360" y="799" class="body">Rank1 · W₁</text>
<rect x="505" y="755" width="180" height="72" rx="12" class="green"/><text x="560" y="799" class="body">Rank2 · W₂</text>
<rect x="705" y="755" width="180" height="72" rx="12" class="gray"/><text x="760" y="799" class="body">Rank3 · W₃</text>
</g>

<path d="M900 790 H1000" class="comm"/>
<rect x="1000" y="735" width="225" height="112" rx="15" class="orange"/>
<text x="1037" y="778" class="node">All-Gather W</text>
<text x="1028" y="817" class="math">W=[W₀;W₁;W₂;W₃]</text>
<path d="M1225 790 H1320" class="flow"/>
<rect x="1320" y="735" width="170" height="112" rx="15" class="green"/>
<text x="1353" y="778" class="node">Forward</text>
<text x="1340" y="817" class="small">then reshard</text>

<path d="M1405 852 V905 H1110" class="aux"/>
<rect x="865" y="875" width="245" height="112" rx="15" class="orange"/>
<text x="905" y="918" class="node">Backward</text>
<text x="895" y="957" class="small">必要时再次 all-gather</text>
<path d="M860 930 H740" class="comm"/>
<rect x="480" y="875" width="260" height="112" rx="15" class="orange"/>
<text x="510" y="918" class="node">Reduce-Scatter dW</text>
<text x="510" y="957" class="small">reduction + shard ownership</text>
<path d="M475 930 H330" class="good"/>
<rect x="105" y="875" width="225" height="112" rx="15" class="green"/>
<text x="137" y="918" class="node">Gradient shards</text>
<text x="133" y="957" class="small">optimizer 只更新本地 shard</text>

<rect x="70" y="1045" width="1460" height="42" rx="11" class="box"/>
<text x="100" y="1073" class="small">FSDP 的本质：DP 计算语义不变，但 full parameter 从“永久复制”变成“按 module 临时 materialize”；内存换通信，prefetch/reshard 决定能否 overlap。</text>
</svg>