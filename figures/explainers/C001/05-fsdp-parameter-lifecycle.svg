<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>FSDP：Parameter Shard 的生命周期与 Collective 时序</title><desc>FSDP rank 平时只拥有 parameter shard；module execution 前 all-gather full params，计算后 reshard，gradient 用 reduce-scatter 直接回到 owner shard。</desc><defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1557B0"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E58A1F"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2E8B57"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C23B3B"/></marker>
<style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324D}.title{font-size:46px;font-weight:700}.sub{font-size:23px;fill:#596579}.h{font-size:28px;font-weight:700}.n{font-size:22px}.small{font-size:20px}.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:21px}.panel{fill:#F8FBFE;stroke:#B8CADB;stroke-width:2}.blue{fill:#EAF3FF;stroke:#1557B0;stroke-width:2.5}.cyan{fill:#E8FAFB;stroke:#0E9AA7;stroke-width:2.5}.orange{fill:#FFF4E6;stroke:#E58A1F;stroke-width:2.5}.green{fill:#ECF8F1;stroke:#2E8B57;stroke-width:2.5}.red{fill:#FFF0F0;stroke:#C23B3B;stroke-width:2.5}.gray{fill:#F1F4F7;stroke:#7D8B99;stroke-width:2}.flow{fill:none;stroke:#1557B0;stroke-width:4;marker-end:url(#ab)}.comm{fill:none;stroke:#E58A1F;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#ao)}.good{fill:none;stroke:#2E8B57;stroke-width:4;marker-end:url(#ag)}.bad{fill:none;stroke:#C23B3B;stroke-width:4;marker-end:url(#ar)}</style></defs><rect width="1600" height="1100" fill="#fff"/><text x="70" y="72" class="title">FSDP：Parameter Shard 的生命周期与 Collective 时序</text>
<text x="70" y="112" class="sub">认知问题：FSDP 怎样在保持 Data Parallel 计算语义的同时，不让每张 GPU 永久保存完整 model states？</text>
<rect x="65" y="155" width="1470" height="820" rx="24" class="panel"/>
<text x="110" y="225" class="h">Persistent ownership（平时）</text>
<rect x="150" y="270" width="250" height="100" rx="18" fill="#EAF3FF" stroke="#1557B0" stroke-width="2.5"/><text x="275" y="312" text-anchor="middle" class="n">Rank 0</text><text x="275" y="348" text-anchor="middle" class="mono">owns W0</text><rect x="490" y="270" width="250" height="100" rx="18" fill="#E8FAFB" stroke="#0E9AA7" stroke-width="2.5"/><text x="615" y="312" text-anchor="middle" class="n">Rank 1</text><text x="615" y="348" text-anchor="middle" class="mono">owns W1</text><rect x="830" y="270" width="250" height="100" rx="18" fill="#EAF3FF" stroke="#1557B0" stroke-width="2.5"/><text x="955" y="312" text-anchor="middle" class="n">Rank 2</text><text x="955" y="348" text-anchor="middle" class="mono">owns W2</text><rect x="1170" y="270" width="250" height="100" rx="18" fill="#E8FAFB" stroke="#0E9AA7" stroke-width="2.5"/><text x="1295" y="312" text-anchor="middle" class="n">Rank 3</text><text x="1295" y="348" text-anchor="middle" class="mono">owns W3</text>
<path d="M275 370V465" class="comm"/><path d="M615 370V465" class="comm"/><path d="M955 370V465" class="comm"/><path d="M1295 370V465" class="comm"/>
<rect x="180" y="475" width="1240" height="110" rx="20" class="orange"/><text x="800" y="518" text-anchor="middle" class="h">All-Gather before module compute</text><text x="800" y="558" text-anchor="middle" class="mono">[W₀,W₁,W₂,W₃] → temporary full W on each participating rank</text>
<path d="M800 585V650" class="flow"/>
<rect x="555" y="660" width="490" height="100" rx="18" class="blue"/><text x="800" y="702" text-anchor="middle" class="n">Forward / Backward module compute</text><text x="800" y="738" text-anchor="middle" class="small">full W 只在需要时临时存在</text>
<path d="M555 710H440" class="good"/><rect x="160" y="655" width="260" height="110" rx="18" class="green"/><text x="290" y="697" text-anchor="middle" class="n">Reshard / free full W</text><text x="290" y="735" text-anchor="middle" class="small">降低 peak residency</text>
<path d="M1045 710H1160" class="comm"/><rect x="1180" y="645" width="285" height="130" rx="18" class="orange"/><text x="1322" y="686" text-anchor="middle" class="n">Reduce-Scatter gradients</text><text x="1322" y="726" text-anchor="middle" class="mono">Σ_r G^(r) → G_shard</text><text x="1322" y="758" text-anchor="middle" class="small">直接回到 owner rank</text>
<rect x="205" y="845" width="1190" height="90" rx="18" class="green"/><text x="800" y="882" text-anchor="middle" class="n">更 aggressive reshard → HBM residency ↓，但 backward 前可能需要再次 all-gather → communication ↑</text><text x="800" y="917" text-anchor="middle" class="small">FSDP 描述 DP group 内 model-state storage / ownership，不是额外的第五个 parallel coordinate</text>
</svg>