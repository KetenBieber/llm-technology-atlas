<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>4D Parallelism：把不同通信模式映射到物理网络层级</title><desc>通信不是一个抽象常数：TP、PP、CP、FSDP 的消息频率/数据量不同，应结合 NVLink/NVSwitch 与跨节点网络做 topology-aware placement 和 overlap。</desc><defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1557B0"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E58A1F"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2E8B57"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C23B3B"/></marker>
<style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324D}.title{font-size:46px;font-weight:700}.sub{font-size:23px;fill:#596579}.h{font-size:28px;font-weight:700}.n{font-size:22px}.small{font-size:20px}.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:21px}.panel{fill:#F8FBFE;stroke:#B8CADB;stroke-width:2}.blue{fill:#EAF3FF;stroke:#1557B0;stroke-width:2.5}.cyan{fill:#E8FAFB;stroke:#0E9AA7;stroke-width:2.5}.orange{fill:#FFF4E6;stroke:#E58A1F;stroke-width:2.5}.green{fill:#ECF8F1;stroke:#2E8B57;stroke-width:2.5}.red{fill:#FFF0F0;stroke:#C23B3B;stroke-width:2.5}.gray{fill:#F1F4F7;stroke:#7D8B99;stroke-width:2}.flow{fill:none;stroke:#1557B0;stroke-width:4;marker-end:url(#ab)}.comm{fill:none;stroke:#E58A1F;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#ao)}.good{fill:none;stroke:#2E8B57;stroke-width:4;marker-end:url(#ag)}.bad{fill:none;stroke:#C23B3B;stroke-width:4;marker-end:url(#ar)}</style></defs><rect width="1600" height="1100" fill="#fff"/><text x="70" y="72" class="title">4D Parallelism：把不同通信模式映射到物理网络层级</text>
<text x="70" y="112" class="sub">认知问题：为什么 parallel degree 不能只看“GPU 数量能不能乘起来”，还必须看 communicator 落在哪一级物理互联？</text>
<rect x="65" y="155" width="1470" height="820" rx="24" class="panel"/>
<text x="120" y="215" class="h">Physical topology（示意）</text>
<rect x="115" y="265" width="585" height="360" rx="24" class="blue"/><text x="408" y="307" text-anchor="middle" class="h">Node A · NVLink / NVSwitch domain</text>
<circle cx="210" cy="390" r="48" fill="#1557B0"/><text x="210" y="397" text-anchor="middle" font-size="20" fill="#fff">GPU0</text><circle cx="390" cy="390" r="48" fill="#1557B0"/><text x="390" y="397" text-anchor="middle" font-size="20" fill="#fff">GPU1</text><circle cx="570" cy="390" r="48" fill="#1557B0"/><text x="570" y="397" text-anchor="middle" font-size="20" fill="#fff">GPU2</text><circle cx="300" cy="535" r="48" fill="#1557B0"/><text x="300" y="542" text-anchor="middle" font-size="20" fill="#fff">GPU3</text><circle cx="480" cy="535" r="48" fill="#1557B0"/><text x="480" y="542" text-anchor="middle" font-size="20" fill="#fff">GPU4</text>
<path d="M258 390H342M438 390H522M240 430L280 500M570 438L505 500M390 438V487" stroke="#0E9AA7" stroke-width="5"/>
<rect x="900" y="265" width="585" height="360" rx="24" class="cyan"/><text x="1192" y="307" text-anchor="middle" class="h">Node B · NVLink / NVSwitch domain</text>
<circle cx="995" cy="390" r="48" fill="#0E9AA7"/><text x="995" y="397" text-anchor="middle" font-size="20" fill="#fff">GPU5</text><circle cx="1175" cy="390" r="48" fill="#0E9AA7"/><text x="1175" y="397" text-anchor="middle" font-size="20" fill="#fff">GPU6</text><circle cx="1355" cy="390" r="48" fill="#0E9AA7"/><text x="1355" y="397" text-anchor="middle" font-size="20" fill="#fff">GPU7</text><circle cx="1085" cy="535" r="48" fill="#0E9AA7"/><text x="1085" y="542" text-anchor="middle" font-size="20" fill="#fff">GPU8</text><circle cx="1265" cy="535" r="48" fill="#0E9AA7"/><text x="1265" y="542" text-anchor="middle" font-size="20" fill="#fff">GPU9</text>
<path d="M1043 390H1127M1223 390H1307M1025 430L1065 500M1355 438L1290 500M1175 438V487" stroke="#1557B0" stroke-width="5"/>
<path d="M700 445H900" class="comm"/><text x="800" y="417" text-anchor="middle" class="n">InfiniBand / RoCE</text><text x="800" y="475" text-anchor="middle" class="small">跨节点：相对更高 latency / 更低有效 bandwidth</text>

<text x="115" y="700" class="h">Logical communication → placement principle</text>
<rect x="120" y="745" width="300" height="125" rx="18" class="blue"/><text x="270" y="786" text-anchor="middle" class="n">TP</text><text x="270" y="824" text-anchor="middle" class="small">layer critical path 高频 collective</text><text x="270" y="855" text-anchor="middle" class="small">通常优先最快 intra-node link</text>
<rect x="455" y="745" width="300" height="125" rx="18" class="orange"/><text x="605" y="786" text-anchor="middle" class="n">PP</text><text x="605" y="824" text-anchor="middle" class="small">stage-boundary P2P</text><text x="605" y="855" text-anchor="middle" class="small">更容易跨节点扩 depth</text>
<rect x="790" y="745" width="300" height="125" rx="18" class="green"/><text x="940" y="786" text-anchor="middle" class="n">CP</text><text x="940" y="824" text-anchor="middle" class="small">KV exchange / ring</text><text x="940" y="855" text-anchor="middle" class="small">placement 依 workload 与网络</text>
<rect x="1125" y="745" width="330" height="125" rx="18" class="cyan"/><text x="1290" y="786" text-anchor="middle" class="n">FSDP</text><text x="1290" y="824" text-anchor="middle" class="small">module all-gather / reduce-scatter</text><text x="1290" y="855" text-anchor="middle" class="small">考虑 prefetch 与 overlap</text>
<rect x="375" y="905" width="850" height="92" rx="18" class="green"/><text x="800" y="941" text-anchor="middle" class="mono">T_comm ≈ α·N_messages + β·V_bytes</text><text x="800" y="974" text-anchor="middle" class="mono">with overlap: T_step ≈ max(T_compute, T_comm)</text>
<text x="800" y="1040" text-anchor="middle" class="small">高频通信优先最快互联是原则，不是固定布局；最终 degrees × topology × overlap 必须联合优化。</text>
</svg>