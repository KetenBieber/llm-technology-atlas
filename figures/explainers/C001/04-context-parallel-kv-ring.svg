<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>Context Parallelism：Local Q 不动，让 KV Blocks 沿 Ring 流动</title><desc>每个 CP rank 固定自己的 local Q/activation shard；K/V blocks 在 ranks 间轮转，每轮做本地 blockwise exact attention，并用 online softmax 合并。</desc><defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1557B0"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E58A1F"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2E8B57"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C23B3B"/></marker>
<style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324D}.title{font-size:46px;font-weight:700}.sub{font-size:23px;fill:#596579}.h{font-size:28px;font-weight:700}.n{font-size:22px}.small{font-size:20px}.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:21px}.panel{fill:#F8FBFE;stroke:#B8CADB;stroke-width:2}.blue{fill:#EAF3FF;stroke:#1557B0;stroke-width:2.5}.cyan{fill:#E8FAFB;stroke:#0E9AA7;stroke-width:2.5}.orange{fill:#FFF4E6;stroke:#E58A1F;stroke-width:2.5}.green{fill:#ECF8F1;stroke:#2E8B57;stroke-width:2.5}.red{fill:#FFF0F0;stroke:#C23B3B;stroke-width:2.5}.gray{fill:#F1F4F7;stroke:#7D8B99;stroke-width:2}.flow{fill:none;stroke:#1557B0;stroke-width:4;marker-end:url(#ab)}.comm{fill:none;stroke:#E58A1F;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#ao)}.good{fill:none;stroke:#2E8B57;stroke-width:4;marker-end:url(#ag)}.bad{fill:none;stroke:#C23B3B;stroke-width:4;marker-end:url(#ar)}</style></defs><rect width="1600" height="1100" fill="#fff"/><text x="70" y="72" class="title">Context Parallelism：Local Q 不动，让 KV Blocks 沿 Ring 流动</text>
<text x="70" y="112" class="sub">认知问题：Sequence 被切到多卡后，为什么 Attention 仍需要 global KV？如何避免一次性 all-gather 全部 KV？</text>
<rect x="65" y="155" width="1470" height="820" rx="24" class="panel"/>
<circle cx="800" cy="550" r="185" fill="#F8FBFE" stroke="#B8CADB" stroke-width="3"/>
<rect x="675" y="192" width="250" height="156" rx="22" class="blue"/><text x="800" y="242" text-anchor="middle" class="h">GPU0</text><text x="800" y="284" text-anchor="middle" class="n">Q₀ 固定</text><text x="800" y="322" text-anchor="middle" class="small">K₀,V₀ 初始 block</text><rect x="1010" y="472" width="250" height="156" rx="22" class="cyan"/><text x="1135" y="522" text-anchor="middle" class="h">GPU1</text><text x="1135" y="564" text-anchor="middle" class="n">Q₁ 固定</text><text x="1135" y="602" text-anchor="middle" class="small">K₁,V₁ 初始 block</text><rect x="675" y="752" width="250" height="156" rx="22" class="blue"/><text x="800" y="802" text-anchor="middle" class="h">GPU2</text><text x="800" y="844" text-anchor="middle" class="n">Q₂ 固定</text><text x="800" y="882" text-anchor="middle" class="small">K₂,V₂ 初始 block</text><rect x="340" y="472" width="250" height="156" rx="22" class="cyan"/><text x="465" y="522" text-anchor="middle" class="h">GPU3</text><text x="465" y="564" text-anchor="middle" class="n">Q₃ 固定</text><text x="465" y="602" text-anchor="middle" class="small">K₃,V₃ 初始 block</text>
<path d="M920 305C1040 355 1090 410 1125 465" class="comm"/><path d="M1125 630C1070 720 970 775 900 805" class="comm"/><path d="M680 805C575 765 500 680 475 635" class="comm"/><path d="M475 465C520 375 640 310 680 300" class="comm"/>
<text x="800" y="505" text-anchor="middle" class="h">KV ring</text><text x="800" y="550" text-anchor="middle" class="n">每轮 rotate K/V block</text><text x="800" y="590" text-anchor="middle" class="small">Q shard stays local</text>
<rect x="180" y="235" width="305" height="135" rx="18" class="green"/><text x="332" y="278" text-anchor="middle" class="n">每轮本地计算</text><text x="332" y="318" text-anchor="middle" class="mono">Q_r · K_blockᵀ</text><text x="332" y="350" text-anchor="middle" class="small">blockwise exact attention</text>
<rect x="1110" y="235" width="305" height="135" rx="18" class="green"/><text x="1262" y="278" text-anchor="middle" class="n">跨轮合并</text><text x="1262" y="318" text-anchor="middle" class="mono">running (m,ℓ,O)</text><text x="1262" y="350" text-anchor="middle" class="small">online softmax statistics</text>
<rect x="480" y="920" width="640" height="70" rx="16" class="orange"/><text x="800" y="965" text-anchor="middle" class="n">CP trade-off：local activation / compute ↓，distributed KV communication ↑</text>
<text x="800" y="1040" text-anchor="middle" class="small">经过 c 轮，每个 local Q shard 都与完整 context 的所有 KV blocks 交互；CP 改变 placement，不把 exact attention 变成 sparse attention。</text>
</svg>