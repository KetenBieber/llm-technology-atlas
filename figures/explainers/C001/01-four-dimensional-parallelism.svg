<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
.title{font-size:46px;font-weight:700}.subtitle{font-size:24px;fill:#526b80}.section{font-size:30px;font-weight:700}.node{font-size:24px;font-weight:650}.body{font-size:21px}.small{font-size:20px;fill:#526b80}.math{font-size:23px;font-family:"STIX Two Text","Times New Roman",serif}
.box{fill:#f8fbfd;stroke:#8fb6cc;stroke-width:2.2}.blue{fill:#eaf4fb;stroke:#2b6f9f;stroke-width:2.4}.cyan{fill:#eafafa;stroke:#178d98;stroke-width:2.4}.orange{fill:#fff4e8;stroke:#d47a20;stroke-width:2.4}.green{fill:#edf9f1;stroke:#2f8a57;stroke-width:2.4}.gray{fill:#f2f4f6;stroke:#8795a1;stroke-width:2}
.flow{fill:none;stroke:#246b9b;stroke-width:5;marker-end:url(#arrow)}.comm{fill:none;stroke:#d47a20;stroke-width:5;stroke-dasharray:10 8;marker-end:url(#arrowOrange)}.good{fill:none;stroke:#2f8a57;stroke-width:5;marker-end:url(#arrowGreen)}.aux{fill:none;stroke:#607d8b;stroke-width:3;marker-end:url(#arrowGray)}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#246b9b"/></marker>
<marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d47a20"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f8a57"/></marker>
<marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker>
</defs>
<rect width="1600" height="1100" fill="#fff"/>
<text x="70" y="72" class="title">4D Parallelism：TP、CP、PP、DP 到底分别切训练图的哪一个轴？</text>
<text x="70" y="112" class="subtitle">C001 · 四个 degree 不是四种“加速开关”，而是 tensor / sequence / depth / data replica 四个正交 ownership 维度</text>

<text x="70" y="176" class="section">从一个样本的 Transformer 训练图出发</text>
<rect x="70" y="210" width="1460" height="590" rx="24" class="box"/>

<rect x="585" y="300" width="430" height="330" rx="24" class="blue"/>
<text x="650" y="350" class="node">一个 logical data replica</text>
<text x="660" y="394" class="math">X ∈ Rᴮˣˢˣᴴ　·　L layers</text>
<g>
<rect x="650" y="440" width="300" height="45" class="cyan"/><text x="680" y="470" class="small">Layer 0 · Attention + MLP</text>
<rect x="650" y="495" width="300" height="45" class="cyan"/><text x="680" y="525" class="small">Layer 1 · Attention + MLP</text>
<rect x="650" y="550" width="300" height="45" class="cyan"/><text x="720" y="580" class="small">… Layer L−1</text>
</g>

<rect x="105" y="285" width="310" height="170" rx="18" class="green"/>
<text x="145" y="330" class="node">DP / FSDP：切 B</text>
<text x="135" y="370" class="body">不同 replica 处理不同样本</text>
<text x="135" y="408" class="small">FSDP 只改变 DP 组内 state ownership</text>
<path d="M420 370 H575" class="good"/>

<rect x="105" y="535" width="310" height="170" rx="18" class="orange"/>
<text x="145" y="580" class="node">CP：切 S</text>
<text x="135" y="620" class="body">local Q + global KV interaction</text>
<text x="135" y="658" class="small">ring / KV exchange 跨 context ranks</text>
<path d="M420 620 H575" class="comm"/>

<rect x="1185" y="285" width="310" height="170" rx="18" class="blue"/>
<text x="1228" y="330" class="node">TP：切 H / heads</text>
<text x="1215" y="370" class="body">同一 layer 内矩阵/heads 分片</text>
<text x="1215" y="408" class="small">高频 collective 进入 layer critical path</text>
<path d="M1180 370 H1025" class="flow"/>

<rect x="1185" y="535" width="310" height="170" rx="18" class="cyan"/>
<text x="1235" y="580" class="node">PP：切 L</text>
<text x="1215" y="620" class="body">不同 GPU stages 持有不同 layers</text>
<text x="1215" y="658" class="small">activation / gradient 沿 stage p2p</text>
<path d="M1180 620 H1025" class="aux"/>

<path d="M800 290 V235" class="aux"/><text x="700" y="250" class="math">N_GPU = t × c × p × d</text>

<text x="70" y="865" class="section">组合后的 ownership：一个样本占 t×c×p 张 GPU，只有 DP 增加独立样本数</text>
<rect x="70" y="900" width="1460" height="130" rx="20" class="gray"/>
<text x="110" y="948" class="math">model-parallel replica = TP × CP × PP = t c p</text>
<text x="110" y="993" class="math">B_global = microbatch b × microbatches m × DP degree d</text>
<text x="820" y="948" class="body">TP / CP / PP：一起算同一个样本</text>
<text x="820" y="993" class="body">DP / FSDP：不同 replicas 才处理不同数据</text>

<rect x="70" y="1050" width="1460" height="38" rx="10" class="box"/>
<text x="100" y="1077" class="small">系统设计顺序：先定位哪一类内存/计算沿哪个逻辑轴增长，再选择对应切分；切完以后才讨论 collective、bubble、topology 与 overlap。</text>
</svg>