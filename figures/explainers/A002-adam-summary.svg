<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect x="0" y="0" width="1600" height="1200" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="800.0" y="64" font-family="Georgia, Microsoft YaHei, serif" font-size="48" font-weight="700" fill="#103B63" text-anchor="middle">Adam：一阶矩、二阶矩与偏差校正</text><text x="800.0" y="108" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" fill="#60788D" text-anchor="middle">核心思想：同时估计梯度方向与尺度，再形成逐参数自适应步长</text><rect x="35" y="145" width="370" height="815" rx="22" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="35" y="145" width="370" height="58" rx="22" fill="#103B63"/><rect x="35" y="179" width="370" height="24" fill="#103B63"/><text x="59" y="184" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">输入与状态</text><circle cx="75" cy="225" r="24" fill="#0A9AA6"/><text x="75" y="234" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="115" y="233" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">梯度 gₜ</text><text x="78" y="277" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="277" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">来自当前 mini-batch</text><text x="78" y="313" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="313" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">可能噪声大、尺度不同</text><circle cx="75" cy="450" r="24" fill="#0A9AA6"/><text x="75" y="459" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="115" y="458" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">一阶矩 mₜ</text><text x="78" y="502" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="502" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">梯度 EMA</text><text x="78" y="538" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="538" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">近似平滑方向</text><circle cx="75" cy="675" r="24" fill="#0A9AA6"/><text x="75" y="684" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="115" y="683" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">二阶矩 vₜ</text><text x="78" y="727" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="727" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">平方梯度 EMA</text><text x="78" y="763" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="763" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">估计局部尺度</text><rect x="430" y="145" width="740" height="815" rx="22" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="430" y="145" width="740" height="58" rx="22" fill="#103B63"/><rect x="430" y="179" width="740" height="24" fill="#103B63"/><text x="454" y="184" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">一次 Adam 更新</text><rect x="520" y="245" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="245" width="14" height="90" rx="7" fill="#1573B8"/><text x="555" y="280" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">mₜ = β₁mₜ₋₁ + (1−β₁)gₜ</text><text x="555" y="310" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">平滑梯度方向</text><line x1="800" y1="335" x2="800" y2="361" stroke="#1573B8" stroke-width="3"/><polygon points="800,361 786,353 786,369" fill="#1573B8"/><rect x="520" y="365" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="365" width="14" height="90" rx="7" fill="#0A9AA6"/><text x="555" y="400" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">vₜ = β₂vₜ₋₁ + (1−β₂)gₜ²</text><text x="555" y="430" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">跟踪平方梯度尺度</text><line x1="800" y1="455" x2="800" y2="481" stroke="#1573B8" stroke-width="3"/><polygon points="800,481 786,473 786,489" fill="#1573B8"/><rect x="520" y="485" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="485" width="14" height="90" rx="7" fill="#56B99A"/><text x="555" y="520" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Bias correction</text><text x="555" y="550" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">m̂ₜ=mₜ/(1−β₁ᵗ)，v̂ₜ=vₜ/(1−β₂ᵗ)</text><line x1="800" y1="575" x2="800" y2="601" stroke="#1573B8" stroke-width="3"/><polygon points="800,601 786,593 786,609" fill="#1573B8"/><rect x="520" y="605" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="605" width="14" height="90" rx="7" fill="#F5B85A"/><text x="555" y="640" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Adaptive step</text><text x="555" y="670" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">Δθ = −α m̂ₜ /(√v̂ₜ+ε)</text><line x1="800" y1="695" x2="800" y2="721" stroke="#1573B8" stroke-width="3"/><polygon points="800,721 786,713 786,729" fill="#1573B8"/><rect x="520" y="725" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="725" width="14" height="90" rx="7" fill="#1573B8"/><text x="555" y="760" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">θₜ ← θₜ₋₁ + Δθ</text><text x="555" y="790" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">逐参数更新</text><rect x="1195" y="145" width="370" height="815" rx="22" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="1195" y="145" width="370" height="58" rx="22" fill="#103B63"/><rect x="1195" y="179" width="370" height="24" fill="#103B63"/><text x="1219" y="184" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">为什么有效</text><rect x="1220" y="225" width="320" height="185" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="1220" y="225" width="8" height="185" rx="4" fill="#0A9AA6"/><text x="1240" y="259" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1C3550" text-anchor="start">Momentum</text><text x="1240" y="293" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#60788D" text-anchor="start">降低梯度方向抖动，积累一致趋势</text><rect x="1220" y="430" width="320" height="185" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="1220" y="430" width="8" height="185" rx="4" fill="#1573B8"/><text x="1240" y="464" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1C3550" text-anchor="start">Scale adaptation</text><text x="1240" y="498" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#60788D" text-anchor="start">大尺度梯度被归一化，小尺度方向仍可前进</text><rect x="1220" y="635" width="320" height="185" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="1220" y="635" width="8" height="185" rx="4" fill="#56B99A"/><text x="1240" y="669" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1C3550" text-anchor="start">Early-step correction</text><text x="1240" y="703" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#60788D" text-anchor="start">修正 EMA 从 0 初始化造成的系统性偏小</text><rect x="500" y="870" width="600" height="70" rx="14" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="800" y="914" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#103B63" text-anchor="middle">Adam = momentum direction + RMS scale normalization + bias correction</text><rect x="35" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="81" cy="1070" r="28" fill="#E8F5FB"/><text x="81" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">◎</text><text x="123" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">目标：稳定更新</text><text x="123" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">在噪声与各向异性梯度下保持可用步长</text><rect x="550" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="596" cy="1070" r="28" fill="#E8F5FB"/><text x="596" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">⚙</text><text x="638" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">方法：双 EMA</text><text x="638" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">m 追踪方向，v 追踪尺度</text><rect x="1065" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="1111" cy="1070" r="28" fill="#E8F5FB"/><text x="1111" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">▥</text><text x="1153" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">关键：偏差校正</text><text x="1153" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">前几步不能直接使用从 0 启动的 EMA</text></svg>