<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="760" viewBox="0 0 1420 760">
<rect width="1420" height="760" fill="#fff"/>
<text x="55" y="60" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">三次 Attention 不能直接相加：必须恢复同一个全局 Softmax</text>
<g font-family="Arial,sans-serif">
<rect x="70" y="135" width="360" height="130" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
<text x="250" y="175" text-anchor="middle" font-size="24" font-weight="700" fill="#166534">Intra group</text>
<text x="250" y="210" text-anchor="middle" font-size="19" fill="#14532d">Z₁ = Σ exp(zⱼ)</text>
<text x="250" y="240" text-anchor="middle" font-size="19" fill="#14532d">o₁ = (1/Z₁) Σ exp(zⱼ)vⱼ</text>
<rect x="530" y="135" width="360" height="130" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="710" y="175" text-anchor="middle" font-size="24" font-weight="700" fill="#92400e">Successive group</text>
<text x="710" y="210" text-anchor="middle" font-size="19" fill="#78350f">Z₂ = Σ exp(zⱼ)</text>
<text x="710" y="240" text-anchor="middle" font-size="19" fill="#78350f">o₂ = (1/Z₂) Σ exp(zⱼ)vⱼ</text>
<rect x="990" y="135" width="360" height="130" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="1170" y="175" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a8a">Inter group</text>
<text x="1170" y="210" text-anchor="middle" font-size="19" fill="#1e40af">Z₃ = Σ exp(zⱼ)</text>
<text x="1170" y="240" text-anchor="middle" font-size="19" fill="#1e40af">o₃ = (1/Z₃) Σ exp(zⱼ)vⱼ</text>
<path d="M250 265 C300 350 480 370 570 410" fill="none" stroke="#22c55e" stroke-width="4" marker-end="url(#a1)"/>
<path d="M710 265 V405" fill="none" stroke="#f59e0b" stroke-width="4" marker-end="url(#a2)"/>
<path d="M1170 265 C1100 350 930 370 850 410" fill="none" stroke="#3b82f6" stroke-width="4" marker-end="url(#a3)"/>
<rect x="360" y="410" width="700" height="175" rx="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="710" y="455" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Global Attention Output</text>
<text x="710" y="505" text-anchor="middle" font-size="25" fill="#111827">o = (Z₁o₁ + Z₂o₂ + Z₃o₃) / (Z₁ + Z₂ + Z₃)</text>
<text x="710" y="550" text-anchor="middle" font-size="19" fill="#4b5563">每个 group 的局部 softmax output 必须按其 partition mass 重新加权</text>
<rect x="355" y="625" width="710" height="80" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
<text x="710" y="660" text-anchor="middle" font-size="21" font-weight="700" fill="#991b1b">错误：o = o₁ + o₂ + o₃</text>
<text x="710" y="687" text-anchor="middle" font-size="17" fill="#7f1d1d">这样会把三个局部 softmax 都强制当成相同概率质量，已经不是原来的全局 attention。</text>
<text x="55" y="735" font-size="17" fill="#6b7280">实际 FlashAttention 合并通常使用每组的 max / log-sum-exp 统计量做数值稳定 merge，而不是显式 materialize 全部 attention map。</text>
</g>
<defs>
<marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/></marker>
<marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/></marker>
<marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/></marker>
</defs>
</svg>