<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<rect width="1600" height="1200" fill="#ffffff"/>
<style>
  .t{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
  .h{font-size:38px;font-weight:700}
  .sub{font-size:21px;fill:#475569}
  .st{font-size:24px;font-weight:700}
  .b{font-size:20px}
  .s{font-size:17px;fill:#475569}
  .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}
  .blue{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.2}
  .cyan{fill:#ecfeff;stroke:#06b6d4;stroke-width:2.2}
  .deep{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.2}
  .dash{fill:#f8fafc;stroke:#64748b;stroke-width:2;stroke-dasharray:8 7}
  .arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arr)}
  .thin{fill:none;stroke:#94a3b8;stroke-width:2}
</style>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
</defs>
<text class="t h" x="800" y="62" text-anchor="middle">Dual Chunk Attention：用三类相对位置关系组织超长上下文</text>
<text class="t sub" x="800" y="102" text-anchor="middle">Training-free 地重映射 RoPE query position，同时保留全局 causal access，并用 softmax statistics 精确合并分支</text>
<rect class="blue" x="70" y="170" width="300" height="220" rx="22"/>
<text class="t st" x="220" y="215" text-anchor="middle">Long Sequence</text>
<text class="t b" x="220" y="260" text-anchor="middle">x₁ … x_L</text>
<path class="thin" d="M115 300 H325"/>
<text class="t s" x="220" y="335" text-anchor="middle">切成固定长度 chunks</text>
<text class="t s" x="220" y="365" text-anchor="middle">目标：相对位置尽量留在预训练范围</text>

<path class="arrow" d="M370 280 H470"/>

<rect class="box" x="470" y="135" width="650" height="310" rx="22"/>
<text class="t st" x="795" y="180" text-anchor="middle">同一个 Query，根据 Key 所在 chunk 走三条关系</text>

<rect class="deep" x="505" y="225" width="180" height="160" rx="16"/>
<text class="t b" x="595" y="260" text-anchor="middle">Intra-Chunk</text>
<text class="t s" x="595" y="300" text-anchor="middle">同 chunk</text>
<text class="t s" x="595" y="330" text-anchor="middle">保留精确局部距离</text>
<text class="t s" x="595" y="360" text-anchor="middle">position ≈ 原始</text>

<rect class="cyan" x="705" y="225" width="180" height="160" rx="16"/>
<text class="t b" x="795" y="260" text-anchor="middle">Successive</text>
<text class="t s" x="795" y="300" text-anchor="middle">相邻 chunk</text>
<text class="t s" x="795" y="330" text-anchor="middle">保护边界 locality</text>
<text class="t s" x="795" y="360" text-anchor="middle">避免跳变</text>

<rect class="blue" x="905" y="225" width="180" height="160" rx="16"/>
<text class="t b" x="995" y="260" text-anchor="middle">Inter-Chunk</text>
<text class="t s" x="995" y="300" text-anchor="middle">更早 chunks</text>
<text class="t s" x="995" y="330" text-anchor="middle">压回训练距离范围</text>
<text class="t s" x="995" y="360" text-anchor="middle">牺牲远距精确坐标</text>

<path class="arrow" d="M1120 290 H1210"/>

<rect class="cyan" x="1210" y="160" width="320" height="260" rx="22"/>
<text class="t st" x="1370" y="205" text-anchor="middle">三路 Attention</text>
<text class="t b" x="1370" y="255" text-anchor="middle">各自计算局部 output</text>
<text class="t b" x="1370" y="295" text-anchor="middle">并保留 max / sumexp</text>
<line class="thin" x1="1260" y1="325" x2="1480" y2="325"/>
<text class="t s" x="1370" y="360" text-anchor="middle">不能直接把 outputs 相加</text>
<text class="t s" x="1370" y="388" text-anchor="middle">必须恢复一个全局 softmax</text>

<path class="arrow" d="M1370 420 V520"/>

<rect class="deep" x="930" y="520" width="600" height="230" rx="22"/>
<text class="t st" x="1230" y="565" text-anchor="middle">Global Softmax Merge</text>
<text class="t b" x="1230" y="615" text-anchor="middle">用每一路的 m_k / ℓ_k 重新归一化</text>
<text class="t b" x="1230" y="655" text-anchor="middle">得到等价于“所有候选 key 一起 softmax”的输出</text>
<text class="t s" x="1230" y="700" text-anchor="middle">与 FlashAttention 的 online-softmax statistics 同源</text>

<rect class="box" x="70" y="520" width="720" height="230" rx="22"/>
<text class="t st" x="430" y="565" text-anchor="middle">设计取舍</text>
<text class="t b" x="130" y="615">• 保留：所有历史 token 的可访问性</text>
<text class="t b" x="130" y="655">• 优先：局部与跨边界短距离精度</text>
<text class="t b" x="130" y="695">• 牺牲：远距离的精确绝对/相对位置分辨率</text>

<rect class="cyan" x="190" y="890" width="1220" height="165" rx="24"/>
<text class="t st" x="800" y="933" text-anchor="middle">DCA 的本质：不是减少 attention pair，而是重新定义“不同 pair 应该看到什么相对位置”</text>
<text class="t b" x="800" y="983" text-anchor="middle">Training-free；仍可访问全部历史，因此 dense 计算复杂度本质上仍是 O(L²)</text>
<text class="t s" x="800" y="1022" text-anchor="middle">它和 YaRN 处理的频率外推、MInference 处理的 sparse prefill runtime 属于不同层</text>
</svg>
