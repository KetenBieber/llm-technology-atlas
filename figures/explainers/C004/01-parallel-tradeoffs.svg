<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="670" viewBox="0 0 1400 670"><rect width="1400" height="670" fill="#f8fafc"/><style>.h{font:700 28px Arial,'Microsoft YaHei',sans-serif;fill:#172236}.s{font:700 19px Arial,'Microsoft YaHei',sans-serif;fill:#172236}.b{font:16px Arial,'Microsoft YaHei',sans-serif;fill:#26394e}.n{font:14px Arial,'Microsoft YaHei',sans-serif;fill:#516379}.box{fill:white;stroke:#cdd7e3;stroke-width:2}.a{fill:#dbeafe;stroke:#7aa2d5;stroke-width:1.5}.g{fill:#dcfce7;stroke:#79b18b;stroke-width:1.5}.y{fill:#fef3c7;stroke:#d7ac55;stroke-width:1.5}.line{stroke:#7c8ca3;stroke-width:2.8;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#7c8ca3"/></marker></defs><text x="700" y="44" text-anchor="middle" class="h">Megatron-LM：并行维度不是越大越好，而是要匹配通信拓扑</text><text x="700" y="80" text-anchor="middle" class="n">将 TP、PP、DP 的数据所有权、通信和频率区分开；不是 GPU 部署示意的唯一布局</text><rect x="60" y="128" width="415" height="390" rx="19" class="box"/><rect x="80" y="150" width="375" height="62" rx="10" class="a"/><text x="267" y="190" text-anchor="middle" class="s">TP · 同一 Layer 内</text><text x="95" y="311" class="b">按列切第一个 Linear</text><text x="95" y="369" class="b">按行切第二个 Linear</text><text x="95" y="427" class="b">本层需要 All-reduce</text><text x="95" y="485" class="b">通信频率：每 micro、每层</text><rect x="505" y="128" width="415" height="390" rx="19" class="box"/><rect x="525" y="150" width="375" height="62" rx="10" class="y"/><text x="712" y="190" text-anchor="middle" class="s">PP · 不同 Layers</text><text x="540" y="311" class="b">相邻 stage 计算不同层</text><text x="540" y="369" class="b">传 activation / gradient</text><text x="540" y="427" class="b">需要 micro-batch pipeline</text><text x="540" y="485" class="b">瓶颈：bubble、stage 不均</text><rect x="950" y="128" width="415" height="390" rx="19" class="box"/><rect x="970" y="150" width="375" height="62" rx="10" class="g"/><text x="1157" y="190" text-anchor="middle" class="s">DP · 不同 Samples</text><text x="985" y="311" class="b">同一模型的不同数据副本</text><text x="985" y="369" class="b">聚合 gradients / shards</text><text x="985" y="427" class="b">每 batch 对齐更新</text><text x="985" y="485" class="b">可接 ZeRO / FSDP 分片</text><text x="700" y="590" text-anchor="middle" class="s">物理原则：高频 TP collective 尽量放在快互联；跨节点用 PP / DP 并不总是等价选择</text><text x="700" y="623" text-anchor="middle" class="n">自制解释图，非原论文 Figure；精确 TP collective 次数与 PP 通信公式需看文章推导。</text></svg>