<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
<rect width="1440" height="960" fill="#f8fafc"/>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
  <style>
    .tt{font:700 34px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
    .sub{font:500 18px Arial,'Microsoft YaHei',sans-serif;fill:#475569}
    .h{font:700 22px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
    .t{font:500 17px Arial,'Microsoft YaHei',sans-serif;fill:#1e293b}
    .s{font:500 15px Arial,'Microsoft YaHei',sans-serif;fill:#475569}
    .b{fill:#ffffff;stroke:#94a3b8;stroke-width:2;rx:18}
    .bl{fill:#dbeafe;stroke:#3b82f6;stroke-width:2;rx:18}
    .cy{fill:#cffafe;stroke:#06b6d4;stroke-width:2;rx:18}
    .sl{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2;rx:18}
    .deep{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.4;rx:18}
    .a{stroke:#475569;stroke-width:2.7;fill:none;marker-end:url(#arr)}
    .d{stroke:#64748b;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#arr)}
  </style>
</defs>
<text x="64" y="62" class="tt">Llama 3：当 Transformer 主干趋于朴素，研发主线转向数据、规模与系统工程</text>
<text x="64" y="96" class="sub">核心不是发明一个新 block，而是把 tokenizer、数据飞轮、scaling law、4D 训练、长上下文与后训练串成一条闭环。</text>
<rect x="55" y="175" width="215" height="140" class="bl"/>
<text x="90" y="220" class="h">Tokenizer</text>
<text x="90" y="258" class="t">128K vocab</text><text x="90" y="290" class="s">更高 token 效率</text>

<rect x="325" y="155" width="260" height="180" class="deep"/>
<text x="365" y="200" class="h">Data Engineering</text>
<text x="365" y="238" class="t">15.6T tokens</text>
<text x="365" y="273" class="t">去重 / filtering / mixture</text>
<text x="365" y="305" class="s">上一代模型参与筛选下一代数据</text>

<rect x="640" y="155" width="250" height="180" class="cy"/>
<text x="680" y="200" class="h">Scaling Law</text>
<text x="680" y="238" class="t">小模型实验 → 预测大模型</text>
<text x="680" y="273" class="t">参数 / token / benchmark</text>
<text x="680" y="305" class="s">训练最优 ≠ 部署最优</text>

<rect x="945" y="155" width="250" height="180" class="bl"/>
<text x="985" y="200" class="h">Dense Transformer</text>
<text x="985" y="238" class="t">GQA + RMSNorm + RoPE</text>
<text x="985" y="273" class="t">8B / 70B / 405B</text>
<text x="985" y="305" class="s">架构保守，规模与数据主导</text>

<rect x="1250" y="175" width="140" height="140" class="deep"/>
<text x="1278" y="220" class="h">Pretrain</text>
<text x="1270" y="258" class="t">大规模训练</text><text x="1270" y="290" class="s">4D parallelism</text>
<path d="M270 245 H325" class="a"/><path d="M585 245 H640" class="a"/><path d="M890 245 H945" class="a"/><path d="M1195 245 H1250" class="a"/>

<text x="70" y="430" class="h">能力迁移与后训练不是“训练结束后的附录”</text>
<rect x="90" y="470" width="360" height="180" class="sl"/>
<text x="130" y="515" class="h">128K Context Extension</text>
<text x="130" y="553" class="t">8K → … → 128K 分阶段扩展</text>
<text x="130" y="590" class="t">RoPE theta + continued pretraining</text>
<text x="130" y="622" class="s">本质是 context-length distribution shift</text>

<rect x="540" y="470" width="360" height="180" class="deep"/>
<text x="580" y="515" class="h">Post-training</text>
<text x="580" y="553" class="t">Rejection Sampling → SFT → DPO</text>
<text x="580" y="590" class="t">安全 / 工具 / 多轮能力共同塑形</text>
<text x="580" y="622" class="s">从“预测下一个 token”转向“满足用户任务”</text>

<rect x="990" y="470" width="360" height="180" class="cy"/>
<text x="1030" y="515" class="h">Deployment System</text>
<text x="1030" y="553" class="t">GQA 降 KV cache</text>
<text x="1030" y="590" class="t">TP / PP / CP / FSDP 组织训练</text>
<text x="1030" y="622" class="s">最终模型形态由训练成本与推理成本共同决定</text>
<path d="M450 560 H540" class="a"/><path d="M900 560 H990" class="a"/>

<rect x="255" y="745" width="930" height="100" class="bl"/>
<text x="295" y="790" class="h">Llama 3 的方法论：标准架构 + 极强数据工程 + 可预测 scaling + 超大规模系统执行</text>
<text x="295" y="823" class="s">创新重心从“单个网络模块”转移到整条研发流水线的可控性与规模化。</text>
<text x="720" y="925" text-anchor="middle" class="s">自制总结架构图：提炼文章核心机制，不复刻原论文图。</text></svg>