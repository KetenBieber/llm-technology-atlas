<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
<rect width="1440" height="960" fill="#f8fafc"/>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
  <style>
    .tt{font:700 34px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
    .sub{font:500 18px Arial,'Microsoft YaHei',sans-serif;fill:#475569}
    .h{font:700 22px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
    .t{font:500 17px Arial,'Microsoft YaHei',sans-serif;fill:#1e293b}
    .s{font:500 15px Arial,'Microsoft YaHei',sans-serif;fill:#475569}
    .b{fill:#ffffff;stroke:#94a3b8;stroke-width:2;rx:18}
    .bl{fill:#dbeafe;stroke:#3b82f6;stroke-width:2;rx:18}
    .cy{fill:#cffafe;stroke:#06b6d4;stroke-width:2;rx:18}
    .sl{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2;rx:18}
    .deep{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.4;rx:18}
    .a{stroke:#475569;stroke-width:2.7;fill:none;marker-end:url(#arr)}
    .d{stroke:#64748b;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#arr)}
  </style>
</defs>
<text x="64" y="62" class="tt">Qwen2.5：不是单个模型，而是一条从数据到产品形态的“模型家族生产线”</text>
<text x="64" y="96" class="sub">统一 tokenizer 与 18T 数据底座，向多尺寸 Dense / MoE 分支扩展，再通过长上下文与 Offline DPO + Online GRPO 完成产品化能力。</text>
<rect x="55" y="170" width="280" height="150" class="deep"/>
<text x="95" y="215" class="h">统一数据与词表底座</text>
<text x="95" y="253" class="t">18T tokens</text>
<text x="95" y="288" class="t">统一 tokenizer + domain data</text>
<text x="95" y="313" class="s">Math / Code / Synthetic data 进入 pretrain</text>

<rect x="405" y="150" width="300" height="190" class="bl"/>
<text x="445" y="195" class="h">Scaling / Hyperparameter Law</text>
<text x="445" y="233" class="t">小规模实验外推大规模配置</text>
<text x="445" y="268" class="t">学习率 / 参数量 / 数据量联动</text>
<text x="445" y="303" class="s">不仅决定“训多大”，也指导模型家族 recipe</text>
<path d="M335 245 H405" class="a"/>

<rect x="795" y="120" width="270" height="155" class="cy"/>
<text x="835" y="165" class="h">Dense Family</text>
<text x="835" y="203" class="t">0.5B → 72B 多尺寸</text>
<text x="835" y="238" class="s">GQA 共享程度随尺寸调整</text>

<rect x="795" y="305" width="270" height="155" class="cy"/>
<text x="835" y="350" class="h">MoE Family</text>
<text x="835" y="388" class="t">fine-grained + shared experts</text>
<text x="835" y="423" class="s">服务容量 / active compute 的另一条产品曲线</text>
<path d="M705 235 C745 190 760 190 795 195" class="a"/>
<path d="M705 255 C745 345 760 375 795 382" class="a"/>

<rect x="1155" y="190" width="235" height="190" class="deep"/>
<text x="1195" y="235" class="h">Pretrained Family</text>
<text x="1195" y="273" class="t">统一能力底座</text>
<text x="1195" y="308" class="t">不同尺寸 / 架构</text>
<text x="1195" y="343" class="s">按部署预算选择产品点</text>
<path d="M1065 195 C1110 205 1120 235 1155 250" class="a"/>
<path d="M1065 382 C1110 370 1120 330 1155 315" class="a"/>

<text x="70" y="550" class="h">后续能力层：长上下文 + Preference Learning + 工具化</text>
<rect x="75" y="590" width="360" height="180" class="sl"/>
<text x="115" y="635" class="h">Long Context</text>
<text x="115" y="673" class="t">训练 4K → 32K</text>
<text x="115" y="708" class="t">YaRN / DCA 继续外推</text>
<text x="115" y="742" class="s">把位置外推与 attention relation 分开解决</text>

<rect x="540" y="590" width="360" height="180" class="bl"/>
<text x="580" y="635" class="h">Instruction / Preference</text>
<text x="580" y="673" class="t">大规模 SFT</text>
<text x="580" y="708" class="t">Offline DPO → Online GRPO</text>
<text x="580" y="742" class="s">先学习偏好数据，再用在线采样继续优化</text>

<rect x="1005" y="590" width="360" height="180" class="cy"/>
<text x="1045" y="635" class="h">Product Capabilities</text>
<text x="1045" y="673" class="t">结构化输出 / 工具使用</text>
<text x="1045" y="708" class="t">多尺寸覆盖端侧到服务端</text>
<text x="1045" y="742" class="s">“模型家族”让能力与部署预算形成连续产品曲线</text>
<path d="M435 680 H540" class="a"/><path d="M900 680 H1005" class="a"/>

<rect x="245" y="825" width="950" height="65" class="deep"/>
<text x="720" y="865" text-anchor="middle" class="h">Qwen2.5 的主线：统一底座 → 多模型分叉 → 后训练收敛 → 面向不同部署场景输出产品族</text>
<text x="720" y="925" text-anchor="middle" class="s">自制总结架构图：提炼文章核心机制，不复刻原论文图。</text></svg>