<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="860" viewBox="0 0 1700 860">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
<style>
.tt{font:700 34px Inter,'Microsoft YaHei',sans-serif;fill:#0f172a}.st{font:500 19px Inter,'Microsoft YaHei',sans-serif;fill:#475569}
.h{font:700 22px Inter,'Microsoft YaHei',sans-serif;fill:#0f172a}.t{font:500 18px Inter,'Microsoft YaHei',sans-serif;fill:#1e293b}.s{font:500 16px Inter,'Microsoft YaHei',sans-serif;fill:#475569}
.pos{fill:#f0fdf4;stroke:#4ade80;stroke-width:2;rx:18}.neg{fill:#fff1f2;stroke:#fb7185;stroke-width:2;rx:18}.mid{fill:#eef2ff;stroke:#818cf8;stroke-width:2;rx:18}.base{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:18}
.l{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}
</style></defs>
<text x="70" y="65" class="tt">Group-relative advantage：同一道题内比较，而不是跨题比较绝对 reward</text>
<text x="70" y="103" class="st">示意用 G=4、outcome reward=[1,1,0,0]；population std=0.5，因此标准化优势为 [+1,+1,-1,-1]。</text>

<rect x="70" y="175" width="260" height="110" class="mid"/><text x="115" y="220" class="h">同一个 prompt q</text><text x="95" y="255" class="s">πold 独立采样 G 条 response</text>
<path d="M330 230 L430 230" class="l"/>

<rect x="430" y="145" width="245" height="120" class="pos"/><text x="485" y="185" class="h">o₁ · reward=1</text><text x="475" y="220" class="t">Â₁ = +1</text>
<rect x="430" y="300" width="245" height="120" class="pos"/><text x="485" y="340" class="h">o₂ · reward=1</text><text x="475" y="375" class="t">Â₂ = +1</text>
<rect x="430" y="455" width="245" height="120" class="neg"/><text x="485" y="495" class="h">o₃ · reward=0</text><text x="475" y="530" class="t">Â₃ = −1</text>
<rect x="430" y="610" width="245" height="120" class="neg"/><text x="485" y="650" class="h">o₄ · reward=0</text><text x="475" y="685" class="t">Â₄ = −1</text>

<rect x="790" y="235" width="330" height="250" class="base"/>
<text x="845" y="280" class="h">组内统计</text>
<text x="835" y="325" class="t">mean(r)=0.5</text>
<text x="835" y="365" class="t">std(r)=0.5</text>
<text x="825" y="420" class="t">Âᵢ=(rᵢ−0.5)/0.5</text>
<text x="820" y="455" class="s">baseline 随 prompt 的难度自动变化</text>
<path d="M675 205 C735 205 755 280 790 315" class="l"/>
<path d="M675 360 C735 360 750 350 790 350" class="l"/>
<path d="M675 515 C735 515 750 420 790 400" class="l"/>
<path d="M675 670 C740 670 760 470 790 450" class="l"/>

<rect x="1240" y="205" width="390" height="315" class="mid"/>
<text x="1280" y="250" class="h">Outcome supervision 的 token credit</text>
<text x="1280" y="300" class="t">o₁: y₁ y₂ … yT</text>
<text x="1280" y="340" class="s">每个 token 都收到同一个 Â₁=+1</text>
<text x="1280" y="395" class="t">o₃: z₁ z₂ … zT</text>
<text x="1280" y="435" class="s">每个 token 都收到同一个 Â₃=−1</text>
<text x="1280" y="485" class="s">粗粒度：知道“整条回答好/坏”，不知道哪一步好/坏。</text>
<path d="M1120 360 L1240 360" class="l"/>

<text x="790" y="600" class="h">不要把它误读成 V(sₜ)</text>
<text x="790" y="640" class="t">V(sₜ) 依赖具体 prefix；group baseline 主要依赖同 prompt 下这批 sampled outcomes。</text>
<text x="790" y="680" class="t">它用“同题相对表现”换掉 learned critic，代价是更依赖 group sampling 与 reward spread。</text>
<text x="70" y="805" class="st">若每条 response 的 reward 完全相同，组内没有相对信息；原论文公式本身不会凭空创造 policy-gradient 区分信号。</text>
</svg>