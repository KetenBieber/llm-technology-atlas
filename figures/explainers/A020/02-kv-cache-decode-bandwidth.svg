<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1557b0"/></marker>
  <marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker>
  <style>
  text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#17212b}.title{font-size:40px;font-weight:700}.sub{font-size:23px;fill:#52606d}
  .h{font-size:29px;font-weight:700}.b{font-size:23px}.s{font-size:20px;fill:#52606d}
  .panel{fill:#fff;stroke:#c6d1dc;stroke-width:2}.mem{fill:#e7fbfc;stroke:#0e8f9b;stroke-width:2}.q{fill:#e9f2ff;stroke:#1557b0;stroke-width:2}
  .bad{fill:#fff1f0;stroke:#c43d3d;stroke-width:2}.good{fill:#edf9f0;stroke:#2e8b57;stroke-width:2}
  .arrow{stroke:#1557b0;stroke-width:3;fill:none;marker-end:url(#a)}.traffic{stroke:#d97706;stroke-width:5;fill:none;marker-end:url(#o)}
  </style>
</defs>
<rect width="1600" height="1100" fill="#fff"/>
<text x="800" y="62" text-anchor="middle" class="title">GQA Decode：减少历史 KV Cache 与 HBM 读带宽</text>
<text x="800" y="101" text-anchor="middle" class="sub">同一个当前 Query 要反复读取 1…t 的历史状态；减少 KV heads 同时减少“存多少”和“每步读多少”</text>

<rect x="55" y="145" width="925" height="760" rx="22" class="panel"/>
<text x="515" y="190" text-anchor="middle" class="h">Decode step t：当前 Q_t 访问全部历史 token</text>
<rect x="95" y="235" width="190" height="92" rx="14" class="q"/>
<text x="190" y="273" text-anchor="middle" class="h">Q_t</text><text x="190" y="304" text-anchor="middle" class="s">32 query heads</text>
<path d="M285 281 H355" class="arrow"/>

<g>
<rect x="365" y="220" width="120" height="120" rx="12" class="mem"/><text x="425" y="266" text-anchor="middle" class="b">KV₁</text><text x="425" y="300" text-anchor="middle" class="s">token 1</text>
<rect x="505" y="220" width="120" height="120" rx="12" class="mem"/><text x="565" y="266" text-anchor="middle" class="b">KV₂</text><text x="565" y="300" text-anchor="middle" class="s">token 2</text>
<rect x="645" y="220" width="120" height="120" rx="12" class="mem"/><text x="705" y="266" text-anchor="middle" class="b">…</text><text x="705" y="300" text-anchor="middle" class="s">history</text>
<rect x="785" y="220" width="150" height="120" rx="12" class="mem"/><text x="860" y="266" text-anchor="middle" class="b">KV_t</text><text x="860" y="300" text-anchor="middle" class="s">latest</text>
</g>
<path d="M355 281 C430 390 790 390 930 315" class="traffic"/>
<text x="630" y="420" text-anchor="middle" class="b">HBM read volume ∝ T · H_KV · d_h</text>
<text x="630" y="454" text-anchor="middle" class="s">上下文越长，这条橙色历史读取路径越可能成为 bandwidth bottleneck</text>

<rect x="95" y="510" width="255" height="250" rx="16" class="bad"/>
<text x="222" y="553" text-anchor="middle" class="h">MHA</text>
<text x="222" y="592" text-anchor="middle" class="b">H_KV=32</text>
<g fill="#c43d3d">
<rect x="135" y="625" width="22" height="70"/><rect x="163" y="625" width="22" height="70"/><rect x="191" y="625" width="22" height="70"/><rect x="219" y="625" width="22" height="70"/><rect x="247" y="625" width="22" height="70"/><rect x="275" y="625" width="22" height="70"/>
</g>
<text x="222" y="731" text-anchor="middle" class="s">32 份 head state</text>

<rect x="385" y="510" width="255" height="250" rx="16" class="good"/>
<text x="512" y="553" text-anchor="middle" class="h">GQA</text>
<text x="512" y="592" text-anchor="middle" class="b">H_KV=8</text>
<g fill="#2e8b57">
<rect x="445" y="625" width="32" height="70"/><rect x="485" y="625" width="32" height="70"/><rect x="525" y="625" width="32" height="70"/><rect x="565" y="625" width="32" height="70"/>
</g>
<text x="512" y="731" text-anchor="middle" class="s">cache = MHA 的 1/4</text>

<rect x="675" y="510" width="255" height="250" rx="16" fill="#f0faf5" stroke="#2e8b57" stroke-width="2"/>
<text x="802" y="553" text-anchor="middle" class="h">MQA</text>
<text x="802" y="592" text-anchor="middle" class="b">H_KV=1</text>
<rect x="782" y="625" width="40" height="70" fill="#2e8b57"/>
<text x="802" y="731" text-anchor="middle" class="s">cache = MHA 的 1/32</text>

<rect x="1015" y="145" width="530" height="760" rx="22" class="panel"/>
<text x="1280" y="190" text-anchor="middle" class="h">同一组文章参数的具体例子</text>
<text x="1280" y="228" text-anchor="middle" class="s">L=32, T=8192, B=4, d_h=128, b=2 bytes</text>
<rect x="1060" y="275" width="440" height="130" rx="16" fill="#f7fafc" stroke="#9aa9b8" stroke-width="2"/>
<text x="1280" y="321" text-anchor="middle" class="b">M_KV = 2 · L · B · T · H_KV · d_h · b</text>
<text x="1280" y="365" text-anchor="middle" class="b">因此 M_GQA / M_MHA = H_KV / H_Q</text>

<rect x="1080" y="460" width="400" height="92" rx="14" class="bad"/>
<text x="1175" y="516" text-anchor="middle" class="h">MHA</text><text x="1375" y="516" text-anchor="middle" class="h">≈16 GiB</text>
<rect x="1080" y="575" width="400" height="92" rx="14" class="good"/>
<text x="1175" y="631" text-anchor="middle" class="h">GQA 8/32</text><text x="1375" y="631" text-anchor="middle" class="h">≈4 GiB</text>
<rect x="1080" y="690" width="400" height="92" rx="14" fill="#f0faf5" stroke="#2e8b57" stroke-width="2"/>
<text x="1175" y="746" text-anchor="middle" class="h">MQA</text><text x="1375" y="746" text-anchor="middle" class="h">≈0.5 GiB</text>
<text x="1280" y="842" text-anchor="middle" class="b">GQA 的收益首先是 state / bandwidth，</text>
<text x="1280" y="875" text-anchor="middle" class="s">不是把 Attention 的 H_Q 个 Query score 直接变成 8 个。</text>

<rect x="95" y="950" width="1410" height="100" rx="16" fill="#f4f8fb" stroke="#c6d1dc" stroke-width="2"/>
<text x="800" y="990" text-anchor="middle" class="b">系统结论：Prefill 的 O(T²) attention score 仍在；GQA 最直接改善的是 Decode 中持久 KV state、历史 KV 读带宽与可容纳 batch 数。</text>
<text x="800" y="1026" text-anchor="middle" class="s">当 FFN、权重 HBM 或跨卡通信成为主瓶颈时，继续减少 H_KV 的 latency 边际收益会下降。</text>
</svg>