<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs>
  <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1557b0"/></marker>
  <marker id="cyanArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0e8f9b"/></marker>
  <style>
    text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#17212b}
    .title{font-size:40px;font-weight:700}.sub{font-size:23px;fill:#52606d}
    .h{font-size:29px;font-weight:700}.b{font-size:23px}.s{font-size:20px;fill:#52606d}
    .q{fill:#e9f2ff;stroke:#1557b0;stroke-width:2}.kv{fill:#e7fbfc;stroke:#0e8f9b;stroke-width:2}
    .out{fill:#eef2f6;stroke:#64748b;stroke-width:2}.box{fill:#fff;stroke:#c6d1dc;stroke-width:2}
    .formula{fill:#f7fafc;stroke:#9aa9b8;stroke-width:2}.flow{stroke:#1557b0;stroke-width:3;fill:none;marker-end:url(#blueArrow)}
    .share{stroke:#0e8f9b;stroke-width:3;fill:none;marker-end:url(#cyanArrow)}
  </style>
</defs>
<rect width="1600" height="1100" fill="#ffffff"/>
<text x="800" y="62" text-anchor="middle" class="title">GQA 的核心不是“复制 KV”，而是让一组 Query heads 共享同一个 KV head</text>
<text x="800" y="101" text-anchor="middle" class="sub">示例：H_Q=32，H_KV=8，group size G=4；输出仍保留 32 个 Query-head 结果</text>

<rect x="55" y="145" width="310" height="790" rx="22" class="box"/>
<text x="210" y="190" text-anchor="middle" class="h">输入与投影</text>
<rect x="95" y="230" width="230" height="84" rx="14" fill="#f4f7fa" stroke="#64748b" stroke-width="2"/>
<text x="210" y="266" text-anchor="middle" class="b">X [B,T,d]</text>
<text x="210" y="295" text-anchor="middle" class="s">shared hidden states</text>
<path d="M210 314 V355" class="flow"/>
<rect x="85" y="370" width="250" height="105" rx="14" class="q"/>
<text x="210" y="410" text-anchor="middle" class="h">W_Q</text>
<text x="210" y="445" text-anchor="middle" class="b">Q [B,32,T,d_h]</text>
<path d="M210 475 V520" class="flow"/>
<rect x="85" y="535" width="250" height="105" rx="14" class="kv"/>
<text x="210" y="575" text-anchor="middle" class="h">W_K / W_V</text>
<text x="210" y="610" text-anchor="middle" class="b">K,V [B,8,T,d_h]</text>
<text x="210" y="680" text-anchor="middle" class="s">Q 与 K/V 的 head 轴长度不同</text>
<text x="210" y="713" text-anchor="middle" class="s">但 attention 输出仍按 32 个 Q heads 计算</text>
<rect x="90" y="770" width="240" height="112" rx="14" class="formula"/>
<text x="210" y="808" text-anchor="middle" class="b">G = H_Q / H_KV = 4</text>
<text x="210" y="844" text-anchor="middle" class="b">g(h)=⌊h / G⌋</text>

<rect x="400" y="145" width="760" height="790" rx="22" class="box"/>
<text x="780" y="190" text-anchor="middle" class="h">Head → Group → KV ownership</text>
<text x="780" y="222" text-anchor="middle" class="s">每个 KV head 被 4 个 Query heads 读取；不存在持久化复制</text>

<g>
  <rect x="445" y="255" width="115" height="58" rx="12" class="q"/><text x="502" y="292" text-anchor="middle" class="b">Q0–Q3</text>
  <rect x="685" y="250" width="165" height="68" rx="13" class="kv"/><text x="767" y="292" text-anchor="middle" class="b">K0 / V0</text>
  <rect x="960" y="255" width="145" height="58" rx="12" class="out"/><text x="1032" y="292" text-anchor="middle" class="b">O0–O3</text>
  <path d="M560 284 H680" class="flow"/><path d="M850 284 H955" class="share"/>
</g>
<g>
  <rect x="445" y="345" width="115" height="58" rx="12" class="q"/><text x="502" y="382" text-anchor="middle" class="b">Q4–Q7</text>
  <rect x="685" y="340" width="165" height="68" rx="13" class="kv"/><text x="767" y="382" text-anchor="middle" class="b">K1 / V1</text>
  <rect x="960" y="345" width="145" height="58" rx="12" class="out"/><text x="1032" y="382" text-anchor="middle" class="b">O4–O7</text>
  <path d="M560 374 H680" class="flow"/><path d="M850 374 H955" class="share"/>
</g>
<g>
  <rect x="445" y="435" width="115" height="58" rx="12" class="q"/><text x="502" y="472" text-anchor="middle" class="b">Q8–Q11</text>
  <rect x="685" y="430" width="165" height="68" rx="13" class="kv"/><text x="767" y="472" text-anchor="middle" class="b">K2 / V2</text>
  <rect x="960" y="435" width="145" height="58" rx="12" class="out"/><text x="1032" y="472" text-anchor="middle" class="b">O8–O11</text>
  <path d="M560 464 H680" class="flow"/><path d="M850 464 H955" class="share"/>
</g>
<text x="780" y="538" text-anchor="middle" class="h">⋮</text>
<g>
  <rect x="445" y="575" width="135" height="58" rx="12" class="q"/><text x="512" y="612" text-anchor="middle" class="b">Q28–Q31</text>
  <rect x="685" y="570" width="165" height="68" rx="13" class="kv"/><text x="767" y="612" text-anchor="middle" class="b">K7 / V7</text>
  <rect x="950" y="575" width="155" height="58" rx="12" class="out"/><text x="1027" y="612" text-anchor="middle" class="b">O28–O31</text>
  <path d="M580 604 H680" class="flow"/><path d="M850 604 H945" class="share"/>
</g>
<rect x="470" y="690" width="620" height="170" rx="16" class="formula"/>
<text x="780" y="732" text-anchor="middle" class="h">每个 Query head 的真实 score 路径</text>
<text x="780" y="777" text-anchor="middle" class="b">A_h = softmax( Q_h K_g(h)ᵀ / √d_h )</text>
<text x="780" y="818" text-anchor="middle" class="b">O_h = A_h V_g(h)</text>
<text x="780" y="850" text-anchor="middle" class="s">共享的是 K/V representation；Query 仍保留独立 projection 与检索方向</text>

<rect x="1195" y="145" width="350" height="790" rx="22" class="box"/>
<text x="1370" y="190" text-anchor="middle" class="h">同一连续谱</text>
<text x="1370" y="228" text-anchor="middle" class="s">只改变 H_KV</text>
<rect x="1240" y="280" width="260" height="120" rx="16" fill="#eef2f6" stroke="#64748b" stroke-width="2"/>
<text x="1370" y="322" text-anchor="middle" class="h">MHA</text><text x="1370" y="360" text-anchor="middle" class="b">H_KV = H_Q = 32</text>
<rect x="1240" y="445" width="260" height="120" rx="16" class="kv"/>
<text x="1370" y="487" text-anchor="middle" class="h">GQA</text><text x="1370" y="525" text-anchor="middle" class="b">H_KV = 8</text>
<rect x="1240" y="610" width="260" height="120" rx="16" fill="#eaf8ef" stroke="#2e8b57" stroke-width="2"/>
<text x="1370" y="652" text-anchor="middle" class="h">MQA</text><text x="1370" y="690" text-anchor="middle" class="b">H_KV = 1</text>
<path d="M1370 400 V438" class="share"/><path d="M1370 565 V603" class="share"/>
<text x="1370" y="780" text-anchor="middle" class="b">KV cache ∝ H_KV</text>
<text x="1370" y="817" text-anchor="middle" class="s">quality / memory / bandwidth</text>
<text x="1370" y="848" text-anchor="middle" class="s">在同一轴上做设计选择</text>

<rect x="120" y="975" width="1360" height="78" rx="15" fill="#f4f8fb" stroke="#c6d1dc" stroke-width="2"/>
<text x="800" y="1010" text-anchor="middle" class="b">实现要点：kernel 用 head→group 索引让多个 Q heads 读取同一 KV head；若用 repeat_interleave 真复制 KV Cache，会把 GQA 的内存收益自己抵消掉。</text>
</svg>