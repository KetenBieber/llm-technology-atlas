<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><desc>Qwen2.5 reward-variance curriculum for online GRPO query selection.</desc><defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B4F9C"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker>
<style>.t{font:700 43px Inter,'Microsoft YaHei',sans-serif;fill:#10243e}.s{font:400 22px Inter,'Microsoft YaHei',sans-serif;fill:#52647a}.h{font:700 29px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.n{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.x{font:400 20px Inter,'Microsoft YaHei',sans-serif;fill:#26384d}.m{font:600 20px Inter,'Microsoft YaHei',sans-serif;fill:#42556d}.mono{font:600 20px Consolas,monospace;fill:#18334f}.blue{fill:#EAF3FF;stroke:#0B4F9C;stroke-width:2.4}.cyan{fill:#E8FBFC;stroke:#0E9AA7;stroke-width:2.4}.gray{fill:#F3F6F9;stroke:#94A3B8;stroke-width:2}.orange{fill:#FFF5DF;stroke:#F59E0B;stroke-width:2.4}.green{fill:#ECF9F0;stroke:#16A34A;stroke-width:2.4}.red{fill:#FFF0F0;stroke:#DC2626;stroke-width:2.4}.f{fill:none;stroke:#0B4F9C;stroke-width:4;marker-end:url(#b)}.opt{fill:none;stroke:#16A34A;stroke-width:4;marker-end:url(#g)}.cost{fill:none;stroke:#F59E0B;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#o)}.d{stroke:#D9E2EC;stroke-width:2}</style></defs><rect width="1600" height="1100" fill="#fff"/><text x="65" y="70" class="t">Qwen2.5 · Reward variance：为什么优先采样“组内分歧大”的 query？</text><text x="65" y="106" class="s">对应 §40–§42｜同 prompt 的 reward variance 怎样作为 learnability proxy 决定采样优先级</text>
<text x="65" y="160" class="h">对每个 candidate query q，先让 current policy 采样 G=8 个 response</text>
<rect x="75" y="210" width="230" height="105" rx="18" class="gray"/><text x="100" y="250" class="n">Query q</text><text x="100" y="285" class="x">candidate RL prompt</text>
<path d="M305 262 H400" class="f"/>
<g><rect x="400" y="195" width="130" height="70" rx="12" fill="#EAF3FF" stroke="#0B4F9C"/><text x="425" y="238" class="m">y1 → r1</text><rect x="555" y="195" width="130" height="70" rx="12" fill="#E8FBFC" stroke="#0B4F9C"/><text x="580" y="238" class="m">y2 → r2</text><rect x="710" y="195" width="130" height="70" rx="12" fill="#EAF3FF" stroke="#0B4F9C"/><text x="735" y="238" class="m">y3 → r3</text><rect x="865" y="195" width="130" height="70" rx="12" fill="#E8FBFC" stroke="#0B4F9C"/><text x="890" y="238" class="m">y4 → r4</text><rect x="400" y="290" width="130" height="70" rx="12" fill="#EAF3FF" stroke="#0B4F9C"/><text x="425" y="333" class="m">y5 → r5</text><rect x="555" y="290" width="130" height="70" rx="12" fill="#E8FBFC" stroke="#0B4F9C"/><text x="580" y="333" class="m">y6 → r6</text><rect x="710" y="290" width="130" height="70" rx="12" fill="#EAF3FF" stroke="#0B4F9C"/><text x="735" y="333" class="m">y7 → r7</text><rect x="865" y="290" width="130" height="70" rx="12" fill="#E8FBFC" stroke="#0B4F9C"/><text x="890" y="333" class="m">y8 → r8</text></g>
<path d="M995 262 H1090" class="f"/>
<rect x="1090" y="190" width="330" height="150" rx="18" class="orange"/><text x="1115" y="230" class="n">Reward statistics</text><text x="1115" y="270" class="mono">Var_q = Var(r₁…r₈)</text><text x="1115" y="305" class="x">同题不同回答的 reward spread</text>
<line x1="65" y1="410" x2="1535" y2="410" class="d"/>
<text x="65" y="470" class="h">低 variance 与高 variance 的训练意义不同</text>
<rect x="90" y="520" width="600" height="190" rx="18" class="gray"/><text x="120" y="560" class="n">Low reward variance</text>
<circle cx="190" cy="625" r="18" fill="#0B4F9C"/><circle cx="240" cy="630" r="18" fill="#0B4F9C"/><circle cx="290" cy="620" r="18" fill="#0B4F9C"/><circle cx="340" cy="627" r="18" fill="#0B4F9C"/>
<text x="400" y="615" class="x">responses 都差不多好 / 都差不多差</text><text x="400" y="655" class="x">组内排序信号较弱，更新方向信息少</text>
<rect x="810" y="520" width="650" height="190" rx="18" class="green"/><text x="840" y="560" class="n">High reward variance</text>
<circle cx="920" cy="655" r="18" fill="#DC2626"/><circle cx="1010" cy="620" r="18" fill="#F59E0B"/><circle cx="1120" cy="570" r="18" fill="#16A34A"/><circle cx="1240" cy="605" r="18" fill="#0B4F9C"/>
<text x="840" y="680" class="x">同一个 query 同时存在明显好 / 坏回答 → relative signal 更强</text>
<line x1="65" y1="770" x2="1535" y2="770" class="d"/>
<text x="65" y="830" class="h">Curriculum：把 sampling budget 优先给当前 policy “有分歧、还有可学空间”的 query</text>
<rect x="105" y="885" width="360" height="120" rx="18" class="blue"/><text x="130" y="925" class="n">Query pool</text><text x="130" y="963" class="x">估计每题 reward variance</text>
<path d="M465 945 H585" class="f"/><rect x="585" y="875" width="410" height="140" rx="18" class="orange"/><text x="610" y="915" class="n">Rank / sample by variance</text><text x="610" y="955" class="x">优先高 variance；不是宣称 variance = 真正难度</text><text x="610" y="990" class="x">它只是当前 policy 下的 learnability proxy</text>
<path d="M995 945 H1115" class="opt"/><rect x="1115" y="885" width="350" height="120" rx="18" class="green"/><text x="1140" y="925" class="n">Spend rollout compute</text><text x="1140" y="963" class="x">在线采样集中到高信息 query</text>
</svg>