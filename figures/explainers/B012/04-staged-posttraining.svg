<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><desc>Qwen2.5 staged post-training from SFT through offline DPO to online GRPO.</desc><defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B4F9C"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker>
<style>.t{font:700 43px Inter,'Microsoft YaHei',sans-serif;fill:#10243e}.s{font:400 22px Inter,'Microsoft YaHei',sans-serif;fill:#52647a}.h{font:700 29px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.n{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.x{font:400 20px Inter,'Microsoft YaHei',sans-serif;fill:#26384d}.m{font:600 20px Inter,'Microsoft YaHei',sans-serif;fill:#42556d}.mono{font:600 20px Consolas,monospace;fill:#18334f}.blue{fill:#EAF3FF;stroke:#0B4F9C;stroke-width:2.4}.cyan{fill:#E8FBFC;stroke:#0E9AA7;stroke-width:2.4}.gray{fill:#F3F6F9;stroke:#94A3B8;stroke-width:2}.orange{fill:#FFF5DF;stroke:#F59E0B;stroke-width:2.4}.green{fill:#ECF9F0;stroke:#16A34A;stroke-width:2.4}.red{fill:#FFF0F0;stroke:#DC2626;stroke-width:2.4}.f{fill:none;stroke:#0B4F9C;stroke-width:4;marker-end:url(#b)}.opt{fill:none;stroke:#16A34A;stroke-width:4;marker-end:url(#g)}.cost{fill:none;stroke:#F59E0B;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#o)}.d{stroke:#D9E2EC;stroke-width:2}</style></defs><rect width="1600" height="1100" fill="#fff"/><text x="65" y="70" class="t">Qwen2.5 · Post-training：为什么是 SFT → Offline DPO → Online GRPO？</text><text x="65" y="106" class="s">对应 §23–§39｜回答：capability coverage、可验证 preference、主观 reward 三类数据分别进入不同优化阶段</text>
<text x="65" y="155" class="h">① SFT：先建立 capability support，而不是一上来用 RL 探索所有行为</text>
<rect x="75" y="205" width="320" height="145" rx="18" class="blue"/><text x="100" y="245" class="n">1M+ SFT examples</text><text x="100" y="285" class="x">math / code / long / struct.</text><text x="100" y="320" class="x">multilingual + system instruction</text>
<path d="M395 278 H500" class="f"/>
<rect x="500" y="205" width="310" height="145" rx="18" class="green"/><text x="525" y="245" class="n">Instruction policy</text><text x="525" y="285" class="x">先把目标行为放进 support</text><text x="525" y="320" class="x">再做 preference optimization</text>
<line x1="65" y1="410" x2="1535" y2="410" class="d"/>
<text x="65" y="470" class="h">② Offline DPO：客观 / 可验证 query 可以先离线构造 clean chosen–rejected pairs</text>
<rect x="80" y="520" width="300" height="130" rx="18" class="gray"/><text x="105" y="560" class="n">Objective query</text><text x="105" y="600" class="x">math verifier / execution</text>
<path d="M380 585 H480" class="f"/>
<rect x="480" y="510" width="350" height="150" rx="18" class="cyan"/><text x="505" y="550" class="n">Generate + verify</text><text x="505" y="590" class="x">positive / negative responses</text><text x="505" y="625" class="x">约 150K verified preference pairs</text>
<path d="M830 585 H930" class="f"/>
<rect x="930" y="510" width="300" height="150" rx="18" class="orange"/><text x="955" y="550" class="n">Offline DPO</text><text x="955" y="590" class="x">不用在线 rollout loop</text><text x="955" y="625" class="x">直接拉开 chosen / rejected</text>
<line x1="65" y1="720" x2="1535" y2="720" class="d"/>
<text x="65" y="780" class="h">③ Online GRPO：主观 / 开放式质量需要 current policy 采样 + Reward Model 在线提供相对信号</text>
<rect x="90" y="835" width="260" height="120" rx="18" class="blue"/><text x="115" y="875" class="n">Current policy</text><text x="115" y="915" class="x">同 prompt 采样 G=8</text>
<path d="M350 895 H455" class="f"/><rect x="455" y="825" width="300" height="140" rx="18" class="cyan"/><text x="480" y="865" class="n">Responses × 8</text><text x="480" y="905" class="x">质量随 policy 实时变化</text><text x="480" y="940" class="x">形成 on-policy-ish data</text>
<path d="M755 895 H860" class="f"/><rect x="860" y="825" width="300" height="140" rx="18" class="orange"/><text x="885" y="865" class="n">Learned RM</text><text x="885" y="905" class="x">主观维度 reward / ranking</text><text x="885" y="940" class="x">组内相对 advantage</text>
<path d="M1160 895 H1265" class="opt"/><rect x="1265" y="835" width="270" height="120" rx="18" class="green"/><text x="1290" y="875" class="n">GRPO update</text><text x="1290" y="915" class="x">探索 current policy 改进方向</text>
<text x="65" y="1030" class="m">顺序的含义：先“教会做什么” → 再利用干净离线偏好 → 最后为主观目标付出在线采样成本。</text>
</svg>