<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><desc>Qwen2.5 data flywheel between generalist filter and math/code specialists.</desc><defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B4F9C"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker>
<style>.t{font:700 43px Inter,'Microsoft YaHei',sans-serif;fill:#10243e}.s{font:400 22px Inter,'Microsoft YaHei',sans-serif;fill:#52647a}.h{font:700 29px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.n{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.x{font:400 20px Inter,'Microsoft YaHei',sans-serif;fill:#26384d}.m{font:600 20px Inter,'Microsoft YaHei',sans-serif;fill:#42556d}.mono{font:600 20px Consolas,monospace;fill:#18334f}.blue{fill:#EAF3FF;stroke:#0B4F9C;stroke-width:2.4}.cyan{fill:#E8FBFC;stroke:#0E9AA7;stroke-width:2.4}.gray{fill:#F3F6F9;stroke:#94A3B8;stroke-width:2}.orange{fill:#FFF5DF;stroke:#F59E0B;stroke-width:2.4}.green{fill:#ECF9F0;stroke:#16A34A;stroke-width:2.4}.red{fill:#FFF0F0;stroke:#DC2626;stroke-width:2.4}.f{fill:none;stroke:#0B4F9C;stroke-width:4;marker-end:url(#b)}.opt{fill:none;stroke:#16A34A;stroke-width:4;marker-end:url(#g)}.cost{fill:none;stroke:#F59E0B;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#o)}.d{stroke:#D9E2EC;stroke-width:2}</style></defs><rect width="1600" height="1100" fill="#fff"/><text x="65" y="70" class="t">Qwen2.5 · Data flywheel：Generalist 与 Specialist 为什么是双向流动？</text><text x="65" y="106" class="s">对应 §8–§13 / §53｜回答：Qwen2-Instruct 过滤、Math/Code specialist 合成、reward filter 与 18T mixture 如何闭环</text>
<text x="65" y="160" class="h">上一代 general model 先当“数据工人”：给原始语料质量打分与 domain balance 信号</text>
<rect x="75" y="205" width="260" height="125" rx="18" class="gray"/><text x="100" y="245" class="n">Raw corpus</text><text x="100" y="285" class="x">web / knowledge / languages</text>
<path d="M335 267 H430" class="f"/>
<rect x="430" y="190" width="330" height="155" rx="18" class="blue"/><text x="455" y="230" class="n">Qwen2-Instruct filter</text><text x="455" y="270" class="x">quality score + domain tags</text><text x="455" y="305" class="x">上一代能力进入下一代 selection</text>
<path d="M760 267 H855" class="opt"/>
<rect x="855" y="200" width="300" height="135" rx="18" class="green"/><text x="880" y="240" class="n">High-quality real pool</text><text x="880" y="280" class="x">去重 / 质量 / domain tags</text>
<text x="65" y="425" class="h">Specialist side：Math / Code model 生成 synthetic candidates，但必须经过 verifier / reward filtering</text>
<rect x="90" y="475" width="300" height="135" rx="18" class="cyan"/><text x="115" y="515" class="n">Math / Code specialists</text><text x="115" y="555" class="x">生成题目 / 解法 / 代码</text>
<path d="M390 542 H500" class="f"/>
<rect x="500" y="465" width="330" height="155" rx="18" class="orange"/><text x="525" y="505" class="n">Verifier / reward filter</text><text x="525" y="545" class="x">数学正确性 / execution / reward</text><text x="525" y="580" class="x">不是“生成多少就全部加入”</text>
<path d="M830 542 H940" class="opt"/>
<rect x="940" y="475" width="330" height="135" rx="18" class="green"/><text x="965" y="515" class="n">Verified synthetic pool</text><text x="965" y="555" class="x">能力密集、可验证的 specialist data</text>
<line x1="65" y1="680" x2="1535" y2="680" class="d"/>
<text x="65" y="740" class="h">Mixture → Pretraining → 更强 Generalist → 再参与下一轮过滤 / 合成</text>
<rect x="100" y="790" width="300" height="125" rx="18" class="blue"/><text x="125" y="830" class="n">Real + Synthetic mix</text><text x="125" y="870" class="x">主动改写 internet frequency</text>
<path d="M400 852 H515" class="f"/>
<rect x="515" y="780" width="300" height="145" rx="18" class="green"/><text x="540" y="820" class="n">18T-token Pretraining</text><text x="540" y="860" class="x">general + math + code</text><text x="540" y="895" class="x">capability 进入 Base model</text>
<path d="M815 852 H930" class="opt"/>
<rect x="930" y="790" width="330" height="125" rx="18" class="cyan"/><text x="955" y="830" class="n">Stronger Generalist</text><text x="955" y="870" class="x">成为更强 filter / generator / teacher</text>
<path d="M1095 915 C1095 1015 235 1015 235 915" class="opt"/>
<text x="65" y="1035" class="m">双向流动：specialist data 注入 generalist；generalist 再反过来制造 / 筛选 specialist-quality data。</text>
</svg>