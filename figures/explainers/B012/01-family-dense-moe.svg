<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><desc>Qwen2.5 shared tokenizer, dense and MoE family branching, and GQA deployment knob.</desc><defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B4F9C"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker>
<style>.t{font:700 43px Inter,'Microsoft YaHei',sans-serif;fill:#10243e}.s{font:400 22px Inter,'Microsoft YaHei',sans-serif;fill:#52647a}.h{font:700 29px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.n{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.x{font:400 20px Inter,'Microsoft YaHei',sans-serif;fill:#26384d}.m{font:600 20px Inter,'Microsoft YaHei',sans-serif;fill:#42556d}.mono{font:600 20px Consolas,monospace;fill:#18334f}.blue{fill:#EAF3FF;stroke:#0B4F9C;stroke-width:2.4}.cyan{fill:#E8FBFC;stroke:#0E9AA7;stroke-width:2.4}.gray{fill:#F3F6F9;stroke:#94A3B8;stroke-width:2}.orange{fill:#FFF5DF;stroke:#F59E0B;stroke-width:2.4}.green{fill:#ECF9F0;stroke:#16A34A;stroke-width:2.4}.red{fill:#FFF0F0;stroke:#DC2626;stroke-width:2.4}.f{fill:none;stroke:#0B4F9C;stroke-width:4;marker-end:url(#b)}.opt{fill:none;stroke:#16A34A;stroke-width:4;marker-end:url(#g)}.cost{fill:none;stroke:#F59E0B;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#o)}.d{stroke:#D9E2EC;stroke-width:2}</style></defs><rect width="1600" height="1100" fill="#fff"/><text x="65" y="70" class="t">Qwen2.5 · 同一 tokenizer / protocol 怎样支撑 Dense 与 MoE 两条产品线？</text><text x="65" y="106" class="s">对应 §1–§7｜回答：统一 token space 之上，Dense 走 GQA Transformer，MoE 服务分支再引入 sparse expert routing</text>
<text x="65" y="160" class="h">统一入口：151,643 normal tokens + 22 control tokens 定义共同的序列协议</text>
<rect x="75" y="205" width="320" height="140" rx="18" class="gray"/><text x="100" y="245" class="n">Tokenizer / Chat Protocol</text><text x="100" y="285" class="mono">151,643 + 22 control tokens</text><text x="100" y="320" class="x">text / code / structured outputs</text>
<path d="M395 275 H520" class="f"/>
<circle cx="570" cy="275" r="38" fill="#0B4F9C"/><text x="555" y="283" font-size="26" fill="#fff">h</text>
<path d="M608 255 C700 190 760 190 845 220" class="f"/><path d="M608 295 C700 365 760 365 845 330" class="f"/>
<rect x="845" y="165" width="340" height="175" rx="18" class="blue"/><text x="870" y="205" class="n">Dense family · 0.5B → 72B</text><text x="870" y="245" class="x">Transformer + GQA + SwiGLU</text><text x="870" y="280" class="x">RoPE / RMSNorm / QKV bias</text><text x="870" y="315" class="mono">all FFN params active / token</text>
<rect x="845" y="380" width="340" height="190" rx="18" class="cyan"/><text x="870" y="420" class="n">MoE service branch</text><text x="870" y="460" class="x">routed experts + shared experts</text><text x="870" y="495" class="x">token → router → Top-K → combine</text><text x="870" y="535" class="mono">total params ≠ active params</text>
<path d="M1185 252 H1300" class="opt"/><path d="M1185 475 H1300" class="opt"/>
<rect x="1300" y="205" width="235" height="125" rx="18" class="green"/><text x="1325" y="245" class="n">Dense use cases</text><text x="1325" y="285" class="x">本地 / 多尺寸部署</text>
<rect x="1300" y="410" width="235" height="125" rx="18" class="green"/><text x="1325" y="450" class="n">MoE use cases</text><text x="1325" y="490" class="x">容量 / active compute</text>
<line x1="65" y1="640" x2="1535" y2="640" class="d"/>
<text x="65" y="700" class="h">GQA 本身也是 deployment knob：不同尺寸选择不同程度的 KV sharing</text>
<rect x="100" y="755" width="310" height="135" rx="18" class="red"/><text x="125" y="795" class="n">MHA baseline</text><text x="125" y="835" class="x">H query heads + H KV heads</text><text x="125" y="870" class="x">KV cache / bandwidth 最大</text>
<path d="M410 823 H520" class="opt"/>
<rect x="520" y="740" width="430" height="165" rx="18" class="blue"/><text x="545" y="780" class="n">Grouped-Query Attention</text><text x="545" y="820" class="x">H query heads 共享较少 K/V heads</text><text x="545" y="855" class="x">模型尺寸越大，KV sharing 配置可独立调整</text>
<path d="M950 823 H1060" class="opt"/>
<rect x="1060" y="755" width="410" height="135" rx="18" class="green"/><text x="1085" y="795" class="n">Serving effect</text><text x="1085" y="835" class="x">更小 KV state → 更低 cache / bandwidth</text>
<text x="65" y="1000" class="m">“Qwen2.5”是同一训练/协议体系下的产品曲线，不应被画成一个固定参数量的单模型。</text>
</svg>