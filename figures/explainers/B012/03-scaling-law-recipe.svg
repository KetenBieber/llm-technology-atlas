<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><desc>Qwen2.5 scaling-law design of model, optimizer and MoE configuration.</desc><defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B4F9C"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker>
<style>.t{font:700 43px Inter,'Microsoft YaHei',sans-serif;fill:#10243e}.s{font:400 22px Inter,'Microsoft YaHei',sans-serif;fill:#52647a}.h{font:700 29px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.n{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.x{font:400 20px Inter,'Microsoft YaHei',sans-serif;fill:#26384d}.m{font:600 20px Inter,'Microsoft YaHei',sans-serif;fill:#42556d}.mono{font:600 20px Consolas,monospace;fill:#18334f}.blue{fill:#EAF3FF;stroke:#0B4F9C;stroke-width:2.4}.cyan{fill:#E8FBFC;stroke:#0E9AA7;stroke-width:2.4}.gray{fill:#F3F6F9;stroke:#94A3B8;stroke-width:2}.orange{fill:#FFF5DF;stroke:#F59E0B;stroke-width:2.4}.green{fill:#ECF9F0;stroke:#16A34A;stroke-width:2.4}.red{fill:#FFF0F0;stroke:#DC2626;stroke-width:2.4}.f{fill:none;stroke:#0B4F9C;stroke-width:4;marker-end:url(#b)}.opt{fill:none;stroke:#16A34A;stroke-width:4;marker-end:url(#g)}.cost{fill:none;stroke:#F59E0B;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#o)}.d{stroke:#D9E2EC;stroke-width:2}</style></defs><rect width="1600" height="1100" fill="#fff"/><text x="65" y="70" class="t">Qwen2.5 · Scaling law：联合设计 model、optimizer 与 MoE</text><text x="65" y="106" class="s">对应 §14–§16｜small-scale runs 如何把 architecture / lr / batch / sparse capacity 一起外推到大规模训练</text>
<text x="65" y="160" class="h">Controlled runs 产生的不只是 loss curve，而是一组可外推的 design surfaces</text>
<rect x="75" y="205" width="260" height="125" rx="18" class="gray"/><text x="100" y="245" class="n">Small runs</text><text x="100" y="285" class="x">多模型尺寸 × 多数据量</text>
<path d="M335 267 H430" class="f"/>
<rect x="430" y="185" width="340" height="165" rx="18" class="blue"/><text x="455" y="225" class="n">Fit scaling relations</text><text x="455" y="265" class="mono">loss = f(N, D, compute)</text><text x="455" y="300" class="x">同时记录稳定训练的 lr / batch 区域</text>
<path d="M770 267 H870" class="f"/>
<g>
<rect x="870" y="170" width="300" height="120" rx="18" class="cyan"/><text x="895" y="210" class="n">Dense design</text><text x="895" y="250" class="x">N / D / lr / batch</text>
<rect x="870" y="315" width="300" height="130" rx="18" class="orange"/><text x="895" y="355" class="n">MoE design</text><text x="895" y="395" class="x">experts / active params / routing</text>
</g>
<path d="M1170 230 H1290" class="opt"/><path d="M1170 380 H1290" class="opt"/>
<rect x="1290" y="210" width="245" height="190" rx="18" class="green"/><text x="1315" y="250" class="n">Large-scale recipe</text><text x="1315" y="290" class="x">不是“小模型超参照搬”</text><text x="1315" y="325" class="x">先按 scaling relation 迁移</text><text x="1315" y="360" class="x">再做稳定性验证</text>
<line x1="65" y1="515" x2="1535" y2="515" class="d"/>
<text x="65" y="575" class="h">为什么 learning rate 也需要 scaling？参数规模变大后，同一 lr 对 update geometry 的意义会变</text>
<line x1="140" y1="800" x2="700" y2="800" stroke="#64748B" stroke-width="3"/><line x1="140" y1="640" x2="140" y2="800" stroke="#64748B" stroke-width="3"/>
<path d="M160 730 C280 650 390 675 500 700 S620 755 690 765" fill="none" stroke="#0B4F9C" stroke-width="5"/>
<circle cx="330" cy="673" r="11" fill="#16A34A"/><text x="265" y="630" class="n">small model optimum</text>
<line x1="900" y1="800" x2="1460" y2="800" stroke="#64748B" stroke-width="3"/><line x1="900" y1="640" x2="900" y2="800" stroke="#64748B" stroke-width="3"/>
<path d="M920 760 C1040 700 1130 660 1240 680 S1370 745 1450 770" fill="none" stroke="#0E9AA7" stroke-width="5"/>
<circle cx="1240" cy="680" r="11" fill="#16A34A"/><text x="1170" y="630" class="n">large model optimum</text>
<rect x="300" y="875" width="1000" height="115" rx="18" class="green"/><text x="335" y="918" class="n">Scaling law 的工程角色</text><text x="335" y="957" class="x">减少昂贵大模型网格搜索：先用小规模实验估计最优区域，再把验证预算集中到少量候选 recipe。</text>
</svg>