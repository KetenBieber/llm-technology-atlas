<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<defs>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1d4ed8"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#0f172a}
    .title{font-size:48px;font-weight:700}.sub{font-size:22px;fill:#475569}.sec{font-size:28px;font-weight:700}
    .lab{font-size:23px;font-weight:700}.body{font-size:20px;fill:#334155}.num{font-size:26px;font-weight:700}.mono{font-size:20px;font-family:Consolas,monospace}
    .box{rx:18;ry:18;stroke-width:2.2}.flow{stroke:#1d4ed8;stroke-width:4;fill:none;marker-end:url(#b)}
    .good{stroke:#16a34a;stroke-width:4;fill:none;marker-end:url(#g)}.cost{stroke:#ea580c;stroke-width:3.5;fill:none;marker-end:url(#o)}
    .dash{stroke:#ea580c;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#o)}
  </style>
</defs>
<rect width="1800" height="1200" fill="#fff"/>
<text x="80" y="78" class="title">Qwen2.5 长上下文栈：1M 不是 max_position 改成 1,000,000</text>
<text x="80" y="116" class="sub">核心问题：training length、position/attention extrapolation 与 efficient serving 是三层不同问题，必须分别解决。</text>

<!-- training timeline -->
<text x="80" y="175" class="sec" fill="#1d4ed8">① Progressive training：先真的在更长分布上训练</text>
<rect x="80" y="220" width="210" height="100" class="box" fill="#f8fafc" stroke="#94a3b8"/>
<text x="185" y="258" text-anchor="middle" class="lab">Foundation</text><text x="185" y="292" text-anchor="middle" class="num">4K</text>
<rect x="355" y="220" width="210" height="100" class="box" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="460" y="258" text-anchor="middle" class="lab">Dense final PT</text><text x="460" y="292" text-anchor="middle" class="num">32K</text>
<rect x="630" y="220" width="180" height="100" class="box" fill="#ecfdf5" stroke="#16a34a"/>
<text x="720" y="258" text-anchor="middle" class="lab">Turbo</text><text x="720" y="292" text-anchor="middle" class="num">65K</text>
<rect x="875" y="220" width="180" height="100" class="box" fill="#ecfdf5" stroke="#16a34a"/>
<text x="965" y="258" text-anchor="middle" class="lab">Turbo</text><text x="965" y="292" text-anchor="middle" class="num">131K</text>
<rect x="1120" y="220" width="200" height="100" class="box" fill="#ecfdf5" stroke="#16a34a"/>
<text x="1220" y="258" text-anchor="middle" class="lab">Turbo max PT</text><text x="1220" y="292" text-anchor="middle" class="num">262K</text>
<path d="M290 270H345" class="flow"/><path d="M565 270H620" class="good"/><path d="M810 270H865" class="good"/><path d="M1055 270H1110" class="good"/>
<rect x="1390" y="210" width="330" height="120" class="box" fill="#fff7ed" stroke="#ea580c"/>
<text x="1555" y="250" text-anchor="middle" class="lab">每个 Turbo stage 的长度混合</text><text x="1555" y="285" text-anchor="middle" class="body">40% 当前 max length</text><text x="1555" y="316" text-anchor="middle" class="body">60% shorter sequences</text>

<!-- SFT -->
<rect x="80" y="370" width="740" height="120" class="box" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="115" y="410" class="lab">Long-context SFT 继续保活 instruction following</text>
<text x="115" y="447" class="body">Stage 1：instructions ≤ 32K</text><text x="470" y="447" class="body">Stage 2：short + long instructions，最长 262K</text>
<path d="M1220 320V350H450V360" class="flow"/>

<!-- extrapolation -->
<text x="80" y="560" class="sec" fill="#16a34a">② Extrapolation：训练到 262K 后，还要处理训练区间之外的位置与 attention 组织</text>
<rect x="80" y="605" width="300" height="130" class="box" fill="#ecfdf5" stroke="#16a34a"/>
<text x="230" y="648" text-anchor="middle" class="lab">YaRN</text><text x="230" y="684" text-anchor="middle" class="body">RoPE position-frequency scaling</text><text x="230" y="716" text-anchor="middle" class="mono">L_infer &gt; L_train</text>
<rect x="455" y="605" width="330" height="130" class="box" fill="#ecfdf5" stroke="#16a34a"/>
<text x="620" y="648" text-anchor="middle" class="lab">Dual Chunk Attention</text><text x="620" y="684" text-anchor="middle" class="body">chunk-relative attention organization</text><text x="620" y="716" text-anchor="middle" class="body">跨块依赖不等于 full-position naive extrapolation</text>
<rect x="860" y="605" width="300" height="130" class="box" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="1010" y="648" text-anchor="middle" class="lab">Model context</text><text x="1010" y="690" text-anchor="middle" class="num">1M</text><text x="1010" y="718" text-anchor="middle" class="body">Turbo reported context</text>
<path d="M820 490V540H230V595" class="good"/><path d="M380 670H445" class="good"/><path d="M785 670H850" class="good"/>

<!-- distinction normal dense -->
<rect x="1230" y="590" width="490" height="155" class="box" fill="#f8fafc" stroke="#94a3b8"/>
<text x="1265" y="630" class="lab">不要混淆三种长度</text>
<text x="1265" y="668" class="body">普通 Qwen2.5：train 32K → extrapolate 128K</text>
<text x="1265" y="704" class="body">Turbo：train 262K → extrapolate 1M</text>
<text x="1265" y="736" class="body">“能表示 1M” ≠ “1M serving 足够快”</text>

<!-- serving -->
<text x="80" y="815" class="sec" fill="#ea580c">③ Serving：Full Attention 的 O(L²) prefill 仍可能让 TTFT 不可接受</text>
<rect x="80" y="860" width="420" height="230" class="box" fill="#fff7ed" stroke="#ea580c"/>
<text x="110" y="900" class="lab">Full Attention @ L=10⁶</text>
<text x="110" y="936" class="mono">QKᵀ → ~10¹² score interactions</text>
