<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
.title{font-size:46px;font-weight:700}.subtitle{font-size:24px;fill:#526b80}.section{font-size:30px;font-weight:700}.node{font-size:24px;font-weight:650}.body{font-size:21px}.small{font-size:20px;fill:#526b80}.math{font-size:23px;font-family:"STIX Two Text","Times New Roman",serif}
.box{fill:#f8fbfd;stroke:#8fb6cc;stroke-width:2.2}.blue{fill:#eaf4fb;stroke:#2b6f9f;stroke-width:2.4}.cyan{fill:#eafafa;stroke:#178d98;stroke-width:2.4}.orange{fill:#fff4e8;stroke:#d47a20;stroke-width:2.4}.red{fill:#fff0f0;stroke:#c64a4a;stroke-width:2.4}.green{fill:#edf9f1;stroke:#2f8a57;stroke-width:2.4}.gray{fill:#f2f4f6;stroke:#8795a1;stroke-width:2}
.flow{fill:none;stroke:#246b9b;stroke-width:5;marker-end:url(#arrow)}.aux{fill:none;stroke:#607d8b;stroke-width:3;marker-end:url(#arrowGray)}.comm{fill:none;stroke:#d47a20;stroke-width:5;stroke-dasharray:11 8;marker-end:url(#arrowOrange)}.good{fill:none;stroke:#2f8a57;stroke-width:5;marker-end:url(#arrowGreen)}.bad{fill:none;stroke:#c64a4a;stroke-width:4;stroke-dasharray:9 7;marker-end:url(#arrowRed)}
.grid{stroke:#c9d6de;stroke-width:1.5}.idle{fill:#f5dddd;stroke:#c64a4a;stroke-width:2}.busy{fill:#dfeef8;stroke:#2b6f9f;stroke-width:2}.busy2{fill:#ddf3e5;stroke:#2f8a57;stroke-width:2}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#246b9b"/></marker>
<marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker>
<marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d47a20"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f8a57"/></marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c64a4a"/></marker>
</defs>
<rect width="1600" height="1100" fill="#fff"/>
<text x="70" y="72" class="title">FlashAttention-2：IO 已优化，瓶颈为什么又迁移到 Work Partition？</text>
<text x="70" y="112" class="subtitle">A056 · FA1 消掉 HBM 往返后，剩余关键路径变成并行度、操作类型与 warp 通信</text>

<text x="70" y="174" class="section">FA1：每个 head 是粗粒度 worker，长序列 + 小 batch 时 SM 仍可能吃不满</text>
<rect x="70" y="205" width="660" height="360" rx="22" class="gray"/>
<text x="100" y="248" class="node">Attention matrix：同一 head 内 row blocks 串行扫过 K/V</text>
<rect x="110" y="285" width="300" height="210" fill="#fff" stroke="#8795a1" stroke-width="2"/>
<g class="grid">
<line x1="110" y1="337" x2="410" y2="337"/><line x1="110" y1="389" x2="410" y2="389"/><line x1="110" y1="441" x2="410" y2="441"/>
<line x1="185" y1="285" x2="185" y2="495"/><line x1="260" y1="285" x2="260" y2="495"/><line x1="335" y1="285" x2="335" y2="495"/>
</g>
<rect x="110" y="285" width="300" height="52" fill="#dfeef8" opacity=".95"/><text x="127" y="319" class="small">Q row block 0</text>
<path d="M430 310 H505 V465 H430" class="aux"/>
<text x="520" y="326" class="body">一个 thread block</text>
<text x="520" y="362" class="small">逐个消费 K/V tiles</text>
<text x="520" y="405" class="math">workers ≈ B × H</text>
<text x="520" y="450" class="small">N 变长并不会增加 worker 数</text>

<text x="790" y="174" class="section">瓶颈迁移：IO 不再遮住后面的成本</text>
<rect x="790" y="205" width="740" height="360" rx="22" class="red"/>
<rect x="830" y="260" width="190" height="115" rx="15" class="red"/><text x="854" y="303" class="node">并行度不足</text><text x="854" y="339" class="small">SM idle / occupancy</text>
<rect x="1060" y="260" width="190" height="115" rx="15" class="orange"/><text x="1080" y="303" class="node">Non-matmul</text><text x="1080" y="339" class="small">max / exp / rescale</text>
<rect x="1290" y="260" width="190" height="115" rx="15" class="red"/><text x="1314" y="303" class="node">Warp reduction</text><text x="1314" y="339" class="small">SMEM + sync</text>
<path d="M925 395 V470" class="bad"/><path d="M1155 395 V470" class="bad"/><path d="M1385 395 V470" class="bad"/>
<text x="832" y="515" class="math">FA1: 30–50% forward peak；backward 25–35%</text>

<path d="M760 590 V640" class="good"/>
<text x="70" y="665" class="section">FA2：把可独立输出维变成并行维，同时减少昂贵非矩阵操作与跨 warp 通信</text>
<rect x="70" y="700" width="1460" height="285" rx="22" class="green"/>

<rect x="105" y="752" width="390" height="175" rx="18" class="blue"/>
<text x="135" y="792" class="node">Sequence row-block parallelism</text>
<text x="135" y="832" class="math">workers ≈ B × H × ⌈N/Bᵣ⌉</text>
<g>
<rect x="145" y="858" width="72" height="34" class="busy2"/><rect x="225" y="858" width="72" height="34" class="busy2"/><rect x="305" y="858" width="72" height="34" class="busy2"/><rect x="385" y="858" width="72" height="34" class="busy2"/>
</g>
<text x="135" y="916" class="small">每个 Q row block 独立拥有完整输出 slice</text>

<rect x="605" y="752" width="390" height="175" rx="18" class="cyan"/>
<text x="635" y="792" class="node">减少 Non-matmul critical path</text>
<text x="635" y="832" class="math">Lᵢ = mᵢ + log ℓᵢ</text>
<text x="635" y="870" class="body">维护 unscaled numerator，最后一次归一化</text>
<text x="635" y="910" class="small">把更多时间留给 Tensor Core GEMM</text>

<rect x="1105" y="752" width="390" height="175" rx="18" class="green"/>
<text x="1135" y="792" class="node">Split-Q warp ownership</text>
<text x="1135" y="832" class="body">warp 各自拥有不同 Q rows</text>
<text x="1135" y="870" class="body">→ 不再合并 partial O</text>
<text x="1135" y="910" class="small">减少 SMEM traffic 与 synchronization</text>

<path d="M495 838 H600" class="flow"/><path d="M995 838 H1100" class="flow"/>
<rect x="70" y="1015" width="1460" height="58" rx="14" class="box"/>
<text x="100" y="1053" class="small">论文结果锚点：A100 forward 最高约 230 TFLOPs/s，约为 312 TFLOPs/s Tensor Core 理论峰值的 73%；数学复杂度仍为 O(N²d)。</text>
</svg>