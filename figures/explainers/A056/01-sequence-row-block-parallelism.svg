<rect x="110" y="775" width="560" height="115" rx="18" class="red"/><text x="390" y="818" text-anchor="middle" class="n">一个 head 内的 sequence blocks 仍较串行</text><text x="390" y="858" text-anchor="middle" class="small">小 batch / 少 heads 时，SM 可能等不到足够 blocks</text>
<path d="M735 550H835" class="flow"/><text x="785" y="520" text-anchor="middle" class="small">改变 loop ownership</text>

