<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>FlashAttention-2：把 Sequence Row Blocks 变成 GPU 并行维度</title><desc>FA1 主要按 batch×head 分 worker；FA2 让每个 Q row block 成为独立 thread block，从长序列本身提取更多并行度。</desc><defs>
