11</text><rect x="0" y="315" width="82" height="82" rx="12" fill="#DDE5EC" stroke="#7D8B99" stroke-width="2"/><text x="41" y="363" text-anchor="middle" class="small">H12</text><rect x="105" y="315" width="82" height="82" rx="12" fill="#DDE5EC" stroke="#7D8B99" stroke-width="2"/><text x="146" y="363" text-anchor="middle" class="small">H13</text><rect x="210" y="315" width="82" height="82" rx="12" fill="#DDE5EC" stroke="#7D8B99" stroke-width="2"/><text x="251" y="363" text-anchor="middle" class="small">H14</text><rect x="315" y="315" width="82" height="82" rx="12" fill="#DDE5EC" stroke="#7D8B99" stroke-width="2"/><text x="356" y="363" text-anchor="middle" class="small">H15</text>
