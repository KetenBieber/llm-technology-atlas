<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
<rect width="1440" height="960" fill="#f8fafc"/>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
  <style>
    .tt{font:700 34px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
    .sub{font:500 18px Arial,'Microsoft YaHei',sans-serif;fill:#475569}
    .h{font:700 22px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
    .t{font:500 17px Arial,'Microsoft YaHei',sans-serif;fill:#1e293b}
    .s{font:500 15px Arial,'Microsoft YaHei',sans-serif;fill:#475569}
    .b{fill:#ffffff;stroke:#94a3b8;stroke-width:2;rx:18}
    .bl{fill:#dbeafe;stroke:#3b82f6;stroke-width:2;rx:18}
    .cy{fill:#cffafe;stroke:#06b6d4;stroke-width:2;rx:18}
    .sl{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2;rx:18}
    .deep{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.4;rx:18}
    .a{stroke:#475569;stroke-width:2.7;fill:none;marker-end:url(#arr)}
    .d{stroke:#64748b;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#arr)}
  </style>
</defs>
<text x="64" y="62" class="tt">GRPO：去掉 learned Critic，但保留“相对基线 + PPO-style 受限更新”</text>
<text x="64" y="96" class="sub">算法可分成三块：同题组内 advantage、importance ratio + clip、reference KL；真正省掉的是 Value Model 支路。</text>
<rect x="55" y="170" width="245" height="125" class="bl"/>
<text x="90" y="215" class="h">Prompt q</text>
<text x="90" y="252" class="t">固定同一个条件</text>

<rect x="370" y="145" width="310" height="180" class="deep"/>
<text x="410" y="190" class="h">π_old 采样 G 条 responses</text>
<text x="410" y="228" class="t">o₁, o₂, …, o_G</text>
<text x="410" y="263" class="t">每条得到 reward r_i</text>
<text x="410" y="298" class="s">不额外查询 learned V(s_t)</text>
<path d="M300 232 H370" class="a"/>

<rect x="760" y="145" width="300" height="180" class="cy"/>
<text x="800" y="190" class="h">Group-relative Advantage</text>
<text x="800" y="228" class="t">Â_i ∝ (r_i − mean(r)) / std(r)</text>
<text x="800" y="263" class="t">同 prompt 内做相对比较</text>
<text x="800" y="298" class="s">经验基线 ≠ token-level Value Function</text>
<path d="M680 232 H760" class="a"/>

<rect x="1140" y="145" width="250" height="180" class="bl"/>
<text x="1180" y="190" class="h">Token-level Update</text>
<text x="1180" y="228" class="t">对 response token 求和</text>
<text x="1180" y="263" class="s">正 advantage 上调</text>
<text x="1180" y="291" class="s">负 advantage 下调</text>
<path d="M1060 232 H1140" class="a"/>

<text x="70" y="405" class="h">Objective 的三块组成</text>
<rect x="80" y="445" width="390" height="180" class="deep"/>
<text x="120" y="490" class="h">① Group Baseline</text>
<text x="120" y="530" class="t">用同题多答案的相对 reward 构造 Â</text>
<text x="120" y="568" class="s">省掉 Critic 的训练、显存和推理成本</text>

<rect x="525" y="445" width="390" height="180" class="bl"/>
<text x="565" y="490" class="h">② PPO Ratio + Clip</text>
<text x="565" y="530" class="t">r_t(θ)=π_θ / π_old</text>
<text x="565" y="568" class="s">限制一次 policy update 不要离 old policy 太远</text>

<rect x="970" y="445" width="390" height="180" class="cy"/>
<text x="1010" y="490" class="h">③ Reference KL</text>
<text x="1010" y="530" class="t">约束 π_θ 偏离 π_ref 的程度</text>
<text x="1010" y="568" class="s">控制 reward optimization 对原模型分布的侵蚀</text>

<rect x="185" y="700" width="1070" height="130" class="sl"/>
<text x="225" y="745" class="h">统计边界：group mean 不是无条件“标准无偏 baseline”</text>
<text x="225" y="785" class="t">它由同一组样本估计，且常包含当前样本自身；再除以 group std 后耦合更强。</text>
<text x="225" y="817" class="s">因此 GRPO 的工程优势非常明确，但不能把 group normalization 简化理解成精确等价于 V(s_t)。</text>
<text x="720" y="925" text-anchor="middle" class="s">自制总结架构图：提炼文章核心机制，不复刻原论文图。</text></svg>