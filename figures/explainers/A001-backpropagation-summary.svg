osoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">链式法则递归传播</text><rect x="430" y="145" width="740" height="815" rx="22" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="430" y="145" width="740" height="58" rx="22" fill="#103B63"/><rect x="430" y="179" width="740" height="24" fill="#103B63"/><text x="454" y="184" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">端到端训练闭环</text><rect x="520" y="245" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="245" width="14" height="90" rx="7" fill="#1573B8"/><text x="555" y="280" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Forward：a⁽ˡ⁾ = f(z⁽ˡ⁾)</text><text x="555" y="310" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">逐层保存中间激活</text><line x1="800" y1="335" x2="800" y2="361" stroke="#1573B8" stroke-width="3"/><polygon points="800,361 786,353 786,369" fill="#1573B8"/><rect x="520" y="365" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="365" width="14" height="90" rx="7" fill="#0A9AA6"/><text x="555" y="400" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Loss：L(y, ŷ)</text><text x="555" y="430" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">输出误差形成反向起点</text><line x1="800" y1="455" x2="800" y2="481" stroke="#1573B8" stroke-width="3"/><polygon points="800,481 786,473 786,489" fill="#1573B8"/><rect x="520" y="485" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="485" width="14" height=