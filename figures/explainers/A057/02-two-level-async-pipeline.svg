<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>FlashAttention-3：两层异步流水——TMA Overlap 与 GEMM–Softmax Overlap</title><desc>FA3 同时隐藏 memory movement 与 consumer 内部 Tensor Core/SFU latency：producer-consumer pipeline + tile-to-tile 2-stage GEMM-softmax pipeline。</desc><defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1557B0"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E58A1F"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2E8B57"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C23B3B"/></marker>
<style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324D}.title{font-size:46px;font-weight:700}.sub{font-size:23px;fill:#596579}.h{font-size:28px;font-weight:700}.n{font-size:22px}.small{font-size:20px}.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:21px}.panel{fill:#F8FBFE;stroke:#B8CADB;stroke-width:2}.blue{fill:#EAF3FF;stroke:#1557B0;stroke-width:2.5}.cyan{fill:#E8FAFB;stroke:#0E9AA7;stroke-width:2.5}.orange{fill:#FFF4E6;stroke:#E58A1F;stroke-width:2.5}.green{fill:#ECF8F1;stroke:#2E8B57;stroke-width:2.5}.red{fill:#FFF0F0;stroke:#C23B3B;stroke-width:2.5}.gray{fill:#F1F4F7;stroke:#7D8B99;stroke-width:2}.flow{fill:none;stroke:#1557B0;stroke-width:4;marker-end:url(#ab)}.comm{fill:none;stroke:#E58A1F;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#ao)}.good{fill:none;stroke:#2E8B57;stroke-width:4;marker-end:url(#ag)}.bad{fill:none;stroke:#C23B3B;stroke-width:4;marker-end:url(#ar)}</style></defs><rect width="1600" height="1100" fill="#fff"/><text x="70" y="72" class="title">FlashAttention-3：两层异步流水——TMA Overlap 与 GEMM–Softmax Overlap</text>
<text x="70" y="112" class="sub">认知问题：FA3 的“异步”到底 overlap 了谁和谁？</text>
<text x="90" y="190" class="h">Baseline serial dependency（逻辑正确，但硬件空转）</text>
<rect x="90" y="225" width="1420" height="125" rx="18" class="red"/>
<g transform="translate(125,255)">
<rect x="0" y="0" width="190" height="62" rx="12" class="orange"/><text x="95" y="40" text-anchor="middle" class="n">load Kⱼ,Vⱼ</text>
<rect x="245" y="0" width="190" height="62" rx="12" class="blue"/><text x="340" y="40" text-anchor="middle" class="n">QKⱼᵀ</text>
<rect x="490" y="0" width="190" height="62" rx="12" class="cyan"/><text x="585" y="40" text-anchor="middle" class="n">softmaxⱼ</text>
<rect x="735" y="0" width="190" height="62" rx="12" class="blue"/><text x="830" y="40" text-anchor="middle" class="n">PⱼVⱼ</text>
<rect x="980" y="0" width="190" height="62" rx="12" class="orange"/><text x="1075" y="40" text-anchor="middle" class="n">load Kⱼ₊₁,Vⱼ₊₁</text>
<path d="M190 31H235" class="bad"/><path d="M435 31H480" class="bad"/><path d="M680 31H725" class="bad"/><path d="M925 31H970" class="bad"/>
</g>

<text x="90" y="430" class="h">FA3 schedule：恢复真实 dependency graph</text>
<rect x="90" y="465" width="1420" height="465" rx="22" class="panel"/>
<text x="120" y="525" class="n">TMA producer</text><text x="120" y="640" class="n">Tensor Core / WGMMA</text><text x="120" y="755" class="n">CUDA / SFU softmax</text><text x="120" y="870" class="n">Output GEMM</text>
<line x1="350" y1="535" x2="1450" y2="535" stroke="#CBD5DF" stroke-width="2"/><line x1="350" y1="650" x2="1450" y2="650" stroke="#CBD5DF" stroke-width="2"/><line x1="350" y1="765" x2="1450" y2="765" stroke="#CBD5DF" stroke-width="2"/><line x1="350" y1="880" x2="1450" y2="880" stroke="#CBD5DF" stroke-width="2"/>
<rect x="380" y="500" width="250" height="70" rx="12" class="orange"/><text x="505" y="544" text-anchor="middle" class="n">TMA load tile j+1</text>
<rect x="660" y="500" width="250" height="70" rx="12" class="orange"/><text x="785" y="544" text-anchor="middle" class="n">TMA load tile j+2</text>
<rect x="405" y="615" width="250" height="70" rx="12" class="blue"/><text x="530" y="659" text-anchor="middle" class="n">QKⱼᵀ</text>
<rect x="690" y="615" width="250" height="70" rx="12" class="blue"/><text x="815" y="659" text-anchor="middle" class="n">QKⱼ₊₁ᵀ</text>
<rect x="975" y="615" width="250" height="70" rx="12" class="blue"/><text x="1100" y="659" text-anchor="middle" class="n">QKⱼ₊₂ᵀ</text>
<rect x="655" y="730" width="250" height="70" rx="12" class="cyan"/><text x="780" y="774" text-anchor="middle" class="n">softmaxⱼ</text>
<rect x="940" y="730" width="250" height="70" rx="12" class="cyan"/><text x="1065" y="774" text-anchor="middle" class="n">softmaxⱼ₊₁</text>
<rect x="850" y="845" width="250" height="70" rx="12" class="green"/><text x="975" y="889" text-anchor="middle" class="n">PⱼVⱼ</text>
<rect x="1135" y="845" width="250" height="70" rx="12" class="green"/><text x="1260" y="889" text-anchor="middle" class="n">Pⱼ₊₁Vⱼ₊₁</text>
<path d="M655 650L690 765" class="flow"/><path d="M940 650L975 765" class="flow"/><path d="M905 765L850 880" class="flow"/><path d="M1190 765L1135 880" class="flow"/>
<rect x="1030" y="485" width="410" height="90" rx="16" class="green"/><text x="1235" y="520" text-anchor="middle" class="small">第一层 overlap：TMA memory movement</text><text x="1235" y="554" text-anchor="middle" class="small">与 consumer compute 并行</text>
<rect x="355" y="805" width="390" height="95" rx="16" class="green"/><text x="550" y="842" text-anchor="middle" class="small">第二层 overlap：QKⱼ₊₁ WGMMA</text><text x="550" y="876" text-anchor="middle" class="small">与 softmaxⱼ 并行</text>
<text x="800" y="1015" text-anchor="middle" class="n">2-stage 的代价：同时保留当前 score 与 next score accumulator → register pressure 上升；更深 pipeline 并非总是更快。</text>
</svg>