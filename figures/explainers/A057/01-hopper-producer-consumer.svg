<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>FlashAttention-3：TMA Producer × WGMMA Consumer 的 Warp Specialization</title><desc>Hopper 上把数据搬运与计算分配给不同 warpgroups，并用 circular SMEM stages 与 per-stage barriers 建立 producer-consumer pipeline。</desc><defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1557B0"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E58A1F"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2E8B57"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C23B3B"/></marker>
<style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324D}.title{font-size:46px;font-weight:700}.sub{font-size:23px;fill:#596579}.h{font-size:28px;font-weight:700}.n{font-size:22px}.small{font-size:20px}.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:21px}.panel{fill:#F8FBFE;stroke:#B8CADB;stroke-width:2}.blue{fill:#EAF3FF;stroke:#1557B0;stroke-width:2.5}.cyan{fill:#E8FAFB;stroke:#0E9AA7;stroke-width:2.5}.orange{fill:#FFF4E6;stroke:#E58A1F;stroke-width:2.5}.green{fill:#ECF8F1;stroke:#2E8B57;stroke-width:2.5}.red{fill:#FFF0F0;stroke:#C23B3B;stroke-width:2.5}.gray{fill:#F1F4F7;stroke:#7D8B99;stroke-width:2}.flow{fill:none;stroke:#1557B0;stroke-width:4;marker-end:url(#ab)}.comm{fill:none;stroke:#E58A1F;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#ao)}.good{fill:none;stroke:#2E8B57;stroke-width:4;marker-end:url(#ag)}.bad{fill:none;stroke:#C23B3B;stroke-width:4;marker-end:url(#ar)}</style></defs><rect width="1600" height="1100" fill="#fff"/><text x="70" y="72" class="title">FlashAttention-3：TMA Producer × WGMMA Consumer 的 Warp Specialization</text>
<text x="70" y="112" class="sub">认知问题：为什么 Hopper 上不该让所有 warps 都做相同的 load + compute 工作？</text>
<rect x="65" y="155" width="1470" height="820" rx="24" class="panel"/>
<rect x="110" y="250" width="250" height="130" rx="20" class="gray"/><text x="235" y="298" text-anchor="middle" class="h">GMEM / HBM</text><text x="235" y="338" text-anchor="middle" class="small">Qᵢ · Kⱼ · Vⱼ tiles</text>
<path d="M360 315H470" class="comm"/>
<rect x="485" y="225" width="300" height="180" rx="22" class="orange"/><text x="635" y="270" text-anchor="middle" class="h">Producer warpgroup</text><text x="635" y="312" text-anchor="middle" class="n">TMA async load</text><text x="635" y="350" text-anchor="middle" class="small">地址/搬运 + barrier signal</text><text x="635" y="385" text-anchor="middle" class="small">低 register quota</text>
<path d="M785 315H875" class="comm"/>
<rect x="890" y="190" width="310" height="470" rx="22" class="cyan"/><text x="1045" y="235" text-anchor="middle" class="h">Circular SMEM Buffer</text>
<rect x="935" y="285" width="220" height="78" rx="14" fill="#EAF3FF" stroke="#1557B0" stroke-width="2.5"/><text x="1045" y="333" text-anchor="middle" class="n">stage 0</text><rect x="935" y="390" width="220" height="78" rx="14" fill="#ECF8F1" stroke="#2E8B57" stroke-width="2.5"/><text x="1045" y="438" text-anchor="middle" class="n">stage 1</text><rect x="935" y="495" width="220" height="78" rx="14" fill="#FFF4E6" stroke="#E58A1F" stroke-width="2.5"/><text x="1045" y="543" text-anchor="middle" class="n">stage 2</text>
<text x="1045" y="620" text-anchor="middle" class="small">ready ↔ consumed barrier state</text>
<path d="M1200 425H1290" class="flow"/>
<rect x="1305" y="225" width="190" height="415" rx="22" class="blue"/><text x="1400" y="270" text-anchor="middle" class="h">Consumer</text>
<text x="1400" y="330" text-anchor="middle" class="n">WGMMA QKᵀ</text><text x="1400" y="380" text-anchor="middle" class="n">Online Softmax</text><text x="1400" y="430" text-anchor="middle" class="n">WGMMA PV</text><text x="1400" y="480" text-anchor="middle" class="n">O accumulator</text><text x="1400" y="548" text-anchor="middle" class="small">高 register quota</text>
<rect x="485" y="735" width="1010" height="150" rx="20" class="green"/><text x="990" y="778" text-anchor="middle" class="h">两类资源同时推进</text><text x="990" y="822" text-anchor="middle" class="mono">T_tile ≈ max(T_load, T_compute)</text><text x="990" y="858" text-anchor="middle" class="small">而不是 load 完再 compute：T_load + T_compute</text>
<path d="M635 405V735" class="comm"/><path d="M1400 640V735" class="good"/>
<rect x="110" y="735" width="310" height="150" rx="20" class="orange"/><text x="265" y="778" text-anchor="middle" class="n">setmaxnreg</text><text x="265" y="818" text-anchor="middle" class="small">Producer 释放 register quota</text><text x="265" y="852" text-anchor="middle" class="small">Consumer 获得更多 registers</text>
<text x="800" y="1030" text-anchor="middle" class="n">Warp specialization 的本质不是代码分支，而是把“搬运、矩阵乘、softmax、寄存器预算”按硬件角色重新分工。</text>
</svg>