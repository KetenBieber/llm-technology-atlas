<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>FlashAttention-3 FP8：Block Quantization × Incoherent Processing</title><desc>Block scale 解决跨 tile 动态范围；Q/K 共同正交混合解决 tile 内 feature outlier，同时保持 QKᵀ 完全不变。</desc><defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1557B0"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E58A1F"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2E8B57"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C23B3B"/></marker>
<style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324D}.title{font-size:46px;font-weight:700}.sub{font-size:23px;fill:#596579}.h{font-size:28px;font-weight:700}.n{font-size:22px}.small{font-size:20px}.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:21px}.panel{fill:#F8FBFE;stroke:#B8CADB;stroke-width:2}.blue{fill:#EAF3FF;stroke:#1557B0;stroke-width:2.5}.cyan{fill:#E8FAFB;stroke:#0E9AA7;stroke-width:2.5}.orange{fill:#FFF4E6;stroke:#E58A1F;stroke-width:2.5}.green{fill:#ECF8F1;stroke:#2E8B57;stroke-width:2.5}.red{fill:#FFF0F0;stroke:#C23B3B;stroke-width:2.5}.gray{fill:#F1F4F7;stroke:#7D8B99;stroke-width:2}.flow{fill:none;stroke:#1557B0;stroke-width:4;marker-end:url(#ab)}.comm{fill:none;stroke:#E58A1F;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#ao)}.good{fill:none;stroke:#2E8B57;stroke-width:4;marker-end:url(#ag)}.bad{fill:none;stroke:#C23B3B;stroke-width:4;marker-end:url(#ar)}</style></defs><rect width="1600" height="1100" fill="#fff"/><text x="70" y="72" class="title">FlashAttention-3 FP8：Block Quantization × Incoherent Processing</text>
<text x="70" y="112" class="sub">认知问题：FP8 的误差来自哪里？为什么缩小 scale 粒度后还需要 Hadamard-style mixing？</text>
<rect x="65" y="155" width="700" height="825" rx="24" class="panel"/><text x="100" y="205" class="h">1 · Block Quantization：scale 与执行 tile 对齐</text>
<g transform="translate(125,285)">
<rect x="0" y="0" width="78" height="58" rx="8" fill="#FFF4E6" stroke="#E58A1F" stroke-width="2"/><rect x="95" y="0" width="78" height="58" rx="8" fill="#EAF3FF" stroke="#B8CADB" stroke-width="2"/><rect x="190" y="0" width="78" height="58" rx="8" fill="#EAF3FF" stroke="#B8CADB" stroke-width="2"/><rect x="285" y="0" width="78" height="58" rx="8" fill="#E8FAFB" stroke="#B8CADB" stroke-width="2"/><rect x="380" y="0" width="78" height="58" rx="8" fill="#FFF4E6" stroke="#E58A1F" stroke-width="2"/><rect x="0" y="75" width="78" height="58" rx="8" fill="#EAF3FF" stroke="#B8CADB" stroke-width="2"/><rect x="95" y="75" width="78" height="58" rx="8" fill="#EAF3FF" stroke="#B8CADB" stroke-width="2"/><rect x="190" y="75" width="78" height="58" rx="8" fill="#E8FAFB" stroke="#B8CADB" stroke-width="2"/><rect x="285" y="75" width="78" height="58" rx="8" fill="#FFF4E6" stroke="#E58A1F" stroke-width="2"/><rect x="380" y="75" width="78" height="58" rx="8" fill="#EAF3FF" stroke="#B8CADB" stroke-width="2"/><rect x="0" y="150" width="78" height="58" rx="8" fill="#EAF3FF" stroke="#B8CADB" stroke-width="2"/><rect x="95" y="150" width="78" height="58" rx="8" fill="#E8FAFB" stroke="#B8CADB" stroke-width="2"/><rect x="190" y="150" width="78" height="58" rx="8" fill="#FFF4E6" stroke="#E58A1F" stroke-width="2"/><rect x="285" y="150" width="78" height="58" rx="8" fill="#EAF3FF" stroke="#B8CADB" stroke-width="2"/><rect x="380" y="150" width="78" height="58" rx="8" fill="#E8FAFB" stroke="#B8CADB" stroke-width="2"/><rect x="0" y="225" width="78" height="58" rx="8" fill="#E8FAFB" stroke="#B8CADB" stroke-width="2"/><rect x="95" y="225" width="78" height="58" rx="8" fill="#FFF4E6" stroke="#E58A1F" stroke-width="2"/><rect x="190" y="225" width="78" height="58" rx="8" fill="#EAF3FF" stroke="#B8CADB" stroke-width="2"/><rect x="285" y="225" width="78" height="58" rx="8" fill="#E8FAFB" stroke="#B8CADB" stroke-width="2"/><rect x="380" y="225" width="78" height="58" rx="8" fill="#EAF3FF" stroke="#B8CADB" stroke-width="2"/>
</g>
<text x="360" y="640" text-anchor="middle" class="mono">Q_i, K_j, V_j → each tile owns scale s_tile</text>
<rect x="125" y="700" width="580" height="160" rx="18" class="green"/><text x="415" y="744" text-anchor="middle" class="n">global dynamic range → local dynamic range</text><text x="415" y="786" text-anchor="middle" class="small">某些 tile 有 outlier，只扩大自己的 scale</text><text x="415" y="826" text-anchor="middle" class="small">其他 tiles 的量化分辨率不被拖累</text>

<rect x="835" y="155" width="700" height="825" rx="24" class="panel"/><text x="870" y="205" class="h">2 · Incoherent Processing：摊平 tile 内 outlier</text>
<text x="875" y="270" class="n">原始 feature energy 高度集中</text>
<g transform="translate(910,315)">
<rect x="0" y="186" width="38" height="24" rx="5" fill="#7DB8D8"/><rect x="65" y="174" width="38" height="36" rx="5" fill="#7DB8D8"/><rect x="130" y="180" width="38" height="30" rx="5" fill="#7DB8D8"/><rect x="195" y="20" width="38" height="190" rx="5" fill="#C23B3B"/><rect x="260" y="168" width="38" height="42" rx="5" fill="#7DB8D8"/><rect x="325" y="182" width="38" height="28" rx="5" fill="#7DB8D8"/><rect x="390" y="175" width="38" height="35" rx="5" fill="#7DB8D8"/><rect x="455" y="179" width="38" height="31" rx="5" fill="#7DB8D8"/>
<line x1="0" y1="212" x2="535" y2="212" stroke="#7D8B99" stroke-width="2"/>
</g>
<path d="M1175 560V625" class="flow"/>
<rect x="930" y="635" width="490" height="105" rx="18" class="cyan"/><text x="1175" y="678" text-anchor="middle" class="mono">Q' = QM , K' = KM , MMᵀ = I</text><text x="1175" y="714" text-anchor="middle" class="small">random sign + fast Hadamard-style mixing</text>
<path d="M1175 740V800" class="good"/>
<rect x="910" y="810" width="530" height="110" rx="18" class="green"/><text x="1175" y="850" text-anchor="middle" class="mono">(QM)(KM)ᵀ = QKᵀ</text><text x="1175" y="887" text-anchor="middle" class="small">score exact；误差只来自之后的 FP8 quantization</text>
<rect x="640" y="430" width="120" height="160" rx="18" class="orange"/><text x="700" y="478" text-anchor="middle" class="n">仍有</text><text x="700" y="515" text-anchor="middle" class="n">tile 内</text><text x="700" y="552" text-anchor="middle" class="n">outlier</text><path d="M765 510H835" class="comm"/>
<text x="800" y="1030" text-anchor="middle" class="n">两种机制解决不同层次：Block scale 控制“作用域”，Incoherent mixing 改变“坐标能量集中度”；二者可叠加。</text>
</svg>