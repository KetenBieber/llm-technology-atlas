<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect x="0" y="0" width="1600" height="1200" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="800.0" y="64" font-family="Georgia, Microsoft YaHei, serif" font-size="48" font-weight="700" fill="#103B63" text-anchor="middle">Scalable Muon：把矩阵梯度变成结构化更新</text><text x="800.0" y="108" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" fill="#60788D" text-anchor="middle">核心思想：对二维参数的更新方向做矩阵正交化，并解决尺度与分布式扩展问题</text><rect x="35" y="145" width="370" height="815" rx="22" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="35" y="145" width="370" height="58" rx="22" fill="#103B63"/><rect x="35" y="179" width="370" height="24" fill="#103B63"/><text x="59" y="184" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">为什么不是普通 Adam</text><circle cx="75" cy="225" r="24" fill="#0A9AA6"/><text x="75" y="234" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="115" y="233" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">对象是矩阵</text><text x="78" y="277" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="277" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">Muon 面向 2D weight</text><text x="102" y="305" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start"> matrix</text><text x="78" y="341" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="341" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">利用行/列几何结构</text><circle cx="75" cy="450" r="24" fill="#0A9AA6"/><text x="75" y="459" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="115" y="458" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">方向正交化</text><text x="78" y="502" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="502" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">把梯度矩阵投向近似正交方向</text><text x="78" y="538" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="538" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">抑制奇异值尺度差异</text><circle cx="75" cy="675" r="24" fill="#0A9AA6"/><text x="75" y="684" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="115" y="683" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">扩展难点</text><text x="78" y="727" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="727" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">不同 shape 的 update</text><text x="102" y="755" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start"> RMS</text><text x="78" y="791" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="791" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">以及 ZeRO/FSDP 分片语义</text><rect x="430" y="145" width="740" height="815" rx="22" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="430" y="145" width="740" height="58" rx="22" fill="#103B63"/><rect x="430" y="179" width="740" height="24" fill="#103B63"/><text x="454" y="184" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">Muon 更新流水</text><rect x="520" y="245" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="245" width="14" height="90" rx="7" fill="#1573B8"/><text x="555" y="280" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Gradient matrix G</text><text x="555" y="310" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">来自某个二维权重矩阵</text><line x1="800" y1="335" x2="800" y2="361" stroke="#1573B8" stroke-width="3"/><polygon points="800,361 786,353 786,369" fill="#1573B8"/><rect x="520" y="365" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="365" width="14" height="90" rx="7" fill="#0A9AA6"/><text x="555" y="400" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Momentum / EMA</text><text x="555" y="430" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">先积累平滑矩阵方向</text><line x1="800" y1="455" x2="800" y2="481" stroke="#1573B8" stroke-width="3"/><polygon points="800,481 786,473 786,489" fill="#1573B8"/><rect x="520" y="485" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="485" width="14" height="90" rx="7" fill="#56B99A"/><text x="555" y="520" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Newton–Schulz orthogonalization</text><text x="555" y="550" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">近似 polar factor，避免完整 SVD</text><line x1="800" y1="575" x2="800" y2="601" stroke="#1573B8" stroke-width="3"/><polygon points="800,601 786,593 786,609" fill="#1573B8"/><rect x="520" y="605" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="605" width="14" height="90" rx="7" fill="#F5B85A"/><text x="555" y="640" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Scale / RMS calibration</text><text x="555" y="670" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">让不同矩阵 shape 的更新尺度可比</text><line x1="800" y1="695" x2="800" y2="721" stroke="#1573B8" stroke-width="3"/><polygon points="800,721 786,713 786,729" fill="#1573B8"/><rect x="520" y="725" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="725" width="14" height="90" rx="7" fill="#1573B8"/><text x="555" y="760" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">W ← W − η·Update</text><text x="555" y="790" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">在大模型训练中与其他参数组优化器协同</text><rect x="1195" y="145" width="370" height="815" rx="22" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="1195" y="145" width="370" height="58" rx="22" fill="#103B63"/><rect x="1195" y="179" width="370" height="24" fill="#103B63"/><text x="1219" y="184" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">系统层约束</text><rect x="1220" y="225" width="320" height="185" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="1220" y="225" width="8" height="185" rx="4" fill="#0A9AA6"/><text x="1240" y="259" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1C3550" text-anchor="start">Polar geometry</text><text x="1240" y="293" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#60788D" text-anchor="start">更新关注矩阵方向，而非逐元素独立缩放</text><rect x="1220" y="430" width="320" height="185" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="1220" y="430" width="8" height="185" rx="4" fill="#1573B8"/><text x="1240" y="464" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1C3550" text-anchor="start">Scalable NS</text><text x="1240" y="498" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#60788D" text-anchor="start">少量矩阵乘迭代即可近似正交化</text><rect x="1220" y="635" width="320" height="185" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="1220" y="635" width="8" height="185" rx="4" fill="#56B99A"/><text x="1240" y="669" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1C3550" text-anchor="start">Distributed state</text><text x="1240" y="703" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#60788D" text-anchor="start">分片方式必须尊重矩阵整体运算，不能照搬 Adam ZeRO 直觉</text><rect x="500" y="870" width="600" height="70" rx="14" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="800" y="914" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#103B63" text-anchor="middle">G = UΣVᵀ  →  polar(G)=UVᵀ  ≈ Newton–Schulz(G)</text><rect x="35" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="81" cy="1070" r="28" fill="#E8F5FB"/><text x="81" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">◎</text><text x="123" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">目标：结构化矩阵更新</text><text x="123" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">利用二维权重的谱几何</text><rect x="550" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="596" cy="1070" r="28" fill="#E8F5FB"/><text x="596" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">⚙</text><text x="638" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">方法：正交化</text><text x="638" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">SVD 理论定义，Newton–Schulz 工程近似</text><rect x="1065" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="1111" cy="1070" r="28" fill="#E8F5FB"/><text x="1111" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">▥</text><text x="1153" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">难点：规模化</text><text x="1153" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">shape-scale calibration 与分布式状态布局</text></svg>