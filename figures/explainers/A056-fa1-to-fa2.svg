<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#202124}.t{font-size:34px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:20px}.s{font-size:17px;fill:#5f6368}.box{fill:#fff;stroke:#5f6368;stroke-width:2;rx:18}.sub{fill:#f8f9fa;stroke:#9aa0a6;stroke-width:2;rx:12}.arrow{stroke:#5f6368;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f6368"/></marker></defs>
<text x="55" y="58" class="t">FlashAttention-2：FA1 的 IO 问题解决后，下一层瓶颈变成 GPU 并行与通信</text>
<rect x="80" y="130" width="360" height="230" class="box"/><text x="115" y="175" class="h">FA1 已解决</text><text x="115" y="220" class="b">✓ 不 materialize N×N S/P</text><text x="115" y="258" class="b">✓ Online softmax</text><text x="115" y="296" class="b">✓ Backward recomputation</text><text x="115" y="334" class="s">但仅约 25–50% peak FLOPs/s</text>
<path d="M440 245H550" class="arrow"/>
<rect x="555" y="105" width="390" height="300" class="box"/><text x="590" y="150" class="h">FA2 三个新瓶颈</text><text x="590" y="200" class="b">① 非 matmul FLOPs 太贵</text><text x="590" y="245" class="b">② batch×heads 太小 → occupancy 低</text><text x="590" y="290" class="b">③ split-K → warp 间通信多</text><text x="590" y="335" class="s">A100: matmul peak ≫ FP32 non-matmul peak</text><text x="590" y="370" class="s">长序列时 batch 往往更小，问题更明显</text>
<path d="M945 245H1055" class="arrow"/>
<rect x="1060" y="105" width="365" height="300" class="box"/><text x="1095" y="150" class="h">FA2 对应改法</text><text x="1095" y="200" class="b">① fewer rescale / store LSE</text><text x="1095" y="245" class="b">② sequence parallelism</text><text x="1095" y="290" class="b">③ split-Q work partition</text><text x="1095" y="335" class="s">更多 independent thread blocks</text><text x="1095" y="370" class="s">减少 shared-memory synchronization</text>
<rect x="220" y="505" width="1060" height="130" class="sub"/><text x="265" y="550" class="h">优化层级迁移</text><text x="265" y="592" class="b">FA1：HBM ↔ SRAM 数据移动　→　FA2：SM occupancy / warp partition / non-matmul overhead</text><text x="265" y="623" class="s">同一 exact Attention 数学定义，性能瓶颈随着前一层优化被消除而向更低层转移。</text>
</svg>