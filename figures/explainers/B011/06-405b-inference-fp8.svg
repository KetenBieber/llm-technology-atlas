<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><desc>Llama 3 405B inference memory placement and selective FP8.</desc><defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B4F9C"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker>
<style>.t{font:700 43px Inter,'Microsoft YaHei',sans-serif;fill:#10243e}.s{font:400 22px Inter,'Microsoft YaHei',sans-serif;fill:#52647a}.h{font:700 29px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.n{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.x{font:400 20px Inter,'Microsoft YaHei',sans-serif;fill:#26384d}.m{font:600 20px Inter,'Microsoft YaHei',sans-serif;fill:#42556d}.mono{font:600 20px Consolas,monospace;fill:#18334f}.blue{fill:#EAF3FF;stroke:#0B4F9C;stroke-width:2.4}.cyan{fill:#E8FBFC;stroke:#0E9AA7;stroke-width:2.4}.gray{fill:#F3F6F9;stroke:#94A3B8;stroke-width:2}.orange{fill:#FFF5DF;stroke:#F59E0B;stroke-width:2.4}.green{fill:#ECF9F0;stroke:#16A34A;stroke-width:2.4}.red{fill:#FFF0F0;stroke:#DC2626;stroke-width:2.4}.f{fill:none;stroke:#0B4F9C;stroke-width:4;marker-end:url(#b)}.opt{fill:none;stroke:#16A34A;stroke-width:4;marker-end:url(#g)}.cost{fill:none;stroke:#F59E0B;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#o)}.d{stroke:#D9E2EC;stroke-width:2}</style></defs><rect width="1600" height="1100" fill="#fff"/><text x="65" y="70" class="t">Llama 3 · 405B Inference：为什么需要两节点 placement + selective FP8？</text><text x="65" y="106" class="s">对应 §35–§39｜回答：810GB BF16 权重、节点内 TP、节点间 PP 与 precision map 怎样共同满足 serving 约束</text>
<text x="65" y="160" class="h">Memory baseline：仅 raw BF16 weights 就超过单台 8×H100 的 HBM</text>
<rect x="90" y="205" width="300" height="140" rx="18" class="red"/><text x="115" y="245" class="n">405B × 2 bytes</text><text x="115" y="285" class="mono">≈ 810 GB raw weights</text><text x="115" y="320" class="x">还没算 KV cache / runtime buffers</text>
<path d="M390 275 H515" class="cost"/>
<rect x="515" y="205" width="300" height="140" rx="18" class="gray"/><text x="540" y="245" class="n">One 8×H100 node</text><text x="540" y="285" class="mono">8 × 80GB = 640GB</text><text x="540" y="320" class="x">raw BF16 model 已放不下</text>
<path d="M815 275 H940" class="opt"/>
<rect x="940" y="190" width="400" height="170" rx="18" class="green"/><text x="965" y="230" class="n">16 GPUs / 2 machines</text><text x="965" y="270" class="x">把 layer stages 分到两个节点</text><text x="965" y="305" class="x">节点内用 TP8，节点间用 PP boundary</text>
<line x1="65" y1="420" x2="1535" y2="420" class="d"/>
<text x="65" y="480" class="h">Placement：把高频 tensor collectives 留在节点内，把较低频 stage activation 跨节点发送</text>
<rect x="80" y="535" width="620" height="250" rx="20" fill="#F8FAFC" stroke="#0B4F9C" stroke-width="2"/><text x="110" y="575" class="n">Node A · TP8 · early layers</text>
<rect x="120" y="610" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="145" y="645" class="m">GPU 0</text><rect x="255" y="610" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="280" y="645" class="m">GPU 1</text><rect x="390" y="610" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="415" y="645" class="m">GPU 2</text><rect x="525" y="610" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="550" y="645" class="m">GPU 3</text><rect x="120" y="685" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="145" y="720" class="m">GPU 4</text><rect x="255" y="685" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="280" y="720" class="m">GPU 5</text><rect x="390" y="685" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="415" y="720" class="m">GPU 6</text><rect x="525" y="685" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="550" y="720" class="m">GPU 7</text>
<rect x="900" y="535" width="620" height="250" rx="20" fill="#F8FAFC" stroke="#0B4F9C" stroke-width="2"/><text x="930" y="575" class="n">Node B · TP8 · later layers</text>
<rect x="940" y="610" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="965" y="645" class="m">GPU 0</text><rect x="1075" y="610" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="1100" y="645" class="m">GPU 1</text><rect x="1210" y="610" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="1235" y="645" class="m">GPU 2</text><rect x="1345" y="610" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="1370" y="645" class="m">GPU 3</text><rect x="940" y="685" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="965" y="720" class="m">GPU 4</text><rect x="1075" y="685" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="1100" y="720" class="m">GPU 5</text><rect x="1210" y="685" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="1235" y="720" class="m">GPU 6</text><rect x="1345" y="685" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="1370" y="720" class="m">GPU 7</text>
<path d="M700 660 H900" class="cost"/><text x="742" y="635" class="m">PP activation</text>
<line x1="65" y1="840" x2="1535" y2="840" class="d"/>
<text x="65" y="900" class="h">Selective FP8：不是把所有矩阵与状态一键 cast 成 FP8</text>
<rect x="95" y="945" width="340" height="105" rx="18" class="blue"/><text x="120" y="985" class="n">Eligible GEMM paths</text><text x="120" y="1020" class="x">量化主 GEMM 降低 memory / compute</text>
<path d="M435 998 H560" class="opt"/>
<rect x="560" y="935" width="400" height="125" rx="18" class="green"/><text x="585" y="975" class="n">Higher-precision islands</text><text x="585" y="1015" class="x">敏感算子 / state 保留高精度</text>
<rect x="1080" y="935" width="405" height="125" rx="18" class="orange"/><text x="1105" y="975" class="n">Evaluation requirement</text><text x="1105" y="1015" class="x">平均指标稳定 ≠ 长尾数值一定安全</text>
</svg>