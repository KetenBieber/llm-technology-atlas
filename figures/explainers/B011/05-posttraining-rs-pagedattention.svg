<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><desc>Llama 3 rejection sampling with PagedAttention, reward model, SFT and DPO.</desc><defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B4F9C"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker>
<style>.t{font:700 43px Inter,'Microsoft YaHei',sans-serif;fill:#10243e}.s{font:400 22px Inter,'Microsoft YaHei',sans-serif;fill:#52647a}.h{font:700 29px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.n{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.x{font:400 20px Inter,'Microsoft YaHei',sans-serif;fill:#26384d}.m{font:600 20px Inter,'Microsoft YaHei',sans-serif;fill:#42556d}.mono{font:600 20px Consolas,monospace;fill:#18334f}.blue{fill:#EAF3FF;stroke:#0B4F9C;stroke-width:2.4}.cyan{fill:#E8FBFC;stroke:#0E9AA7;stroke-width:2.4}.gray{fill:#F3F6F9;stroke:#94A3B8;stroke-width:2}.orange{fill:#FFF5DF;stroke:#F59E0B;stroke-width:2.4}.green{fill:#ECF9F0;stroke:#16A34A;stroke-width:2.4}.red{fill:#FFF0F0;stroke:#DC2626;stroke-width:2.4}.f{fill:none;stroke:#0B4F9C;stroke-width:4;marker-end:url(#b)}.opt{fill:none;stroke:#16A34A;stroke-width:4;marker-end:url(#g)}.cost{fill:none;stroke:#F59E0B;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#o)}.d{stroke:#D9E2EC;stroke-width:2}</style></defs><rect width="1600" height="1100" fill="#fff"/><text x="65" y="70" class="t">Llama 3 · Rejection Sampling 为什么依赖 serving infrastructure？</text><text x="65" y="106" class="s">对应 §24–§32｜RM → K-way sampling → selection → SFT → DPO 的六轮 flywheel 怎样依赖高吞吐生成</text>
<text x="65" y="155" class="h">一轮数据飞轮：先生成候选，再把低概率优质行为转回监督 / preference data</text>
<rect x="70" y="205" width="245" height="125" rx="18" class="gray"/><text x="95" y="245" class="n">Prompt x</text><text x="95" y="283" class="x">human + synthetic task pool</text>
<path d="M315 268 H405" class="f"/>
<rect x="405" y="190" width="300" height="155" rx="18" class="blue"/><text x="430" y="230" class="n">Current policy</text><text x="430" y="270" class="x">每个 prompt 采样 K=10–30</text><text x="430" y="305" class="x">共享相同 prompt prefix</text>
<path d="M705 268 H800" class="f"/>
<g><rect x="800" y="180" width="215" height="70" rx="13" class="cyan"/><text x="825" y="224" class="x">candidate y₁</text><rect x="800" y="265" width="215" height="70" rx="13" class="cyan"/><text x="825" y="309" class="x">candidate y₂</text><rect x="800" y="350" width="215" height="70" rx="13" class="cyan"/><text x="825" y="394" class="x">… y_K</text></g>
<path d="M1015 300 H1110" class="f"/>
<rect x="1110" y="225" width="250" height="150" rx="18" class="orange"/><text x="1135" y="265" class="n">Reward Model</text><text x="1135" y="305" class="x">ranking / quality score</text><text x="1135" y="340" class="x">RM ≠ PPO Critic</text>
<path d="M1360 300 H1445" class="opt"/><rect x="1445" y="245" width="90" height="110" rx="16" class="green"/><text x="1468" y="290" class="n">Best</text><text x="1465" y="325" class="x">select</text>
<text x="65" y="490" class="h">PagedAttention 的角色：K 条 candidate 共享同一 prompt KV pages，减少重复 prefix storage / compute</text>
<rect x="95" y="545" width="330" height="135" rx="18" class="red"/><text x="120" y="585" class="n">Naive RS</text><text x="120" y="625" class="x">每条 candidate 各存 prefix KV</text><text x="120" y="660" class="x">K 越大，duplication 越重</text>
<path d="M425 612 H540" class="opt"/>
<rect x="540" y="530" width="520" height="165" rx="18" class="green"/><text x="565" y="570" class="n">PagedAttention shared prefix</text>
<rect x="575" y="605" width="190" height="45" rx="9" fill="#BFE2FF"/><text x="605" y="635" class="m">shared prompt pages</text>
<rect x="790" y="590" width="85" height="35" rx="8" fill="#DDF6E5"/><rect x="790" y="635" width="85" height="35" rx="8" fill="#DDF6E5"/><rect x="895" y="590" width="85" height="35" rx="8" fill="#DDF6E5"/><rect x="895" y="635" width="85" height="35" rx="8" fill="#DDF6E5"/>
<text x="785" y="685" class="m">private continuation pages</text>
<rect x="1130" y="545" width="355" height="135" rx="18" class="blue"/><text x="1155" y="585" class="n">System evidence</text><text x="1155" y="625" class="x">论文报告 RS throughput &gt;2×</text><text x="1155" y="660" class="x">serving primitive → training infra</text>
<line x1="65" y1="750" x2="1535" y2="750" class="d"/>
<text x="65" y="810" class="h">Selected responses 如何进入优化：SFT 固化行为，DPO 再拉开 chosen / rejected 概率</text>
<rect x="95" y="865" width="300" height="120" rx="18" class="green"/><text x="120" y="905" class="n">Selected high-quality y</text><text x="120" y="945" class="x">Rejection Sampling output</text>
<path d="M395 925 H500" class="f"/><rect x="500" y="855" width="250" height="140" rx="18" class="blue"/><text x="525" y="895" class="n">SFT</text><text x="525" y="935" class="x">teacher-force selected y</text><text x="525" y="970" class="x">更新 current policy</text>
<path d="M750 925 H855" class="f"/><rect x="855" y="855" width="280" height="140" rx="18" class="orange"/><text x="880" y="895" class="n">DPO</text><text x="880" y="935" class="x">chosen vs rejected pair</text><text x="880" y="970" class="x">+ chosen NLL regularization</text>
<path d="M1135 925 H1240" class="opt"/><rect x="1240" y="865" width="245" height="120" rx="18" class="green"/><text x="1265" y="905" class="n">Next round</text><text x="1265" y="945" class="x">repeat × 6 rounds</text>
</svg>