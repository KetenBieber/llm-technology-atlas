<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><desc>Llama 3 4D parallelism mapped to node topology and recovery path.</desc><defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B4F9C"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker>
<style>.t{font:700 43px Inter,'Microsoft YaHei',sans-serif;fill:#10243e}.s{font:400 22px Inter,'Microsoft YaHei',sans-serif;fill:#52647a}.h{font:700 29px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.n{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.x{font:400 20px Inter,'Microsoft YaHei',sans-serif;fill:#26384d}.m{font:600 20px Inter,'Microsoft YaHei',sans-serif;fill:#42556d}.mono{font:600 20px Consolas,monospace;fill:#18334f}.blue{fill:#EAF3FF;stroke:#0B4F9C;stroke-width:2.4}.cyan{fill:#E8FBFC;stroke:#0E9AA7;stroke-width:2.4}.gray{fill:#F3F6F9;stroke:#94A3B8;stroke-width:2}.orange{fill:#FFF5DF;stroke:#F59E0B;stroke-width:2.4}.green{fill:#ECF9F0;stroke:#16A34A;stroke-width:2.4}.red{fill:#FFF0F0;stroke:#DC2626;stroke-width:2.4}.f{fill:none;stroke:#0B4F9C;stroke-width:4;marker-end:url(#b)}.opt{fill:none;stroke:#16A34A;stroke-width:4;marker-end:url(#g)}.cost{fill:none;stroke:#F59E0B;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#o)}.d{stroke:#D9E2EC;stroke-width:2}</style></defs><rect width="1600" height="1100" fill="#fff"/><text x="65" y="70" class="t">Llama 3 · 4D Parallelism：16K GPU 训练时到底沿哪四个维度切？</text><text x="65" y="106" class="s">对应 §18–§23｜回答：TP / CP / PP / FSDP 分别切什么，通信为什么必须跟物理拓扑一起设计</text>
<text x="65" y="155" class="h">一个训练 batch 同时存在四个可切分维度</text>
<rect x="80" y="205" width="300" height="125" rx="18" class="gray"/><text x="105" y="245" class="n">Global tensor state</text><text x="105" y="285" class="mono">[B, T, H, layers]</text>
<path d="M380 268 H470" class="f"/>
<g>
<rect x="470" y="180" width="250" height="160" rx="18" class="blue"/><text x="495" y="220" class="n">TP · hidden / heads</text><text x="495" y="260" class="x">单层矩阵切到多 GPU</text><text x="495" y="300" class="x">高频 collective</text>
<rect x="745" y="180" width="250" height="160" rx="18" class="cyan"/><text x="770" y="220" class="n">CP · sequence</text><text x="770" y="260" class="x">128K token 维切分</text><text x="770" y="300" class="x">Attention 跨 shard 通信</text>
<rect x="1020" y="180" width="250" height="160" rx="18" class="orange"/><text x="1045" y="220" class="n">PP · layers</text><text x="1045" y="260" class="x">layer stages 跨设备</text><text x="1045" y="300" class="x">activation send / recv</text>
<rect x="1295" y="180" width="240" height="160" rx="18" class="green"/><text x="1320" y="220" class="n">FSDP · params</text><text x="1320" y="260" class="x">data-parallel ranks 分片</text><text x="1320" y="300" class="x">all-gather / reduce-scatter</text>
</g>
<line x1="65" y1="405" x2="1535" y2="405" class="d"/>
<text x="65" y="465" class="h">Topology-aware placement：高频通信留在快链路，粗粒度 stage 边界跨节点</text>
<rect x="90" y="520" width="620" height="250" rx="20" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
<text x="115" y="558" class="n">Node A · 8 GPUs · fast intra-node fabric</text>
<g><rect x="125" y="590" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="150" y="625" class="m">GPU 0</text><rect x="260" y="590" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="285" y="625" class="m">GPU 1</text><rect x="395" y="590" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="420" y="625" class="m">GPU 2</text><rect x="530" y="590" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="555" y="625" class="m">GPU 3</text><rect x="125" y="665" width="110" height="55" rx="10" fill="#E8FBFC" stroke="#0B4F9C"/><text x="150" y="700" class="m">GPU 4</text><rect x="260" y="665" width="110" height="55" rx="10" fill="#E8FBFC" stroke="#0B4F9C"/><text x="285" y="700" class="m">GPU 5</text><rect x="395" y="665" width="110" height="55" rx="10" fill="#E8FBFC" stroke="#0B4F9C"/><text x="420" y="700" class="m">GPU 6</text><rect x="530" y="665" width="110" height="55" rx="10" fill="#E8FBFC" stroke="#0B4F9C"/><text x="555" y="700" class="m">GPU 7</text></g>
<rect x="890" y="520" width="620" height="250" rx="20" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
<text x="915" y="558" class="n">Node B · next PP stage</text>
<g><rect x="925" y="590" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="950" y="625" class="m">GPU 0</text><rect x="1060" y="590" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="1085" y="625" class="m">GPU 1</text><rect x="1195" y="590" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="1220" y="625" class="m">GPU 2</text><rect x="1330" y="590" width="110" height="55" rx="10" fill="#EAF3FF" stroke="#0B4F9C"/><text x="1355" y="625" class="m">GPU 3</text><rect x="925" y="665" width="110" height="55" rx="10" fill="#E8FBFC" stroke="#0B4F9C"/><text x="950" y="700" class="m">GPU 4</text><rect x="1060" y="665" width="110" height="55" rx="10" fill="#E8FBFC" stroke="#0B4F9C"/><text x="1085" y="700" class="m">GPU 5</text><rect x="1195" y="665" width="110" height="55" rx="10" fill="#E8FBFC" stroke="#0B4F9C"/><text x="1220" y="700" class="m">GPU 6</text><rect x="1330" y="665" width="110" height="55" rx="10" fill="#E8FBFC" stroke="#0B4F9C"/><text x="1355" y="700" class="m">GPU 7</text></g>
<path d="M710 645 H890" class="cost"/><text x="735" y="620" class="m">PP activation</text>
<path d="M180 745 C260 790 480 790 560 745" class="f"/><text x="290" y="815" class="m">TP / CP collectives stay local when possible</text>
<line x1="65" y1="855" x2="1535" y2="855" class="d"/>
<text x="65" y="910" class="h">Reliability 是训练图的一部分：16K GPU 下 failure 必须走正常恢复路径</text>
<rect x="105" y="950" width="260" height="95" rx="16" class="blue"/><text x="135" y="1005" class="n">Train step</text>
<path d="M365 998 H500" class="f"/><rect x="500" y="950" width="280" height="95" rx="16" class="red"/><text x="530" y="990" class="n">Fault / interruption</text><text x="530" y="1022" class="x">detect + isolate</text>
<path d="M780 998 H915" class="opt"/><rect x="915" y="950" width="300" height="95" rx="16" class="green"/><text x="945" y="990" class="n">Checkpoint / recover</text><text x="945" y="1022" class="x">自动重启并继续同步训练</text>
<path d="M1215 998 H1350" class="opt"/><text x="1360" y="1005" class="n">resume</text>
</svg>