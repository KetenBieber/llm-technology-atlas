<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<defs>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1d4ed8"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker>
  <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#0f172a}
    .title{font-size:48px;font-weight:700}.sub{font-size:22px;fill:#475569}
    .sec{font-size:28px;font-weight:700}.lab{font-size:23px;font-weight:700}.body{font-size:20px;fill:#334155}
    .mono{font-size:20px;font-family:Consolas,"SFMono-Regular",monospace}.evi{font-size:20px;font-weight:700}
    .box{rx:18;ry:18;stroke-width:2.2}.thin{stroke-width:2;fill:none}.flow{stroke:#1d4ed8;stroke-width:4;fill:none;marker-end:url(#arrB)}
    .good{stroke:#16a34a;stroke-width:4;fill:none;marker-end:url(#arrG)}.cost{stroke:#ea580c;stroke-width:3.5;fill:none;marker-end:url(#arrO)}
  </style>
</defs>
<rect width="1800" height="1200" fill="#ffffff"/>
<text x="80" y="78" class="title">Llama 3：强模型不是一个 block，而是一条完整生产链</text>
<text x="80" y="116" class="sub">核心问题：相对标准的 Dense Transformer，如何通过 data → scale → systems → post-training → serving 被推到 405B / 128K？</text>

<!-- baseline architecture -->
<rect x="80" y="160" width="310" height="250" class="box" fill="#f8fafc" stroke="#94a3b8"/>
<text x="110" y="202" class="sec" fill="#475569">成熟骨干 · Baseline</text>
<rect x="120" y="232" width="230" height="52" class="box" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="235" y="265" text-anchor="middle" class="lab">RMSNorm → GQA</text>
<rect x="120" y="300" width="230" height="52" class="box" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="235" y="333" text-anchor="middle" class="lab">SwiGLU FFN</text>
<text x="110" y="385" class="body">创新重点不在新 block</text>

<!-- data/scale lane -->
<text x="440" y="170" class="sec" fill="#1d4ed8">① Data &amp; Scale：先设计训练分布，再设计旗舰规模</text>
<rect x="440" y="205" width="190" height="100" class="box" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="535" y="242" text-anchor="middle" class="lab">Raw corpus</text><text x="535" y="273" text-anchor="middle" class="body">web / code / math</text>
<rect x="690" y="205" width="210" height="100" class="box" fill="#ecfeff" stroke="#0891b2"/>
<text x="795" y="242" text-anchor="middle" class="lab">清洗 + 去重 + 过滤</text><text x="795" y="273" text-anchor="middle" class="body">model-based filter</text>
<rect x="960" y="205" width="190" height="100" class="box" fill="#ecfeff" stroke="#0891b2"/>
<text x="1055" y="242" text-anchor="middle" class="lab">Data mix</text><text x="1055" y="273" text-anchor="middle" class="body">能力分布被主动重写</text>
<rect x="1210" y="205" width="190" height="100" class="box" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="1305" y="242" text-anchor="middle" class="lab">128K tokenizer</text><text x="1305" y="273" text-anchor="middle" class="body">更少 token / 语义量</text>
<rect x="1460" y="205" width="250" height="100" class="box" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="1585" y="242" text-anchor="middle" class="lab">Scaling experiments</text><text x="1585" y="273" text-anchor="middle" class="body">小模型 → 405B 设计区</text>
<path d="M630 255H680" class="flow"/><path d="M900 255H950" class="flow"/><path d="M1150 255H1200" class="flow"/><path d="M1400 255H1450" class="flow"/>

<!-- pretraining path -->
<rect x="440" y="345" width="300" height="120" class="box" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="590" y="383" text-anchor="middle" class="lab">Main pre-training</text><text x="590" y="416" text-anchor="middle" class="body">约 15.6T tokens · 4K→8K</text><text x="590" y="447" text-anchor="middle" class="body">AdamW · phase-dependent batch</text>
<rect x="820" y="345" width="320" height="120" class="box" fill="#ecfdf5" stroke="#16a34a"/>
<text x="980" y="383" text-anchor="middle" class="lab">Long-context continued PT</text><text x="980" y="416" text-anchor="middle" class="body">6 stages · 8K → 128K</text><text x="980" y="447" text-anchor="middle" class="body">约 800B tokens · short recovery gate</text>
<rect x="1220" y="345" width="220" height="120" class="box" fill="#ecfdf5" stroke="#16a34a"/>
<text x="1330" y="383" text-anchor="middle" class="lab">Annealing</text><text x="1330" y="416" text-anchor="middle" class="body">LR → 0</text><text x="1330" y="447" text-anchor="middle" class="body">checkpoint averaging</text>
<rect x="1510" y="345" width="200" height="120" class="box" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="1610" y="390" text-anchor="middle" class="lab">Llama 3 Base</text><text x="1610" y="425" text-anchor="middle" class="body">8B / 70B / 405B</text>
<path d="M740 405H810" class="flow"/><path d="M1140 405H1210" class="good"/><path d="M1440 405H1500" class="good"/>
<path d="M1585 305V330H590V338" class="flow"/>

<!-- post-training lane -->
<text x="80" y="540" class="sec" fill="#16a34a">② Post-training：把“偶尔会做好”转成高概率 assistant 行为</text>
<rect x="80" y="575" width="210" height="110" class="box" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="185" y="612" text-anchor="middle" class="lab">Current policy</text><text x="185" y="644" text-anchor="middle" class="body">同一 prompt 多次采样</text>
<rect x="350" y="575" width="220" height="110" class="box" fill="#fff7ed" stroke="#ea580c"/>
<text x="460" y="612" text-anchor="middle" class="lab">Reward Model</text><text x="460" y="644" text-anchor="middle" class="body">对候选 response 排序</text>
<rect x="630" y="575" width="220" height="110" class="box" fill="#ecfdf5" stroke="#16a34a"/>
<text x="740" y="612" text-anchor="middle" class="lab">Rejection Sampling</text><text x="740" y="644" text-anchor="middle" class="body">K=10–30 → 选高质量</text>
<rect x="910" y="575" width="190" height="110" class="box" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="1005" y="612" text-anchor="middle" class="lab">SFT</text><text x="1005" y="644" text-anchor="middle" class="body">模仿优质轨迹</text>
<rect x="1160" y="575" width="190" height="110" class="box" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="1255" y="612" text-anchor="middle" class="lab">DPO</text><text x="1255" y="644" text-anchor="middle" class="body">chosen / rejected</text>
<rect x="1410" y="575" width="300" height="110" class="box" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="1560" y="612" text-anchor="middle" class="lab">Llama 3 Instruct</text><text x="1560" y="644" text-anchor="middle" class="body">six-round data flywheel</text>
<path d="M290 630H340" class="flow"/><path d="M570 630H620" class="cost"/><path d="M850 630H900" class="good"/><path d="M1100 630H1150" class="flow"/><path d="M1350 630H1400" class="flow"/>
<path d="M1510 465V520H185V565" class="flow"/>

<!-- serving lane -->
<text x="80" y="770" class="sec" fill="#0891b2">③ Serving：模型能力还要穿过 memory / precision / topology 才能变成可用系统</text>
<rect x="80" y="810" width="300" height="125" class="box" fill="#ecfeff" stroke="#0891b2"/>
<text x="230" y="850" text-anchor="middle" class="lab">405B BF16 weights</text><text x="230" y="884" text-anchor="middle" class="body">单机 8×H100 无法容纳 raw weights</text>
<rect x="450" y="810" width="300" height="125" class="box" fill="#fff7ed" stroke="#ea580c"/>
<text x="600" y="850" text-anchor="middle" class="lab">Multi-node runtime</text><text x="600" y="884" text-anchor="middle" class="body">节点内 / 节点间并行成本不同</text>
<rect x="820" y="810" width="300" height="125" class="box" fill="#ecfdf5" stroke="#16a34a"/>
<text x="970" y="850" text-anchor="middle" class="lab">Selective FP8</text><text x="970" y="884" text-anchor="middle" class="body">FFN 为主；边界层保高精度</text>
<rect x="1190" y="810" width="520" height="125" class="box" fill="#f8fafc" stroke="#64748b"/>
<text x="1450" y="848" text-anchor="middle" class="lab">鲁棒性评估 ≠ 只看平均 benchmark</text>
<text x="1450" y="882" text-anchor="middle" class="body">比较 100,000 条 BF16 / FP8 response 的 reward 分布尾部</text>
<path d="M380 872H440" class="cost"/><path d="M750 872H810" class="good"/><path d="M1120 872H1180" class="flow"/>
<path d="M1560 685V755H230V800" class="flow"/>

<!-- evidence/formula -->
<rect x="80" y="1000" width="1100" height="120" class="box" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="110" y="1038" class="lab">系统级定义</text>
<text x="110" y="1082" class="mono">Model System = Architecture + Data + Training Recipe + Distributed Runtime + Post-training + Inference Runtime</text>
<rect x="1230" y="1000" width="480" height="120" class="box" fill="#fff7ed" stroke="#ea580c"/>
<text x="1260" y="1038" class="lab" fill="#9a3412">论文量级证据</text>
<text x="1260" y="1075" class="evi">405B · ≈15.6T tokens · 3.8×10²⁵ FLOPs</text>
<text x="1260" y="1105" class="body">训练峰值约 16K H100；128K context</text>
</svg>