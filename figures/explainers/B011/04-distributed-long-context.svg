<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<defs>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1d4ed8"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#0f172a}
    .title{font-size:48px;font-weight:700}.sub{font-size:22px;fill:#475569}.sec{font-size:28px;font-weight:700}
    .lab{font-size:23px;font-weight:700}.body{font-size:20px;fill:#334155}.mono{font-size:21px;font-family:Consolas,monospace}.num{font-size:27px;font-weight:700}
    .box{rx:18;ry:18;stroke-width:2.2}.flow{stroke:#1d4ed8;stroke-width:4;fill:none;marker-end:url(#b)}
    .good{stroke:#16a34a;stroke-width:4;fill:none;marker-end:url(#g)}.cost{stroke:#ea580c;stroke-width:3.5;fill:none;marker-end:url(#o)}
    .dash{stroke:#ea580c;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#o)}
  </style>
</defs>
<rect width="1800" height="1200" fill="#fff"/>
<text x="80" y="78" class="title">Llama 3：128K context 为什么会重写 16K GPU 的并行分配？</text>
<text x="80" y="116" class="sub">核心问题：sequence 变长后，瓶颈从 data replicas 转向单样本 context；于是 GPU 从 DP 被重新分配给 CP。</text>

<!-- context growth -->
<text x="80" y="175" class="sec" fill="#1d4ed8">① 长度变化先改变 Attention 工作量</text>
<rect x="80" y="215" width="260" height="115" class="box" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="210" y="255" text-anchor="middle" class="lab">Main PT</text><text x="210" y="290" text-anchor="middle" class="num">8K context</text>
<rect x="430" y="215" width="330" height="115" class="box" fill="#ecfdf5" stroke="#16a34a"/>
<text x="595" y="252" text-anchor="middle" class="lab">6-stage continued PT</text><text x="595" y="288" text-anchor="middle" class="body">每阶段先恢复 short eval + needle test</text>
<rect x="850" y="215" width="260" height="115" class="box" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="980" y="255" text-anchor="middle" class="lab">Target</text><text x="980" y="290" text-anchor="middle" class="num">128K context</text>
<path d="M340 272H420" class="good"/><path d="M760 272H840" class="good"/>
<rect x="1190" y="205" width="530" height="135" class="box" fill="#fff7ed" stroke="#ea580c"/>
<text x="1220" y="245" class="lab">Attention score shape：QKᵀ ∈ ℝᴸˣᴸ</text>
<text x="1220" y="282" class="body">L：8K → 128K = 16×</text>
<text x="1220" y="316" class="num" fill="#9a3412">仅 L² interaction 量级变化：16² = 256×</text>

<!-- decomposition compare -->
<text x="80" y="420" class="sec" fill="#1d4ed8">② 同样 16,384 GPUs，不同 context 需要不同 4D decomposition</text>

<!-- 8K side -->
<rect x="80" y="460" width="760" height="390" class="box" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="115" y="505" class="lab">8K context · 16,384 GPUs</text>
<text x="115" y="545" class="mono">TP=8 × CP=1 × PP=16 × DP=128 = 16,384</text>
<text x="115" y="592" class="body">单个 sample 的 sequence 不需要切分 → CP=1</text>
<!-- sequence -->
<text x="115" y="640" class="body">sequence shard</text>
<rect x="270" y="610" width="500" height="55" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
<text x="520" y="645" text-anchor="middle" class="lab">8K · one context shard</text>
<!-- axis bars -->
<text x="115" y="718" class="body">GPU budget 去向</text>
<rect x="270" y="690" width="80" height="50" rx="10" fill="#1d4ed8"/><text x="310" y="723" text-anchor="middle" class="body" fill="#fff">TP 8</text>
<rect x="360" y="690" width="42" height="50" rx="10" fill="#0891b2"/><text x="381" y="723" text-anchor="middle" class="body" fill="#fff">CP1</text>
<rect x="412" y="690" width="110" height="50" rx="10" fill="#64748b"/><text x="467" y="723" text-anchor="middle" class="body" fill="#fff">PP16</text>
<rect x="532" y="690" width="238" height="50" rx="10" fill="#16a34a"/><text x="651" y="723" text-anchor="middle" class="body" fill="#fff">DP128</text>
<text x="115" y="800" class="body">BF16 MFU（论文报告）</text><text x="430" y="804" class="num" fill="#166534">≈41%</text>

<!-- 128K side -->
<rect x="900" y="460" width="820" height="390" class="box" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="935" y="505" class="lab">128K context · 16,384 GPUs</text>
<text x="935" y="545" class="mono">TP=8 × CP=16 × PP=16 × DP=8 = 16,384</text>
<text x="935" y="592" class="body">单个 sample 的 activation / attention state 变成瓶颈 → CP=16</text>
<text x="935" y="640" class="body">128K sequence → 16 context shards</text>
<g stroke="#0891b2" stroke-width="1.8">
<rect x="1160" y="610" width="27" height="55" rx="5" fill="#cffafe"/><rect x="1191" y="610" width="27" height="55" rx="5" fill="#a5f3fc"/><rect x="1222" y="610" width="27" height="55" rx="5" fill="#cffafe"/><rect x="1253" y="610" width="27" height="55" rx="5" fill="#a5f3fc"/><rect x="1284" y="610" width="27" height="55" rx="5" fill="#cffafe"/><rect x="1315" y="610" width="27" height="55" rx="5" fill="#a5f3fc"/><rect x="1346" y="610" width="27" height="55" rx="5" fill="#cffafe"/><rect x="1377" y="610" width="27" height="55" rx="5" fill="#a5f3fc"/><rect x="1408" y="610" width="27" height="55" rx="5" fill="#cffafe"/><rect x="1439" y="610" width="27" height="55" rx="5" fill="#a5f3fc"/><rect x="1470" y="610" width="27" height="55" rx="5" fill="#cffafe"/><rect x="1501" y="610" width="27" height="55" rx="5" fill="#a5f3fc"/><rect x="1532" y="610" width="27" height="55" rx="5" fill="#cffafe"/><rect x="1563" y="610" width="27" height="55" rx="5" fill="#a5f3fc"/><rect x="1594" y="610" width="27" height="55" rx="5" fill="#cffafe"/><rect x="1625" y="610" width="27" height="55" rx="5" fill="#a5f3fc"/>
</g>
<text x="935" y="718" class="body">GPU budget 去向</text>
<rect x="1160" y="690" width="80" height="50" rx="10" fill="#1d4ed8"/><text x="1200" y="723" text-anchor="middle" class="body" fill="#fff">TP 8</text>
<rect x="1250" y="690" width="150" height="50" rx="10" fill="#0891b2"/><text x="1325" y="723" text-anchor="middle" class="body" fill="#fff">CP16</text>
<rect x="1410" y="690" width="110" height="50" rx="10" fill="#64748b"/><text x="1465" y="723" text-anchor="middle" class="body" fill="#fff">PP16</text>
<rect x="1530" y="690" width="80" height="50" rx="10" fill="#16a34a"/><text x="1570" y="723" text-anchor="middle" class="body" fill="#fff">DP8</text>
<text x="935" y="800" class="body">BF16 MFU（论文报告）</text><text x="1250" y="804" class="num" fill="#9a3412">≈38%</text>
<path d="M840 655H890" class="cost"/><text x="865" y="635" text-anchor="middle" class="body" fill="#9a3412">workload shift</text>

<!-- physical topology -->
<text x="80" y="915" class="sec" fill="#ea580c">③ 逻辑并行还必须映射到物理网络</text>
<rect x="80" y="950" width="1020" height="180" class="box" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="115" y="990" class="lab">RoCE 400 Gbps · 三层 Clos</text>
<rect x="120" y="1020" width="210" height="65" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="225" y="1060" text-anchor="middle" class="body">Pod A · full bisection</text>
<rect x="420" y="1020" width="210" height="65" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="525" y="1060" text-anchor="middle" class="body">Pod B · full bisection</text>
<rect x="720" y="1020" width="210" height="65" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="825" y="1060" text-anchor="middle" class="body">Pod C · full bisection</text>
<path d="M330 1052H410M630 1052H710" class="dash"/>
<text x="525" y="1115" text-anchor="middle" class="body" fill="#9a3412">aggregation layer ≈ 1:7 oversubscription → communication pattern 决定 group placement</text>

<rect x="1160" y="950" width="560" height="180" class="box" fill="#fff7ed" stroke="#ea580c"/>
<text x="1195" y="993" class="lab">四个轴解决四类“放不下”</text>
<text x="1195" y="1032" class="body">TP：单层矩阵 · PP：layer stack</text>
<text x="1195" y="1068" class="body">CP：长 sequence · FSDP/DP：model/grad/optimizer state</text>
<text x="1195" y="1105" class="body">结论：parallel strategy 必须随 workload shape 改变</text>
</svg>