<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
<rect width="1400" height="860" fill="white"/>
<text x="700" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700">4D Parallelism：四个维度分别切什么？</text>
<text x="700" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="21">同一个训练任务同时沿 batch / hidden / layer depth / sequence 四个正交方向拆分</text>
<rect x="70" y="145" width="1260" height="130" rx="18" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
<text x="105" y="188" font-family="Arial" font-size="27" font-weight="700">DP / FSDP</text>
<text x="315" y="188" font-family="Arial" font-size="23">切 batch / data replicas</text>
<text x="315" y="228" font-family="Arial" font-size="20">不同 replica 处理不同样本；FSDP 再把每个 replica 对应 rank 的参数/梯度/优化器状态分片</text>

<rect x="70" y="300" width="1260" height="130" rx="18" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
<text x="105" y="343" font-family="Arial" font-size="27" font-weight="700">TP</text>
<text x="315" y="343" font-family="Arial" font-size="23">切 layer 内 tensor / hidden / heads</text>
<text x="315" y="383" font-family="Arial" font-size="20">同一个 Transformer layer 由多个 GPU 协同完成；通信频繁，适合高速 NVLink/NVSwitch 域</text>

<rect x="70" y="455" width="1260" height="130" rx="18" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
<text x="105" y="498" font-family="Arial" font-size="27" font-weight="700">PP</text>
<text x="315" y="498" font-family="Arial" font-size="23">切 layer depth</text>
<text x="315" y="538" font-family="Arial" font-size="20">不同 stage 持有不同连续层；通过 microbatch 流水化，代价是 bubble 与 stage 间 activation 传输</text>

<rect x="70" y="610" width="1260" height="130" rx="18" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
<text x="105" y="653" font-family="Arial" font-size="27" font-weight="700">CP</text>
<text x="315" y="653" font-family="Arial" font-size="23">切 sequence / context</text>
<text x="315" y="693" font-family="Arial" font-size="20">每个 GPU 只保存部分 token activation；Attention 通过 KV 交换让局部 Q 看到完整上下文</text>

<rect x="315" y="775" width="770" height="58" rx="14" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="700" y="814" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">N_GPU = t × c × p × d</text>
</svg>