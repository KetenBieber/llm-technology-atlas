<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><defs><style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#14213d}.title{font-size:48px;font-weight:700}.sub{font-size:24px;fill:#607086}.h{font-size:29px;font-weight:700}.n{font-size:24px;font-weight:650}.b{font-size:21px}.s{font-size:20px;fill:#607086}.formula{font-family:"STIX Two Math","Cambria Math",serif;font-size:23px}
.box{fill:#f8fbff;stroke:#8fb6d9;stroke-width:2}.state{fill:#ecfbfc;stroke:#3ba9b3;stroke-width:2}.gray{fill:#f4f6f8;stroke:#aab6c3;stroke-width:2}.warn{fill:#fff2f1;stroke:#cf5c57;stroke-width:2}.good{fill:#eef9f2;stroke:#4ca267;stroke-width:2}.cost{fill:#fff7e9;stroke:#df942c;stroke-width:2}
.blue{stroke:#246aa5;stroke-width:5;fill:none}.cyan{stroke:#2599a6;stroke-width:4;fill:none}.green{stroke:#3d995c;stroke-width:5;fill:none}.orange{stroke:#d9871c;stroke-width:4;fill:none}.red{stroke:#c8504b;stroke-width:5;fill:none}.dash{stroke-dasharray:12 10}
</style><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246aa5"/></marker><marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2599a6"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d995c"/></marker><marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9871c"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8504b"/></marker></defs><rect width="1600" height="1200" fill="#fff"/><text x="70" y="75" class="title">A003 · 预条件器几何：各向异性 L2 vs 统一 weight decay</text><text x="72" y="115" class="sub">只改变一个条件：当 Mₜ 不是 kI 时，SGD 中的等价为什么必然失效？</text>
<rect x="60" y="170" width="700" height="710" rx="28" class="gray"/><text x="95" y="220" class="h">Coupled L2 after adaptive preconditioning</text>
<line x1="170" y1="735" x2="650" y2="735" stroke="#94a0ad" stroke-width="3"/><line x1="170" y1="735" x2="170" y2="300" stroke="#94a0ad" stroke-width="3"/>
<circle cx="400" cy="520" r="165" fill="none" stroke="#b8c2cd" stroke-width="2" stroke-dasharray="10 8"/>
<ellipse cx="400" cy="520" rx="205" ry="72" transform="rotate(-20 400 520)" fill="none" stroke="#c8504b" stroke-width="5"/>
<circle cx="520" cy="410" r="12" fill="#14213d"/><text x="545" y="405" class="n">θ</text>
<path d="M520 410 L430 500" class="red" marker-end="url(#ar)"/><text x="500" y="485" class="b">−αλ′Mₜθ</text>
<text x="115" y="805" class="formula">Mₜ = diag(s₁,s₂,…),  sᵢ 不同</text><text x="115" y="845" class="b">原本径向 L2 收缩，被逐坐标尺度扭成各向异性。</text>

<rect x="820" y="170" width="720" height="710" rx="28" class="good"/><text x="855" y="220" class="h">Decoupled weight decay · uniform radial shrink</text>
<line x1="930" y1="735" x2="1410" y2="735" stroke="#94a0ad" stroke-width="3"/><line x1="930" y1="735" x2="930" y2="300" stroke="#94a0ad" stroke-width="3"/>
<circle cx="1160" cy="520" r="165" fill="none" stroke="#4ca267" stroke-width="5"/><circle cx="1280" cy="410" r="12" fill="#14213d"/><text x="1305" y="405" class="n">θ</text>
<path d="M1280 410 L1195 485" class="green" marker-end="url(#ag)"/><text x="1260" y="490" class="b">−αλwθ</text>
<text x="875" y="805" class="formula">same scalar λw for every selected coordinate</text><text x="875" y="845" class="b">衰减方向只由 θ 自身决定，不读取梯度历史尺度。</text>

<rect x="115" y="930" width="1370" height="210" rx="26" class="cost"/>
<text x="150" y="980" class="h">等价条件 · Proposition 2 的线性代数核心</text>
<text x="160" y="1035" class="formula">αλ′Mₜθ = λθ   for all θ  ⇒  αλ′Mₜ = λI  ⇒  Mₜ = (λ/(αλ′))I</text>
<text x="160" y="1085" class="b">因此只有预条件器退化为“标量 × 单位矩阵”时，统一 L2 系数才可能与统一 weight decay 逐步等价。</text>
<text x="160" y="1120" class="s">Adam 的 Mₜ 一般是逐坐标 diagonal scale，而不是 kI。</text>
</svg>