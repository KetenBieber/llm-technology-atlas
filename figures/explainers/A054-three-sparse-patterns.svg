<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<rect width="1500" height="700" fill="#fff"/>
<text x="60" y="60" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">MInference 的三种 Head Pattern：稀疏不是一个统一 Top-K</text>
<g font-family="Arial,sans-serif">
<rect x="70" y="125" width="400" height="430" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="270" y="170" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">A-shape</text>
<rect x="115" y="215" width="300" height="250" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect x="115" y="215" width="55" height="250" fill="#60a5fa" opacity="0.9"/>
<polygon points="115,465 415,465 415,390 340,465" fill="#34d399" opacity="0.9"/>
<text x="270" y="505" text-anchor="middle" font-size="18" fill="#334155">global / sink tokens + local window</text>
<text x="270" y="535" text-anchor="middle" font-size="16" fill="#64748b">结构固定，索引开销≈0</text>

<rect x="550" y="125" width="400" height="430" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="750" y="170" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">Vertical-Slash</text>
<rect x="595" y="215" width="300" height="250" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect x="650" y="215" width="18" height="250" fill="#f59e0b" opacity="0.9"/>
<rect x="765" y="215" width="18" height="250" fill="#f59e0b" opacity="0.9"/>
<path d="M595 430 L810 215" stroke="#ec4899" stroke-width="18" opacity="0.75"/>
<path d="M660 465 L895 230" stroke="#ec4899" stroke-width="18" opacity="0.75"/>
<text x="750" y="505" text-anchor="middle" font-size="18" fill="#334155">dynamic columns + dynamic diagonals</text>
<text x="750" y="535" text-anchor="middle" font-size="16" fill="#64748b">last-query probe 估计 vertical / slash index</text>

<rect x="1030" y="125" width="400" height="430" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="1230" y="170" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">Block-Sparse</text>
<rect x="1075" y="215" width="300" height="250" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<g fill="#8b5cf6" opacity="0.82">
<rect x="1090" y="390" width="55" height="55"/><rect x="1155" y="325" width="55" height="55"/>
<rect x="1245" y="280" width="55" height="55"/><rect x="1310" y="390" width="55" height="55"/>
<rect x="1180" y="215" width="55" height="55"/><rect x="1280" y="335" width="55" height="55"/>
</g>
<text x="1230" y="505" text-anchor="middle" font-size="18" fill="#334155">dynamic spatial clusters / 64×64 blocks</text>
<text x="1230" y="535" text-anchor="middle" font-size="16" fill="#64748b">Q/K mean pooling → coarse attention → top blocks</text>

<rect x="235" y="605" width="1030" height="60" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
<text x="750" y="642" text-anchor="middle" font-size="20" fill="#155e75">离线决定“这个 head 用哪一种结构”；在线决定“这个 prompt 下具体保留哪些 column / diagonal / block”。</text>
</g>
</svg>