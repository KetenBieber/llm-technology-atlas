<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<desc>DeepSeek-V3 multi-token prediction training branch and why it can be removed at inference.</desc>
<defs>
  <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B4F9C"/></marker>
  <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16A34A"/></marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
  <style>
    .t{font:700 44px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#10243e}
    .sub{font:400 23px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52647a}
    .h{font:700 30px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#15385f}
    .n{font:700 24px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#15385f}
    .b{font:400 21px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#26384d}
    .m{font:600 20px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#42556d}
    .mono{font:600 21px 'JetBrains Mono','Consolas',monospace;fill:#18334f}
    .blue{fill:#EAF3FF;stroke:#0B4F9C;stroke-width:2.4}.cyan{fill:#E8FBFC;stroke:#0E9AA7;stroke-width:2.4}
    .gray{fill:#F3F6F9;stroke:#94A3B8;stroke-width:2}.orange{fill:#FFF5DF;stroke:#F59E0B;stroke-width:2.4}
    .green{fill:#ECF9F0;stroke:#16A34A;stroke-width:2.4}.red{fill:#FFF0F0;stroke:#DC2626;stroke-width:2.4}
    .flow{fill:none;stroke:#0B4F9C;stroke-width:4;marker-end:url(#arrowB)}.comm{fill:none;stroke:#F59E0B;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrowO)}
    .opt{fill:none;stroke:#16A34A;stroke-width:4;marker-end:url(#arrowG)}.bad{fill:none;stroke:#DC2626;stroke-width:4;stroke-dasharray:9 8;marker-end:url(#arrowR)}
    .thin{fill:none;stroke:#64748B;stroke-width:2.2;marker-end:url(#arrowB)}.divider{stroke:#D9E2EC;stroke-width:2}
  </style>
</defs>
<rect width="1600" height="1100" fill="#FFFFFF"/>
<text x="70" y="72" class="t">DeepSeek‑V3 · MTP 为什么训练时增加监督、推理时又能删掉？</text>
<text x="70" y="110" class="sub">对应 §6｜回答：next-token 主目标如何扩展成 next² token 辅助目标，并把梯度回流到共享主干</text>

<text x="70" y="165" class="h">Baseline：标准 NTP 每个位置只监督一个未来 token</text>
<g>
  <rect x="90" y="220" width="175" height="70" rx="14" class="gray"/><text x="135" y="264" class="n">hₜ</text>
  <path d="M265 255 H365" class="flow"/>
  <rect x="365" y="220" width="260" height="70" rx="14" class="blue"/><text x="405" y="264" class="n">LM Head → p(yₜ₊₁)</text>
  <path d="M625 255 H740" class="flow"/>
  <rect x="740" y="220" width="220" height="70" rx="14" class="green"/><text x="785" y="264" class="n">target yₜ₊₁</text>
  <text x="1010" y="264" class="mono">Lₙₜₚ = −log p(yₜ₊₁|hₜ)</text>
</g>
<text x="70" y="365" class="h">MTP：把“预测更远未来”做成训练期 auxiliary branch</text>
<rect x="80" y="405" width="260" height="160" rx="18" class="gray"/><text x="98" y="439" class="n">Main hidden hₜ</text><text x="98" y="475" class="b">共享 backbone 输出</text><text x="98" y="504" class="b">主模型仍做 yₜ₊₁</text>
<path d="M340 485 H440" class="flow"/>
<rect x="440" y="390" width="330" height="190" rx="18" class="blue"/><text x="458" y="424" class="n">Main NTP Head</text><text x="458" y="460" class="b">predict yₜ₊₁；主 loss L₁</text><text x="458" y="489" class="b">训练 / 推理都保留</text>
<path d="M340 515 C390 650 420 670 500 670" class="opt"/>
<rect x="500" y="625" width="360" height="205" rx="18" class="cyan"/><text x="518" y="659" class="n">MTP Module (D=1)</text><text x="518" y="695" class="b">hₜ + embed(yₜ₊₁) → predict yₜ₊₂</text><text x="518" y="724" class="b">共享 embedding / head；auxiliary L₂</text>
<path d="M860 730 H1010" class="flow"/>
<rect x="1010" y="650" width="300" height="165" rx="18" class="green"/><text x="1028" y="684" class="n">Future target</text><text x="1028" y="720" class="b">yₜ₊₂：额外未来监督</text><text x="1028" y="749" class="b">梯度回流共享 backbone</text>
<path d="M670 625 C660 575 650 565 650 580" class="opt"/>
<path d="M575 625 C480 570 400 545 340 520" class="opt"/>
<text x="925" y="540" class="mono">L = L₁ + λ·L₂</text>
<text x="925" y="580" class="m">绿色箭头 = auxiliary gradient 回流到共享主干</text>
<line x1="70" y1="875" x2="1530" y2="875" class="divider"/>
<text x="70" y="930" class="h">推理时：默认只保留 Main Model</text>
<rect x="360" y="950" width="370" height="80" rx="16" class="green"/><text x="430" y="1000" class="n">Main Model → next token</text>
<text x="775" y="1005" font-size="44" font-weight="800" fill="#DC2626">×</text>
<rect x="850" y="950" width="420" height="80" rx="16" class="red"/><text x="905" y="985" class="n">MTP Module · train-only</text><text x="905" y="1015" class="b">默认删除；也可选用于 speculative decoding</text>

</svg>