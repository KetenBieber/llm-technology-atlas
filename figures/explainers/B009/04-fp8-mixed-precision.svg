<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<desc>DeepSeek-V3 FP8 mixed-precision data path with tile scaling, Tensor Core GEMM and high-precision accumulation.</desc>
<defs>
  <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B4F9C"/></marker>
  <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16A34A"/></marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
  <style>
    .t{font:700 44px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#10243e}
    .sub{font:400 23px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52647a}
    .h{font:700 30px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#15385f}
    .n{font:700 24px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#15385f}
    .b{font:400 21px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#26384d}
    .m{font:600 20px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#42556d}
    .mono{font:600 21px 'JetBrains Mono','Consolas',monospace;fill:#18334f}
    .blue{fill:#EAF3FF;stroke:#0B4F9C;stroke-width:2.4}.cyan{fill:#E8FBFC;stroke:#0E9AA7;stroke-width:2.4}
    .gray{fill:#F3F6F9;stroke:#94A3B8;stroke-width:2}.orange{fill:#FFF5DF;stroke:#F59E0B;stroke-width:2.4}
    .green{fill:#ECF9F0;stroke:#16A34A;stroke-width:2.4}.red{fill:#FFF0F0;stroke:#DC2626;stroke-width:2.4}
    .flow{fill:none;stroke:#0B4F9C;stroke-width:4;marker-end:url(#arrowB)}.comm{fill:none;stroke:#F59E0B;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrowO)}
    .opt{fill:none;stroke:#16A34A;stroke-width:4;marker-end:url(#arrowG)}.bad{fill:none;stroke:#DC2626;stroke-width:4;stroke-dasharray:9 8;marker-end:url(#arrowR)}
    .thin{fill:none;stroke:#64748B;stroke-width:2.2;marker-end:url(#arrowB)}.divider{stroke:#D9E2EC;stroke-width:2}
  </style>
</defs>
<rect width="1600" height="1100" fill="#FFFFFF"/>
<text x="70" y="72" class="t">DeepSeek‑V3 · FP8 训练：精度分区与累加路径</text>
<text x="70" y="110" class="sub">对应 §8｜回答：哪里用 FP8 Tensor Core，哪里必须保留 BF16/FP32，以及 fine-grained scaling 如何处理 outlier</text>

<text x="70" y="165" class="h">Linear 的三条 GEMM 路径：Fprop / Dgrad / Wgrad 都可进入 FP8 compute</text>
<rect x="70" y="205" width="260" height="155" rx="18" class="gray"/><text x="88" y="239" class="n">Activation / Weight</text><text x="88" y="275" class="b">A, W</text><text x="88" y="304" class="b">进入量化前保留高精度源</text>
<path d="M330 280 H420" class="flow"/>
<rect x="420" y="185" width="330" height="195" rx="18" class="cyan"/><text x="438" y="219" class="n">Fine-grained scaling</text><text x="438" y="255" class="b">activation 1×128 ｜ weight 128×128</text><text x="438" y="284" class="b">局部 scale 限制 outlier 影响</text>
<path d="M750 280 H845" class="flow"/>
<rect x="845" y="180" width="330" height="205" rx="18" class="blue"/><text x="863" y="214" class="n">FP8 Tensor Core GEMM</text><text x="863" y="250" class="b">Fprop / Dgrad / Wgrad</text><text x="863" y="279" class="b">FP8 Tensor Core 高吞吐 GEMM</text>
<path d="M1175 280 H1270" class="opt"/>
<rect x="1270" y="205" width="260" height="155" rx="18" class="green"/><text x="1288" y="239" class="n">Higher-precision output</text><text x="1288" y="275" class="b">输出 / partial sum</text><text x="1288" y="304" class="b">进入后续高精度路径</text>
<text x="70" y="440" class="h">长 dot-product 的风险：低精度乘法可以快，但长累加不能无限留在低精度</text>
<g>
  <rect x="100" y="490" width="150" height="62" rx="12" fill="#DDEBFA"/><text x="135" y="530" class="b">FP8 MMA</text>
  <rect x="300" y="490" width="150" height="62" rx="12" fill="#DDEBFA"/><text x="335" y="530" class="b">FP8 MMA</text>
  <rect x="500" y="490" width="150" height="62" rx="12" fill="#DDEBFA"/><text x="535" y="530" class="b">FP8 MMA</text>
  <path d="M250 521 H290" class="flow"/><path d="M450 521 H490" class="flow"/>
  <path d="M650 521 H760" class="opt"/>
  <rect x="760" y="470" width="330" height="102" rx="16" class="green"/><text x="805" y="512" class="n">FP32 accumulation</text><text x="805" y="545" class="b">周期性 promotion partial sum</text>
  <text x="1140" y="525" class="mono">Nᶜ = 128</text>
</g>
<text x="70" y="650" class="h">Precision islands：真正敏感的状态没有被“强行 FP8 化”</text>
<rect x="70" y="690" width="340" height="230" rx="18" class="green"/><text x="88" y="724" class="n">保留高精度</text><text x="88" y="760" class="b">FP32 master weights / gradients</text><text x="88" y="789" class="b">BF16 moments；norm / attention</text>
<rect x="465" y="690" width="300" height="230" rx="18" class="blue"/><text x="483" y="724" class="n">重点 FP8 化</text><text x="483" y="760" class="b">Linear GEMM + A/W tiles</text><text x="483" y="789" class="b">Tensor Core / 带宽收益</text>
<rect x="820" y="690" width="315" height="230" rx="18" class="orange"/><text x="838" y="724" class="n">工程代价</text><text x="838" y="760" class="b">online scale + metadata + cast</text><text x="838" y="789" class="b">promotion 暴露额外软件成本</text>
<rect x="1190" y="690" width="340" height="230" rx="18" class="gray"/><text x="1208" y="724" class="n">设计原则</text><text x="1208" y="760" class="b">低精度是算子级 precision map</text><text x="1208" y="789" class="b">吞吐 × 动态范围 × 累加误差</text>
<text x="70" y="1000" class="m">颜色语义：蓝=主计算；青=scale / state；绿=稳定性保留路径；橙=额外成本。</text>

</svg>