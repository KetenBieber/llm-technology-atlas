<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<desc>DeepSeek-V3 token tensor flow through MLA and MoE, highlighting cache state and sparse active parameters.</desc>
<defs>
  <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B4F9C"/></marker>
  <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16A34A"/></marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
  <style>
    .t{font:700 44px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#10243e}
    .sub{font:400 23px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52647a}
    .h{font:700 30px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#15385f}
    .n{font:700 24px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#15385f}
    .b{font:400 21px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#26384d}
    .m{font:600 20px 'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#42556d}
    .mono{font:600 21px 'JetBrains Mono','Consolas',monospace;fill:#18334f}
    .blue{fill:#EAF3FF;stroke:#0B4F9C;stroke-width:2.4}.cyan{fill:#E8FBFC;stroke:#0E9AA7;stroke-width:2.4}
    .gray{fill:#F3F6F9;stroke:#94A3B8;stroke-width:2}.orange{fill:#FFF5DF;stroke:#F59E0B;stroke-width:2.4}
    .green{fill:#ECF9F0;stroke:#16A34A;stroke-width:2.4}.red{fill:#FFF0F0;stroke:#DC2626;stroke-width:2.4}
    .flow{fill:none;stroke:#0B4F9C;stroke-width:4;marker-end:url(#arrowB)}.comm{fill:none;stroke:#F59E0B;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrowO)}
    .opt{fill:none;stroke:#16A34A;stroke-width:4;marker-end:url(#arrowG)}.bad{fill:none;stroke:#DC2626;stroke-width:4;stroke-dasharray:9 8;marker-end:url(#arrowR)}
    .thin{fill:none;stroke:#64748B;stroke-width:2.2;marker-end:url(#arrowB)}.divider{stroke:#D9E2EC;stroke-width:2}
  </style>
</defs>
<rect width="1600" height="1100" fill="#FFFFFF"/>
<text x="70" y="72" class="t">DeepSeek‑V3 · 一个 token 怎样穿过 MLA 与 DeepSeekMoE？</text>
<text x="70" y="110" class="sub">对应 §2–§4｜回答：671B total / 37B active 是怎样在真实 token flow 中同时成立的</text>

<text x="70" y="165" class="h">主干：hidden state → MLA → residual → routed FFN</text>
<rect x="70" y="205" width="245" height="120" rx="18" class="gray"/><text x="88" y="239" class="n">Token / Hidden</text><text x="88" y="275" class="b">hₜ ∈ R⁷¹⁶⁸</text><text x="88" y="304" class="b">batch: [B,T,7168]</text>
<path d="M315 265 H385" class="flow"/>
<rect x="385" y="185" width="430" height="165" rx="18" class="blue"/><text x="403" y="219" class="n">MLA Attention</text><text x="403" y="255" class="b">Q: 128 heads × 128 ｜ cᵏᵛ: 512</text><text x="403" y="284" class="b">decoupled RoPE key kᴿ: 64</text>
<path d="M815 267 H885" class="flow"/>
<rect x="885" y="205" width="260" height="120" rx="18" class="gray"/><text x="903" y="239" class="n">Residual + RMSNorm</text><text x="903" y="275" class="b">保持主干维度</text><text x="903" y="304" class="b">[B,T,7168]</text>
<path d="M1145 265 H1215" class="flow"/>
<rect x="1215" y="180" width="315" height="170" rx="18" class="cyan"/><text x="1233" y="214" class="n">DeepSeekMoE</text><text x="1233" y="250" class="b">1 shared + 256 routed experts</text><text x="1233" y="279" class="b">每 token 激活 Top‑8 routed</text>
<text x="70" y="405" class="h">MLA：改变“历史状态缓存什么”，不是改变 Attention 定义</text>
<rect x="70" y="450" width="310" height="150" rx="18" class="red"/><text x="88" y="484" class="n">Baseline · MHA Decode</text><text x="88" y="520" class="b">K,V = 2×128×128 = 32768</text><text x="88" y="549" class="b">elements / token / layer</text>
<path d="M380 525 H470" class="bad"/>
<rect x="470" y="430" width="330" height="190" rx="18" class="green"/><text x="488" y="464" class="n">MLA Cache State</text><text x="488" y="500" class="b">cᵏᵛ:512 + kᴿ:64 = 576 elements</text><text x="488" y="529" class="b">content 线性映射可吸收</text>
<path d="M800 525 H900" class="opt"/>
<rect x="900" y="448" width="290" height="155" rx="18" class="blue"/><text x="918" y="482" class="n">Decode Query</text><text x="918" y="518" class="b">qᶜ 与 cᵏᵛ 直接交互</text><text x="918" y="547" class="b">位置用 kᴿ；不展开完整 K/V</text>
<text x="1220" y="485" class="m">raw element ratio</text>
<text x="1220" y="528" class="mono">32768 / 576 ≈ 56.9×</text>
<text x="1220" y="567" class="m">仅按论文维度比较；不是服务显存实测</text>
<line x1="70" y1="660" x2="1530" y2="660" class="divider"/>
<text x="70" y="710" class="h">MoE：把“参数容量”与“每 token 计算”拆开</text>
<g>
  <circle cx="170" cy="800" r="30" fill="#0B4F9C"/><text x="152" y="807" font-size="21" fill="#fff">t₁</text>
  <circle cx="170" cy="875" r="30" fill="#0B4F9C"/><text x="152" y="882" font-size="21" fill="#fff">t₂</text>
  <circle cx="170" cy="950" r="30" fill="#0B4F9C"/><text x="152" y="957" font-size="21" fill="#fff">t₃</text>
  <text x="70" y="1030" class="m">每个 token 产生 router affinity</text>
</g>
<path d="M205 800 C340 780 360 760 500 760" class="flow"/>
<path d="M205 875 C340 875 360 860 500 860" class="flow"/>
<path d="M205 950 C340 960 360 970 500 970" class="flow"/>
<rect x="500" y="730" width="280" height="260" rx="18" class="orange"/><text x="518" y="764" class="n">Router / Top‑8</text><text x="518" y="800" class="b">sigmoid affinity → Top‑8 routed</text><text x="518" y="829" class="b">+ 1 shared；selected gate 归一化</text>
<path d="M780 800 H880" class="comm"/><path d="M780 875 H880" class="comm"/><path d="M780 950 H880" class="comm"/>
<rect x="880" y="710" width="350" height="300" rx="18" class="cyan"/><text x="898" y="744" class="n">Expert Bank</text><text x="898" y="780" class="b">E₁ … E₂₅₆；token 只进入被选 experts</text><text x="898" y="809" class="b">总参数驻留 ≠ 每 token 全部计算</text>
<path d="M1230 860 H1320" class="flow"/>
<rect x="1320" y="765" width="210" height="190" rx="18" class="green"/><text x="1338" y="799" class="n">Combine</text><text x="1338" y="835" class="b">shared + routed 加权合并</text><text x="1338" y="864" class="b">返回 residual 主干</text>
<text x="1110" y="1050" class="mono">671B total → ≈37B active / token</text>

</svg>