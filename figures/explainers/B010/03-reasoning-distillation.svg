<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><desc>DeepSeek-R1 trajectory distillation from large-model exploration to small-model supervised imitation.</desc>
<defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B4F9C"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16A34A"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker>
<style>.t{font:700 44px Inter,'Microsoft YaHei',sans-serif;fill:#10243e}.s{font:400 23px Inter,'Microsoft YaHei',sans-serif;fill:#52647a}.h{font:700 30px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.n{font:700 24px Inter,'Microsoft YaHei',sans-serif;fill:#15385f}.x{font:400 21px Inter,'Microsoft YaHei',sans-serif;fill:#26384d}.m{font:600 20px Inter,'Microsoft YaHei',sans-serif;fill:#42556d}.mono{font:600 21px Consolas,monospace;fill:#18334f}.blue{fill:#EAF3FF;stroke:#0B4F9C;stroke-width:2.4}.cyan{fill:#E8FBFC;stroke:#0E9AA7;stroke-width:2.4}.gray{fill:#F3F6F9;stroke:#94A3B8;stroke-width:2}.orange{fill:#FFF5DF;stroke:#F59E0B;stroke-width:2.4}.green{fill:#ECF9F0;stroke:#16A34A;stroke-width:2.4}.red{fill:#FFF0F0;stroke:#DC2626;stroke-width:2.4}.f{fill:none;stroke:#0B4F9C;stroke-width:4;marker-end:url(#b)}.opt{fill:none;stroke:#16A34A;stroke-width:4;marker-end:url(#g)}.cost{fill:none;stroke:#F59E0B;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#o)}.dash{fill:none;stroke:#64748B;stroke-width:2.5;stroke-dasharray:8 7}.d{stroke:#D9E2EC;stroke-width:2}</style></defs>
<rect width="1600" height="1100" fill="#fff"/><text x="65" y="70" class="t">DeepSeek‑R1 · Distillation：把已发现的 reasoning 轨迹交给小模型</text><text x="65" y="108" class="s">对应 §18–§20｜大模型先承担探索成本，小模型再用 SFT 模仿筛选后的高质量轨迹</text>
<text x="65" y="160" class="h">Teacher side：大模型用更大的轨迹搜索空间承担 exploration cost</text>
<rect x="65" y="205" width="270" height="135" rx="18" class="blue"/><text x="90" y="245" class="n">DeepSeek‑R1 Teacher</text><text x="90" y="285" class="x">同题采样多条 trajectories</text>
<path d="M335 272 H420" class="f"/>
<g>
<rect x="420" y="190" width="330" height="70" rx="14" class="gray"/><text x="440" y="234" class="x">τ₁：错误 / 不一致</text>
<rect x="420" y="280" width="330" height="70" rx="14" class="green"/><text x="440" y="324" class="x">τ₂：可验证正确 + 清晰 reasoning</text>
<rect x="420" y="370" width="330" height="70" rx="14" class="cyan"/><text x="440" y="414" class="x">τ₃：正确但不同解法</text>
</g>
<path d="M750 225 C825 225 835 275 890 275" class="cost"/><path d="M750 315 H890" class="opt"/><path d="M750 405 C825 405 835 350 890 350" class="opt"/>
<rect x="890" y="235" width="300" height="160" rx="18" class="orange"/><text x="915" y="275" class="n">Verify / Filter</text><text x="915" y="315" class="x">答案验证 + 质量筛选</text><text x="915" y="350" class="x">保留可学习的轨迹文本</text>
<path d="M1190 315 H1280" class="f"/>
<rect x="1280" y="245" width="255" height="145" rx="18" class="green"/><text x="1305" y="285" class="n">Reasoning Dataset</text><text x="1305" y="325" class="x">(q, high-quality CoT)</text><text x="1305" y="360" class="x">迁移文本，不迁移权重</text>
<line x1="65" y1="500" x2="1535" y2="500" class="d"/>
<text x="65" y="560" class="h">Student side：SFT 把“低概率好行为”直接变成 teacher-forced target</text>
<rect x="95" y="615" width="310" height="150" rx="18" class="cyan"/><text x="120" y="655" class="n">Small Qwen / Llama</text><text x="120" y="695" class="x">不需要先自己发现同一条轨迹</text><text x="120" y="730" class="x">直接读取筛选后的 reasoning text</text>
<path d="M405 690 H515" class="f"/>
<rect x="515" y="605" width="395" height="170" rx="18" class="green"/><text x="540" y="645" class="n">Supervised imitation</text><text x="540" y="690" class="mono">L = −Σₜ log π_student(yₜ|·)</text><text x="540" y="735" class="x">teacher trajectory → 高概率 student 行为</text>
<path d="M910 690 H1020" class="opt"/>
<rect x="1020" y="615" width="450" height="150" rx="18" class="blue"/><text x="1045" y="655" class="n">Transferred reasoning behavior</text><text x="1045" y="695" class="x">结构化推理 / 验证 / 修正模式更易被采到</text><text x="1045" y="730" class="x">模型参数仍是 student 自己训练得到</text>
<text x="65" y="845" class="h">为什么“小模型直接 RL”可能更难？</text>
<rect x="95" y="890" width="500" height="120" rx="18" class="red"/><text x="120" y="930" class="n">Direct small-model RL</text><text x="120" y="970" class="x">难采到高-reward 长轨迹 → 信号稀疏</text>
<path d="M595 950 H760" class="cost"/>
<rect x="760" y="880" width="710" height="140" rx="18" class="green"/><text x="785" y="920" class="n">Distillation shortcut</text><text x="785" y="960" class="x">Teacher 先探索 → verifier 选择 → Student 模仿；把昂贵搜索成本转成监督学习成本</text>
</svg>