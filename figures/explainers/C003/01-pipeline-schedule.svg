 5</text><rect x="1031" y="302" width="110" height="64" rx="9" class="g"/><text x="1086" y="340" text-anchor="middle" class="b">micro 6</text><rect x="551" y="390" width="110" height="64" rx="9" class="a"/><text x="606" y="428" text-anchor="middle" class="b">micro 1</text><rect x="671" y="390" width="110" height="64" rx="9" class="g"/><text x="726" y="428" text-anchor="middle" class="b">micro 2</text><rect x="791" y="390" width="110" height="64" rx="9" class="a"/><text x="846" y="428" text-anchor="middle" class="b">micro 3</text><rect x="911" y="390" width="110" height="64" rx="9" class="g"/><text x="966" y="428" text-anchor="middle" class="b">micro 4</text><rect x="1031" y="390" width="110" height="64" rx="9" class="a"/><text x="1086" y="428" text-anchor="middle" class="b">micro 5</text><rect x="1151" y="390" width="110" height="64" rx="9" class="g"/><text x="1206" y="428" text-anchor="middle" class="b">micro 6</text><rect x="50" y="513" width="1295" height="110" rx="14" class="box"/><text x="75" y="548" class="s">理想化时序：</text><text x="75" y="580" class="b">填充 pipeline 的前 3 个 slot、排空的最后 3 个 slot 存在空档；micro-batches 越多，固定填/排开销越易摊薄。</text><text x="75" y="607" class="n">不同 micro 使用同一版本权重，累积整批梯度后才同步更新；本图非原论文证据图。</text></svg>