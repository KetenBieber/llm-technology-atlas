<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690">
<rect width="1400" height="690" fill="#fbfbfd"/><style>.t{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#18212f}.h{font-size:28px;font-weight:700}.s{font-size:20px;font-weight:700}.b{font-size:16px}.m{font-size:15px;fill:#5b6675}.box{fill:white;stroke:#ced6e2;stroke-width:2;rx:16}.p{fill:#fff3f3;stroke:#dc9b9b}.g{fill:#f3f9ff;stroke:#8fb5df}.a{stroke:#6f7b89;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#6f7b89"/></marker></defs>
<text x="700" y="42" text-anchor="middle" class="t h">PPO → GRPO：被拿掉的不是 Policy Gradient，而是 learned Critic</text>
<text x="345" y="90" text-anchor="middle" class="t s">LLM PPO</text><text x="1055" y="90" text-anchor="middle" class="t s">GRPO</text>
<rect x="70" y="125" width="550" height="100" class="box p"/><text x="95" y="160" class="t s">Policy 采样 response</text><text x="95" y="192" class="t b">Reward / Reference / Critic 共同参与训练</text>
<rect x="780" y="125" width="550" height="100" class="box g"/><text x="805" y="160" class="t s">同一个 prompt 采样一组 responses</text><text x="805" y="192" class="t b">r₁, r₂, ... , r_G</text>
<rect x="70" y="285" width="550" height="125" class="box p"/><text x="95" y="322" class="t s">Critic 学 V(s)</text><text x="95" y="355" class="t b">为每个 token / state 提供 baseline</text><text x="95" y="385" class="t b">代价：额外模型状态、训练与并行成本</text>
<rect x="780" y="285" width="550" height="125" class="box g"/><text x="805" y="322" class="t s">组内 relative baseline</text><text x="805" y="355" class="t b">Aᵢ = (rᵢ - mean(r))/std(r)</text><text x="805" y="385" class="t b">同题内部判断“谁比同伴更好”</text>
<path d="M345 225 L345 285" class="a"/><path d="M1055 225 L1055 285" class="a"/>
<rect x="70" y="470" width="550" height="105" class="box"/><text x="95" y="505" class="t s">仍然是 PPO-style policy update</text><text x="95" y="538" class="t b">ratio + clip + KL / reference regularization</text>
<rect x="780" y="470" width="550" height="105" class="box"/><text x="805" y="505" class="t s">GRPO 也保留 clipped update</text><text x="805" y="538" class="t b">核心变化：advantage 的 baseline 来源改变</text>
<path d="M345 410 L345 470" class="a"/><path d="M1055 410 L1055 470" class="a"/>
<text x="700" y="635" text-anchor="middle" class="t m">自制解释图：完整无偏性、KL estimator、token-level ratio 与方差分析应跳转 DeepSeekMath / GRPO 原始方法专题。</text>
</svg>