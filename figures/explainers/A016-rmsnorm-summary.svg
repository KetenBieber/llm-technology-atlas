<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect x="0" y="0" width="1600" height="1200" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="800.0" y="64" font-family="Georgia, Microsoft YaHei, serif" font-size="48" font-weight="700" fill="#103B63" text-anchor="middle">RMSNorm：去掉均值中心化，只保留尺度归一化</text><text x="800.0" y="108" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" fill="#60788D" text-anchor="middle">核心思想：用 RMS 控制向量尺度，减少一次 mean reduction 与中心化操作</text><rect x="35" y="145" width="1530" height="760" rx="22" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="35" y="145" width="1530" height="58" rx="22" fill="#103B63"/><rect x="35" y="179" width="1530" height="24" fill="#103B63"/><text x="59" y="184" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">LayerNorm 与 RMSNorm 的数据流对照</text><rect x="70" y="225" width="700" height="570" rx="18" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="830" y="225" width="700" height="570" rx="18" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><text x="420" y="270" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#103B63" text-anchor="middle">LayerNorm</text><text x="1180" y="270" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#103B63" text-anchor="middle">RMSNorm</text><rect x="160" y="325" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="325" width="12" height="82" rx="6" fill="#DF6B63"/><text x="188" y="358" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">输入 x</text><text x="188" y="387" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">d 维 hidden vector</text><line x1="420" y1="407" x2="420" y2="433" stroke="#DF6B63" stroke-width="3"/><polygon points="420,433 406,425 406,441" fill="#DF6B63"/><rect x="160" y="440" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="440" width="12" height="82" rx="6" fill="#F5B85A"/><text x="188" y="473" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">计算 mean μ</text><text x="188" y="502" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">先做中心化统计</text><line x1="420" y1="522" x2="420" y2="548" stroke="#F5B85A" stroke-width="3"/><polygon points="420,548 406,540 406,556" fill="#F5B85A"/><rect x="160" y="555" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="555" width="12" height="82" rx="6" fill="#1573B8"/><text x="188" y="588" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">计算 variance σ²</text><text x="188" y="617" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">围绕 μ 估计尺度</text><line x1="420" y1="637" x2="420" y2="663" stroke="#1573B8" stroke-width="3"/><polygon points="420,663 406,655 406,671" fill="#1573B8"/><rect x="160" y="670" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="670" width="12" height="82" rx="6" fill="#DF6B63"/><text x="188" y="703" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">(x−μ)/√(σ²+ε) · γ + β</text><text x="188" y="732" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">re-centering + re-scaling</text><rect x="160" y="720" width="520" height="54" rx="12" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="420" y="754" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#103B63" text-anchor="middle">同时具有平移与尺度相关的归一化性质</text><rect x="920" y="325" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="325" width="12" height="82" rx="6" fill="#0A9AA6"/><text x="948" y="358" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">输入 x</text><text x="948" y="387" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">d 维 hidden vector</text><line x1="1180" y1="407" x2="1180" y2="433" stroke="#0A9AA6" stroke-width="3"/><polygon points="1180,433 1166,425 1166,441" fill="#0A9AA6"/><rect x="920" y="440" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="440" width="12" height="82" rx="6" fill="#1573B8"/><text x="948" y="473" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">RMS = √(mean(x²)+ε)</text><text x="948" y="502" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">不计算 μ</text><line x1="1180" y1="522" x2="1180" y2="548" stroke="#1573B8" stroke-width="3"/><polygon points="1180,548 1166,540 1166,556" fill="#1573B8"/><rect x="920" y="555" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="555" width="12" height="82" rx="6" fill="#56B99A"/><text x="948" y="588" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">x / RMS</text><text x="948" y="617" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">只控制整体尺度</text><line x1="1180" y1="637" x2="1180" y2="663" stroke="#56B99A" stroke-width="3"/><polygon points="1180,663 1166,655 1166,671" fill="#56B99A"/><rect x="920" y="670" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="670" width="12" height="82" rx="6" fill="#0A9AA6"/><text x="948" y="703" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">· γ</text><text x="948" y="732" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">通常不需要显式 β</text><rect x="920" y="720" width="520" height="54" rx="12" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="1180" y="754" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#103B63" text-anchor="middle">更简单的数据流，少一次 mean reduction</text><rect x="430" y="830" width="740" height="54" rx="12" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="800" y="864" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#103B63" text-anchor="middle">RMSNorm(x)=γ ⊙ x / √(mean(x²)+ε)</text><rect x="35" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="81" cy="1070" r="28" fill="#E8F5FB"/><text x="81" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">◎</text><text x="123" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">保留：scale normalization</text><text x="123" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">控制 hidden vector 的整体幅值</text><rect x="550" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="596" cy="1070" r="28" fill="#E8F5FB"/><text x="596" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">⚙</text><text x="638" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">移除：re-centering</text><text x="638" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">不再强制每个样本均值为 0</text><rect x="1065" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="1111" cy="1070" r="28" fill="#E8F5FB"/><text x="1111" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">▥</text><text x="1153" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">工程收益：更简洁</text><text x="1153" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">在 Transformer 中成为常见 Norm 选择</text></svg>