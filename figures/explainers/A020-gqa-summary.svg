<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
<rect width="1440" height="960" fill="#f8fafc"/>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
  <style>
    .tt{font:700 34px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
    .sub{font:500 18px Arial,'Microsoft YaHei',sans-serif;fill:#475569}
    .h{font:700 22px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
    .t{font:500 17px Arial,'Microsoft YaHei',sans-serif;fill:#1e293b}
    .s{font:500 15px Arial,'Microsoft YaHei',sans-serif;fill:#475569}
    .b{fill:#ffffff;stroke:#94a3b8;stroke-width:2;rx:18}
    .bl{fill:#dbeafe;stroke:#3b82f6;stroke-width:2;rx:18}
    .cy{fill:#cffafe;stroke:#06b6d4;stroke-width:2;rx:18}
    .sl{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2;rx:18}
    .deep{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.4;rx:18}
    .a{stroke:#475569;stroke-width:2.7;fill:none;marker-end:url(#arr)}
    .d{stroke:#64748b;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#arr)}
  </style>
</defs>
<text x="64" y="62" class="tt">GQA：用 KV head 数量把质量—缓存—带宽放到一条连续谱上</text>
<text x="64" y="96" class="sub">核心变量不是 Query head 数，而是 H_KV：从 MHA 的完全独立，到 GQA 的分组共享，再到 MQA 的全共享。</text>
<text x="70" y="155" class="h">同一 Attention 骨架，只改变 K/V 的共享粒度</text>
<rect x="70" y="190" width="360" height="210" class="bl"/>
<text x="100" y="235" class="h">MHA</text>
<text x="100" y="272" class="t">H_Q = 32，H_KV = 32</text>
<text x="100" y="307" class="t">每个 Query head 都有独立 K/V</text>
<text x="100" y="342" class="s">表达自由度最高</text>
<text x="100" y="370" class="s">KV Cache / Decode 带宽最大</text>

<rect x="540" y="175" width="360" height="240" class="deep"/>
<text x="570" y="220" class="h">GQA</text>
<text x="570" y="257" class="t">H_Q = 32，H_KV = 8</text>
<text x="570" y="292" class="t">每 4 个 Query heads 共享一组 K/V</text>
<text x="570" y="327" class="s">保留多个 KV 子空间</text>
<text x="570" y="355" class="s">KV Cache 约降到 MHA 的 1/4</text>
<text x="570" y="383" class="s">可从 MHA checkpoint 分组平均后 uptrain</text>

<rect x="1010" y="190" width="360" height="210" class="cy"/>
<text x="1040" y="235" class="h">MQA</text>
<text x="1040" y="272" class="t">H_Q = 32，H_KV = 1</text>
<text x="1040" y="307" class="t">所有 Query heads 共享同一 K/V</text>
<text x="1040" y="342" class="s">KV Cache / 带宽最省</text>
<text x="1040" y="370" class="s">共享约束最强，质量风险更高</text>

<path d="M430 295 H540" class="a"/><path d="M900 295 H1010" class="a"/>
<text x="720" y="468" text-anchor="middle" class="h">GQA 的本质：把“完全独立”和“完全共享”之间的离散选择，变成可调参数</text>

<rect x="140" y="525" width="1160" height="285" class="sl"/>
<text x="180" y="570" class="h">Decode 时真正被改变的系统量</text>
<text x="190" y="620" class="t">1. KV Cache 容量 ∝ H_KV × sequence length × head_dim</text>
<text x="190" y="660" class="t">2. 每生成一个 token，需要从 HBM 读取的历史 K/V 也随 H_KV 降低</text>
<text x="190" y="700" class="t">3. Query 仍保留 32 个 heads：共享的是“记忆通道”，不是把 Query 也压成 8 个</text>
<text x="190" y="740" class="t">4. Uptraining 目标：尽量继承 MHA 能力，只用少量额外训练恢复共享后的性能</text>
<text x="190" y="780" class="s">选择 H_KV，本质是在质量、缓存占用、decode memory bandwidth 三者之间做工程折中。</text>
<text x="720" y="925" text-anchor="middle" class="s">自制总结架构图：提炼文章核心机制，不复刻原论文图。</text></svg>