<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect x="0" y="0" width="1600" height="1200" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="800.0" y="64" font-family="Georgia, Microsoft YaHei, serif" font-size="48" font-weight="700" fill="#103B63" text-anchor="middle">Transformer：Attention 如何替代循环序列建模</text><text x="800.0" y="108" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" fill="#60788D" text-anchor="middle">核心思想：用全局 token-to-token 交互 + 逐位置 FFN 构建并行序列模型</text><rect x="35" y="145" width="370" height="815" rx="22" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="35" y="145" width="370" height="58" rx="22" fill="#103B63"/><rect x="35" y="179" width="370" height="24" fill="#103B63"/><text x="59" y="184" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">输入表示</text><circle cx="75" cy="225" r="24" fill="#0A9AA6"/><text x="75" y="234" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="115" y="233" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Token embeddings</text><text x="78" y="277" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="277" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">离散 token 映射到 d_mo</text><text x="102" y="305" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">del</text><circle cx="75" cy="450" r="24" fill="#0A9AA6"/><text x="75" y="459" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="115" y="458" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Positional encoding</text><text x="78" y="502" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="502" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">Attention 本身无时间递推</text><text x="78" y="538" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="538" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">必须显式注入位置信息</text><circle cx="75" cy="675" r="24" fill="#0A9AA6"/><text x="75" y="684" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="115" y="683" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Q / K / V</text><text x="78" y="727" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="727" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">Query 决定查什么</text><text x="78" y="763" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="763" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">Key 决定如何匹配</text><text x="78" y="799" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1573B8" text-anchor="start">•</text><text x="102" y="799" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#1C3550" text-anchor="start">Value 承载被聚合内容</text><rect x="430" y="145" width="740" height="815" rx="22" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="430" y="145" width="740" height="58" rx="22" fill="#103B63"/><rect x="430" y="179" width="740" height="24" fill="#103B63"/><text x="454" y="184" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">Encoder–Decoder 数据流</text><rect x="520" y="245" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="245" width="14" height="90" rx="7" fill="#1573B8"/><text x="555" y="280" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Multi-Head Self-Attention</text><text x="555" y="310" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">每个位置并行读取整段上下文</text><line x1="800" y1="335" x2="800" y2="361" stroke="#1573B8" stroke-width="3"/><polygon points="800,361 786,353 786,369" fill="#1573B8"/><rect x="520" y="365" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="365" width="14" height="90" rx="7" fill="#0A9AA6"/><text x="555" y="400" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Add &amp; Norm</text><text x="555" y="430" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">Residual 保留信息，Normalization 稳定训练</text><line x1="800" y1="455" x2="800" y2="481" stroke="#1573B8" stroke-width="3"/><polygon points="800,481 786,473 786,489" fill="#1573B8"/><rect x="520" y="485" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="485" width="14" height="90" rx="7" fill="#56B99A"/><text x="555" y="520" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Position-wise FFN</text><text x="555" y="550" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">对每个 token 独立做非线性通道变换</text><line x1="800" y1="575" x2="800" y2="601" stroke="#1573B8" stroke-width="3"/><polygon points="800,601 786,593 786,609" fill="#1573B8"/><rect x="520" y="605" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="605" width="14" height="90" rx="7" fill="#F5B85A"/><text x="555" y="640" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Decoder masked self-attention</text><text x="555" y="670" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">阻止看到未来 token</text><line x1="800" y1="695" x2="800" y2="721" stroke="#1573B8" stroke-width="3"/><polygon points="800,721 786,713 786,729" fill="#1573B8"/><rect x="520" y="725" width="560" height="90" rx="16" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="520" y="725" width="14" height="90" rx="7" fill="#1573B8"/><text x="555" y="760" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1C3550" text-anchor="start">Cross-Attention → Linear → Softmax</text><text x="555" y="790" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">Decoder 查询 Encoder 表示并生成输出</text><rect x="1195" y="145" width="370" height="815" rx="22" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="1195" y="145" width="370" height="58" rx="22" fill="#103B63"/><rect x="1195" y="179" width="370" height="24" fill="#103B63"/><text x="1219" y="184" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">关键机制</text><rect x="1220" y="225" width="320" height="185" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="1220" y="225" width="8" height="185" rx="4" fill="#0A9AA6"/><text x="1240" y="259" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1C3550" text-anchor="start">Scaled dot-product</text><text x="1240" y="293" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#60788D" text-anchor="start">softmax(QKᵀ/√d_k)V，缩放控制 logit 方差</text><rect x="1220" y="430" width="320" height="185" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="1220" y="430" width="8" height="185" rx="4" fill="#1573B8"/><text x="1240" y="464" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1C3550" text-anchor="start">Multi-head</text><text x="1240" y="498" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#60788D" text-anchor="start">多个子空间并行建模不同关系</text><rect x="1220" y="635" width="320" height="185" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="1220" y="635" width="8" height="185" rx="4" fill="#56B99A"/><text x="1240" y="669" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1C3550" text-anchor="start">Parallel tokens</text><text x="1240" y="703" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#60788D" text-anchor="start">训练时不需要 RNN 的时间步递推</text><rect x="500" y="870" width="600" height="70" rx="14" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="800" y="914" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#103B63" text-anchor="middle">Attention(Q,K,V)=softmax(QKᵀ/√dₖ)V</text><rect x="35" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="81" cy="1070" r="28" fill="#E8F5FB"/><text x="81" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">◎</text><text x="123" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">目标：并行建模序列</text><text x="123" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">移除循环依赖，缩短长程依赖路径</text><rect x="550" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="596" cy="1070" r="28" fill="#E8F5FB"/><text x="596" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">⚙</text><text x="638" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">方法：Attention + FFN</text><text x="638" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">关系建模与逐位置变换分工</text><rect x="1065" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="1111" cy="1070" r="28" fill="#E8F5FB"/><text x="1111" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">▥</text><text x="1153" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">遗产：现代 LLM 骨架</text><text x="1153" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">后续 Decoder-only 模型继承核心模块</text></svg>