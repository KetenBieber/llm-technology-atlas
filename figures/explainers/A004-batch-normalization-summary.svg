<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect x="0" y="0" width="1600" height="1200" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="800.0" y="64" font-family="Georgia, Microsoft YaHei, serif" font-size="48" font-weight="700" fill="#103B63" text-anchor="middle">Batch Normalization：训练统计与推理统计的双路径</text><text x="800.0" y="108" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" fill="#60788D" text-anchor="middle">核心思想：训练时用 minibatch 统计归一化，推理时切换到 running statistics</text><rect x="35" y="145" width="1530" height="760" rx="22" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="35" y="145" width="1530" height="58" rx="22" fill="#103B63"/><rect x="35" y="179" width="1530" height="24" fill="#103B63"/><text x="59" y="184" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">同一个 BN 层，在 Train / Eval 模式下走不同统计路径</text><rect x="70" y="225" width="700" height="570" rx="18" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="830" y="225" width="700" height="570" rx="18" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><text x="420" y="270" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#103B63" text-anchor="middle">Training</text><text x="1180" y="270" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#103B63" text-anchor="middle">Inference</text><rect x="160" y="325" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="325" width="12" height="82" rx="6" fill="#DF6B63"/><text x="188" y="358" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">Mini-batch activations x</text><text x="188" y="387" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">按特征/通道收集样本</text><line x1="420" y1="407" x2="420" y2="433" stroke="#DF6B63" stroke-width="3"/><polygon points="420,433 406,425 406,441" fill="#DF6B63"/><rect x="160" y="440" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="440" width="12" height="82" rx="6" fill="#F5B85A"/><text x="188" y="473" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">计算 μ_B 与 σ²_B</text><text x="188" y="502" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">batch 统计参与当前前向</text><line x1="420" y1="522" x2="420" y2="548" stroke="#F5B85A" stroke-width="3"/><polygon points="420,548 406,540 406,556" fill="#F5B85A"/><rect x="160" y="555" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="555" width="12" height="82" rx="6" fill="#1573B8"/><text x="188" y="588" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">x̂=(x−μ_B)/√(σ²_B+ε)</text><text x="188" y="617" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">标准化当前 batch</text><line x1="420" y1="637" x2="420" y2="663" stroke="#1573B8" stroke-width="3"/><polygon points="420,663 406,655 406,671" fill="#1573B8"/><rect x="160" y="670" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="670" width="12" height="82" rx="6" fill="#DF6B63"/><text x="188" y="703" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">y=γx̂+β</text><text x="188" y="732" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">恢复可学习缩放与平移</text><rect x="160" y="720" width="520" height="54" rx="12" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="420" y="754" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#103B63" text-anchor="middle">同时更新 running mean / variance</text><rect x="920" y="325" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="325" width="12" height="82" rx="6" fill="#0A9AA6"/><text x="948" y="358" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">Single / arbitrary batch x</text><text x="948" y="387" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">不再依赖当前 batch 统计</text><line x1="1180" y1="407" x2="1180" y2="433" stroke="#0A9AA6" stroke-width="3"/><polygon points="1180,433 1166,425 1166,441" fill="#0A9AA6"/><rect x="920" y="440" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="440" width="12" height="82" rx="6" fill="#1573B8"/><text x="948" y="473" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">读取 running μ、σ²</text><text x="948" y="502" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">训练阶段累积的稳定估计</text><line x1="1180" y1="522" x2="1180" y2="548" stroke="#1573B8" stroke-width="3"/><polygon points="1180,548 1166,540 1166,556" fill="#1573B8"/><rect x="920" y="555" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="555" width="12" height="82" rx="6" fill="#56B99A"/><text x="948" y="588" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">固定 affine transform</text><text x="948" y="617" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">可与前一层 Conv/Linear 融合</text><line x1="1180" y1="637" x2="1180" y2="663" stroke="#56B99A" stroke-width="3"/><polygon points="1180,663 1166,655 1166,671" fill="#56B99A"/><rect x="920" y="670" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="670" width="12" height="82" rx="6" fill="#0A9AA6"/><text x="948" y="703" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">输出 y</text><text x="948" y="732" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">确定性推理路径</text><rect x="920" y="720" width="520" height="54" rx="12" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="1180" y="754" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#103B63" text-anchor="middle">Train/Eval 统计机制不可混用</text><rect x="430" y="830" width="740" height="54" rx="12" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="800" y="864" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#103B63" text-anchor="middle">BN(x) = γ · (x−μ)/√(σ²+ε) + β</text><rect x="35" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="81" cy="1070" r="28" fill="#E8F5FB"/><text x="81" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">◎</text><text x="123" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">目标：稳定激活尺度</text><text x="123" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">减弱训练过程中尺度漂移</text><rect x="550" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="596" cy="1070" r="28" fill="#E8F5FB"/><text x="596" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">⚙</text><text x="638" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">方法：batch statistics</text><text x="638" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">训练时动态估计，推理时使用 running stats</text><rect x="1065" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="1111" cy="1070" r="28" fill="#E8F5FB"/><text x="1111" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">▥</text><text x="1153" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">边界：依赖有效 batch</text><text x="1153" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">batch 太小会使统计噪声显著增大</text></svg>