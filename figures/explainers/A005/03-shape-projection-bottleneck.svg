<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><defs><style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#14213d}.title{font-size:48px;font-weight:700}.sub{font-size:24px;fill:#607086}.h{font-size:29px;font-weight:700}.n{font-size:24px;font-weight:650}.b{font-size:21px}.s{font-size:20px;fill:#607086}.formula{font-family:"STIX Two Math","Cambria Math",serif;font-size:23px}.box{fill:#f8fbff;stroke:#8fb6d9;stroke-width:2}.state{fill:#ecfbfc;stroke:#3ba9b3;stroke-width:2}.gray{fill:#f4f6f8;stroke:#aab6c3;stroke-width:2}.warn{fill:#fff2f1;stroke:#cf5c57;stroke-width:2}.good{fill:#eef9f2;stroke:#4ca267;stroke-width:2}.cost{fill:#fff7e9;stroke:#df942c;stroke-width:2}.blue{stroke:#246aa5;stroke-width:5;fill:none}.cyan{stroke:#2599a6;stroke-width:4;fill:none}.green{stroke:#3d995c;stroke-width:5;fill:none}.orange{stroke:#d9871c;stroke-width:4;fill:none}.red{stroke:#c8504b;stroke-width:4;fill:none}.dash{stroke-dasharray:12 10}</style><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246aa5"/></marker><marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2599a6"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d995c"/></marker><marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9871c"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8504b"/></marker></defs><rect width="1600" height="1200" fill="#fff"/><text x="70" y="75" class="title">A005 · Shape transition 与 Bottleneck：identity shortcut 的边界</text><text x="72" y="115" class="sub">Residual add 的硬约束是两路 Shape 可逐元素相加；stage 切换时必须显式处理尺寸与通道。</text>
<text x="75" y="180" class="h">Stage transition：主分支下采样 + 通道翻倍</text>
<rect x="65" y="225" width="1470" height="410" rx="28" class="gray"/>
<rect x="105" y="350" width="230" height="115" rx="18" class="state"/><text x="220" y="395" text-anchor="middle" class="n">input x</text><text x="220" y="430" text-anchor="middle" class="formula">[B,64,56,56]</text>
<rect x="445" y="300" width="320" height="205" rx="22" class="box"/><text x="605" y="345" text-anchor="middle" class="n">main branch</text><text x="605" y="385" text-anchor="middle" class="b">3×3 Conv, stride 2</text><text x="605" y="425" text-anchor="middle" class="formula">→ [B,128,28,28]</text><text x="605" y="465" text-anchor="middle" class="s">F(x)</text><path d="M335 405 H445" class="blue" marker-end="url(#ab)"/>
<rect x="445" y="535" width="320" height="80" rx="18" class="warn"/><text x="605" y="582" text-anchor="middle" class="b">identity x 不能直接与 F(x) 相加：Shape 不同</text>
<path d="M220 465 C260 565 345 575 445 575" class="red" marker-end="url(#ar)"/>
<rect x="875" y="290" width="320" height="215" rx="22" class="good"/><text x="1035" y="335" text-anchor="middle" class="n">Option B projection</text><text x="1035" y="380" text-anchor="middle" class="b">1×1 Conv, stride 2</text><text x="1035" y="420" text-anchor="middle" class="formula">W_s x → [B,128,28,28]</text><text x="1035" y="460" text-anchor="middle" class="s">只在维度变化处付出参数/算力</text>
<path d="M335 420 C570 560 760 540 875 410" class="green" marker-end="url(#ag)"/>
<circle cx="1320" cy="405" r="48" fill="#fff" stroke="#4ca267" stroke-width="3"/><text x="1320" y="414" text-anchor="middle" class="n">＋</text><path d="M765 400 C870 245 1125 245 1278 370" class="blue" marker-end="url(#ab)"/><path d="M1195 400 H1272" class="green" marker-end="url(#ag)"/>
<text x="1320" y="500" text-anchor="middle" class="formula">F(x)+W_sx</text>

<text x="75" y="710" class="h">Deep ResNet 的 bottleneck：让昂贵 3×3 在窄通道上工作</text>
<rect x="65" y="755" width="1470" height="360" rx="28" class="box"/>
<rect x="115" y="860" width="210" height="110" rx="18" class="state"/><text x="220" y="905" text-anchor="middle" class="n">input</text><text x="220" y="940" text-anchor="middle" class="formula">[B,256,H,W]</text>
<rect x="405" y="835" width="210" height="160" rx="18" class="box"/><text x="510" y="880" text-anchor="middle" class="n">1×1 reduce</text><text x="510" y="920" text-anchor="middle" class="formula">256→64</text><text x="510" y="960" text-anchor="middle" class="s">channel projection</text>
<rect x="695" y="835" width="210" height="160" rx="18" class="cost"/><text x="800" y="880" text-anchor="middle" class="n">3×3 spatial</text><text x="800" y="920" text-anchor="middle" class="formula">64→64</text><text x="800" y="960" text-anchor="middle" class="s">昂贵算子在窄宽度</text>
<rect x="985" y="835" width="210" height="160" rx="18" class="box"/><text x="1090" y="880" text-anchor="middle" class="n">1×1 expand</text><text x="1090" y="920" text-anchor="middle" class="formula">64→256</text><text x="1090" y="960" text-anchor="middle" class="s">恢复 add 所需宽度</text>
<rect x="1285" y="860" width="190" height="110" rx="18" class="state"/><text x="1380" y="905" text-anchor="middle" class="n">F(x)</text><text x="1380" y="940" text-anchor="middle" class="formula">[B,256,H,W]</text>
<path d="M325 915 H405" class="blue" marker-end="url(#ab)"/><path d="M615 915 H695" class="orange" marker-end="url(#ao)"/><path d="M905 915 H985" class="orange" marker-end="url(#ao)"/><path d="M1195 915 H1285" class="blue" marker-end="url(#ab)"/>
<text x="220" y="1055" class="s">Bottleneck 是 practical compute design，不是 residual learning 的数学必要条件。</text><text x="1000" y="1055" class="s">identity / projection shortcut 仍需与最终 F(x) Shape 匹配。</text>
</svg>