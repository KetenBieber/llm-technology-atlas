<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><defs><style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#14213d}.title{font-size:48px;font-weight:700}.sub{font-size:24px;fill:#607086}.h{font-size:29px;font-weight:700}.n{font-size:24px;font-weight:650}.b{font-size:21px}.s{font-size:20px;fill:#607086}.formula{font-family:"STIX Two Math","Cambria Math",serif;font-size:23px}.box{fill:#f8fbff;stroke:#8fb6d9;stroke-width:2}.state{fill:#ecfbfc;stroke:#3ba9b3;stroke-width:2}.gray{fill:#f4f6f8;stroke:#aab6c3;stroke-width:2}.warn{fill:#fff2f1;stroke:#cf5c57;stroke-width:2}.good{fill:#eef9f2;stroke:#4ca267;stroke-width:2}.cost{fill:#fff7e9;stroke:#df942c;stroke-width:2}.blue{stroke:#246aa5;stroke-width:5;fill:none}.cyan{stroke:#2599a6;stroke-width:4;fill:none}.green{stroke:#3d995c;stroke-width:5;fill:none}.orange{stroke:#d9871c;stroke-width:4;fill:none}.red{stroke:#c8504b;stroke-width:4;fill:none}.dash{stroke-dasharray:12 10}</style><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246aa5"/></marker><marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2599a6"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d995c"/></marker><marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9871c"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8504b"/></marker></defs><rect width="1600" height="1200" fill="#fff"/><text x="70" y="75" class="title">A005 · Residual Block：Forward shortcut 与 Backward path</text><text x="72" y="115" class="sub">原始 ResNet v1 有 identity path，但 post-add ReLU 意味着“梯度永远是 1”仍是错误说法。</text>
<rect x="55" y="165" width="1490" height="620" rx="28" class="gray"/>
<text x="85" y="215" class="h">Forward · y = ReLU(F(x)+x)</text>
<rect x="100" y="355" width="190" height="110" rx="18" class="state"/><text x="195" y="400" text-anchor="middle" class="n">x</text><text x="195" y="435" text-anchor="middle" class="b">[B,C,H,W]</text>
<rect x="430" y="275" width="280" height="185" rx="22" class="box"/><text x="570" y="320" text-anchor="middle" class="n">residual branch F(x)</text><text x="570" y="360" text-anchor="middle" class="b">Conv→BN→ReLU</text><text x="570" y="398" text-anchor="middle" class="b">Conv→BN</text><text x="570" y="432" text-anchor="middle" class="s">学习“修正量”</text>
<path d="M290 395 C350 340 390 335 430 340" class="blue" marker-end="url(#ab)"/>
<path d="M290 430 C560 600 820 580 980 440" class="green" marker-end="url(#ag)"/><text x="560" y="585" text-anchor="middle" class="n">identity shortcut S(x)=x</text>
<circle cx="1025" cy="390" r="48" fill="#fff" stroke="#4ca267" stroke-width="3"/><text x="1025" y="399" text-anchor="middle" class="n">＋</text>
<path d="M710 365 H977" class="blue" marker-end="url(#ab)"/>
<rect x="1130" y="335" width="180" height="110" rx="18" class="cost"/><text x="1220" y="380" text-anchor="middle" class="n">ReLU</text><text x="1220" y="415" text-anchor="middle" class="formula">D_z</text><path d="M1073 390 H1130" class="orange" marker-end="url(#ao)"/>
<rect x="1380" y="350" width="120" height="80" rx="16" class="state"/><text x="1440" y="398" text-anchor="middle" class="n">y</text><path d="M1310 390 H1380" class="blue" marker-end="url(#ab)"/>

<text x="85" y="675" class="h">Backward · 两条 Jacobian 路径在 x 处相加</text>
<path d="M1440 445 C1350 690 1190 710 1040 610" class="green" marker-end="url(#ag)"/><text x="1290" y="670" class="formula">D_z g_y</text>
<path d="M1010 610 C830 720 520 690 290 465" class="green" marker-end="url(#ag)"/><text x="720" y="690" class="formula">J_F(x)ᵀ D_z g_y</text>
<path d="M1010 625 C720 820 350 760 205 465" class="cyan" marker-end="url(#ac)"/><text x="470" y="760" class="formula">Iᵀ D_z g_y</text>

<rect x="70" y="850" width="720" height="285" rx="24" class="good"/><text x="100" y="900" class="h">忽略最终 ReLU 时的核心结构</text><text x="105" y="955" class="formula">z=x+F(x)</text><text x="105" y="1005" class="formula">∂L/∂x = g_z + J_F(x)ᵀ g_z</text><text x="105" y="1060" class="b">相比 plain block，多出一条不经过 F 内部层的直接梯度项。</text><text x="105" y="1100" class="s">这也是 shortcut 同时改变 forward parameterization 与 backward path 的原因。</text>
<rect x="825" y="850" width="705" height="285" rx="24" class="warn"/><text x="855" y="900" class="h">ResNet v1 的限制：post-add ReLU 会门控</text><text x="860" y="960" class="formula">∂L/∂x = (I+J_F)ᵀ D_z g_y</text><text x="860" y="1015" class="b">若某坐标 z&lt;0，对应 D_z=0，identity 梯度也会被门掉。</text><text x="860" y="1060" class="b">后来的 pre-activation 结构进一步改善这条路径，</text><text x="860" y="1100" class="s">但不能倒写成 2015/2016 原始 v1 已经拥有。</text>
</svg>