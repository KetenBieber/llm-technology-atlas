<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect x="0" y="0" width="1600" height="1200" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="800.0" y="64" font-family="Georgia, Microsoft YaHei, serif" font-size="48" font-weight="700" fill="#103B63" text-anchor="middle">AdamW：把 Weight Decay 从自适应梯度里解耦</text><text x="800.0" y="108" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" fill="#60788D" text-anchor="middle">核心思想：数据梯度进入 Adam 状态，参数收缩走独立支路</text><rect x="35" y="145" width="1530" height="760" rx="22" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="35" y="145" width="1530" height="58" rx="22" fill="#103B63"/><rect x="35" y="179" width="1530" height="24" fill="#103B63"/><text x="59" y="184" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">Coupled L2 与 Decoupled Weight Decay 的数据流差异</text><rect x="70" y="225" width="700" height="570" rx="18" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="830" y="225" width="700" height="570" rx="18" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><text x="420" y="270" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#103B63" text-anchor="middle">Adam + coupled L₂</text><text x="1180" y="270" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#103B63" text-anchor="middle">AdamW</text><rect x="160" y="325" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="325" width="12" height="82" rx="6" fill="#DF6B63"/><text x="188" y="358" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">数据梯度 g</text><text x="188" y="387" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">来自任务损失</text><line x1="420" y1="407" x2="420" y2="433" stroke="#DF6B63" stroke-width="3"/><polygon points="420,433 406,425 406,441" fill="#DF6B63"/><rect x="160" y="440" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="440" width="12" height="82" rx="6" fill="#F5B85A"/><text x="188" y="473" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">g + λθ</text><text x="188" y="502" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">L₂ 项先混入梯度</text><line x1="420" y1="522" x2="420" y2="548" stroke="#F5B85A" stroke-width="3"/><polygon points="420,548 406,540 406,556" fill="#F5B85A"/><rect x="160" y="555" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="555" width="12" height="82" rx="6" fill="#1573B8"/><text x="188" y="588" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">进入 m、v</text><text x="188" y="617" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">预条件器也看到 λθ</text><line x1="420" y1="637" x2="420" y2="663" stroke="#1573B8" stroke-width="3"/><polygon points="420,663 406,655 406,671" fill="#1573B8"/><rect x="160" y="670" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="670" width="12" height="82" rx="6" fill="#DF6B63"/><text x="188" y="703" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">自适应缩放后更新</text><text x="188" y="732" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">weight decay 被坐标尺度扭曲</text><rect x="160" y="720" width="520" height="54" rx="12" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="420" y="754" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#103B63" text-anchor="middle">耦合：正则项被 Adam 预条件</text><rect x="920" y="325" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="325" width="12" height="82" rx="6" fill="#0A9AA6"/><text x="948" y="358" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">数据梯度 g</text><text x="948" y="387" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">只来自任务损失</text><line x1="1180" y1="407" x2="1180" y2="433" stroke="#0A9AA6" stroke-width="3"/><polygon points="1180,433 1166,425 1166,441" fill="#0A9AA6"/><rect x="920" y="440" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="440" width="12" height="82" rx="6" fill="#1573B8"/><text x="948" y="473" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">进入 m、v</text><text x="948" y="502" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">状态只建模数据梯度</text><line x1="1180" y1="522" x2="1180" y2="548" stroke="#1573B8" stroke-width="3"/><polygon points="1180,548 1166,540 1166,556" fill="#1573B8"/><rect x="920" y="555" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="555" width="12" height="82" rx="6" fill="#56B99A"/><text x="948" y="588" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">Adam adaptive step</text><text x="948" y="617" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">−α m̂/(√v̂+ε)</text><line x1="1180" y1="637" x2="1180" y2="663" stroke="#56B99A" stroke-width="3"/><polygon points="1180,663 1166,655 1166,671" fill="#56B99A"/><rect x="920" y="670" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="670" width="12" height="82" rx="6" fill="#0A9AA6"/><text x="948" y="703" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">独立参数收缩</text><text x="948" y="732" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">θ ← (1−αλ)θ + Adam step</text><rect x="920" y="720" width="520" height="54" rx="12" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="1180" y="754" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#103B63" text-anchor="middle">解耦：weight decay 直接作用参数</text><rect x="430" y="830" width="740" height="54" rx="12" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="800" y="864" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#103B63" text-anchor="middle">SGD 中 L₂≈weight decay；Adam 中一般不等价</text><rect x="35" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="81" cy="1070" r="28" fill="#E8F5FB"/><text x="81" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">◎</text><text x="123" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">问题：自适应预条件</text><text x="123" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">会改变 coupled L₂ 的实际衰减方向</text><rect x="550" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="596" cy="1070" r="28" fill="#E8F5FB"/><text x="596" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">⚙</text><text x="638" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">方法：两条支路</text><text x="638" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">梯度支路与参数收缩支路分开</text><rect x="1065" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="1111" cy="1070" r="28" fill="#E8F5FB"/><text x="1111" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">▥</text><text x="1153" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">效果：超参更可解释</text><text x="1153" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">weight decay 不再被 vₜ 的坐标尺度扭曲</text></svg>