<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<rect width="1600" height="1200" fill="#ffffff"/>
<style>
  .t{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
  .h{font-size:38px;font-weight:700}
  .sub{font-size:21px;fill:#475569}
  .st{font-size:24px;font-weight:700}
  .b{font-size:20px}
  .s{font-size:17px;fill:#475569}
  .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}
  .blue{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.2}
  .cyan{fill:#ecfeff;stroke:#06b6d4;stroke-width:2.2}
  .deep{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.2}
  .dash{fill:#f8fafc;stroke:#64748b;stroke-width:2;stroke-dasharray:8 7}
  .arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arr)}
  .thin{fill:none;stroke:#94a3b8;stroke-width:2}
</style>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
</defs>
<text class="t h" x="800" y="62" text-anchor="middle">YaRN：同时修正 RoPE 频率几何与长上下文 Attention 统计</text>
<text class="t sub" x="800" y="102" text-anchor="middle">频率分段避免一刀切插值，temperature scaling 补偿 context 变长后的 softmax 分布变化</text>
<rect class="blue" x="65" y="170" width="310" height="210" rx="22"/>
<text class="t st" x="220" y="215" text-anchor="middle">Pretrained RoPE</text>
<text class="t b" x="220" y="260" text-anchor="middle">训练窗口 L</text>
<text class="t b" x="220" y="300" text-anchor="middle">多组 wavelength λ_i</text>
<text class="t s" x="220" y="342" text-anchor="middle">超出 L 后 phase / distance OOD</text>

<path class="arrow" d="M375 275 H465"/>

<rect class="box" x="465" y="145" width="470" height="265" rx="22"/>
<text class="t st" x="700" y="190" text-anchor="middle">先按频率判断“该不该动”</text>
<text class="t b" x="700" y="235" text-anchor="middle">r_i = L / λ_i</text>
<rect class="deep" x="505" y="275" width="125" height="90" rx="14"/>
<text class="t s" x="567" y="310" text-anchor="middle">高频</text>
<text class="t s" x="567" y="338" text-anchor="middle">尽量保留</text>
<rect class="cyan" x="645" y="275" width="125" height="90" rx="14"/>
<text class="t s" x="707" y="310" text-anchor="middle">中频</text>
<text class="t s" x="707" y="338" text-anchor="middle">平滑过渡</text>
<rect class="blue" x="785" y="275" width="110" height="90" rx="14"/>
<text class="t s" x="840" y="310" text-anchor="middle">低频</text>
<text class="t s" x="840" y="338" text-anchor="middle">插值缩放</text>

<path class="arrow" d="M935 275 H1025"/>

<rect class="cyan" x="1025" y="145" width="510" height="265" rx="22"/>
<text class="t st" x="1280" y="190" text-anchor="middle">NTK-by-parts / YaRN Position Map</text>
<text class="t b" x="1280" y="240" text-anchor="middle">γ(r) 在不同频段间做连续 ramp</text>
<text class="t b" x="1280" y="280" text-anchor="middle">局部短距离精度 ↔ 长距离可外推</text>
<line class="thin" x1="1085" y1="310" x2="1475" y2="310"/>
<text class="t s" x="1280" y="344" text-anchor="middle">不再对所有 RoPE 维度统一除以 s</text>
<text class="t s" x="1280" y="373" text-anchor="middle">核心是 frequency-selective interpolation</text>

<rect class="blue" x="260" y="545" width="470" height="260" rx="22"/>
<text class="t st" x="495" y="590" text-anchor="middle">另一条问题：Attention 统计改变</text>
<text class="t b" x="495" y="640" text-anchor="middle">context：L → sL</text>
<text class="t b" x="495" y="684" text-anchor="middle">可竞争 key 数量显著增加</text>
<text class="t s" x="495" y="730" text-anchor="middle">即使位置几何合理，softmax entropy 也会漂移</text>
<text class="t s" x="495" y="766" text-anchor="middle">需要额外 magnitude / temperature compensation</text>

<path class="arrow" d="M730 675 H860"/>

<rect class="cyan" x="860" y="545" width="480" height="260" rx="22"/>
<text class="t st" x="1100" y="590" text-anchor="middle">Attention Scaling</text>
<text class="t b" x="1100" y="640" text-anchor="middle">Q / K 同步缩放</text>
<text class="t b" x="1100" y="684" text-anchor="middle">√(1/t) ≈ 0.1 ln s + 1</text>
<text class="t s" x="1100" y="730" text-anchor="middle">恢复更合适的 attention sharpness</text>
<text class="t s" x="1100" y="766" text-anchor="middle">与位置插值是不同机制</text>

<path class="arrow" d="M800 835 V910"/>

<rect class="deep" x="235" y="910" width="1130" height="155" rx="24"/>
<text class="t st" x="800" y="952" text-anchor="middle">YaRN = 频率分段位置外推 + Attention 分布补偿</text>
<text class="t b" x="800" y="1000" text-anchor="middle">输出：更长 context window；仍需 continued training / evaluation 验证模型是否真正会利用长上下文</text>
<text class="t s" x="800" y="1036" text-anchor="middle">它解决位置编码与 attention statistics，不等价于自动获得 long-context reasoning 能力</text>
</svg>
