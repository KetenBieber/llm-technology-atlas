<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="670" viewBox="0 0 1400 670"><rect width="1400" height="670" fill="#f8fafc"/><style>.h{font:700 28px Arial,'Microsoft YaHei',sans-serif;fill:#172236}.s{font:700 19px Arial,'Microsoft YaHei',sans-serif;fill:#172236}.b{font:16px Arial,'Microsoft YaHei',sans-serif;fill:#26394e}.n{font:14px Arial,'Microsoft YaHei',sans-serif;fill:#516379}.box{fill:white;stroke:#cdd7e3;stroke-width:2}.a{fill:#dbeafe;stroke:#7aa2d5;stroke-width:1.5}.g{fill:#dcfce7;stroke:#79b18b;stroke-width:1.5}.y{fill:#fef3c7;stroke:#d7ac55;stroke-width:1.5}.line{stroke:#7c8ca3;stroke-width:2.8;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#7c8ca3"/></marker></defs><text x="700" y="44" text-anchor="middle" class="h">Ring Attention：固定 Q 块，循环传递 KV 块</text><text x="700" y="78" text-anchor="middle" class="n">4 个 devices 的概念示意：每个设备负责自己的 Query block；每一轮用当前收到的 K/V 块更新 online softmax</text><rect x="125" y="146" width="280" height="148" rx="17" class="box"/><text x="265" y="183" class="s" text-anchor="middle">Device 0</text><text x="265" y="217" class="b" text-anchor="middle">Fixed Q_0</text><text x="265" y="247" class="b" text-anchor="middle">Rotating K/V blocks</text><text x="265" y="274" class="n" text-anchor="middle">Online max / sum / output</text><rect x="975" y="146" width="280" height="148" rx="17" class="box"/><text x="1115" y="183" class="s" text-anchor="middle">Device 1</text><text x="1115" y="217" class="b" text-anchor="middle">Fixed Q_1</text><text x="1115" y="247" class="b" text-anchor="middle">Rotating K/V blocks</text><text x="1115" y="274" class="n" text-anchor="middle">Online max / sum / output</text><rect x="975" y="406" width="280" height="148" rx="17" class="box"/><text x="1115" y="443" class="s" text-anchor="middle">Device 2</text><text x="1115" y="477" class="b" text-anchor="middle">Fixed Q_2</text><text x="1115" y="507" class="b" text-anchor="middle">Rotating K/V blocks</text><text x="1115" y="534" class="n" text-anchor="middle">Online max / sum / output</text><rect x="125" y="406" width="280" height="148" rx="17" class="box"/><text x="265" y="443" class="s" text-anchor="middle">Device 3</text><text x="265" y="477" class="b" text-anchor="middle">Fixed Q_3</text><text x="265" y="507" class="b" text-anchor="middle">Rotating K/V blocks</text><text x="265" y="534" class="n" text-anchor="middle">Online max / sum / output</text><path d="M420 220 H953" class="line"/><path d="M1115 302 V400" class="line"/><path d="M955 480 H428" class="line"/><path d="M265 400 V305" class="line"/><rect x="515" y="287" width="370" height="145" rx="12" class="g"/><text x="700" y="327" class="s" text-anchor="middle">完整 Attention 的等价分块累加</text><text x="700" y="361" class="b" text-anchor="middle">每行统一 softmax 统计量</text><text x="700" y="395" class="b" text-anchor="middle">Compute(KV block j) ∥ Send(next)</text><text x="700" y="607" class="n" text-anchor="middle">条件：块内计算足够久才能隐藏通信；序列变长时原始 dense 注意力总运算复杂度并未变为线性。</text><text x="700" y="635" class="n" text-anchor="middle">自制解释图，非原论文 Figure。</text></svg>