<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs>
  <style>
  text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#17212b}.title{font-size:40px;font-weight:700}.sub{font-size:23px;fill:#52606d}
  .h{font-size:29px;font-weight:700}.b{font-size:23px}.s{font-size:20px;fill:#52606d}.panel{fill:#fff;stroke:#c6d1dc;stroke-width:2}
  .coarse{fill:#e9f2ff;stroke:#1557b0;stroke-width:2}.fine{fill:#e7fbfc;stroke:#0e8f9b;stroke-width:2}.pick{fill:#edf9f0;stroke:#2e8b57;stroke-width:3}
  .formula{fill:#f7fafc;stroke:#9aa9b8;stroke-width:2}.warn{fill:#fff7ed;stroke:#d97706;stroke-width:2}
  </style>
</defs>
<rect width="1600" height="1100" fill="#fff"/>
<text x="800" y="62" text-anchor="middle" class="title">Fine-Grained Routing：为什么切细 Expert 会扩大组合空间</text>
<text x="800" y="101" text-anchor="middle" class="sub">组合数是结构自由度的上界；它说明路由颗粒度改变了，但不等于模型真的学会了几十亿个独立技能</text>

<rect x="55" y="150" width="710" height="720" rx="22" class="panel"/>
<text x="410" y="195" text-anchor="middle" class="h">粗粒度：N=16，Top-2</text>
<g>
<rect x="115" y="260" width="120" height="100" rx="14" class="pick"/><text x="175" y="318" text-anchor="middle" class="b">Expert 1 ✓</text>
<rect x="250" y="260" width="120" height="100" rx="14" class="coarse"/><text x="310" y="318" text-anchor="middle" class="b">Expert 2</text>
<rect x="385" y="260" width="120" height="100" rx="14" class="pick"/><text x="445" y="318" text-anchor="middle" class="b">Expert 3 ✓</text>
<rect x="520" y="260" width="120" height="100" rx="14" class="coarse"/><text x="580" y="318" text-anchor="middle" class="b">… 16</text>
</g>
<text x="410" y="430" text-anchor="middle" class="b">每个大 expert 内部可能同时绑定：</text>
<text x="410" y="472" text-anchor="middle" class="s">syntax + math + code + language + common patterns</text>
<rect x="145" y="545" width="530" height="175" rx="16" class="formula"/>
<text x="410" y="596" text-anchor="middle" class="h">可选组合数</text>
<text x="410" y="650" text-anchor="middle" class="h">C(16,2) = 120</text>
<text x="410" y="694" text-anchor="middle" class="s">Router 只能整块拿走 Expert 1 / 3 的全部函数</text>

<rect x="835" y="150" width="710" height="720" rx="22" class="panel"/>
<text x="1190" y="195" text-anchor="middle" class="h">细粒度：m=4 ⇒ 64 个小 experts，Top-8</text>
<g>
<rect x="895" y="260" width="82" height="82" rx="12" class="pick"/><text x="936" y="309" text-anchor="middle" class="b">A₁✓</text>
<rect x="990" y="260" width="82" height="82" rx="12" class="fine"/><text x="1031" y="309" text-anchor="middle" class="b">A₂</text>
<rect x="1085" y="260" width="82" height="82" rx="12" class="pick"/><text x="1126" y="309" text-anchor="middle" class="b">A₃✓</text>
<rect x="1180" y="260" width="82" height="82" rx="12" class="fine"/><text x="1221" y="309" text-anchor="middle" class="b">B₁</text>
<rect x="1275" y="260" width="82" height="82" rx="12" class="pick"/><text x="1316" y="309" text-anchor="middle" class="b">B₂✓</text>
<rect x="1370" y="260" width="82" height="82" rx="12" class="pick"/><text x="1411" y="309" text-anchor="middle" class="b">C₁✓</text>

<rect x="895" y="365" width="82" height="82" rx="12" class="fine"/><text x="936" y="414" text-anchor="middle" class="b">C₂</text>
<rect x="990" y="365" width="82" height="82" rx="12" class="pick"/><text x="1031" y="414" text-anchor="middle" class="b">D₁✓</text>
<rect x="1085" y="365" width="82" height="82" rx="12" class="fine"/><text x="1126" y="414" text-anchor="middle" class="b">D₂</text>
<rect x="1180" y="365" width="82" height="82" rx="12" class="pick"/><text x="1221" y="414" text-anchor="middle" class="b">E₁✓</text>
<rect x="1275" y="365" width="82" height="82" rx="12" class="fine"/><text x="1316" y="414" text-anchor="middle" class="b">…</text>
<rect x="1370" y="365" width="82" height="82" rx="12" class="pick"/><text x="1411" y="414" text-anchor="middle" class="b">64✓</text>
</g>
<text x="1190" y="505" text-anchor="middle" class="b">结构上可以跨原 expert 边界重新拼接更小函数块</text>
<rect x="925" y="545" width="530" height="175" rx="16" class="formula"/>
<text x="1190" y="596" text-anchor="middle" class="h">可选组合数上界</text>
<text x="1190" y="650" text-anchor="middle" class="h">C(64,8) = 4,426,165,368</text>
<text x="1190" y="694" text-anchor="middle" class="s">从 120 → 约 44 亿种离散组合</text>

<rect x="160" y="915" width="1280" height="125" rx="16" class="warn"/>
<text x="800" y="955" text-anchor="middle" class="b">正确解释：组合空间变大 ⇒ Router 有更多“函数块重组”自由度。</text>
<text x="800" y="995" text-anchor="middle" class="b">错误解释：模型一定实际使用全部组合 / 每个组合都有独立语义 / 表达能力因此增长几十亿倍。</text>
<text x="800" y="1027" text-anchor="middle" class="s">组合数是结构上界；真正是否形成更强 specialization 必须看 controlled ablation 与 intervention。</text>
</svg>