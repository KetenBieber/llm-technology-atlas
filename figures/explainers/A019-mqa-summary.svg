<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect x="0" y="0" width="1600" height="1200" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="800.0" y="64" font-family="Georgia, Microsoft YaHei, serif" font-size="48" font-weight="700" fill="#103B63" text-anchor="middle">MQA：共享 K/V Head，压缩 Decode 阶段 KV Cache</text><text x="800.0" y="108" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="600" fill="#60788D" text-anchor="middle">核心思想：Query 保持多头表达，所有 Query heads 共享一组 Key/Value</text><rect x="35" y="145" width="1530" height="760" rx="22" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="35" y="145" width="1530" height="58" rx="22" fill="#103B63"/><rect x="35" y="179" width="1530" height="24" fill="#103B63"/><text x="59" y="184" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start">MHA 与 MQA：计算复杂度相近，但 KV Cache / HBM 流量完全不同</text><rect x="70" y="225" width="700" height="570" rx="18" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><rect x="830" y="225" width="700" height="570" rx="18" fill="#F6FAFD" stroke="#B8D5E7" stroke-width="2"/><text x="420" y="270" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#103B63" text-anchor="middle">MHA</text><text x="1180" y="270" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#103B63" text-anchor="middle">MQA</text><rect x="160" y="325" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="325" width="12" height="82" rx="6" fill="#DF6B63"/><text x="188" y="358" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">h 个 Query heads</text><text x="188" y="387" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">Q₁ … Q_h</text><line x1="420" y1="407" x2="420" y2="433" stroke="#DF6B63" stroke-width="3"/><polygon points="420,433 406,425 406,441" fill="#DF6B63"/><rect x="160" y="440" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="440" width="12" height="82" rx="6" fill="#F5B85A"/><text x="188" y="473" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">h 个 Key heads</text><text x="188" y="502" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">K₁ … K_h</text><line x1="420" y1="522" x2="420" y2="548" stroke="#F5B85A" stroke-width="3"/><polygon points="420,548 406,540 406,556" fill="#F5B85A"/><rect x="160" y="555" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="555" width="12" height="82" rx="6" fill="#1573B8"/><text x="188" y="588" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">h 个 Value heads</text><text x="188" y="617" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">V₁ … V_h</text><line x1="420" y1="637" x2="420" y2="663" stroke="#1573B8" stroke-width="3"/><polygon points="420,663 406,655 406,671" fill="#1573B8"/><rect x="160" y="670" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="160" y="670" width="12" height="82" rx="6" fill="#DF6B63"/><text x="188" y="703" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">KV Cache ∝ h·L·d_head</text><text x="188" y="732" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">每个 decode token 需读取所有历史 K/V heads</text><rect x="160" y="720" width="520" height="54" rx="12" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="420" y="754" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#103B63" text-anchor="middle">质量强，但 Decode memory bandwidth 高</text><rect x="920" y="325" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="325" width="12" height="82" rx="6" fill="#0A9AA6"/><text x="948" y="358" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">h 个 Query heads</text><text x="948" y="387" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">仍保留多个 Q 子空间</text><line x1="1180" y1="407" x2="1180" y2="433" stroke="#0A9AA6" stroke-width="3"/><polygon points="1180,433 1166,425 1166,441" fill="#0A9AA6"/><rect x="920" y="440" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="440" width="12" height="82" rx="6" fill="#1573B8"/><text x="948" y="473" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">1 个 shared Key head</text><text x="948" y="502" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">所有 Q heads 共用 K</text><line x1="1180" y1="522" x2="1180" y2="548" stroke="#1573B8" stroke-width="3"/><polygon points="1180,548 1166,540 1166,556" fill="#1573B8"/><rect x="920" y="555" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="555" width="12" height="82" rx="6" fill="#56B99A"/><text x="948" y="588" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">1 个 shared Value head</text><text x="948" y="617" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">所有 Q heads 共用 V</text><line x1="1180" y1="637" x2="1180" y2="663" stroke="#56B99A" stroke-width="3"/><polygon points="1180,663 1166,655 1166,671" fill="#56B99A"/><rect x="920" y="670" width="520" height="82" rx="14" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><rect x="920" y="670" width="12" height="82" rx="6" fill="#0A9AA6"/><text x="948" y="703" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1C3550" text-anchor="start">KV Cache ∝ 1·L·d_head</text><text x="948" y="732" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#60788D" text-anchor="start">显著降低缓存容量与 HBM 读取</text><rect x="920" y="720" width="520" height="54" rx="12" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="1180" y="754" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#103B63" text-anchor="middle">Decode 更省显存/带宽，可能有质量折中</text><rect x="430" y="830" width="740" height="54" rx="12" fill="#E8F5FB" stroke="#8BCBE2" stroke-width="2"/><text x="800" y="864" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#103B63" text-anchor="middle">KV cache reduction ≈ h×（相对 MHA，固定 head_dim 时）</text><rect x="35" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="81" cy="1070" r="28" fill="#E8F5FB"/><text x="81" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">◎</text><text x="123" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">瓶颈：Decode bandwidth</text><text x="123" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">逐 token 生成时反复读取历史 KV Cache</text><rect x="550" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="596" cy="1070" r="28" fill="#E8F5FB"/><text x="596" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">⚙</text><text x="638" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">方法：共享 K/V</text><text x="638" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">Q 多头不变，K/V 从 h 组降为 1 组</text><rect x="1065" y="1020" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#B8D5E7" stroke-width="2"/><circle cx="1111" cy="1070" r="28" fill="#E8F5FB"/><text x="1111" y="1079" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1573B8" text-anchor="middle">▥</text><text x="1153" y="1063" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1573B8" text-anchor="start">效果：服务更高效</text><text x="1153" y="1096" font-family="Inter, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#60788D" text-anchor="start">支持更大 batch / 更长上下文，但不改变 O(L) 单步注意力扫描</text></svg>