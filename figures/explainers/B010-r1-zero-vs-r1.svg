<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#fbfbfd"/><style>.t{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#18212f}.h{font-size:28px;font-weight:700}.s{font-size:21px;font-weight:700}.b{font-size:17px}.m{font-size:15px;fill:#596575}.box{fill:white;stroke:#ced7e3;stroke-width:2;rx:18}.z{fill:#fff6ee;stroke:#d9ad7d}.r{fill:#f2f8ff;stroke:#8eb3dd}.a{stroke:#6f7c8b;stroke-width:2.2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#6f7c8b"/></marker></defs>
<text x="700" y="45" text-anchor="middle" class="t h">R1-Zero 与 R1：一个回答“能不能”，一个回答“怎么做成可用模型”</text>
<text x="350" y="95" text-anchor="middle" class="t s">R1-Zero：科学探针</text><text x="1050" y="95" text-anchor="middle" class="t s">R1：产品化训练管线</text>
<rect x="120" y="135" width="460" height="80" class="box z"/><text x="350" y="183" text-anchor="middle" class="t s">DeepSeek-V3-Base</text>
<rect x="820" y="135" width="460" height="80" class="box r"/><text x="1050" y="183" text-anchor="middle" class="t s">DeepSeek-V3-Base</text>
<rect x="120" y="270" width="460" height="95" class="box z"/><text x="350" y="305" text-anchor="middle" class="t s">直接 Reasoning RL</text><text x="350" y="338" text-anchor="middle" class="t b">无 reasoning SFT cold start</text>
<path d="M350 215 L350 270" class="a"/>
<rect x="820" y="250" width="460" height="95" class="box r"/><text x="1050" y="285" text-anchor="middle" class="t s">Cold-start SFT → Reasoning RL</text><text x="1050" y="318" text-anchor="middle" class="t b">先塑形可读轨迹，再扩大 reasoning 能力</text>
<path d="M1050 215 L1050 250" class="a"/>
<rect x="120" y="425" width="460" height="120" class="box z"/><text x="350" y="462" text-anchor="middle" class="t s">观察到：能力↑，但行为缺陷也出现</text><text x="350" y="495" text-anchor="middle" class="t b">可读性差 / language mixing / 通用能力不足</text><text x="350" y="525" text-anchor="middle" class="t b">它验证“RL 能否激发 reasoning”</text>
<path d="M350 365 L350 425" class="a"/>
<rect x="820" y="400" width="460" height="150" class="box r"/><text x="1050" y="438" text-anchor="middle" class="t s">Sampling → SFT → All-scenario RL</text><text x="1050" y="472" text-anchor="middle" class="t b">把高质量 reasoning 轨迹回流监督训练</text><text x="1050" y="504" text-anchor="middle" class="t b">再处理 helpfulness / harmlessness</text>
<path d="M1050 345 L1050 400" class="a"/>
<text x="350" y="615" text-anchor="middle" class="t m">问题：Reasoning 能否在无 reasoning SFT 冷启动下出现？</text>
<text x="1050" y="615" text-anchor="middle" class="t m">问题：怎样把这种能力做成稳定、通用、可对齐的 assistant？</text>
<text x="700" y="675" text-anchor="middle" class="t m">自制解释图：R1-Zero 与 R1 的目标不同，不能把二者都简化成“GRPO 训练”。</text>
</svg>