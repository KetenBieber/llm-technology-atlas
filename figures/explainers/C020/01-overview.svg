<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="600" viewBox="0 0 1450 600"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#64748b"/></marker></defs><style>.title{font:700 28px 'Microsoft YaHei',Arial,sans-serif;fill:#193049}.head{font:700 21px 'Microsoft YaHei',Arial,sans-serif;fill:#193049}.body{font:17px 'Microsoft YaHei',Arial,sans-serif;fill:#29425f}.small{font:15px 'Microsoft YaHei',Arial,sans-serif;fill:#5b708a}</style><rect width="1450" height="600" fill="#f8fafc"/><text x="725" y="51" text-anchor="middle" class="title">Speculative Decoding · Exact Coupling</text><rect x="58" y="119" width="395" height="295" rx="18" fill="#e8f1ff" stroke="#7e96b1" stroke-width="1.5"/><text x="255" y="180" text-anchor="middle" class="head">Draft q 提议多个 token</text><path d="M86 215 H425" stroke="#9aacbc" stroke-width="1.5"/><text x="255" y="266" text-anchor="middle" class="body">便宜模型给候选</text><text x="255" y="325" text-anchor="middle" class="small">Step 1 · 识别状态</text><path d="M459 265 h60" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="530" y="119" width="395" height="295" rx="18" fill="#edf9ef" stroke="#7e96b1" stroke-width="1.5"/><text x="727" y="180" text-anchor="middle" class="head">Target p 一次并行验证</text><path d="M558 215 H897" stroke="#9aacbc" stroke-width="1.5"/><text x="727" y="266" text-anchor="middle" class="body">目标条件概率逐位置验证</text><text x="727" y="325" text-anchor="middle" class="small">Step 2 · 搬运与执行</text><path d="M931 265 h60" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="1002" y="119" width="395" height="295" rx="18" fill="#fff3df" stroke="#7e96b1" stroke-width="1.5"/><text x="1199" y="180" text-anchor="middle" class="head">接受 / 拒绝 + 残差</text><path d="M1030 215 H1369" stroke="#9aacbc" stroke-width="1.5"/><text x="1199" y="266" text-anchor="middle" class="body">输出保持目标 p 分布</text><text x="1199" y="325" text-anchor="middle" class="small">Step 3 · 结果及代价</text><rect x="58" y="457" width="1339" height="83" rx="13" fill="white" stroke="#cbd5e1"/><text x="725" y="490" class="body" text-anchor="middle">关键证明：min(p,q) 被接受，正残差 [p-q]₊ 填补剩余概率</text><text x="725" y="575" text-anchor="middle" class="small">自制解释图 · 非论文原图 · 不含实验测量数据</text></svg>