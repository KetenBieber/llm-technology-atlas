<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#ffffff"/>
<text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">YaRN：不同 RoPE 频段不应该被同样压缩</text>
<text x="60" y="110" font-family="Arial, sans-serif" font-size="20" fill="#4b5563">r(d)=L/λ_d 表示预训练窗口内该频段完成了多少圈旋转</text>
<line x1="110" y1="360" x2="1090" y2="360" stroke="#111827" stroke-width="4"/>
<polygon points="1090,360 1070,348 1070,372" fill="#111827"/>
<text x="90" y="405" font-family="Arial, sans-serif" font-size="18" fill="#374151">低 r：长波长 / 低频</text>
<text x="905" y="405" font-family="Arial, sans-serif" font-size="18" fill="#374151">高 r：短波长 / 高频</text>
<rect x="120" y="210" width="260" height="120" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
<text x="250" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">r &lt; α</text>
<text x="250" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#991b1b">完全插值</text>
<text x="250" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7f1d1d">θ → θ / s</text>
<rect x="430" y="210" width="340" height="120" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="600" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#92400e">α ≤ r ≤ β</text>
<text x="600" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#92400e">平滑混合</text>
<text x="600" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#78350f">(1−γ) θ/s + γ θ</text>
<rect x="820" y="210" width="260" height="120" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
<text x="950" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">r &gt; β</text>
<text x="950" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#166534">保持原频率</text>
<text x="950" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#14532d">θ → θ</text>
<text x="120" y="470" font-family="Arial, sans-serif" font-size="20" fill="#4b5563">直觉：</text>
<text x="185" y="470" font-family="Arial, sans-serif" font-size="20" fill="#111827">低频维度在预训练窗口里甚至没转满一圈，容易携带“绝对位置”线索 → 必须压回训练范围。</text>
<text x="120" y="510" font-family="Arial, sans-serif" font-size="20" fill="#111827">高频维度已经转了很多圈，主要承担局部相对距离分辨率 → 不应被 PI 一刀切地全部降频。</text>
<text x="120" y="565" font-family="Arial, sans-serif" font-size="18" fill="#6b7280">LLaMA 系论文经验值：α=1，β=32。它们是经验超参数，不是普适常数。</text>
</svg>