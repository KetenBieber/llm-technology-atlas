<text x="655" y="575" text-anchor="middle" class="mono">Â = softmax(Q_probe Kᵀ)</text><text x="655" y="612" text-anchor="middle" class="mono">shape: 64 × L</text>
<rect x="500" y="680" width="310" height="120" rx="16" class="green"/><text x="655" y="725" text-anchor="middle" class="n">Estimator cost</text><text x="655" y="765" text-anchor="middle" class="mono">O(64·L·d) ≪ O(L²d)</text>

<path d="M855 450H930" class="flow"/>
<rect x="940" y="165" width="590" height="770" rx="22" class="panel"/><text x="970" y="210" class="h">3 · 两种几何聚合</text>
<text x="995" y="270" class="n">Vertical score：同一 Key column 被多少 probe query 持续关注</text>
<rect x="1000" y="305" width="470" height="120" rx="16" class="cyan"/><text x="1235" y="352" text-anchor="middle" class="mono">s_v(j) = Σ_i Â_ij</text><text x="1235" y="392" text-anchor="middle" class="n">TopK → dynamic key columns 𝓘_v</text>
<text x="995" y="500" class="n">Slash score：固定相对距离 δ=i−j 的对角线累积</text>
<rect x="1000" y="535" width="470" height="120" rx="16" class="blue"/><text x="1235" y="582" text-anchor="middle" class="mono">s_s(δ) = Σ_(i−j=δ) Â_ij</text><text x="1235" y="622" text-anchor="middle" class="n">TopK → dynamic offsets 𝓘_s</text>
<path d="M1235 655V720" class="flow"/>
<rect x="1015" y="730" width="440" height="145" rx="18" class="orange"/><text x="1235" y="773" text-anchor="middle" class="n">几何索引 → GPU sparse format</text><text x="1235" y="810" text-anchor="middle" class="small">vertical columns + slash block ranges</text><text x="1235" y="845" text-anchor="middle" class="small">合并 overlap 后交给 sparse kernel</text>
<text x="800" y="1010" text-anchor="middle" class="n">核心假设：pattern family 稳定，但具体 column / relative offset 必须随当前 prompt 在线估计。</text>
</svg>