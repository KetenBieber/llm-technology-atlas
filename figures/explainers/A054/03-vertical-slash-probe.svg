<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>MInference Vertical–Slash：用 64 个末端 Query 预测整条长序列</title><desc>Last-query probe 把 L×L mask search 降为 64×L，再分别沿列与相对对角线聚合。</desc><defs>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1557B0"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E58A1F"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2E8B57"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C23B3B"/></marker>
  <style>
  text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324D}
  .title{font-size:46px;font-weight:700}.sub{font-size:23px;fill:#596579}.h{font-size:28px;font-weight:700}
  .n{font-size:22px}.small{font-size:20px}.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:21px}
  .panel{fill:#F8FBFE;stroke:#B8CADB;stroke-width:2}.blue{fill:#EAF3FF;stroke:#1557B0;stroke-width:2.5}
  .cyan{fill:#E8FAFB;stroke:#0E9AA7;stroke-width:2.5}.orange{fill:#FFF4E6;stroke:#E58A1F;stroke-width:2.5}
  .green{fill:#ECF8F1;stroke:#2E8B57;stroke-width:2.5}.red{fill:#FFF0F0;stroke:#C23B3B;stroke-width:2.5}
  .gray{fill:#F1F4F7;stroke:#7D8B99;stroke-width:2}.flow{fill:none;stroke:#1557B0;stroke-width:4;marker-end:url(#ab)}
  .comm{fill:none;stroke:#E58A1F;stroke-width:4;stroke-dasharray:11 8;marker-end:url(#ao)}
  .good{fill:none;stroke:#2E8B57;stroke-width:4;marker-end:url(#ag)}.bad{fill:none;stroke:#C23B3B;stroke-width:4;marker-end:url(#ar)}
  </style>
</defs><rect width="1600" height="1100" fill="#FFFFFF"/><text x="70" y="72" class="title">MInference Vertical–Slash：用 64 个末端 Query 预测整条长序列</text>
<text x="70" y="112" class="sub">认知问题：不计算完整 L×L Attention，怎样找出动态 vertical columns 与 slash offsets？</text>
<rect x="70" y="165" width="330" height="770" rx="22" class="panel"/><text x="100" y="210" class="h">1 · 取末端 Probe</text>
<rect x="118" y="280" width="220" height="430" fill="#F1F4F7" stroke="#7D8B99" stroke-width="2"/>
<rect x="145" y="300" width="165" height="20" rx="5" fill="#DCE5ED"/><rect x="145" y="330" width="165" height="20" rx="5" fill="#DCE5ED"/><rect x="145" y="360" width="165" height="20" rx="5" fill="#DCE5ED"/><rect x="145" y="390" width="165" height="20" rx="5" fill="#DCE5ED"/><rect x="145" y="420" width="165" height="20" rx="5" fill="#DCE5ED"/><rect x="145" y="450" width="165" height="20" rx="5" fill="#DCE5ED"/><rect x="145" y="480" width="165" height="20" rx="5" fill="#DCE5ED"/><rect x="145" y="510" width="165" height="20" rx="5" fill="#DCE5ED"/><rect x="145" y="540" width="165" height="20" rx="5" fill="#DCE5ED"/><rect x="145" y="570" width="165" height="20" rx="5" fill="#DCE5ED"/><rect x="145" y="600" width="165" height="20" rx="5" fill="#0E9AA7"/><rect x="145" y="630" width="165" height="20" rx="5" fill="#0E9AA7"/>
<path d="M338 654H445" class="flow"/><text x="228" y="755" text-anchor="middle" class="mono">Q_probe = Q[-64:]</text><text x="228" y="790" text-anchor="middle" class="small">末端 Query 几乎可见完整历史</text>

<rect x="455" y="165" width="400" height="770" rx="22" class="panel"/><text x="485" y="210" class="h">2 · 只算 64×L Probe Matrix</text>
