<text class="t b" x="875" y="385">单步 attention：O(Ld)</text>
<text class="t s muted" x="875" y="430">MInference 主要优化 prefill；decode 的收益/索引开销权衡不同。</text>

<path d="M 430 520 C 430 575, 430 575, 430 620" class="fo"/>
<path d="M 1180 520 C 1180 575, 1180 575, 1180 620" class="f"/>

<rect x="80" y="635" width="1440" height="220" rx="22" class="orange"/>
<text class="t sub" x="110" y="680">论文设置下的 bottleneck evidence（LLaMA-3-8B · single A100）</text>
<text class="t b" x="120" y="730">300K dense prefill ≈ 6 min</text>
<text class="t b" x="520" y="730">1M dense prefill ≈ 30 min</text>
<text class="t b" x="900" y="730">超长 prompt：attention 占 prefill latency &gt; 90%</text>
<text class="t s muted" x="120" y="780">这些是论文硬件/实现条件下的 measured evidence，不应外推为任意 GPU/模型的固定常数。</text>
<text class="t b" x="120" y="820">MInference 的目标：不再计算所有 L² entries，而是动态选择真正需要的结构化 sparse regions。</text>

<rect x="255" y="905" width="1090" height="115" rx="18" class="green"/>
<text class="t sub" x="285" y="948">优化对象从“搬得更聪明”进一步变成“少算大量不重要 score”</text>
<text class="t b" x="285" y="990">Dense FA：same math + better IO schedule　→　MInference：input-dependent structured sparse compute</text>
</svg>