<text class="t title" x="64" y="72">MInference · Dense Prefill：L×L score space 才是 TTFT 瓶颈</text>
<text class="t b muted" x="66" y="112">核心问题：为什么百万 token 的 TTFT 会被 prefill attention 拖垮，而 decode 不是同一种二次瓶颈？</text>

<rect x="65" y="155" width="700" height="355" rx="22" class="red"/>
<text class="t sub" x="95" y="198">Prefill：many Q × many K</text>
<text class="t b" x="95" y="238">Q,K ∈ Rᴸˣᵈ → QKᵀ ∈ Rᴸˣᴸ → O(L²d)</text>
