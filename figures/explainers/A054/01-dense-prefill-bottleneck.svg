<text class="t b" x="365" y="302">L = 10⁶ ⇒ L² = 10¹²</text>
<text class="t b" x="365" y="344">万亿级 query–key interactions</text>
<text class="t s muted" x="365" y="390">FlashAttention 可降 IO，但仍计算 dense score pairs。</text>
<text class="t s muted" x="365" y="430">因此 context 继续增大时，算术规模仍按 L² 增长。</text>

<rect x="835" y="155" width="700" height="355" rx="22" class="blue"/>
<text class="t sub" x="865" y="198">Decode：one new Q × historical K</text>
<text class="t b" x="865" y="238">qₜ ∈ R¹ˣᵈ，K ∈ Rᴸˣᵈ → qₜKᵀ ∈ R¹ˣᴸ</text>
