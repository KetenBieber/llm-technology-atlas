<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
<rect width="1440" height="960" fill="#f8fafc"/>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
  <style>
    .tt{font:700 34px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
    .sub{font:500 18px Arial,'Microsoft YaHei',sans-serif;fill:#475569}
    .h{font:700 22px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
    .t{font:500 17px Arial,'Microsoft YaHei',sans-serif;fill:#1e293b}
    .s{font:500 15px Arial,'Microsoft YaHei',sans-serif;fill:#475569}
    .b{fill:#ffffff;stroke:#94a3b8;stroke-width:2;rx:18}
    .bl{fill:#dbeafe;stroke:#3b82f6;stroke-width:2;rx:18}
    .cy{fill:#cffafe;stroke:#06b6d4;stroke-width:2;rx:18}
    .sl{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2;rx:18}
    .deep{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.4;rx:18}
    .a{stroke:#475569;stroke-width:2.7;fill:none;marker-end:url(#arr)}
    .d{stroke:#64748b;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#arr)}
  </style>
</defs>
<text x="64" y="62" class="tt">DeepSeekMoE：把“专家不够专”拆成两类结构性问题分别解决</text>
<text x="64" y="96" class="sub">Fine-grained segmentation 提高可组合粒度；Shared expert isolation 把共通知识从 routed experts 中剥离。</text>
<text x="70" y="155" class="h">传统 MoE 的两个失败模式</text>
<rect x="70" y="190" width="580" height="150" class="sl"/>
<text x="110" y="235" class="h">Knowledge Hybridity</text>
<text x="110" y="273" class="t">一个大 expert 被迫同时容纳多种知识</text>
<text x="110" y="307" class="s">Router 能选 expert，却不能选 expert 内部更细的知识子块</text>

<rect x="790" y="190" width="580" height="150" class="sl"/>
<text x="830" y="235" class="h">Knowledge Redundancy</text>
<text x="830" y="273" class="t">多个 routed experts 重复学习“所有 token 都常用”的共通知识</text>
<text x="830" y="307" class="s">稀疏路由把本应共享的能力重复复制到不同 experts</text>

<rect x="90" y="430" width="540" height="245" class="bl"/>
<text x="130" y="475" class="h">Fine-Grained Expert Segmentation</text>
<text x="130" y="515" class="t">大 expert → 更多、更小的 routed experts</text>
<text x="130" y="555" class="t">每 token 激活更多“小块”，总 active compute 近似保持</text>
<text x="130" y="595" class="t">组合数大幅增加 → 路由粒度更细</text>
<text x="130" y="635" class="s">解决：一个 expert 像“杂货铺”，专业化边界不清</text>
<path d="M360 340 V430" class="a"/>

<rect x="810" y="430" width="540" height="245" class="cy"/>
<text x="850" y="475" class="h">Shared Expert Isolation</text>
<text x="850" y="515" class="t">部分 shared experts 对所有 token 永远激活</text>
<text x="850" y="555" class="t">共通知识集中到 shared path</text>
<text x="850" y="595" class="t">routed experts 更专注于条件性 / 差异化知识</text>
<text x="850" y="635" class="s">解决：多个 routed experts 重复学习相似基础能力</text>
<path d="M1080 340 V430" class="a"/>

<rect x="355" y="755" width="730" height="105" class="deep"/>
<text x="395" y="800" class="h">核心设计约束：总 expert 参数与每 token active compute 基本不变</text>
<text x="395" y="838" class="t">收益来自“参数组织方式 + 路由组合自由度”的改变，而不是简单多算更多 FLOPs。</text>
<path d="M360 675 C420 735 500 745 590 755" class="a"/>
<path d="M1080 675 C1015 735 940 745 850 755" class="a"/>
<text x="720" y="925" text-anchor="middle" class="s">自制总结架构图：提炼文章核心机制，不复刻原论文图。</text></svg>