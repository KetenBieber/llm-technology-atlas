<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><defs><style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#14213d}.title{font-size:48px;font-weight:700}.sub{font-size:24px;fill:#607086}.h{font-size:29px;font-weight:700}.n{font-size:24px;font-weight:650}.b{font-size:21px}.s{font-size:20px;fill:#607086}.formula{font-family:"STIX Two Math","Cambria Math",serif;font-size:23px}.box{fill:#f8fbff;stroke:#8fb6d9;stroke-width:2}.state{fill:#ecfbfc;stroke:#3ba9b3;stroke-width:2}.gray{fill:#f4f6f8;stroke:#aab6c3;stroke-width:2}.warn{fill:#fff2f1;stroke:#cf5c57;stroke-width:2}.good{fill:#eef9f2;stroke:#4ca267;stroke-width:2}.cost{fill:#fff7e9;stroke:#df942c;stroke-width:2}.blue{stroke:#246aa5;stroke-width:5;fill:none}.cyan{stroke:#2599a6;stroke-width:4;fill:none}.green{stroke:#3d995c;stroke-width:5;fill:none}.orange{stroke:#d9871c;stroke-width:4;fill:none}.red{stroke:#c8504b;stroke-width:4;fill:none}.dash{stroke-dasharray:12 10}</style><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246aa5"/></marker><marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2599a6"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d995c"/></marker><marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9871c"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8504b"/></marker></defs><rect width="1600" height="1200" fill="#fff"/><text x="70" y="75" class="title">A004 · BatchNorm：Training 与 Inference 是两套统计路径</text><text x="72" y="115" class="sub">γ、β 两边都用；不同的是均值/方差从哪里来，以及样本之间是否互相影响。</text>
<rect x="55" y="165" width="1490" height="790" rx="28" class="gray"/>
<rect x="85" y="210" width="690" height="700" rx="26" class="box"/><text x="115" y="260" class="h">Training · current minibatch statistics</text>
<rect x="130" y="330" width="220" height="115" rx="18" class="state"/><text x="240" y="375" text-anchor="middle" class="n">X</text><text x="240" y="410" text-anchor="middle" class="b">[B,C,H,W]</text>
<rect x="440" y="285" width="265" height="155" rx="20" class="cost"/><text x="573" y="330" text-anchor="middle" class="n">reduce B,H,W</text><text x="573" y="370" text-anchor="middle" class="formula">μB[c], σB²[c]</text><text x="573" y="405" text-anchor="middle" class="s">m = BHW per channel</text>
<path d="M350 385 H440" class="orange" marker-end="url(#ao)"/>
<rect x="420" y="520" width="300" height="140" rx="20" class="state"/><text x="570" y="565" text-anchor="middle" class="n">normalize</text><text x="570" y="608" text-anchor="middle" class="formula">x̂=(x−μB)/√(σB²+ε)</text>
<path d="M240 445 C250 555 350 590 420 590" class="blue" marker-end="url(#ab)"/><path d="M573 440 V520" class="orange" marker-end="url(#ao)"/>
<rect x="420" y="735" width="300" height="120" rx="20" class="good"/><text x="570" y="780" text-anchor="middle" class="n">learnable affine</text><text x="570" y="820" text-anchor="middle" class="formula">Y=γx̂+β</text><path d="M570 660 V735" class="green" marker-end="url(#ag)"/>
<rect x="120" y="655" width="220" height="120" rx="18" class="cost"/><text x="230" y="700" text-anchor="middle" class="n">running stats</text><text x="230" y="738" text-anchor="middle" class="b">EMA update only</text><path d="M440 370 C330 470 260 560 240 655" class="orange dash" marker-end="url(#ao)"/>

<rect x="825" y="210" width="690" height="700" rx="26" class="good"/><text x="855" y="260" class="h">Inference · fixed running / population estimate</text>
<rect x="870" y="330" width="220" height="115" rx="18" class="state"/><text x="980" y="375" text-anchor="middle" class="n">X</text><text x="980" y="410" text-anchor="middle" class="b">single / any batch</text>
<rect x="1170" y="290" width="270" height="150" rx="20" class="cost"/><text x="1305" y="335" text-anchor="middle" class="n">fixed statistics</text><text x="1305" y="375" text-anchor="middle" class="formula">μrun[c], σrun²[c]</text><text x="1305" y="408" text-anchor="middle" class="s">不从当前请求重新估计</text>
<rect x="1110" y="520" width="330" height="140" rx="20" class="state"/><text x="1275" y="565" text-anchor="middle" class="n">deterministic affine</text><text x="1275" y="608" text-anchor="middle" class="formula">γ(x−μrun)/√(σrun²+ε)+β</text>
<path d="M1090 385 C1140 455 1170 500 1190 520" class="blue" marker-end="url(#ab)"/><path d="M1305 440 V520" class="orange" marker-end="url(#ao)"/>
<rect x="1110" y="735" width="330" height="120" rx="20" class="good"/><text x="1275" y="780" text-anchor="middle" class="n">可 fold 到前一 Conv/Linear</text><text x="1275" y="820" text-anchor="middle" class="b">统计固定 ⇒ 本步是固定 affine</text><path d="M1275 660 V735" class="green" marker-end="url(#ag)"/>

<rect x="70" y="995" width="710" height="145" rx="22" class="warn"/><text x="100" y="1040" class="h">Training 的结构性质</text><text x="105" y="1090" class="b">同 batch 其他样本改变 μB、σB²，因此一个样本的输出也会改变。</text>
<rect x="820" y="995" width="710" height="145" rx="22" class="good"/><text x="850" y="1040" class="h">Inference 的结构性质</text><text x="855" y="1090" class="b">固定统计下请求之间不再因 BN 直接耦合；独立 BN kernel 还可被融合。</text>
</svg>