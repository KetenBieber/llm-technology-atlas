<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><defs><style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#14213d}.title{font-size:48px;font-weight:700}.sub{font-size:24px;fill:#607086}.h{font-size:29px;font-weight:700}.n{font-size:24px;font-weight:650}.b{font-size:21px}.s{font-size:20px;fill:#607086}.formula{font-family:"STIX Two Math","Cambria Math",serif;font-size:23px}.box{fill:#f8fbff;stroke:#8fb6d9;stroke-width:2}.state{fill:#ecfbfc;stroke:#3ba9b3;stroke-width:2}.gray{fill:#f4f6f8;stroke:#aab6c3;stroke-width:2}.warn{fill:#fff2f1;stroke:#cf5c57;stroke-width:2}.good{fill:#eef9f2;stroke:#4ca267;stroke-width:2}.cost{fill:#fff7e9;stroke:#df942c;stroke-width:2}.blue{stroke:#246aa5;stroke-width:5;fill:none}.cyan{stroke:#2599a6;stroke-width:4;fill:none}.green{stroke:#3d995c;stroke-width:5;fill:none}.orange{stroke:#d9871c;stroke-width:4;fill:none}.red{stroke:#c8504b;stroke-width:4;fill:none}.dash{stroke-dasharray:12 10}</style><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246aa5"/></marker><marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2599a6"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d995c"/></marker><marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9871c"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8504b"/></marker></defs><rect width="1600" height="1200" fill="#fff"/><text x="70" y="75" class="title">A004 · Conv–BN Fusion：固定统计后为何能消掉独立 BN kernel</text><text x="72" y="115" class="sub">训练时 BN 是 batch-dependent 非线性统计图；推理时统计固定后，它退化成逐通道 affine。</text>
<rect x="60" y="170" width="710" height="760" rx="28" class="warn"/><text x="95" y="220" class="h">Training · 不能永久 fold</text>
<rect x="110" y="325" width="190" height="120" rx="18" class="box"/><text x="205" y="370" text-anchor="middle" class="n">Conv</text><text x="205" y="407" text-anchor="middle" class="formula">x=Wu+b</text>
<rect x="400" y="290" width="280" height="190" rx="20" class="state"/><text x="540" y="335" text-anchor="middle" class="n">BatchNorm(train)</text><text x="540" y="378" text-anchor="middle" class="formula">μB,σB² ← current X</text><text x="540" y="420" text-anchor="middle" class="formula">y=γ(x−μB)/√(σB²+ε)+β</text>
<path d="M300 385 H400" class="blue" marker-end="url(#ab)"/>
<path d="M540 480 C530 550 460 560 430 500" class="orange dash" marker-end="url(#ao)"/><text x="500" y="600" text-anchor="middle" class="b">μB、σB² 每个 batch 都变</text>
<rect x="135" y="675" width="565" height="165" rx="22" class="warn"/><text x="170" y="722" class="n">Backward 还必须穿过统计量依赖</text><text x="170" y="770" class="b">xⱼ 不只影响自己的 yⱼ，还改变共享 mean / variance。</text><text x="170" y="812" class="s">所以训练 BN 不是一组固定的 W′、b′。</text>

<rect x="825" y="170" width="715" height="760" rx="28" class="good"/><text x="860" y="220" class="h">Inference · fold 到 Conv</text>
<rect x="865" y="300" width="210" height="115" rx="18" class="box"/><text x="970" y="345" text-anchor="middle" class="n">Conv</text><text x="970" y="380" text-anchor="middle" class="formula">x=Wu+b</text>
<rect x="1160" y="270" width="300" height="175" rx="20" class="state"/><text x="1310" y="315" text-anchor="middle" class="n">BN(eval)</text><text x="1310" y="355" text-anchor="middle" class="formula">a=γ/√(σrun²+ε)</text><text x="1310" y="397" text-anchor="middle" class="formula">y=ax−aμrun+β</text><path d="M1075 357 H1160" class="blue" marker-end="url(#ab)"/>
<rect x="920" y="565" width="485" height="205" rx="24" class="good"/><text x="1163" y="612" text-anchor="middle" class="n">预计算 fused parameters</text><text x="1163" y="660" text-anchor="middle" class="formula">Wfused = a W</text><text x="1163" y="708" text-anchor="middle" class="formula">bfused = a(b−μrun)+β</text>
<path d="M970 415 C980 500 1030 535 1080 565" class="green" marker-end="url(#ag)"/><path d="M1310 445 C1290 510 1250 540 1220 565" class="green" marker-end="url(#ag)"/>
<rect x="980" y="815" width="360" height="90" rx="18" class="cost"/><text x="1160" y="853" text-anchor="middle" class="n">部署只执行 fused Conv</text><text x="1160" y="885" text-anchor="middle" class="s">独立 BN kernel / 中间写回可消失</text>
<path d="M1163 770 V815" class="orange" marker-end="url(#ao)"/>

<rect x="75" y="980" width="1450" height="160" rx="24" class="gray"/><text x="105" y="1025" class="h">系统层意义</text><text x="110" y="1075" class="b">Fusion 不改变网络函数；它利用“推理统计固定”把两段 affine 合并，减少 kernel launch 与中间 activation 读写。</text><text x="110" y="1115" class="s">收益取决于编译器、kernel 与硬件；不能把“可融合”写成所有平台固定的 latency 倍数。</text>
</svg>