<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><defs><style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#14213d}.title{font-size:48px;font-weight:700}.sub{font-size:24px;fill:#607086}.h{font-size:29px;font-weight:700}.n{font-size:24px;font-weight:650}.b{font-size:21px}.s{font-size:20px;fill:#607086}.formula{font-family:"STIX Two Math","Cambria Math",serif;font-size:23px}.box{fill:#f8fbff;stroke:#8fb6d9;stroke-width:2}.state{fill:#ecfbfc;stroke:#3ba9b3;stroke-width:2}.gray{fill:#f4f6f8;stroke:#aab6c3;stroke-width:2}.warn{fill:#fff2f1;stroke:#cf5c57;stroke-width:2}.good{fill:#eef9f2;stroke:#4ca267;stroke-width:2}.cost{fill:#fff7e9;stroke:#df942c;stroke-width:2}.blue{stroke:#246aa5;stroke-width:5;fill:none}.cyan{stroke:#2599a6;stroke-width:4;fill:none}.green{stroke:#3d995c;stroke-width:5;fill:none}.orange{stroke:#d9871c;stroke-width:4;fill:none}.red{stroke:#c8504b;stroke-width:4;fill:none}.dash{stroke-dasharray:12 10}</style><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246aa5"/></marker><marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2599a6"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d995c"/></marker><marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9871c"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8504b"/></marker></defs><rect width="1600" height="1200" fill="#fff"/><text x="70" y="75" class="title">A004 · Conv-BN 的归约轴与 Backward Coupling</text><text x="72" y="115" class="sub">X∈ℝ[B,C,H,W] 时，固定通道 c 的 B×H×W 个位置共同决定同一组统计量。</text>
<rect x="55" y="165" width="1490" height="950" rx="28" class="gray"/>
<text x="85" y="215" class="h">Forward：选定 channel c，把 B×H×W 个位置视为同类 feature samples</text>
<rect x="95" y="285" width="370" height="330" rx="24" class="box"/><text x="280" y="330" text-anchor="middle" class="n">X [B,C,H,W]</text>
<g fill="#dff4f6" stroke="#3ba9b3" stroke-width="2"><rect x="145" y="390" width="80" height="65"/><rect x="235" y="390" width="80" height="65"/><rect x="325" y="390" width="80" height="65"/><rect x="145" y="465" width="80" height="65"/><rect x="235" y="465" width="80" height="65"/><rect x="325" y="465" width="80" height="65"/></g>
<text x="280" y="575" text-anchor="middle" class="s">示意：固定 c，沿 B,H,W 聚合</text>
<rect x="555" y="320" width="330" height="230" rx="24" class="cost"/><text x="720" y="365" text-anchor="middle" class="n">Reduction</text><text x="720" y="415" text-anchor="middle" class="formula">μc = (1/BHW) Σb,h,w Xbchw</text><text x="720" y="465" text-anchor="middle" class="formula">σc² = mean[(X−μc)²]</text><text x="720" y="510" text-anchor="middle" class="b">μ,σ² shape = [C]</text>
<path d="M465 445 H555" class="orange" marker-end="url(#ao)"/>
<rect x="985" y="305" width="445" height="260" rx="24" class="state"/><text x="1208" y="350" text-anchor="middle" class="n">Broadcast back to every position</text><text x="1208" y="400" text-anchor="middle" class="formula">X̂bchw=(Xbchw−μc)/√(σc²+ε)</text><text x="1208" y="450" text-anchor="middle" class="formula">Ybchw=γc X̂bchw+βc</text><text x="1208" y="500" text-anchor="middle" class="b">γ,β shape = [C]</text>
<path d="M885 435 H985" class="blue" marker-end="url(#ab)"/>

<text x="85" y="690" class="h">Backward：共享 mean / variance 让同一 channel 内的梯度互相耦合</text>
<rect x="95" y="745" width="430" height="280" rx="24" class="box"/><text x="310" y="790" text-anchor="middle" class="n">upstream dᵢ = ∂L/∂yᵢ</text>
<circle cx="185" cy="880" r="28" fill="#8fd3da"/><circle cx="310" cy="880" r="28" fill="#8fd3da"/><circle cx="435" cy="880" r="28" fill="#8fd3da"/><text x="185" y="935" text-anchor="middle" class="s">d₁</text><text x="310" y="935" text-anchor="middle" class="s">d₂</text><text x="435" y="935" text-anchor="middle" class="s">dₘ</text>
<rect x="630" y="735" width="410" height="300" rx="24" class="cost"/><text x="835" y="780" text-anchor="middle" class="n">shared reductions</text><text x="835" y="835" text-anchor="middle" class="formula">Σᵢ dᵢ</text><text x="835" y="890" text-anchor="middle" class="formula">Σᵢ dᵢ x̂ᵢ</text><text x="835" y="950" text-anchor="middle" class="b">均值修正 + 方差方向修正</text>
<path d="M213 880 C400 790 520 810 630 835" class="orange" marker-end="url(#ao)"/><path d="M338 880 H630" class="orange" marker-end="url(#ao)"/><path d="M463 880 C540 930 575 930 630 900" class="orange" marker-end="url(#ao)"/>
<rect x="1125" y="735" width="355" height="300" rx="24" class="good"/><text x="1303" y="780" text-anchor="middle" class="n">每个 xⱼ 的最终梯度</text><text x="1303" y="840" text-anchor="middle" class="formula">∂L/∂xⱼ = γ/(ms) [</text><text x="1303" y="885" text-anchor="middle" class="formula">m dⱼ − Σdᵢ</text><text x="1303" y="930" text-anchor="middle" class="formula">− x̂ⱼ Σ(dᵢx̂ᵢ) ]</text><text x="1303" y="985" text-anchor="middle" class="s">m=BHW</text>
<path d="M1040 885 H1125" class="green" marker-end="url(#ag)"/>
</svg>