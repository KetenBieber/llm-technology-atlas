<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 670" width="1420" height="670">
<rect width="1420" height="670" fill="#f8fafc"/><style>.h{font:700 29px Arial,'Microsoft YaHei',sans-serif;fill:#162237}.l{font:700 20px Arial,'Microsoft YaHei',sans-serif;fill:#203247}.t{font:17px Arial,'Microsoft YaHei',sans-serif;fill:#203247}.s{font:15px Arial,'Microsoft YaHei',sans-serif;fill:#58677a}.c{fill:#dbeafe;stroke:#6c9fda;stroke-width:2}.m{fill:#fef3c7;stroke:#d1a44b;stroke-width:2}.r{fill:#dcfce7;stroke:#7bb88c;stroke-width:2}.box{fill:white;stroke:#d5dee8;stroke-width:2}.a{stroke:#73869f;stroke-width:2;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#73869f"/></marker></defs>
<text x="710" y="47" text-anchor="middle" class="h">ZeRO-3：一个训练 step 内参数为何可以“使用时才存在”？</text>
<text x="710" y="82" text-anchor="middle" class="s">展示两层网络的概念时序；真实实现可 prefetch/overlap，图中没有把通信时长画成测量数据</text>
<text x="62" y="143" class="l">阶段</text><text x="220" y="143" class="l">Layer 1</text><text x="640" y="143" class="l">Layer 2</text><text x="1060" y="143" class="l">为什么这样做</text>
<g transform="translate(28 174)"><rect class="box" rx="16" width="1364" height="94"/><text x="36" y="57" class="l">Forward</text><rect class="m" x="185" y="15" width="180" height="59" rx="9"/><text x="275" y="50" text-anchor="middle" class="t">All-gather P₁</text><rect class="c" x="400" y="15" width="166" height="59" rx="9"/><text x="483" y="50" class="t" text-anchor="middle">Compute L1</text><rect class="m" x="610" y="15" width="180" height="59" rx="9"/><text x="700" y="50" text-anchor="middle" class="t">All-gather P₂</text><rect class="c" x="810" y="15" width="150" height="59" rx="9"/><text x="885" y="50" text-anchor="middle" class="t">Compute L2</text><text x="1013" y="47" class="s">用完可释放</text><text x="1013" y="70" class="s">完整权重缓存</text></g>
<g transform="translate(28 304)"><rect class="box" rx="16" width="1364" height="94"/><text x="36" y="57" class="l">Backward</text><rect class="m" x="185" y="15" width="180" height="59" rx="9"/><text x="275" y="50" text-anchor="middle" class="t">All-gather P₂</text><rect class="c" x="400" y="15" width="166" height="59" rx="9"/><text x="483" y="50" class="t" text-anchor="middle">Grad L2</text><rect class="m" x="610" y="15" width="180" height="59" rx="9"/><text x="700" y="50" text-anchor="middle" class="t">All-gather P₁</text><rect class="c" x="810" y="15" width="150" height="59" rx="9"/><text x="885" y="50" text-anchor="middle" class="t">Grad L1</text><text x="1013" y="47" class="s">逆序重新获取</text><text x="1013" y="70" class="s">所需层权重</text></g>
<g transform="translate(28 434)"><rect class="box" rx="16" width="1364" height="94"/><text x="36" y="57" class="l">Update</text><rect class="r" x="185" y="15" width="310" height="59" rx="9"/><text x="340" y="50" text-anchor="middle" class="t">Reduce-scatter gradients</text><rect class="r" x="552" y="15" width="298" height="59" rx="9"/><text x="701" y="50" text-anchor="middle" class="t">Local Adam on owned shards</text><text x="1013" y="47" class="s">每卡更新自己</text><text x="1013" y="70" class="s">负责的参数分片</text></g>
<text x="710" y="580" text-anchor="middle" class="t">通信账本（大模型带宽主导的理想化近似）：Forward All-gather Ψ + Backward All-gather Ψ + Reduce-scatter Ψ = 3Ψ</text>
<text x="710" y="616" text-anchor="middle" class="s">对照标准 DP 梯度 All-reduce 约 2Ψ（元素体积）；不要误读为真实训练 wall-clock 只增加 50%</text>
<text x="710" y="653" text-anchor="middle" class="s">自制解释图，不是原论文 Figure；具体 buffer/prefetch/layer 粒度依实现而异。</text>
</svg>