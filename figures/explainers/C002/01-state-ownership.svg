<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 690" width="1420" height="690">
<rect width="1420" height="690" fill="#f8fafc"/>
<style>.h{font:700 30px Arial,'Microsoft YaHei',sans-serif;fill:#172332}.l{font:700 20px Arial,'Microsoft YaHei',sans-serif;fill:#172332}.t{font:17px Arial,'Microsoft YaHei',sans-serif;fill:#203247}.s{font:15px Arial,'Microsoft YaHei',sans-serif;fill:#526071}.p{fill:#dbeafe;stroke:#5c93d6;stroke-width:2}.g{fill:#fee2e2;stroke:#dc8d8d;stroke-width:2}.o{fill:#dcfce7;stroke:#74b88c;stroke-width:2}.b{fill:white;stroke:#cbd5e1;stroke-width:2}.arrow{stroke:#6f839c;stroke-width:2.5;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0 0L11 4L0 8Z" fill="#6f839c"/></marker></defs>
<text x="710" y="49" class="h" text-anchor="middle">为什么 ZeRO 不是一种新的模型并行？</text>
<text x="710" y="82" class="s" text-anchor="middle">每个 DP rank 都执行完整模型的样本前向，但长期训练状态的所有权逐步改变</text>
<text x="185" y="142" class="l" text-anchor="middle">标准 DP</text><text x="535" y="142" class="l" text-anchor="middle">ZeRO-1</text><text x="885" y="142" class="l" text-anchor="middle">ZeRO-2</text><text x="1235" y="142" class="l" text-anchor="middle">ZeRO-3</text>
<g transform="translate(42 160)"><rect class="b" x="0" y="0" width="285" height="330" rx="18"/><rect class="p" x="21" y="32" width="245" height="75" rx="11"/><rect class="g" x="21" y="125" width="245" height="75" rx="11"/><rect class="o" x="21" y="218" width="245" height="75" rx="11"/><text x="142" y="75" class="t" text-anchor="middle">完整 Parameters</text><text x="142" y="167" class="t" text-anchor="middle">完整 Gradients</text><text x="142" y="260" class="t" text-anchor="middle">完整 Optimizer states</text></g>
<g transform="translate(392 160)"><rect class="b" x="0" y="0" width="285" height="330" rx="18"/><rect class="p" x="21" y="32" width="245" height="75" rx="11"/><rect class="g" x="21" y="125" width="245" height="75" rx="11"/><rect class="o" x="21" y="218" width="75" height="75" rx="11"/><text x="142" y="75" class="t" text-anchor="middle">完整 Parameters</text><text x="142" y="167" class="t" text-anchor="middle">完整 Gradients</text><text x="142" y="260" class="t" text-anchor="middle">分片 O</text></g>
<g transform="translate(742 160)"><rect class="b" x="0" y="0" width="285" height="330" rx="18"/><rect class="p" x="21" y="32" width="245" height="75" rx="11"/><rect class="g" x="21" y="125" width="75" height="75" rx="11"/><rect class="o" x="21" y="218" width="75" height="75" rx="11"/><text x="142" y="75" class="t" text-anchor="middle">完整 Parameters</text><text x="58" y="167" class="t" text-anchor="middle">G shard</text><text x="58" y="260" class="t" text-anchor="middle">O shard</text></g>
<g transform="translate(1092 160)"><rect class="b" x="0" y="0" width="285" height="330" rx="18"/><rect class="p" x="21" y="32" width="75" height="75" rx="11"/><rect class="g" x="21" y="125" width="75" height="75" rx="11"/><rect class="o" x="21" y="218" width="75" height="75" rx="11"/><text x="58" y="75" class="t" text-anchor="middle">P shard</text><text x="58" y="167" class="t" text-anchor="middle">G shard</text><text x="58" y="260" class="t" text-anchor="middle">O shard</text></g>
<path d="M327 315H392" class="arrow"/><path d="M677 315H742" class="arrow"/><path d="M1027 315H1092" class="arrow"/>
<text x="185" y="528" class="s" text-anchor="middle">每张卡永久复制 P/G/O</text><text x="535" y="528" class="s" text-anchor="middle">只分片优化器状态</text><text x="885" y="528" class="s" text-anchor="middle">再分片长期梯度</text><text x="1235" y="528" class="s" text-anchor="middle">参数也只长期保留分片</text>
<rect x="125" y="566" width="1170" height="72" class="b" rx="12"/><text x="710" y="594" class="t" text-anchor="middle">关键区分：长期存储状态减少 ≠ 当前层不需要完整权重</text><text x="710" y="621" class="s" text-anchor="middle">ZeRO-3 在每一层被计算之前临时 All-gather，使用后释放；图中只表示 persistent ownership，未计瞬时缓存</text>
<text x="710" y="671" class="s" text-anchor="middle">自制解释图，不是原论文 Figure。块宽仅表达存储所有权变化，不代表精确字节比例。</text>
</svg>