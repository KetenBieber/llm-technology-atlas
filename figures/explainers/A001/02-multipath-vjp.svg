<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <style>
      text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#14213d}
      .title{font-size:48px;font-weight:700}.sub{font-size:24px;fill:#607086}
      .h{font-size:28px;font-weight:700}.n{font-size:24px;font-weight:650}.b{font-size:21px}.s{font-size:20px;fill:#607086}
      .formula{font-family:"STIX Two Math","Cambria Math",serif;font-size:23px}
      .box{fill:#f8fbff;stroke:#8fb6d9;stroke-width:2}.state{fill:#eefbfb;stroke:#47aeb7;stroke-width:2}
      .gray{fill:#f4f6f8;stroke:#aeb8c3;stroke-width:2}.warn{fill:#fff3f2;stroke:#d86561;stroke-width:2}
      .good{fill:#effaf3;stroke:#50a66b;stroke-width:2}.cost{fill:#fff7eb;stroke:#e39a36;stroke-width:2}
      .blue{stroke:#246aa5;stroke-width:5;fill:none}.cyan{stroke:#279aa7;stroke-width:4;fill:none}
      .green{stroke:#3b9859;stroke-width:5;fill:none}.orange{stroke:#db8a20;stroke-width:4;fill:none}
      .red{stroke:#c94e49;stroke-width:4;fill:none}.dash{stroke-dasharray:12 10}
    </style>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246aa5"/></marker>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#279aa7"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b9859"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#db8a20"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c94e49"/></marker>
  </defs>
  <rect width="1600" height="1200" fill="#ffffff"/>
  <text x="70" y="75" class="title">A001 · 多路径梯度聚合与局部 VJP</text>
  <text x="72" y="115" class="sub">为什么一个隐藏节点不能只沿某一条下游边反传？</text>
  
  <text x="75" y="180" class="h">一个隐藏激活 hᵢ 同时被 3 个下游单元使用</text>
  <rect x="90" y="250" width="260" height="150" rx="22" class="state"/>
  <text x="220" y="300" text-anchor="middle" class="n">hidden node</text><text x="220" y="340" text-anchor="middle" class="formula">hᵢ=σ(zᵢ)</text><text x="220" y="375" text-anchor="middle" class="b">没有直接监督标签</text>

  <rect x="600" y="190" width="230" height="110" rx="18" class="box"/><text x="715" y="235" text-anchor="middle" class="n">z₁</text><text x="715" y="270" text-anchor="middle" class="formula">∂z₁/∂hᵢ=wᵢ₁</text>
  <rect x="600" y="355" width="230" height="110" rx="18" class="box"/><text x="715" y="400" text-anchor="middle" class="n">z₂</text><text x="715" y="435" text-anchor="middle" class="formula">∂z₂/∂hᵢ=wᵢ₂</text>
  <rect x="600" y="520" width="230" height="110" rx="18" class="box"/><text x="715" y="565" text-anchor="middle" class="n">z₃</text><text x="715" y="600" text-anchor="middle" class="formula">∂z₃/∂hᵢ=wᵢ₃</text>

  <path d="M350 315 C460 240 510 240 600 245" class="blue" marker-end="url(#ab)"/>
  <path d="M350 330 C460 390 510 405 600 410" class="blue" marker-end="url(#ab)"/>
  <path d="M350 350 C470 505 515 555 600 575" class="blue" marker-end="url(#ab)"/>

  <rect x="1030" y="190" width="220" height="110" rx="18" class="cost"/><text x="1140" y="235" text-anchor="middle" class="n">δ₁</text><text x="1140" y="270" text-anchor="middle" class="formula">∂L/∂z₁</text>
  <rect x="1030" y="355" width="220" height="110" rx="18" class="cost"/><text x="1140" y="400" text-anchor="middle" class="n">δ₂</text><text x="1140" y="435" text-anchor="middle" class="formula">∂L/∂z₂</text>
  <rect x="1030" y="520" width="220" height="110" rx="18" class="cost"/><text x="1140" y="565" text-anchor="middle" class="n">δ₃</text><text x="1140" y="600" text-anchor="middle" class="formula">∂L/∂z₃</text>
  <path d="M1030 245 H830" class="green" marker-end="url(#ag)"/><path d="M1030 410 H830" class="green" marker-end="url(#ag)"/><path d="M1030 575 H830" class="green" marker-end="url(#ag)"/>

  <rect x="1330" y="300" width="190" height="220" rx="22" class="good"/>
  <text x="1425" y="350" text-anchor="middle" class="n">路径汇合</text>
  <text x="1425" y="405" text-anchor="middle" class="formula">∂L/∂hᵢ</text>
  <text x="1425" y="445" text-anchor="middle" class="formula">= Σⱼ δⱼwᵢⱼ</text>
  <text x="1425" y="495" text-anchor="middle" class="s">所有用途共同决定</text>
  <path d="M1250 245 C1320 260 1340 320 1360 350" class="green" marker-end="url(#ag)"/><path d="M1250 410 H1330" class="green" marker-end="url(#ag)"/><path d="M1250 575 C1320 555 1340 500 1360 470" class="green" marker-end="url(#ag)"/>

  <rect x="75" y="720" width="690" height="380" rx="26" class="warn"/>
  <text x="105" y="770" class="h">错误直觉：只挑一条下游路径</text>
  <path d="M140 875 H330" class="red" marker-end="url(#ar)"/><path d="M330 875 H500" class="red dash" marker-end="url(#ar)"/>
  <text x="140" y="840" class="b">hᵢ</text><text x="330" y="840" class="b">z₁</text><text x="500" y="840" class="b">Loss</text>
  <text x="105" y="950" class="b">会丢掉 z₂、z₃ 对 loss 的真实依赖，得到错误的敏感度。</text>
  <text x="105" y="1005" class="formula">wrong: ∂L/∂hᵢ ≈ δ₁wᵢ₁</text>
  <text x="105" y="1055" class="s">分支越多，遗漏路径越严重。</text>

  <rect x="800" y="720" width="720" height="380" rx="26" class="good"/>
  <text x="830" y="770" class="h">Reverse-mode / VJP 的局部接口</text>
  <text x="835" y="830" class="formula">x → z=f(x),  收到  z̄=∇zL</text>
  <text x="835" y="885" class="formula">x̄ = (∂z/∂x)ᵀ z̄</text>
  <text x="835" y="940" class="b">分支节点先把多个输出伴随梯度相加，再乘本地 Jacobian。</text>
  <text x="835" y="995" class="b">这正是 autograd 能把复杂图拆成局部算子的原因。</text>
  <text x="835" y="1050" class="s">绿色箭头是梯度贡献，不是额外的“反向网络”。</text>

</svg>