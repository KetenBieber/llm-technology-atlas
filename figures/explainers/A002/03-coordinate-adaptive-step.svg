<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<defs><style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#14213d}
.title{font-size:48px;font-weight:700}.sub{font-size:24px;fill:#607086}.h{font-size:29px;font-weight:700}.n{font-size:24px;font-weight:650}.b{font-size:21px}.s{font-size:20px;fill:#607086}.formula{font-family:"STIX Two Math","Cambria Math",serif;font-size:23px}
.box{fill:#f8fbff;stroke:#8fb6d9;stroke-width:2}.state{fill:#ecfbfc;stroke:#3ba9b3;stroke-width:2}.gray{fill:#f4f6f8;stroke:#aab6c3;stroke-width:2}.warn{fill:#fff2f1;stroke:#cf5c57;stroke-width:2}.good{fill:#eef9f2;stroke:#4ca267;stroke-width:2}.cost{fill:#fff7e9;stroke:#df942c;stroke-width:2}
.blue{stroke:#246aa5;stroke-width:5;fill:none}.cyan{stroke:#2599a6;stroke-width:4;fill:none}.green{stroke:#3d995c;stroke-width:5;fill:none}.orange{stroke:#d9871c;stroke-width:4;fill:none}.red{stroke:#c8504b;stroke-width:4;fill:none}.dash{stroke-dasharray:12 10}
</style>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246aa5"/></marker>
<marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2599a6"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d995c"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9871c"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8504b"/></marker></defs>
<rect width="1600" height="1200" fill="#fff"/><text x="70" y="75" class="title">A002 · Adam 的逐坐标自适应步长</text><text x="72" y="115" class="sub">同一个全局 α，如何根据每个参数坐标自己的历史方向与尺度，生成不同的有效位移？</text>
<rect x="60" y="170" width="720" height="690" rx="28" class="gray"/>
<text x="90" y="220" class="h">Gradient space · 两个坐标的历史尺度不同</text>
<line x1="180" y1="735" x2="670" y2="735" stroke="#8a98aa" stroke-width="3" marker-end="url(#ab)"/>
<line x1="180" y1="735" x2="180" y2="300" stroke="#8a98aa" stroke-width="3" marker-end="url(#ab)"/>
<text x="680" y="770" class="b">coord 1</text><text x="105" y="300" class="b">coord 2</text>
<path d="M180 735 L580 380" class="red" marker-end="url(#ar)"/>
<text x="520" y="350" class="n">当前 gₜ</text>
<ellipse cx="380" cy="535" rx="225" ry="85" transform="rotate(-38 380 535)" fill="none" stroke="#d86561" stroke-width="4" stroke-dasharray="12 10"/>
<text x="285" y="615" class="b">历史梯度云：不同轴尺度差异大</text>

<rect x="835" y="180" width="700" height="680" rx="28" class="box"/>
<text x="865" y="230" class="h">Adam · 每个坐标独立构造 direction / scale</text>
<rect x="890" y="310" width="245" height="135" rx="20" class="state"/><text x="1012" y="355" text-anchor="middle" class="n">方向统计</text><text x="1012" y="395" text-anchor="middle" class="formula">m̂ᵢ</text><text x="1012" y="425" text-anchor="middle" class="s">带符号历史平均</text>
<rect x="1240" y="310" width="245" height="135" rx="20" class="state"/><text x="1362" y="355" text-anchor="middle" class="n">尺度统计</text><text x="1362" y="395" text-anchor="middle" class="formula">√v̂ᵢ+ε</text><text x="1362" y="425" text-anchor="middle" class="s">典型梯度量级</text>
<rect x="1025" y="520" width="330" height="145" rx="22" class="good"/><text x="1190" y="565" text-anchor="middle" class="n">normalized direction</text><text x="1190" y="610" text-anchor="middle" class="formula">dᵢ = m̂ᵢ/(√v̂ᵢ+ε)</text>
<path d="M1012 445 C1040 490 1080 505 1110 520" class="green" marker-end="url(#ag)"/><path d="M1362 445 C1340 490 1300 505 1270 520" class="green" marker-end="url(#ag)"/>
<rect x="1025" y="725" width="330" height="95" rx="20" class="cost"/><text x="1190" y="765" text-anchor="middle" class="formula">Δθᵢ = −α dᵢ</text><text x="1190" y="798" text-anchor="middle" class="s">α 仍是全局名义尺度</text>
<path d="M1190 665 V725" class="orange" marker-end="url(#ao)"/>

<rect x="65" y="910" width="720" height="225" rx="24" class="good"/>
<text x="95" y="958" class="h">几何直觉</text>
<text x="100" y="1005" class="b">大梯度尺度轴会被较大的 √v̂ᵢ 分母压缩；</text><text x="100" y="1045" class="b">小尺度轴分母相对小，因此不会被统一 lr 完全淹没。</text>
<text x="100" y="1090" class="s">这是 diagonal preconditioning，不是旋转坐标系的完整二阶 Newton step。</text>
<rect x="825" y="910" width="710" height="225" rx="24" class="warn"/>
<text x="855" y="958" class="h">尺度不变性的边界</text>
<text x="860" y="1008" class="formula">ε=0:  (c m̂)/(√(c²v̂)) = m̂/√v̂</text>
<text x="860" y="1050" class="b">但 ε&gt;0 时严格尺度抵消会被打破；</text><text x="860" y="1090" class="b">也不能据此推成任意参数重参数化都不改变轨迹。</text>
</svg>