<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<defs><style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#14213d}
.title{font-size:48px;font-weight:700}.sub{font-size:24px;fill:#607086}.h{font-size:29px;font-weight:700}.n{font-size:24px;font-weight:650}.b{font-size:21px}.s{font-size:20px;fill:#607086}.formula{font-family:"STIX Two Math","Cambria Math",serif;font-size:23px}
.box{fill:#f8fbff;stroke:#8fb6d9;stroke-width:2}.state{fill:#ecfbfc;stroke:#3ba9b3;stroke-width:2}.gray{fill:#f4f6f8;stroke:#aab6c3;stroke-width:2}.warn{fill:#fff2f1;stroke:#cf5c57;stroke-width:2}.good{fill:#eef9f2;stroke:#4ca267;stroke-width:2}.cost{fill:#fff7e9;stroke:#df942c;stroke-width:2}
.blue{stroke:#246aa5;stroke-width:5;fill:none}.cyan{stroke:#2599a6;stroke-width:4;fill:none}.green{stroke:#3d995c;stroke-width:5;fill:none}.orange{stroke:#d9871c;stroke-width:4;fill:none}.red{stroke:#c8504b;stroke-width:4;fill:none}.dash{stroke-dasharray:12 10}
</style>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#246aa5"/></marker>
<marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2599a6"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d995c"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9871c"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8504b"/></marker></defs>
<rect width="1600" height="1200" fill="#fff"/><text x="70" y="75" class="title">A002 · Bias correction：修复的是“零初始化缺失质量”</text><text x="72" y="115" class="sub">为什么 EMA 从 0 开始时，前几步会系统性偏小，而除以 1−βᵗ 恰好修正它？</text>
<text x="80" y="180" class="h">未修正 EMA：历史样本权重之和小于 1</text>
<rect x="70" y="225" width="1460" height="400" rx="26" class="gray"/>
<text x="100" y="275" class="formula">vₜ=(1−β) Σᵢ₌₁ᵗ βᵗ⁻ⁱ gᵢ²</text>

<g>
<rect x="135" y="355" width="150" height="180" rx="16" class="state"/><text x="210" y="395" text-anchor="middle" class="n">g₁²</text><text x="210" y="500" text-anchor="middle" class="formula">(1−β)βᵗ⁻¹</text>
<rect x="350" y="330" width="150" height="205" rx="16" class="state"/><text x="425" y="370" text-anchor="middle" class="n">g₂²</text><text x="425" y="500" text-anchor="middle" class="formula">(1−β)βᵗ⁻²</text>
<rect x="565" y="300" width="150" height="235" rx="16" class="state"/><text x="640" y="340" text-anchor="middle" class="n">…</text><text x="640" y="500" text-anchor="middle" class="formula">…</text>
<rect x="780" y="260" width="150" height="275" rx="16" class="state"/><text x="855" y="300" text-anchor="middle" class="n">gₜ²</text><text x="855" y="500" text-anchor="middle" class="formula">(1−β)</text>
</g>
<path d="M950 400 H1100" class="orange" marker-end="url(#ao)"/>
<rect x="1100" y="305" width="350" height="205" rx="20" class="warn"/><text x="1275" y="350" text-anchor="middle" class="n">缺失的权重质量</text><text x="1275" y="402" text-anchor="middle" class="formula">Σ weights = 1−βᵗ</text><text x="1275" y="452" text-anchor="middle" class="b">剩余 βᵗ 隐含地落在初值 0 上</text>

<text x="80" y="700" class="h">Bias correction：重新归一化现有历史样本的总权重</text>
<rect x="70" y="745" width="910" height="320" rx="26" class="good"/>
<text x="110" y="800" class="formula">v̂ₜ = vₜ / (1−βᵗ)</text>
<path d="M155 905 H800" class="green" marker-end="url(#ag)"/>
<circle cx="220" cy="905" r="26" fill="#3d995c"/><circle cx="400" cy="905" r="34" fill="#3d995c"/><circle cx="600" cy="905" r="42" fill="#3d995c"/><circle cx="790" cy="905" r="54" fill="#3d995c"/>
<text x="220" y="965" text-anchor="middle" class="s">old</text><text x="790" y="985" text-anchor="middle" class="s">recent</text>
<text x="110" y="1035" class="b">修正后：现有样本权重和 = 1；不是把未来样本“补进来”。</text>

<rect x="1020" y="745" width="510" height="320" rx="26" class="cost"/>
<text x="1050" y="795" class="h">证据边界</text>
<text x="1050" y="845" class="b">论文 Fig.4 单独开关 bias correction，</text><text x="1050" y="885" class="b">在 β₂ 接近 1 的设置中观察到早期稳定性差异。</text>
<text x="1050" y="945" class="formula">E[vₜ]=μ₂(1−βᵗ)+ζ</text>
<text x="1050" y="995" class="b">除法只修零初始化因子；</text><text x="1050" y="1035" class="b">非平稳分布造成的 ζ 不会因此消失。</text>
</svg>