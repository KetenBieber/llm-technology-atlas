<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1f5f8b"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97706"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c94a4a"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16855b"/></marker>
<style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#15324b}.title{font-size:44px;font-weight:700}.sub{font-size:25px;font-weight:650}.b{font-size:22px}.s{font-size:20px}.muted{fill:#607487}.box{fill:#f7fafc;stroke:#94a7b6;stroke-width:2}.blue{fill:#eaf4fb;stroke:#2f77a8;stroke-width:2}.cyan{fill:#e9fbfb;stroke:#249ca0;stroke-width:2}.green{fill:#edf9f2;stroke:#269267;stroke-width:2}.orange{fill:#fff5e7;stroke:#d97706;stroke-width:2}.red{fill:#fff0f0;stroke:#c94a4a;stroke-width:2}.f{fill:none;stroke:#1f5f8b;stroke-width:4;marker-end:url(#a)}.fo{fill:none;stroke:#d97706;stroke-width:4;marker-end:url(#o)}.fr{fill:none;stroke:#c94a4a;stroke-width:4;marker-end:url(#r)}.fg{fill:none;stroke:#16855b;stroke-width:4;marker-end:url(#g)}</style></defs>
<rect width="1600" height="1100" fill="#fff"/>
<text class="t title" x="62" y="72">FlashAttention · Memory Hierarchy：消掉 N×N HBM 往返</text>
<text class="t b muted" x="64" y="112">核心问题：为什么 exact dense attention 可以通过重排 HBM ↔ SRAM 数据流获得大幅加速，而不改变 Attention 数学定义？</text>

<rect x="70" y="160" width="1460" height="155" rx="22" class="box"/>
<text class="t sub" x="100" y="205">A100 论文量级：容量与带宽方向相反</text>
<rect x="115" y="235" width="385" height="52" rx="10" fill="#eef2f5" stroke="#8096a6" stroke-width="2"/>
<text class="t b" x="135" y="270">HBM：40–80 GB · ≈1.5–2.0 TB/s</text>
<rect x="570" y="235" width="430" height="52" rx="10" fill="#dff8f7" stroke="#249ca0" stroke-width="2"/>
<text class="t b" x="590" y="270">On-chip SRAM：≈192 KB / SM · ~19 TB/s aggregate</text>
<rect x="1070" y="235" width="375" height="52" rx="10" fill="#eaf4fb" stroke="#2f77a8" stroke-width="2"/>
<text class="t b" x="1090" y="270">Registers / Tensor Cores：最靠近计算</text>
<path d="M500 260 L568 260" class="f"/><path d="M1000 260 L1068 260" class="f"/>

<rect x="70" y="365" width="680" height="500" rx="22" class="red"/>
<text class="t sub" x="100" y="410">Standard attention：S、P 往返 HBM</text>
<rect x="120" y="455" width="150" height="72" rx="12" class="blue"/><text class="t b" x="155" y="500">Q, K</text>
<rect x="340" y="455" width="160" height="72" rx="12" class="box"/><text class="t b" x="380" y="500">GEMM</text>
<rect x="570" y="455" width="130" height="72" rx="12" class="red"/><text class="t b" x="610" y="500">S</text>
<path d="M270 491 L338 491" class="f"/><path d="M500 491 L568 491" class="fr"/>
<rect x="570" y="590" width="130" height="72" rx="12" fill="#f4f7f9" stroke="#8096a6" stroke-width="3"/><text class="t b" x="600" y="635">HBM</text>
<path d="M635 527 L635 588" class="fr"/><text class="t s" x="650" y="562" fill="#b23a3a">write N×N</text>
<rect x="345" y="700" width="160" height="72" rx="12" class="box"/><text class="t b" x="372" y="745">Softmax</text>
<rect x="570" y="700" width="130" height="72" rx="12" class="red"/><text class="t b" x="610" y="745">P</text>
<path d="M570 626 C500 626 505 736 507 736" class="fr"/><path d="M505 736 L568 736" class="fr"/>
<text class="t s muted" x="115" y="822">N=16K, BF16：单个 N×N 矩阵约 512 MB（单 head 数量级直觉）</text>

<rect x="810" y="365" width="720" height="500" rx="22" class="green"/>
<text class="t sub" x="840" y="410">FlashAttention：Sᵢⱼ、Pᵢⱼ 只在 SRAM 短暂存在</text>
<rect x="855" y="455" width="190" height="72" rx="12" class="blue"/><text class="t b" x="885" y="500">Qᵢ, Kⱼ, Vⱼ</text>
<rect x="1115" y="440" width="340" height="245" rx="18" class="cyan"/>
<text class="t sub" x="1150" y="482">SRAM tile</text>
<text class="t b" x="1150" y="530">Sᵢⱼ = QᵢKⱼᵀ</text>
<text class="t b" x="1150" y="570">mask + online softmax</text>
<text class="t b" x="1150" y="610">PᵢⱼVⱼ → update (mᵢ,ℓᵢ,Oᵢ)</text>
<text class="t s muted" x="1150" y="650">tile 完成后丢弃 Sᵢⱼ / Pᵢⱼ</text>
<path d="M1045 491 L1113 491" class="f"/>
<rect x="880" y="725" width="230" height="80" rx="14" class="box"/><text class="t b" x="910" y="760">HBM 持久状态</text><text class="t s" x="910" y="790">Q,K,V · O · m,ℓ</text>
<path d="M1280 686 C1280 765 1160 765 1112 765" class="fg"/>
<text class="t s muted" x="850" y="820">无 N×N S/P materialization；只保留 O 与 softmax statistics。</text>

<rect x="260" y="915" width="1080" height="110" rx="18" class="orange"/>
<text class="t sub" x="290" y="958">优化目标：降低 HBM reads/writes，提高 arithmetic intensity</text>
<text class="t b" x="290" y="998">Exact dense QK pairs 仍全部计算；改变的是 storage hierarchy 与 execution order，而不是 receptive field。</text>
</svg>