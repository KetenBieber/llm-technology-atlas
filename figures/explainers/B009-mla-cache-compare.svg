<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
<rect width="1400" height="650" fill="#fbfbfd"/><style>.t{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#18212f}.h{font-size:28px;font-weight:700}.s{font-size:21px;font-weight:700}.b{font-size:17px}.m{font-size:15px;fill:#566273}.box{fill:white;stroke:#cfd7e3;stroke-width:2;rx:16}.mha{fill:#fff4f4;stroke:#d89b9b}.mla{fill:#f2f8ff;stroke:#8eb5df}.a{stroke:#6f7d8b;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#6f7d8b"/></marker></defs>
<text x="700" y="45" text-anchor="middle" class="t h">MHA vs MLA：Decode 时历史状态到底缓存什么？</text>
<text x="350" y="95" text-anchor="middle" class="t s">普通 MHA</text><text x="1050" y="95" text-anchor="middle" class="t s">MLA</text>
<rect x="80" y="130" width="540" height="95" class="box mha"/><text x="110" y="168" class="t s">每个历史 token 保存完整 K + V</text><text x="110" y="200" class="t b">近似规模：T × n_h × (d_k + d_v)</text>
<rect x="780" y="130" width="540" height="95" class="box mla"/><text x="810" y="168" class="t s">每个历史 token 保存 compressed latent</text><text x="810" y="200" class="t b">再加一小块 decoupled RoPE positional key</text>
<rect x="110" y="270" width="480" height="110" class="box"/><text x="140" y="310" class="t s">新 query 到来</text><text x="140" y="342" class="t b">直接读取所有历史 K/V 做 attention</text>
<rect x="810" y="270" width="480" height="110" class="box"/><text x="840" y="310" class="t s">新 query 到来</text><text x="840" y="342" class="t b">通过 weight absorption，让 latent 直接参与 score / value 路径</text>
<path d="M350 225 L350 270" class="a"/><path d="M1050 225 L1050 270" class="a"/>
<rect x="110" y="430" width="480" height="100" class="box mha"/><text x="140" y="468" class="t s">代价随上下文增长</text><text x="140" y="500" class="t b">KV 容量与 HBM 读取都按完整 head state 增长</text>
<rect x="810" y="430" width="480" height="100" class="box mla"/><text x="840" y="468" class="t s">核心收益不是“低秩”三个字</text><text x="840" y="500" class="t b">而是压缩状态可以不为每次 decode 显式解压成完整历史 K/V</text>
<path d="M350 380 L350 430" class="a"/><path d="M1050 380 L1050 430" class="a"/>
<text x="700" y="605" text-anchor="middle" class="t m">自制解释图：精确矩阵吸收与 RoPE 解耦推导请跳转 DeepSeek-V2 专题。</text>
</svg>