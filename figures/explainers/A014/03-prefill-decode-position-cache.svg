<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<style>
text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#17324d}
.title{font-size:46px;font-weight:700}.subtitle{font-size:24px;fill:#526b80}.section{font-size:30px;font-weight:700}.node{font-size:24px;font-weight:650}.body{font-size:21px}.small{font-size:20px;fill:#526b80}.math{font-size:23px;font-family:"STIX Two Text","Times New Roman",serif}
.box{fill:#f8fbfd;stroke:#8fb6cc;stroke-width:2.2}.blue{fill:#eaf4fb;stroke:#2b6f9f;stroke-width:2.4}.cyan{fill:#eafafa;stroke:#178d98;stroke-width:2.4}.orange{fill:#fff4e8;stroke:#d47a20;stroke-width:2.4}.red{fill:#fff0f0;stroke:#c64a4a;stroke-width:2.4}.green{fill:#edf9f1;stroke:#2f8a57;stroke-width:2.4}.gray{fill:#f2f4f6;stroke:#8795a1;stroke-width:2}
.flow{fill:none;stroke:#246b9b;stroke-width:5;marker-end:url(#arrow)}.aux{fill:none;stroke:#607d8b;stroke-width:3;marker-end:url(#arrowGray)}.comm{fill:none;stroke:#d47a20;stroke-width:5;stroke-dasharray:11 8;marker-end:url(#arrowOrange)}.good{fill:none;stroke:#2f8a57;stroke-width:5;marker-end:url(#arrowGreen)}.bad{fill:none;stroke:#c64a4a;stroke-width:4;stroke-dasharray:9 7;marker-end:url(#arrowRed)}
.axis{stroke:#7c919f;stroke-width:2}.phase{fill:none;stroke:#2b6f9f;stroke-width:4}.phase2{fill:none;stroke:#178d98;stroke-width:4}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#246b9b"/></marker>
<marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607d8b"/></marker>
<marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d47a20"/></marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f8a57"/></marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c64a4a"/></marker>
</defs><rect width="1600" height="1100" fill="#fff"/><text x="70" y="72" class="title">RoPE + KV Cache：Prefill 与 Decode 中 position_id 到底属于谁？</text><text x="70" y="112" class="subtitle">A014 · K 在写入 Cache 时按自己的绝对位置旋转一次；后续 Decode 不应重复旋转旧 K</text>
<text x="70" y="178" class="section">Prefill：位置 0…T−1 一次性建立旋转后的 K Cache</text>
<rect x="70" y="220" width="1460" height="290" rx="24" class="blue"/>
<rect x="115" y="295" width="155" height="85" rx="14" class="gray"/><text x="145" y="330" class="node">token 0</text><text x="145" y="362" class="small">pos=0</text><path d="M192 380 V425" class="flow"/><rect x="120" y="425" width="145" height="55" rx="10" class="cyan"/><text x="138" y="461" class="body">K′0=R(0θ)K0</text><rect x="320" y="295" width="155" height="85" rx="14" class="gray"/><text x="350" y="330" class="node">token 1</text><text x="350" y="362" class="small">pos=1</text><path d="M397 380 V425" class="flow"/><rect x="325" y="425" width="145" height="55" rx="10" class="cyan"/><text x="343" y="461" class="body">K′1=R(1θ)K1</text><rect x="525" y="295" width="155" height="85" rx="14" class="gray"/><text x="555" y="330" class="node">token 2</text><text x="555" y="362" class="small">pos=2</text><path d="M602 380 V425" class="flow"/><rect x="530" y="425" width="145" height="55" rx="10" class="cyan"/><text x="548" y="461" class="body">K′2=R(2θ)K2</text><rect x="730" y="295" width="155" height="85" rx="14" class="gray"/><text x="760" y="330" class="node">token 3</text><text x="760" y="362" class="small">pos=3</text><path d="M807 380 V425" class="flow"/><rect x="735" y="425" width="145" height="55" rx="10" class="cyan"/><text x="753" y="461" class="body">K′3=R(3θ)K3</text><rect x="935" y="295" width="155" height="85" rx="14" class="gray"/><text x="965" y="330" class="node">token 4</text><text x="965" y="362" class="small">pos=4</text><path d="M1012 380 V425" class="flow"/><rect x="940" y="425" width="145" height="55" rx="10" class="cyan"/><text x="958" y="461" class="body">K′4=R(4θ)K4</text><rect x="1140" y="295" width="155" height="85" rx="14" class="gray"/><text x="1170" y="330" class="node">token 5</text><text x="1170" y="362" class="small">pos=5</text><path d="M1217 380 V425" class="flow"/><rect x="1145" y="425" width="145" height="55" rx="10" class="cyan"/><text x="1163" y="461" class="body">K′5=R(5θ)K5</text>
<text x="100" y="265" class="body">每个 K 使用创建它时的 position；V 不需要 RoPE 旋转。</text>

<text x="70" y="575" class="section">Decode：新 token 只旋转当前 Q/K，然后 append K′</text>
<rect x="70" y="615" width="1040" height="330" rx="24" class="green"/>
<rect x="105" y="675" width="235" height="105" rx="18" class="gray"/>
<text x="135" y="718" class="node">new token</text><text x="135" y="758" class="body">position = T</text>
<path d="M340 728 H420" class="flow"/>
<rect x="420" y="655" width="280" height="145" rx="18" class="cyan"/>
<text x="450" y="700" class="node">当前 Qₜ, Kₜ</text>
<text x="450" y="742" class="math">Q′ₜ=R(Tθ)Qₜ</text><text x="450" y="780" class="math">K′ₜ=R(Tθ)Kₜ</text>
<path d="M700 728 H790" class="good"/>
<rect x="790" y="655" width="280" height="145" rx="18" class="blue"/>
<text x="820" y="700" class="node">K Cache append</text>
<text x="820" y="744" class="body">[K′₀,…,K′ₜ₋₁,K′ₜ]</text>
<path d="M560 800 V855 H840 V800" class="aux"/>
<text x="385" y="895" class="body">Q′ₜ 与历史 K′ⱼ 点积 → score 只依赖 (j−T) 的相对相位</text>

<rect x="1160" y="615" width="370" height="330" rx="24" class="red"/>
<text x="1190" y="660" class="node">常见错误</text>
<text x="1190" y="710" class="body">每个 decode step</text>
<text x="1190" y="750" class="body">把旧 K′ 再乘 R(Tθ)</text>
<path d="M1220 800 H1450" class="bad"/>
<text x="1190" y="850" class="body">→ 相位被重复累积</text>
<text x="1190" y="890" class="small">破坏原本的相对位置关系</text>

<rect x="70" y="985" width="1460" height="70" rx="15" class="orange"/>
<text x="100" y="1030" class="body">滑动窗口若重编号 position，也必须让窗口内 Q/K 坐标系一致；“删除旧 Cache”与“重新定义位置坐标”是两件不同的事。</text>
</svg>