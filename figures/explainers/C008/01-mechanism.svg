<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#697d96"/></marker></defs><style>.title{font:700 29px 'Microsoft YaHei',Arial,sans-serif;fill:#1b293a}.sub{font:15px 'Microsoft YaHei',Arial,sans-serif;fill:#596779}.heading{font:700 22px 'Microsoft YaHei',Arial,sans-serif;fill:#1b293a}.body{font:17px 'Microsoft YaHei',Arial,sans-serif;fill:#293c53}.foot{font:18px 'Microsoft YaHei',Arial,sans-serif;fill:#20364d}.card{stroke-width:2}.a{fill:#f1f7ff;stroke:#a4c0e6}.b{fill:#f0faf3;stroke:#9bcdae}</style><rect width="1500" height="620" fill="#fcfdfe"/><text x="750" y="55" text-anchor="middle" class="title">ZeRO-Offload｜数据和计算向 CPU 分工</text><text x="750" y="94" text-anchor="middle" class="sub">自制解释图：仅描述机制与代价，不表示真实实验测量值；非原论文 Figure</text><rect x="37" y="160" width="330" height="263" rx="20" class="card a"/><text x="202" y="210" text-anchor="middle" class="heading">GPU 侧</text><path d="M72 236H332" stroke="#c8d4df" stroke-width="2"/><text x="202" y="286" text-anchor="middle" class="body">FP16 前向 / 反向</text><text x="202" y="333" text-anchor="middle" class="body">产生梯度并保留计算工作集</text><path d="M371 291 L398 291" stroke="#697d96" stroke-width="3" marker-end="url(#ar)"/><rect x="406" y="160" width="330" height="263" rx="20" class="card b"/><text x="571" y="210" text-anchor="middle" class="heading">边界传输</text><path d="M441 236H701" stroke="#c8d4df" stroke-width="2"/><text x="571" y="286" text-anchor="middle" class="body">压缩或分片梯度搬运</text><text x="571" y="333" text-anchor="middle" class="body">PCIe 带宽决定成本</text><path d="M740 291 L767 291" stroke="#697d96" stroke-width="3" marker-end="url(#ar)"/><rect x="775" y="160" width="330" height="263" rx="20" class="card a"/><text x="940" y="210" text-anchor="middle" class="heading">CPU 侧</text><path d="M810 236H1070" stroke="#c8d4df" stroke-width="2"/><text x="940" y="286" text-anchor="middle" class="body">FP32 Master / Adam</text><text x="940" y="333" text-anchor="middle" class="body">负责优化器更新</text><path d="M1109 291 L1136 291" stroke="#697d96" stroke-width="3" marker-end="url(#ar)"/><rect x="1144" y="160" width="330" height="263" rx="20" class="card b"/><text x="1309" y="210" text-anchor="middle" class="heading">回到 GPU</text><path d="M1179 236H1439" stroke="#c8d4df" stroke-width="2"/><text x="1309" y="286" text-anchor="middle" class="body">更新后的 FP16 参数</text><text x="1309" y="333" text-anchor="middle" class="body">下轮前向复用</text><rect x="58" y="481" width="1384" height="90" rx="15" fill="#eaf1f8"/><text x="750" y="518" text-anchor="middle" class="foot">阅读路径：先识别数据所有权 → 跟踪通信的时机与对象 → 检查数学语义 → 最后讨论吞吐、峰值内存与适用条件</text><text x="750" y="546" text-anchor="middle" class="sub">源文证据、定量结论及未覆盖的限制请参见文章中的原论文链接与逐节分析</text></svg>