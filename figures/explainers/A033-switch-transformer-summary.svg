<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
<rect width="1440" height="960" fill="#f8fafc"/>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
  <style>
    .tt{font:700 34px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
    .sub{font:500 18px Arial,'Microsoft YaHei',sans-serif;fill:#475569}
    .h{font:700 22px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
    .t{font:500 17px Arial,'Microsoft YaHei',sans-serif;fill:#1e293b}
    .s{font:500 15px Arial,'Microsoft YaHei',sans-serif;fill:#475569}
    .b{fill:#ffffff;stroke:#94a3b8;stroke-width:2;rx:18}
    .bl{fill:#dbeafe;stroke:#3b82f6;stroke-width:2;rx:18}
    .cy{fill:#cffafe;stroke:#06b6d4;stroke-width:2;rx:18}
    .sl{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2;rx:18}
    .deep{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.4;rx:18}
    .a{stroke:#475569;stroke-width:2.7;fill:none;marker-end:url(#arr)}
    .d{stroke:#64748b;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#arr)}
  </style>
</defs>
<text x="64" y="62" class="tt">Switch Transformer：Top-1 路由把 MoE 的系统复杂度压到最低</text>
<text x="64" y="96" class="sub">每个 token 只去一个 expert；为了让这个极简决策可训练，需要 capacity、balancing 与 router 数值稳定性共同兜底。</text>
<rect x="80" y="175" width="250" height="120" class="bl"/>
<text x="115" y="220" class="h">Token x</text>
<text x="115" y="257" class="t">hidden state</text>

<rect x="420" y="150" width="330" height="170" class="deep"/>
<text x="455" y="195" class="h">Router softmax</text>
<text x="455" y="232" class="t">p(expert | x)</text>
<text x="455" y="267" class="t">argmax → Top-1 expert</text>
<text x="455" y="297" class="s">仍保留概率，用于权重与 balancing loss</text>
<path d="M330 235 H420" class="a"/>

<rect x="850" y="110" width="230" height="100" class="cy"/>
<rect x="850" y="240" width="230" height="100" class="cy"/>
<rect x="1130" y="110" width="230" height="100" class="cy"/>
<rect x="1130" y="240" width="230" height="100" class="cy"/>
<text x="925" y="155" class="h">Expert 1</text><text x="925" y="285" class="h">Expert 2</text>
<text x="1205" y="155" class="h">Expert 3</text><text x="1205" y="285" class="h">Expert N</text>
<path d="M750 235 C790 160 810 160 850 160" class="a"/>
<path d="M750 235 C790 285 810 290 850 290" class="d"/>
<path d="M750 235 C900 60 1040 90 1130 160" class="d"/>
<path d="M750 235 C900 410 1040 360 1130 290" class="d"/>

<rect x="835" y="410" width="550" height="135" class="sl"/>
<text x="875" y="455" class="h">Capacity Factor：Top-1 仍然必须处理拥塞</text>
<text x="875" y="493" class="t">expert capacity ≈ tokens / experts × capacity factor</text>
<text x="875" y="525" class="s">过小：溢出 token 增多；过大：padding / memory / communication 浪费增加。</text>

<rect x="75" y="410" width="650" height="340" class="bl"/>
<text x="115" y="455" class="h">为什么 Top-1 仍然需要三类“护栏”</text>
<text x="125" y="505" class="t">① Load-balancing loss</text>
<text x="155" y="537" class="s">同时看 router 概率与实际 token 分配，避免 expert collapse</text>
<text x="125" y="585" class="t">② Router 数值稳定性</text>
<text x="155" y="617" class="s">高精度 router / z-loss 抑制过大 logits，降低训练不稳定</text>
<text x="125" y="665" class="t">③ Expert Parallel 调度</text>
<text x="155" y="697" class="s">Top-1 降低 dispatch / combine 次数，但跨设备 token 搬运仍存在</text>
<text x="115" y="735" class="s">Switch 的贡献：不是“路由更聪明”，而是把大规模稀疏模型做得更简单、更可扩展。</text>

<rect x="835" y="610" width="550" height="140" class="deep"/>
<text x="875" y="655" class="h">与 Top-k MoE 相比</text>
<text x="875" y="693" class="t">每 token expert 数：k → 1</text>
<text x="875" y="725" class="t">通信 / combine 复杂度下降，active compute 更容易控制</text>
<text x="720" y="925" text-anchor="middle" class="s">自制总结架构图：提炼文章核心机制，不复刻原论文图。</text></svg>