<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<rect width="1500" height="760" fill="#fff"/>
<text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">MInference：把“找稀疏结构”和“每次输入找具体索引”分开</text>
<g font-family="Arial,sans-serif">
<text x="85" y="130" font-size="24" font-weight="700" fill="#1e3a8a">Offline / once per model configuration</text>
<rect x="85" y="165" width="270" height="100" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="220" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">Reference prompt</text>
<text x="220" y="237" text-anchor="middle" font-size="17" fill="#1e40af">full attention as teacher</text>
<path d="M355 215 H430" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>
<rect x="430" y="145" width="360" height="140" rx="18" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
<text x="610" y="187" text-anchor="middle" font-size="21" font-weight="700" fill="#312e81">Kernel-aware search space</text>
<text x="610" y="220" text-anchor="middle" font-size="17" fill="#3730a3">A-shape / VS / Block-Sparse</text>
<text x="610" y="248" text-anchor="middle" font-size="17" fill="#3730a3">候选项先对齐“真实 GPU kernel FLOPs”</text>
<path d="M790 215 H865" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>
<rect x="865" y="165" width="300" height="100" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
<text x="1015" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#5b21b6">Per-head selection</text>
<text x="1015" y="237" text-anchor="middle" font-size="17" fill="#6d28d9">选 attention-output recall 更高的结构</text>
<path d="M1165 215 H1240" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>
<rect x="1240" y="165" width="200" height="100" rx="18" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
<text x="1340" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#7e22ce">Head config</text>
<text x="1340" y="237" text-anchor="middle" font-size="17" fill="#86198f">pattern + budget</text>

<line x1="55" y1="330" x2="1445" y2="330" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="9 7"/>
<text x="85" y="390" font-size="24" font-weight="700" fill="#166534">Online / every prompt</text>
<rect x="85" y="425" width="260" height="105" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
<text x="215" y="466" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">New long prompt</text>
<text x="215" y="498" text-anchor="middle" font-size="17" fill="#15803d">Q, K, V</text>
<path d="M345 477 H420" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>
<rect x="420" y="405" width="370" height="145" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="605" y="445" text-anchor="middle" font-size="21" font-weight="700" fill="#92400e">Cheap dynamic index estimation</text>
<text x="605" y="478" text-anchor="middle" font-size="17" fill="#78350f">A: fixed indices</text>
<text x="605" y="505" text-anchor="middle" font-size="17" fill="#78350f">VS: last-Q probe → vertical/slash</text>
<text x="605" y="532" text-anchor="middle" font-size="17" fill="#78350f">BS: pooled Q/K → top blocks</text>
<path d="M790 477 H865" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>
<rect x="865" y="425" width="300" height="105" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
<text x="1015" y="466" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">Sparse GPU kernel</text>
<text x="1015" y="498" text-anchor="middle" font-size="17" fill="#7f1d1d">只计算 selected tiles / columns</text>
<path d="M1165 477 H1240" stroke="#111827" stroke-width="3" marker-end="url(#a)"/>
<rect x="1240" y="425" width="200" height="105" rx="18" fill="#cffafe" stroke="#06b6d4" stroke-width="2"/>
<text x="1340" y="466" text-anchor="middle" font-size="20" font-weight="700" fill="#155e75">Prefill output</text>
<text x="1340" y="498" text-anchor="middle" font-size="17" fill="#164e63">decode 仍可 dense</text>

<rect x="290" y="620" width="920" height="78" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="750" y="650" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">真正优化目标</text>
<text x="750" y="680" text-anchor="middle" font-size="19" fill="#475569">低 sparse-compute latency + 低 index-building overhead + 尽量高 attention-output fidelity</text>
</g>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
</svg>