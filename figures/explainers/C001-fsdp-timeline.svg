<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<rect width="1500" height="760" fill="white"/>
<text x="750" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700">FSDP：参数平时分片，需要计算时临时 all-gather</text>
<text x="750" y="92" text-anchor="middle" font-family="Arial" font-size="21">核心不是“参数永远完整复制”，而是“按模块临时重建 → 计算 → 再释放/分片”</text>
<text x="95" y="162" font-family="Arial" font-size="24" font-weight="700">静态存储</text>
<g font-family="Arial" font-size="20">
<rect x="220" y="125" width="210" height="80" rx="12" fill="#f5f5f5" stroke="#222"/><text x="325" y="174" text-anchor="middle">Rank 0: W₀</text>
<rect x="455" y="125" width="210" height="80" rx="12" fill="#f5f5f5" stroke="#222"/><text x="560" y="174" text-anchor="middle">Rank 1: W₁</text>
<rect x="690" y="125" width="210" height="80" rx="12" fill="#f5f5f5" stroke="#222"/><text x="795" y="174" text-anchor="middle">Rank 2: W₂</text>
<rect x="925" y="125" width="210" height="80" rx="12" fill="#f5f5f5" stroke="#222"/><text x="1030" y="174" text-anchor="middle">Rank 3: W₃</text>
</g>
<path d="M750 225 L750 280" stroke="#222" stroke-width="3" marker-end="url(#a)"/>
<text x="780" y="260" font-family="Arial" font-size="22">all-gather</text>
<rect x="380" y="295" width="740" height="85" rx="16" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="750" y="348" text-anchor="middle" font-family="Arial" font-size="24">每个 rank 临时得到完整 W = [W₀,W₁,W₂,W₃]，执行该模块 Forward</text>
<path d="M750 395 L750 445" stroke="#222" stroke-width="3" marker-end="url(#a)"/>
<text x="780" y="429" font-family="Arial" font-size="20">可选 reshard_after_forward</text>
<rect x="235" y="465" width="1030" height="80" rx="16" fill="#f5f5f5" stroke="#222" stroke-width="2"/>
<text x="750" y="515" text-anchor="middle" font-family="Arial" font-size="23">Backward 前再次 all-gather（若 forward 后已 reshard）→ 计算局部完整梯度</text>
<path d="M750 560 L750 610" stroke="#222" stroke-width="3" marker-end="url(#a)"/>
<text x="780" y="594" font-family="Arial" font-size="22">reduce-scatter gradients</text>
<rect x="285" y="625" width="930" height="78" rx="16" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="750" y="675" text-anchor="middle" font-family="Arial" font-size="22">每个 rank 只保留自己的 gradient shard + optimizer-state shard，并更新 parameter shard</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs>
</svg>