<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#202124}.t{font-size:34px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:20px}.s{font-size:17px;fill:#5f6368}.box{fill:#fff;stroke:#5f6368;stroke-width:2;rx:18}.state{fill:#f8f9fa;stroke:#9aa0a6;stroke-width:2;rx:12}.arrow{stroke:#5f6368;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f6368"/></marker></defs>
<text x="55" y="60" class="t">Online Softmax：只保存 (m, ℓ, O)，仍能逐块恢复全局 exact softmax</text>
<rect x="70" y="150" width="350" height="190" class="box"/><text x="105" y="195" class="h">已处理 Block 1…k</text><text x="105" y="240" class="b">running max: mₒ</text><text x="105" y="278" class="b">running sum: ℓₒ</text><text x="105" y="316" class="b">normalized output: Oₒ</text>
<rect x="575" y="150" width="350" height="190" class="box"/><text x="610" y="195" class="h">新 score Block</text><text x="610" y="240" class="b">local max: m_b</text><text x="610" y="278" class="b">local sum: ℓ_b</text><text x="610" y="316" class="b">local numerator: U_b</text>
<path d="M420 245H555" class="arrow"/><path d="M925 245H1060" class="arrow"/>
<rect x="1065" y="130" width="365" height="235" class="state"/><text x="1100" y="175" class="h">Merge</text><text x="1100" y="215" class="b">mₙ = max(mₒ, m_b)</text><text x="1100" y="255" class="b">α = exp(mₒ − mₙ)</text><text x="1100" y="295" class="b">γ = exp(m_b − mₙ)</text><text x="1100" y="335" class="b">ℓₙ = αℓₒ + γℓ_b</text>
<rect x="250" y="455" width="1000" height="160" class="state"/><text x="295" y="500" class="h">Output 也必须跟着重标定</text><text x="295" y="545" class="b">Oₙ = [ α ℓₒ Oₒ + γ U_b ] / ℓₙ</text><text x="295" y="585" class="s">如果新 block 出现更大的 logit，旧 block 的 exp 值必须统一乘 exp(mₒ−mₙ)；否则 softmax denominator 不再等价于一次性计算。</text>
<text x="240" y="690" class="b">结论：Softmax 的“全局耦合”并不要求完整 score row 同时驻留，只要求保存足够的聚合统计量。</text>
</svg>