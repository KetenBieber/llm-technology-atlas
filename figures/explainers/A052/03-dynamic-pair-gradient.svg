<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".10"/></filter>
</defs>
<rect width="1600" height="1200" fill="#f8fbfd"/>
<text x="70" y="72" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="48" font-weight="700" fill="#0f172a">DPO Gradient：为什么“错得越多，推得越重”？</text>
<text x="72" y="112" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#475569">动态权重 w(z)=σ(−z) 由当前 preference margin 决定，而不是对每个 pair 永远施加同样力度</text>

<rect x="70" y="155" width="1460" height="850" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<g font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif">
  <text x="105" y="205" font-size="27" font-weight="700" fill="#334155">横轴：相对 reference 的 pair margin</text>
  <text x="105" y="242" font-size="23" fill="#0f172a">z = β[(Δθ) − (Δ_ref)] = r̂_w − r̂_l</text>

  <!-- chart -->
  <line x1="180" y1="770" x2="1080" y2="770" stroke="#334155" stroke-width="3"/>
  <line x1="630" y1="320" x2="630" y2="820" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 8"/>
  <line x1="180" y1="320" x2="180" y2="770" stroke="#334155" stroke-width="3"/>
  <text x="1092" y="778" font-size="22" fill="#334155">z</text>
  <text x="146" y="306" font-size="22" fill="#334155">w</text>
  <text x="134" y="352" font-size="20" fill="#64748b">1.0</text>
  <text x="140" y="558" font-size="20" fill="#64748b">0.5</text>
  <text x="148" y="770" font-size="20" fill="#64748b">0</text>
  <text x="612" y="804" font-size="20" fill="#64748b">0</text>

  <!-- sigmoid decreasing curve -->
  <path d="M190 350 C310 352 390 370 465 420 C545 475 585 520 630 550 C675 580 720 630 795 680 C875 730 960 755 1065 760" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <text x="735" y="410" font-size="26" font-weight="700" fill="#1d4ed8">w(z)=σ(−z)</text>
  <text x="735" y="445" font-size="20" fill="#64748b">dynamic per-example weight</text>

  <!-- naive baseline constant -->
  <path d="M195 515 H1060" stroke="#dc2626" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="700" y="502" font-size="18" fill="#b91c1c">naive winner↑ / loser↓：常数权重（对照）</text>

  <!-- regime points -->
  <circle cx="360" cy="377" r="13" fill="#dc2626"/>
  <circle cx="630" cy="550" r="13" fill="#f59e0b"/>
  <circle cx="900" cy="740" r="13" fill="#059669"/>
  <line x1="360" y1="390" x2="360" y2="770" stroke="#fecaca" stroke-width="3"/>
  <line x1="900" y1="727" x2="900" y2="770" stroke="#bbf7d0" stroke-width="3"/>

  <rect x="205" y="825" width="310" height="120" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="360" y="860" text-anchor="middle" font-size="23" font-weight="700" fill="#991b1b">A · 排反了：z ≪ 0</text>
  <text x="360" y="895" text-anchor="middle" font-size="21" fill="#334155">w≈1 → 强更新</text>
  <text x="360" y="925" text-anchor="middle" font-size="19" fill="#64748b">提高 y_w，压低 y_l</text>

  <rect x="530" y="825" width="260" height="120" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="660" y="860" text-anchor="middle" font-size="23" font-weight="700" fill="#9a3412">B · 持平：z≈0</text>
  <text x="660" y="895" text-anchor="middle" font-size="21" fill="#334155">w=0.5</text>
  <text x="660" y="925" text-anchor="middle" font-size="19" fill="#64748b">仍有明显更新</text>

  <rect x="810" y="825" width="310" height="120" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="965" y="860" text-anchor="middle" font-size="23" font-weight="700" fill="#166534">C · 已拉开：z ≫ 0</text>
  <text x="965" y="895" text-anchor="middle" font-size="21" fill="#334155">w≈0 → 自动衰减</text>
  <text x="965" y="925" text-anchor="middle" font-size="19" fill="#64748b">避免无休止推远 pair</text>

  <!-- gradient circuit on right -->
  <rect x="1160" y="285" width="300" height="610" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1310" y="330" text-anchor="middle" font-size="25" font-weight="700" fill="#334155">梯度电路</text>
  <rect x="1200" y="370" width="220" height="90" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="1310" y="407" text-anchor="middle" font-size="23" fill="#075985">margin z</text>
  <text x="1310" y="438" text-anchor="middle" font-size="20" fill="#475569">由 policy/ref 计算</text>
  <path d="M1310 460 V510" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="1310" cy="555" r="52" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="1310" y="548" text-anchor="middle" font-size="22" font-weight="700" fill="#9a3412">σ(−z)</text>
  <text x="1310" y="578" text-anchor="middle" font-size="18" fill="#475569">gate</text>
  <path d="M1310 607 V655" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1190" y="670" width="240" height="105" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="1310" y="708" text-anchor="middle" font-size="21" font-weight="700" fill="#047857">g_w − g_l</text>
  <text x="1310" y="742" text-anchor="middle" font-size="18" fill="#475569">sequence log-prob gradients</text>
  <path d="M1310 775 V820" stroke="#059669" stroke-width="4" marker-end="url(#arrowG)"/>
  <text x="1310" y="858" text-anchor="middle" font-size="22" font-weight="700" fill="#047857">∇ℓ = −β w(z)(g_w−g_l)</text>
</g>
<text x="90" y="1070" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">优化含义</text>
<text x="90" y="1112" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#475569">DPO 关注的是“当前 policy 相对 reference 是否已经把 pair 排得足够好”；pair 越错误，sigmoid gate 越接近 1。</text>
<text x="90" y="1150" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#64748b">这解释了它为何不同于固定强度的 Unlikelihood：梯度幅度本身随 preference margin 自适应变化。</text>
</svg>