<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".10"/></filter>
</defs>
<rect width="1600" height="1200" fill="#f8fbfd"/>
<text x="70" y="72" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="48" font-weight="700" fill="#0f172a">DPO：response-level preference 为什么能训练到每个 token？</text>
<text x="72" y="112" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#475569">Autoregressive factorization 把 sequence log-prob 拆成 token 和；同一个 pair-level 权重沿梯度路径广播</text>

<rect x="70" y="155" width="1460" height="930" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<g font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif">
  <!-- prompt -->
  <rect x="105" y="205" width="220" height="86" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="215" y="240" text-anchor="middle" font-size="23" font-weight="700" fill="#075985">Prompt x</text>
  <text x="215" y="272" text-anchor="middle" font-size="20" fill="#475569">shared context</text>

  <!-- preferred token rail -->
  <text x="385" y="202" font-size="24" font-weight="700" fill="#166534">preferred response y_w</text>
  <path d="M325 248 H385" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <g fill="#dcfce7" stroke="#22c55e" stroke-width="2">
    <rect x="390" y="220" width="120" height="58" rx="12"/><rect x="525" y="220" width="120" height="58" rx="12"/><rect x="660" y="220" width="120" height="58" rx="12"/><rect x="795" y="220" width="120" height="58" rx="12"/><rect x="930" y="220" width="120" height="58" rx="12"/>
  </g>
  <g font-size="21" fill="#14532d" text-anchor="middle"><text x="450" y="256">w₁</text><text x="585" y="256">w₂</text><text x="720" y="256">w₃</text><text x="855" y="256">…</text><text x="990" y="256">w_T</text></g>

  <!-- rejected token rail -->
  <text x="385" y="342" font-size="24" font-weight="700" fill="#991b1b">rejected response y_l</text>
  <path d="M325 248 V388 H385" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <g fill="#fee2e2" stroke="#ef4444" stroke-width="2">
    <rect x="390" y="360" width="120" height="58" rx="12"/><rect x="525" y="360" width="120" height="58" rx="12"/><rect x="660" y="360" width="120" height="58" rx="12"/><rect x="795" y="360" width="120" height="58" rx="12"/><rect x="930" y="360" width="120" height="58" rx="12"/>
  </g>
  <g font-size="21" fill="#7f1d1d" text-anchor="middle"><text x="450" y="396">l₁</text><text x="585" y="396">l₂</text><text x="720" y="396">l₃</text><text x="855" y="396">…</text><text x="990" y="396">l_T</text></g>

  <!-- policy/reference twin score paths -->
  <text x="1115" y="198" font-size="22" font-weight="700" fill="#1d4ed8">每个 token 两条 score path</text>
  <rect x="1110" y="220" width="165" height="70" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="1192" y="251" text-anchor="middle" font-size="21" font-weight="700" fill="#1e40af">πθ</text>
  <text x="1192" y="278" text-anchor="middle" font-size="18" fill="#334155">trainable</text>
  <rect x="1300" y="220" width="165" height="70" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="1382" y="251" text-anchor="middle" font-size="21" font-weight="700" fill="#475569">π_ref</text>
  <text x="1382" y="278" text-anchor="middle" font-size="18" fill="#64748b">frozen</text>
  <path d="M1050 249 H1100" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1050 249 C1090 249 1110 320 1300 320 L1380 320 L1380 300" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1050 389 H1100" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- per-token logratio strips -->
  <line x1="100" y1="475" x2="1500" y2="475" stroke="#e2e8f0" stroke-width="2"/>
  <text x="105" y="520" font-size="27" font-weight="700" fill="#0f172a">Token contribution</text>
  <text x="105" y="558" font-size="21" fill="#475569">q_t = β [log πθ(y_t|s_t) − log π_ref(y_t|s_t)]</text>

  <g>
    <rect x="610" y="500" width="115" height="80" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <rect x="745" y="500" width="115" height="80" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <rect x="880" y="500" width="115" height="80" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <rect x="1015" y="500" width="115" height="80" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="668" y="548" text-anchor="middle" font-size="22" fill="#0e7490">q₁</text><text x="803" y="548" text-anchor="middle" font-size="22" fill="#0e7490">q₂</text><text x="938" y="548" text-anchor="middle" font-size="22" fill="#0e7490">q₃</text><text x="1073" y="548" text-anchor="middle" font-size="22" fill="#0e7490">… q_T</text>
  </g>
  <path d="M1130 540 H1160" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1170" y="493" width="295" height="95" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="1318" y="532" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">response implicit reward</text>
  <text x="1318" y="565" text-anchor="middle" font-size="22" fill="#0f172a">r̂(x,y) = Σ_t q_t</text>

  <!-- two response sums -->
  <rect x="180" y="655" width="470" height="112" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <text x="415" y="698" text-anchor="middle" font-size="24" font-weight="700" fill="#166534">r̂_w = β log[πθ(y_w)/π_ref(y_w)]</text>
  <text x="415" y="738" text-anchor="middle" font-size="20" fill="#475569">Σ preferred token contributions</text>

  <rect x="180" y="810" width="470" height="112" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="415" y="853" text-anchor="middle" font-size="24" font-weight="700" fill="#991b1b">r̂_l = β log[πθ(y_l)/π_ref(y_l)]</text>
  <text x="415" y="893" text-anchor="middle" font-size="20" fill="#475569">Σ rejected token contributions</text>

  <path d="M650 710 H770" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M650 865 H770" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="830" cy="787" r="58" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/>
  <text x="830" y="780" text-anchor="middle" font-size="23" font-weight="700" fill="#075985">margin</text>
  <text x="830" y="814" text-anchor="middle" font-size="26" fill="#0f172a">z=r̂_w−r̂_l</text>

  <path d="M888 787 H1005" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1015" y="705" width="425" height="165" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2.5"/>
  <text x="1227" y="745" text-anchor="middle" font-size="24" font-weight="700" fill="#c2410c">Pair-level gradient gate</text>
  <text x="1227" y="788" text-anchor="middle" font-size="26" fill="#0f172a">w_pair = σ(−z)</text>
  <text x="1227" y="827" text-anchor="middle" font-size="20" fill="#475569">同一个 scalar 乘在 sequence gradient 上</text>

  <!-- gradient broadcast: loss gate sends opposite-sign gradients back to the two sequence scores -->
  <path d="M1015 755 C905 705 790 690 650 710" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrowG)"/>
  <path d="M1015 825 C905 875 790 885 650 865" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrowR)"/>
  <text x="760" y="985" font-size="21" font-weight="700" fill="#047857">∇ℓ = −β w_pair [g_w − g_l]</text>
  <text x="760" y="1018" font-size="19" fill="#64748b">g_w / g_l 再按 autoregressive log-prob 展开为 token 梯度和。</text>
  <text x="760" y="1050" font-size="19" fill="#64748b">同一 pair gate 广播到 token；label 本身不指出“哪个 token 更好”。</text>
</g>
<text x="74" y="1152" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#64748b">重点：token-level contribution 是代数分解，不等价于人工提供 token reward / process supervision。</text>
</svg>