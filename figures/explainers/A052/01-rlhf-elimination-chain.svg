<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".10"/></filter>
</defs>
<rect width="1600" height="1200" fill="#f8fbfd"/>
<text x="70" y="72" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="48" font-weight="700" fill="#0f172a">DPO：RLHF 中的 Reward 与 RL 如何被解析消元？</text>
<text x="72" y="112" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#475569">核心：KL-regularized optimal policy → reward log-ratio 重参数化 → Bradley–Terry 做差时 Z(x) 消失</text>

<!-- baseline explicit pipeline -->
<rect x="70" y="155" width="1460" height="210" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="95" y="195" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="700" fill="#334155">Baseline · 经典 RLHF 显式中间件</text>
<g font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif">
  <rect x="105" y="225" width="245" height="92" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="228" y="260" text-anchor="middle" font-size="23" font-weight="700" fill="#075985">Preference pair</text>
  <text x="228" y="291" text-anchor="middle" font-size="21" fill="#334155">(x, y_w ≻ y_l)</text>

  <rect x="440" y="225" width="250" height="92" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="565" y="260" text-anchor="middle" font-size="23" font-weight="700" fill="#9a3412">Reward Model</text>
  <text x="565" y="291" text-anchor="middle" font-size="21" fill="#475569">rφ(x,y)</text>

  <rect x="780" y="225" width="270" height="92" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="915" y="260" text-anchor="middle" font-size="23" font-weight="700" fill="#991b1b">RL / PPO optimizer</text>
  <text x="915" y="291" text-anchor="middle" font-size="20" fill="#475569">maximize reward − β KL</text>

  <rect x="1150" y="225" width="270" height="92" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="1285" y="260" text-anchor="middle" font-size="23" font-weight="700" fill="#166534">Aligned policy</text>
  <text x="1285" y="291" text-anchor="middle" font-size="21" fill="#475569">πθ(y|x)</text>
</g>
<path d="M350 271 H430" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M690 271 H770" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M1050 271 H1140" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M1235 330 C1150 350 1000 350 930 320" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8"/>
<text x="1080" y="347" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#64748b">π_ref 提供 KL anchor</text>

<!-- derivation flow -->
<text x="70" y="420" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">DPO 的消元链</text>

<g font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" filter="url(#soft)">
  <rect x="75" y="455" width="360" height="170" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="255" y="493" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4ed8">① KL-regularized objective</text>
  <text x="255" y="535" text-anchor="middle" font-size="22" fill="#0f172a">maxπ  Eπ[r] − β KL(π || π_ref)</text>
  <text x="255" y="579" text-anchor="middle" font-size="21" fill="#475569">对「概率分布 π」直接求最优解</text>

  <rect x="480" y="455" width="360" height="170" rx="22" fill="#ecfeff" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="660" y="493" text-anchor="middle" font-size="24" font-weight="700" fill="#0e7490">② Closed-form tilt</text>
  <text x="660" y="535" text-anchor="middle" font-size="22" fill="#0f172a">π*(y|x) ∝ π_ref(y|x) · exp(r/β)</text>
  <text x="660" y="579" text-anchor="middle" font-size="21" fill="#475569">reward 只负责重加权 reference mass</text>

  <rect x="885" y="455" width="360" height="170" rx="22" fill="#f0fdf4" stroke="#34d399" stroke-width="2.5"/>
  <text x="1065" y="493" text-anchor="middle" font-size="24" font-weight="700" fill="#047857">③ 反解 implicit reward</text>
  <text x="1065" y="535" text-anchor="middle" font-size="21" fill="#0f172a">r = β log(π*/π_ref) + β log Z(x)</text>
  <text x="1065" y="579" text-anchor="middle" font-size="21" fill="#475569">未知 Z(x) 只依赖 prompt</text>

  <rect x="1290" y="455" width="240" height="170" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2.5"/>
  <text x="1410" y="493" text-anchor="middle" font-size="24" font-weight="700" fill="#c2410c">④ Pair difference</text>
  <text x="1410" y="536" text-anchor="middle" font-size="21" fill="#0f172a">r_w − r_l</text>
  <text x="1410" y="577" text-anchor="middle" font-size="21" fill="#dc2626">+βlogZ − βlogZ = 0</text>
</g>
<path d="M435 540 H470" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M840 540 H875" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M1245 540 H1280" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

<!-- pair log-ratio circuit -->
<rect x="75" y="680" width="1455" height="420" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="105" y="725" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="700" fill="#334155">Preference likelihood 只需要 policy / reference 的相对 log-ratio</text>

<g font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif">
  <text x="120" y="790" font-size="22" font-weight="700" fill="#166534">preferred y_w</text>
  <rect x="270" y="755" width="265" height="72" rx="15" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="403" y="800" text-anchor="middle" font-size="22" fill="#14532d">log πθ(y_w|x)</text>
  <rect x="270" y="845" width="265" height="72" rx="15" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="403" y="890" text-anchor="middle" font-size="22" fill="#334155">log π_ref(y_w|x)</text>
  <circle cx="590" cy="836" r="35" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="590" y="844" text-anchor="middle" font-size="30" fill="#1d4ed8">−</text>
  <text x="690" y="842" font-size="24" font-weight="700" fill="#1d4ed8">a_w = log(πθ/π_ref)</text>
  <path d="M535 790 H570" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M535 881 C555 881 565 865 575 855" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="120" y="992" font-size="22" font-weight="700" fill="#991b1b">rejected y_l</text>
  <rect x="270" y="945" width="265" height="72" rx="15" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="403" y="990" text-anchor="middle" font-size="22" fill="#7f1d1d">log πθ(y_l|x)</text>
  <rect x="270" y="1030" width="265" height="60" rx="15" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="403" y="1068" text-anchor="middle" font-size="21" fill="#334155">log π_ref(y_l|x)</text>
  <circle cx="590" cy="1020" r="35" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="590" y="1028" text-anchor="middle" font-size="30" fill="#1d4ed8">−</text>
  <text x="690" y="1026" font-size="24" font-weight="700" fill="#1d4ed8">a_l = log(πθ/π_ref)</text>

  <rect x="1000" y="790" width="455" height="220" rx="22" fill="#eefcf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="1227" y="832" text-anchor="middle" font-size="25" font-weight="700" fill="#047857">DPO preference margin</text>
  <text x="1227" y="882" text-anchor="middle" font-size="26" fill="#0f172a">z = β (a_w − a_l)</text>
  <path d="M930 840 C980 840 985 855 1000 865" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M930 1020 C970 1020 985 975 1000 950" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1227" y="930" text-anchor="middle" font-size="25" font-weight="700" fill="#166534">ℒ_DPO = −log σ(z)</text>
  <text x="1227" y="975" text-anchor="middle" font-size="20" fill="#475569">无需显式 rφ，也无需训练阶段 PPO rollout</text>
</g>

<text x="80" y="1158" font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#64748b">图意：DPO “简单”来自解析结构，不是把 PPO loss 直接改名；reference policy 仍保留为相对坐标系。</text>
</svg>